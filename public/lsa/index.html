":["항공법령의 개정사항","기상정보 획득 및 이해","경량항공기 사고사례","항공기 정비기술 실습"],"a":3,"e":"안전교육 내용은 항공법령 개정사항, 기상정보 획득 및 이해, 경량항공기 사고사례이다.","page":40},{"q":"체중이동형비행기 실기시험 채점표에만 있는 항목으로 옳은 것은?","o":["조립(ASSEMBLY) 및 날개 조율(WING TUNING)","직진 오토로테이션 착륙","캐노피 배치(CANOPY LAYOUT)","지상공진(GROUND RESONANCE)"],"a":0,"e":"조립과 날개 조율은 체중이동형비행기 채점표 항목이다. 오토로테이션·지상공진은 경량헬리콥터, 캐노피 배치는 동력패러슈트 항목이다.","page":42},{"q":"45세인 경량항공기 조종사가 제2종 항공신체검사증명을 보유한 경우 그 유효기간은?","o":["12개월","60개월","24개월","36개월"],"a":2,"e":"제2종 유효기간은 40세 미만 60개월, 40세 이상 50세 미만 24개월, 50세 이상 12개월이다.","page":46},{"q":"경량항공기 조종사가 항공신체검사증명 대신 자동차운전면허증을 적용하는 경우 신체검사 유효기간은?","o":["연령과 관계없이 24개월","그 자동차운전면허증의 유효기간","60개월","발급일부터 1년"],"a":1,"e":"자동차운전면허증을 적용할 경우 그 자동차운전면허증의 유효기간으로 한다.","page":46},{"q":"국토교통부장관이 경량항공기 조종사 자격증명을 반드시 취소하여야 하는 경우는?","o":["비행규칙을 따르지 아니하고 비행한 경우","주류등의 섭취 및 사용 여부의 측정 요구에 따르지 아니한 경우","한정된 종류 외의 경량항공기를 조종한 경우","항공안전법을 위반하여 벌금 이상의 형을 선고받은 경우"],"a":1,"e":"측정 요구 불응은 필요적 취소 사유이다. 나머지는 취소 또는 1년 이내 효력정지 사유이다.","page":46},{"q":"경량항공기 조종사 자격증명의 효력정지를 명할 수 있는 최대 기간은?","o":["6개월 이내","2년 이내","3개월 이내","1년 이내"],"a":3,"e":"국토교통부장관은 자격증명을 취소하거나 1년 이내의 기간을 정하여 효력정지를 명할 수 있다.","page":47},{"q":"항공법규에서 정하는 주류등에 해당하지 않는 것은?","o":["주세법에 따른 주류","마약류 관리에 관한 법률에 따른 마약류","화학물질관리법에 따른 환각물질","약사법에 따른 일반의약품"],"a":3,"e":"주류등은 주세법상 주류, 마약류관리법상 마약류, 화학물질관리법상 환각물질 등을 말한다.","page":47},{"q":"자격증명 시험에서 부정행위를 한 사람에 대한 조치로 옳은 것은?","o":["부정행위를 한 날부터 1년간 응시 불가","부정행위를 한 날부터 2년간 시험 응시·심사 및 항공신체검사 불가","해당 회차 시험만 무효","영구적으로 응시 불가"],"a":1,"e":"시험·심사·신체검사에서 부정행위를 한 경우 그 날부터 각각 2년 동안 응시하거나 심사·신체검사를 받을 수 없다.","page":48},{"q":"경량항공기 전문교육기관에 관한 설명으로 옳지 않은 것은?","o":["지정신청서에 교육규정을 첨부하여 국토교통부장관에게 제출한다","교육 종료 후 이수자 명단과 평가 결과를 국토부장관 및 한국교통안전공단 이사장에게 보고한다","국토교통부장관은 3년마다 지정기준 적합 여부를 심사한다","예산 범위에서 경비의 전부 또는 일부를 지원받을 수 있다"],"a":2,"e":"국토교통부장관은 1년마다 지정전문교육기관이 지정기준(별표 12)에 적합한지 심사하여야 한다.","page":49}]},{"id":"law-5","title":"제5장 경량항공기 운항","pages":[50,86],"goal":"경량항공기 운항 시 비행계획·경보업무·공역·조종사 준수사항·비행규칙·신호·공항시설·장애물 표지·등불·탑재장비에 관한 법적 기준을 정확한 숫자와 함께 알아야 한다.","summary":"경량항공기로 비행정보구역 안에서 비행하려는 자는 비행계획을 제출·준수하고 착륙 즉시 도착보고를 해야 하며, 연락 두절 시 항공교통업무기관은 불확실(INCERFA)·경보(ALERFA)·조난(DETRESFA) 단계로 경보업무를 수행한다. 공역은 제공 업무에 따라 A~G등급(관제 A~E, 비관제 F·G), 사용목적에 따라 관제·비관제·통제·주의공역으로 나뉘며, 경량항공기 조종사는 야간비행·평균해면 1,500m(5천피트) 이상 비행·곡예비행 등이 금지되고 혈중알코올농도 0.02% 이상이면 업무를 할 수 없다. 비행규칙에서는 통행 우선순위(우측 항공기 우선, 정면 접근 시 우측 선회, 앞지르기는 우측 통과), 순항고도(000~179° 1,500/3,500ft, 180~359° 2,500/4,500ft), QNH 수정(185km 이내), 조난·긴급신호와 빛총신호가 핵심이다. 후반부는 공항시설·항행안전시설·항공등화의 정의, 항공장애표시등(60m·150m 기준)과 장애표지물·색채 표지 기준, 항공기 등불과 시계비행 계기·구급용구를 다룬다.","sections":[{"title":"5.1.1~5.1.4 비행계획의 제출·준수·변경·종료","page":50,"points":["경량항공기로 우리나라 비행정보구역 안에서 비행하려는 자는 비행 시작 전에 비행계획을 수립하여 관할 항공교통업무기관에 제출해야 한다.","비행계획 제출 방법: 구술·전화·서류·전자통신문·팩스·정보통신망. 서류·팩스·정보통신망으로 제출 시 항공안전법 시행규칙 별지 제71호서식 사용.","비행계획 포함사항: 식별부호, 비행방식 및 종류, 대수, 탑재장비, 출발비행장 및 출발예정시간, 순항속도·순항고도·예정항공로, 최초 착륙예정 비행장 및 총 예상 소요시간, 시간으로 표시한 연료탑재량, 변경될 목적비행장, 탑승 총 인원, 비상무선주파수 및 구조장비, 기장 성명(편대는 편대책임기장) 등.","연료탑재량·변경 목적비행장·탑승 총 인원·비상무선주파수 및 구조장비(㈕~㈘)는 지방항공청장 또는 항공교통본부장이 요청하거나 제출자가 필요하다고 판단하는 경우에만 포함.","제출한 비행계획은 준수해야 하며, 관제기관 허가를 받거나 긴급 비상상황이면 예외 — 긴급조치 후 즉시 관제기관에 통보. 항공로 중심선을 따라 비행하고, 항공로가 없는 지역은 항행안전시설과 정해진 지점 간을 직선 비행.","관제비행 중 부주의로 항공로를 이탈하면 기수를 조정하여 즉시 비행계획 항공로로 복귀. 시계비행 관제비행 중 기상이 시계비행기상상태 미만이 되면 관제허가 변경 요청 → 불가 시 시계비행기상상태 유지하며 관제공역 이탈 또는 가까운 비행장 착륙 예정임을 통보 → 관제권 안이면 특별시계비행 허가 요구.","순항고도 변경 통보: 식별부호, 변경 순항고도 및 순항속도, 다음 보고지점 도착 예정시간. 순항속도 변경 통보: 식별부호, 변경 속도.","착륙 즉시 관할 항공교통업무기관(없으면 가장 가까운 기관)에 도착보고: 식별부호, 출발비행장, 도착비행장, 목적비행장(따로 있는 경우), 착륙시간. 착륙 후 통신시설이 없으면 착륙 직전에 도착보고."]},{"title":"5.1.5 경보업무","page":53,"points":["경보업무 대상: 항공교통업무 대상 경량항공기, 비행계획을 제출한 모든 경량항공기, 테러 등 불법간섭을 받는 것으로 인지된 경량항공기.","불확실상황(INCERFA): 연락 예정시간 또는 첫 교신시도 실패시간 중 더 이른 시간부터 30분 이내 연락이 없거나, 마지막 통보 도착예정시간 또는 기관 예상 도착예정시간 중 더 늦은 시간부터 30분 이내 도착하지 않는 경우.","경보상황(ALERFA): 불확실상황에서 교신·조회로도 위치 확인 곤란, 착륙허가 후 착륙예정시간부터 5분 이내 착륙하지 않고 무선교신 안 됨, 비행능력 상실되었으나 불시착 가능성 없다는 정보, 불법간섭 인지.","조난상황(DETRESFA): 경보상황에서 교신·조회 실패로 조난 가능성, 탑재연료 고갈로 안전 유지 곤란, 비행능력 상실로 불시착 가능성 정보 입수, 불시착 중이거나 불시착했다는 정보가 정확하다고 판단되는 경우.","항공교통업무기관은 비상상황을 알게 되면 지체 없이 수색·구조업무 기관에 통보하고, 통보 후에도 조사를 계속하며 악화·종료 사실도 지체 없이 통보.","경보 통보사항: 비상상황별 용어, 통보기관 명칭·통보자 성명, 비상상황 내용, 비행계획 중요사항, 최종 교신 관제기관·시간·주파수, 최종 위치보고 지점, 색상 및 특징, 위험물 탑재사항, 통보기관 조치사항 등.","불확실상황 또는 경보상황이라고 판단되면 해당 경량항공기의 소유자등에게 그 사실을 통보해야 한다."]},{"title":"5.1.6 공역","page":55,"points":["비행정보구역: 안전·효율적 비행과 수색·구조에 필요한 정보 제공을 위한 공역으로, 국제민간항공협약 및 부속서에 따라 국토교통부장관이 명칭·수직 및 수평 범위를 지정·공고한 공역.","영공: 대한민국 영토와 내수 및 영해의 상공. 항공로: 국토교통부장관이 항행에 적합하다고 지정한 지구 표면상에 표시한 공간의 길.","관제권: 비행장 또는 공항과 그 주변 공역으로 국토교통부장관이 지정·공고. 관제구: 지표면 또는 수면으로부터 200미터 이상 높이의 공역으로 국토교통부장관이 지정·공고.","공항: 공항시설을 갖춘 공공용 비행장으로 국토교통부장관이 명칭·위치·구역을 지정·고시. 이착륙장: 비행장 외에 경량항공기·초경량비행장치의 이착륙을 위한 육지 또는 수면 구역(대통령령).","공역 4구분: 관제공역(관제권·관제구 포함), 비관제공역(조언·비행정보 제공), 통제공역(비행 금지·제한), 주의공역(특별한 주의·경계·식별 필요).","등급별: A=모든 항공기 계기비행, B=IFR·VFR 모두 분리 포함 관제, C=관제 제공하나 VFR 간 교통정보만, D=관제 제공하나 IFR-VFR 및 VFR 간 교통정보만, E=IFR에 관제·VFR에 교통정보, F=IFR에 비행정보·조언업무·VFR에 비행정보, G=모든 항공기에 비행정보업무만. 관제공역 A~E, 비관제공역 F·G.","사용목적별: 관제권은 B·C·D등급 중, 관제구는 A~E등급(항공로·접근관제구역 포함). 비관제공역=조언구역·정보구역. 통제공역=비행금지구역·비행제한구역·초경량비행장치 비행제한구역. 주의공역=훈련구역·군작전구역·위험구역·경계구역·초경량비행장치 비행구역.","위험구역=항공기 또는 지상시설물에 대한 위험 예상 공역, 경계구역=대규모 조종사 훈련이나 비정상 형태의 항공활동 수행 공역, 비행제한구역=항공사격·대공사격 등 위험으로부터 보호하거나 비행허가 없는 항공기 비행 제한."]},{"title":"5.2 조종사 준수사항","page":57,"points":["경량항공기사고: 비행 목적으로 발동기가 시동되는 순간부터 비행 종료 후 발동기가 정지되는 순간까지 발생한 사람의 사망·중상·행방불명, 추락·충돌·화재, 위치 확인 불가 또는 접근 불가.","사고 발생 시 조종사는 지체 없이 국토교통부장관에게 보고(조종사가 보고할 수 없으면 소유자등이 보고). 보고사항(지방항공청장): 성명·명칭, 일시·장소, 종류 및 등록부호, 사고 경위, 사상·파손 개요, 사상자 인적사항.","금지행위: 위험한 낙하물 투하, 인구밀집지역 상공 위험비행, 안개 등으로 지상목표물 육안 식별 불가 상태 비행, 일몰 후~일출 전 야간비행, 평균해면 1,500m(5천피트) 이상 비행(항공교통업무기관 승인 시 제외), 동승자 낙하산 강하, 곡예비행 등 비정상 비행, 비행시정 및 구름 거리 기준 위반 비행.","동력을 이용하지 않는 초경량비행장치(행글라이더, 패러글라이더, 낙하산, 기구류)에 진로를 양보해야 한다.","시계상 양호한 기상상태: 해발 10,000ft 이상 비행시정 8천m, 10,000ft 미만~3,000ft(또는 장애물 상공 1,000ft 중 높은 고도) 초과 5천m, 구름으로부터 수평 1,500m·수직 1,000ft. 3,000ft 이하 F·G등급은 5천m, 지표면 육안 식별 및 구름을 피할 수 있는 거리.","3,000ft 이하 F·G등급 비행시정은 우세시정 하 다른 항공기·장애물을 보고 피할 수 있는 속도로 움직이는 경우, 교통량이 적어 마주칠 확률이 낮은 경우 1,500m까지 적용 가능.","탑재용 항공일지를 기내에 비치하고, 항공에 사용하거나 개조·정비한 경우 지체 없이 기록(등록부호·등록일, 종류·형식, 안전성인증서번호, 제작자·제작번호·제작일, 발동기·프로펠러 형식, 비행기록, 총비행시간과 최근 오버홀 후 총비행시간, 정비 기록).","항공레저스포츠사업 종사 조종사: 비행 전 이상 유무 점검(이상 시 비행 중단), 동승자에게 안전 주의사항 설명, 제작자가 정한 최대이륙중량 초과 금지, 제작자 거리 기준 충족 활주로 이용, 동승자 인적사항(성명·생년월일·주소) 기록·유지."]},{"title":"5.3 경량항공기의 비행제한","page":60,"points":["항공안전법 제121조(준용규정)에 따라 제79조(항공기의 비행제한 등)를 경량항공기에 준용한다.","비관제공역 또는 주의공역에서 경량항공기를 운항하려는 사람은 국토교통부장관이 정하여 공고하는 비행의 방식 및 절차에 따라야 한다.","통제공역에서는 비행해서는 안 되며, 국토교통부장관의 허가를 받아 정해진 방식·절차에 따르는 경우만 예외.","통제공역 비행허가 신청: 통제공역 비행허가 신청서(시행규칙 별지 제84호서식)를 지방항공청장에게 제출. 비행 중에는 무선통신 등으로 제출 가능."]},{"title":"5.4 주류등 제한","page":61,"points":["경량항공기조종사(조종연습을 하는 사람 포함)는 주류·마약류·환각물질(주류등)의 영향으로 정상적 업무 수행이 불가능한 상태에서 업무를 해서는 안 되며, 업무 종사 중에는 주류등을 섭취·사용해서는 안 된다.","정상 업무 불가 기준: 혈중알코올농도 0.02퍼센트 이상, 「마약류 관리에 관한 법률」의 마약류 사용, 「화학물질관리법」 제22조제1항의 환각물질 사용.","국토교통부장관(또는 소속 공무원)은 호흡측정기 검사 등으로 측정할 수 있고 조종사는 이에 따라야 한다.","측정 결과에 불복하면 조종사의 동의를 받아 혈액 채취 또는 소변 검사 등으로 다시 측정할 수 있다.","항공업무에 종사하는 동안 항공기 내에서 흡연해서는 안 된다."]},{"title":"5.5 항공교통관제 업무","page":61,"points":["국토교통부장관 또는 항공교통업무증명을 받은 자는 비행장·공항·관제권·관제구에서 항공교통관제 업무를, 비행정보구역에서 운항 관련 조언·정보 및 수색·구조 관련 정보를 제공할 수 있다.","비행장·이착륙장·공항·관제권·관제구에서 이동·이륙·착륙·비행하려는 자는 지시된 순서·시기·비행방법을 따라야 하며, 이동지역에서 차량 운행·유지보수 등 업무 수행자도 지시에 따라야 한다.","음성으로 전달된 관제 허가·지시는 복창해야 하며, 반드시 복창할 사항: 활주로 진입·착륙·이륙·대기·횡단·역방향 주행 허가/지시, 사용 활주로, 고도계 수정치, 트랜스폰더(Mode 3/A, Mode C) 배정부호, 고도·기수·속도지시, 전이고도, 항공로 허가사항.","관제사는 복창을 경청하고 틀린 사항이 있으면 즉시 시정조치해야 한다.","관제사-조종사 데이터통신(CPDLC)으로 허가·지시가 전달되면 음성 복창을 하지 않을 수 있다."]},{"title":"5.6.1~5.6.6 비행규칙·지상이동·비행장 주변 비행·순항고도·고도계 수정","page":63,"points":["경량항공기 비행규칙은 항공안전법 제67조를 준용: 재산·인명 보호 일반규칙, 시계비행 규칙, 비행계획 작성·제출·접수·통보 규칙 등.","비행 전 현재 기상관측보고, 기상예보, 소요 연료량, 대체 비행경로 등 필요한 정보를 숙지해야 한다. 비행규칙은 안전상 불가피한 경우 예외.","지상이동: 정면 접근 시 모두 정지하거나 가능하면 각각 오른쪽으로 진로 변경, 교차 접근 시 상대를 우측으로 보는 항공기가 양보, 앞지르기 시 충분한 분리 유지, 관제탑 지시 없으면 활주로진입전대기지점(Runway Holding Position)에서 정지, 정지선등(Stop Bar Lights)이 켜져 있으면 정지·대기 후 꺼질 때 이동.","비행장 주변: 이륙 항공기는 안전고도·안전속도 미만에서 선회 금지, 이륙기상최저치 미만 이륙 금지, 시계비행착륙기상최저치 미만 시계비행 착륙 시도 금지, 관제기관과 무선통신 유지.","선행 이륙기가 활주로 종단을 통과하기 전 이륙활주 시작 금지, 선행 착륙기가 활주로 밖으로 나가기 전 활주로 시단 통과 금지. 지시가 없으면 접근·이륙 중 선회는 좌선회, 바람이 불어오는 방향으로 이착륙.","관제구·관제권에서는 관제기관이 지시하는 고도로 비행. 순항고도: 000°~179° 시계비행 1,500ft(FL015)·3,500ft(FL035), 180°~359° 2,500ft(FL025)·4,500ft(FL045).","기압고도계: 비행로를 따라 185km(100해리) 이내에 관제기관이 있으면 그 기관이 통보한 QNH로, 없으면 비행정보기관 등의 최신 QNH로 수정.","QNH는 전이고도 14,000ft 이하에서 사용하며 평균해면으로부터 고도를 표시하도록(출발비행장 활주로 표고를 지시하도록) 고도계를 맞추는 방식."]},{"title":"5.6.7~5.6.10 통행 우선순위·진로와 속도·수상 충돌예방·편대비행","page":66,"points":["교차 접근 시 양보: 비행기·헬리콥터 → 비행선·활공기·기구류에, 비행기·헬리콥터·비행선 → 예항하는 항공기에, 비행선 → 활공기·기구류에, 활공기 → 기구류에 양보. 동종이면 상대를 우측으로 보는 항공기가 양보.","비행 중·지상·수상 운항 중인 항공기는 착륙 중이거나 최종접근 중인 항공기에 양보. 착륙 접근 상호간에는 높은 고도의 항공기가 낮은 고도의 항공기에 양보하되, 낮은 항공기는 최종 접근단계 항공기 전방에 끼어들거나 앞지르기 금지.","비행기·헬리콥터·비행선은 착륙을 위해 접근하는 활공기에 양보. 비상착륙 항공기를 인지하면 양보. 기동지역에서는 이륙 중이거나 이륙하려는 항공기에 양보.","우선권이 있는 항공기는 진로와 속도를 유지. 양보하는 항공기는 상대의 상하 또는 전방 통과 금지(충분한 거리·항적난기류 고려 시 예외).","정면 접근 시 서로 기수를 오른쪽으로. 후방 좌·우 70도 미만 각도에서 앞지르기(상승·강하 포함)하는 항공기는 앞지르기당하는 항공기의 오른쪽을 통과하며 진로 방해 금지.","수상: 「해사안전법」에 달리 정한 것이 없으면 교차 시 상대를 오른쪽으로 보는 쪽이 양보, 정면 시 서로 기수를 오른쪽으로, 수상 이착륙 시 선박 항해 방해 금지.","2대 이상 편대비행 기장은 사전에 실시계획, 편대의 형, 선회 등 행동요령, 신호 및 의미를 협의.","관제공역 내 편대: 편대 책임기장은 편대를 단일 경량항공기로 취급하여 위치 보고, 집결·분산 시 분리. 편대 내 분리는 종적·횡적 1km, 수직 30m 이내."]},{"title":"5.6.11~5.6.16 최저비행고도·시계비행·통신·위치보고·시간·신호","page":68,"points":["최저비행고도 미만 비행 금지. 예외: 이륙·착륙, 항공교통업무기관 허가, 비상 시 지상 사람·재산에 위해 없이 착륙할 수 있는 고도.","지표면·수면 상공 900m(3천피트) 이상 비행 시 순항고도에 따라 비행. B·C·D등급 공역, 관제비행장 부근·기동지역, 특별시계비행방식 비행 시 관제기관 지시에 따름. 관제권 내 시계비행 시 공지 통신 유지·경청.","통신두절항공기는 고시된 교신절차에 따르고 관제탑 시각신호를 주시하며, 시계비행 기상상태이면 시계비행을 계속해 가장 가까운 착륙 가능 비행장에 착륙 후 지체 없이 도착 통보.","위치보고(위치통보지점): 식별부호, 통과시각과 고도, 안전항행 영향사항. 레이더 관제 중 별도 요구 없으면 생략 가능. 통보지점이 없으면 지정된 시간·거리 간격으로, 데이터링크 사용 시 요구하면 음성으로 보고. 시간은 국제표준시(UTC), 자정 기준 24시간 시·분(필요시 초) 표시. 데이터링크 시간은 UTC 기준 1초 이내 정확도 유지.","조난신호(중대·절박한 위험, 즉각 도움 필요): SOS(…---…), 짧은 간격 1발씩 붉은색 로켓·대포, 붉은색 낙하산 부착 불빛, 무선전화 MAYDAY, 데이터링크 MAYDAY.","긴급신호: 착륙등 스위치 개폐 반복 또는 항행등 개폐 반복(즉각 도움은 불필요하나 불가피한 착륙의 어려움), 무선전신 XXX, 무선전화·데이터링크 PAN PAN(매우 긴급한 통보사항).","침범 경고신호: 지상에서 10초 간격으로 발사되는 붉은색 및 녹색 불빛·별모양 신호탄. 통신두절 응신: 비행 중 주간 날개 흔들기(base leg·final leg 제외), 지상 주간 보조익·방향타 움직임, 야간은 착륙등(없으면 항행등) 2회 점멸.","빛총신호(비행 중/지상): 연속 녹색=착륙허가/이륙허가, 연속 붉은색=양보하고 계속 선회/정지, 깜박이는 녹색=착륙 준비/지상이동 허가, 깜박이는 붉은색=비행장 불안전 착륙 금지/착륙지역에서 벗어날 것, 깜박이는 흰색=착륙하여 계류장으로/출발지점으로 돌아갈 것."]},{"title":"5.7 공항시설","page":71,"points":["비행장시설: 비행장에 설치된 이착륙 시설과 부대시설로 국토교통부장관이 지정. 활주로: 이착륙을 위해 국토교통부령으로 정하는 크기의 구역.","착륙대: 활주로와 항공기가 활주로를 이탈하는 경우 피해를 줄이기 위해 활주로 주변에 설치하는 안전지대로, 활주로 중심선에 중심을 두는 직사각형의 지표면 또는 수면.","장애물 제한표면: 장애물 설치 등이 제한되는 표면(대통령령). 항행안전시설: 유선통신·무선통신·인공위성·불빛·색채·전파를 이용하는 시설. 항공등화: 불빛·색채·형상 이용. 항행안전무선시설: 전파 이용. 항공정보통신시설: 전기통신 이용 정보 제공·교환.","기본시설: 활주로·유도로·계류장·착륙대 등 이착륙시설, 여객·화물처리시설, 항행안전시설, 통신시설, 기상관측시설, 주차·경비·보안시설, 홍보·안내시설. 지원시설: 정비시설, 운항관리·의료·교육훈련·소방·기내식, 급유·유류저장, 화물창고 등.","비계기·비정밀접근 활주로 비행장의 장애물 제한표면: 수평표면, 원추표면, 진입표면, 전이표면. 직진입 절차만 있는 수상비행장은 원추표면·수평표면 미적용.","항공등화 예: 비행장등대(위치), 비행장식별등대(모르스부호 점멸), 진입각지시등(진입각 적정 여부, 활주로 외측), 활주로등(활주로 양측), 활주로종단등, 활주로시단식별등(시단 양쪽), 활주로경계등(진입 전 멈출 위치), 착륙방향지시등(T자형 또는 4면체형), 활주로회전패드등(180도 회전), 비상용등화(이동형).","항행안전무선시설: DME, ILS/MLS/TLS, MLAT, 레이더(ASR/ARSR/SSR 등), NDB, UAT, GNSS 감시·위성항법(GNSS/SBAS/GRAS/GBAS), ADS(ADS-B, ADS-C), VOR, TACAN.","항공정보통신시설: 항공고정통신시설(AFTN/MHS, AIDC, AMHS, ATN), 항공이동통신시설(CPDLC, VHF/UHF, HFDL, HF, 모드 S, VCCS, VDL, AMS(R)S, AeroMACS), 항공정보방송시설(ATIS)."]},{"title":"5.8 항공장애 표시등 및 주간표지","page":77,"points":["장애물 제한구역 내부: 진입·전이표면 또는 수평·원추표면보다 높은 물체에는 표지를, 비행장이 야간 사용되면 표시등도 설치. 지표·수면 60m 이상 물체에는 표시등과 표지 설치.","비행장 이동지역의 차량·이동물체는 표지, 야간·저시정 사용 시 표시등도 설치(항공기, 계류장 전용 조업장비·차량 제외). 노출된 항공등화에는 표지(지방항공청장 인정 시 생략 가능).","장애물 제한구역 밖: 150m 이상 물체·구조물은 표시등과 표지. 60m 이상인 굴뚝·철탑·기둥, 뼈대 구조물, 추가 설치 철탑·송전탑, 가공선·케이블, 계류기구(주간 시정 5,000m 미만·야간), 풍력터빈도 표시등과 표지.","장애표지물 색채: 흰색과 붉은색 또는 흰색과 주황색. 공중에서 최소 1,000m, 지상에서 최소 300m 거리에서 확인 가능. 공중선 표지물은 직경 60cm 이상 구형, 가장 높은 공중선에 설치.","표지물 간격: 직경 60~80cm 미만 30m, 80~130cm 미만 35m, 130cm 이상 40m 초과 금지.","풍력터빈: 전체 높이 150m 미만은 상부에 중광도 A·B·C형 표시등, 150~315m는 상부에 중광도 2개 + 중간 높이에 저광도 E형 3개 이상. 풍력발전단지 표시등 간격 900m 이내, 섬광등은 동시 섬광.","색채 표지: 가로·세로 모두 4.5m 이상이면 바둑판(한 변 1.5~3m, 모퉁이는 어두운 색), 한 변 1.5m 초과·다른 변 4.5m 미만 또는 뼈대형은 줄무늬(주황·흰색, 끝단 진한 색), 두 변 모두 1.5m 미만은 주황 또는 붉은색 단일색. 응급차량 붉은색·황록색, 업무차량 노란색.","구형 저장탱크: 주황·흰색 물방울 줄무늬, 배 부분 폭 1.5~4.5m, 문자로 끊기는 폭 0.9m 이하. 풍력터빈은 회전날개·엔진실·지지대 상부 2/3 흰색. 고정물체 기 0.6m 이상 사각형(집단은 최소 15m 간격), 이동물체 기 0.9m 이상 바둑판(눈 0.3m 이상), 계류용 선 기 15m 이하 간격·1.6km 식별."]},{"title":"5.9 항공기의 등불","page":84,"points":["야간은 해가 진 뒤부터 해가 뜨기 전까지를 말한다.","야간에 공중·지상·수상을 항행하거나 이동지역에서 이동 또는 엔진 작동 중이면 항행등(우현등, 좌현등, 미등)과 충돌방지등으로 위치를 나타내야 한다.","야간에 사용되는 비행장에 주기·정박 시 항행등으로 위치 표시. 단, 비행장에 항공기를 조명하는 시설이 있으면 예외.","항행등으로 잘못 인식될 수 있는 다른 등불을 켜서는 안 된다.","섬광등이 업무에 장애를 주거나 외부 사람에게 눈부심을 줄 수 있으면 끄거나 빛의 강도를 줄여야 한다."]},{"title":"5.10 항공계기 등의 설치·탑재 및 운용","page":85,"points":["비행방식과 운영범위에 따라 필요한 항공계기·장비·구급용구 등을 설치·탑재하여 운용해야 한다(항공안전법 제52조).","시계비행방식 항공계기: 나침반(Magnetic Compass), 시계(시·분·초 표시), 속도계(Airspeed Indicator), 기압고도계(Pressure Altimeter). 헬리콥터는 정밀기압고도계.","수상비행기(수륙 양용 포함) 구급용구: 구명동의 또는 개인부양장비(탑승자 1명당 1개), 음성신호발생기, 해상용 닻(해상이동에 필요한 경우만), 일상용 닻.","육상단발비행기(수륙 양용 포함)가 해안으로부터 활공거리를 벗어난 해상을 비행하면 탑승자 1명당 1개의 구명동의 또는 개인부양장비.","수색구조가 특별히 어려운 산악지역, 외딴지역, 국토교통부장관이 정한 해상 등을 횡단 비행하는 비행기(헬리콥터 포함)는 불꽃조난신호장비 및 구명장비를 갖추어야 한다."]}],"memorize":[{"k":"도착보고 시기","v":"착륙 즉시 관할 항공교통업무기관에 / 착륙 후 통신시설 없으면 착륙 직전","page":53},{"k":"불확실상황(INCERFA)","v":"연락 예정 또는 첫 교신실패 중 이른 시간부터 30분 무연락 / 도착예정 중 늦은 시간부터 30분 미도착","page":54},{"k":"경보상황(ALERFA) 착륙 지연","v":"착륙허가 후 착륙예정시간부터 5분 이내 미착륙 + 무선교신 불가","page":54},{"k":"관제구 높이","v":"지표면 또는 수면으로부터 200미터 이상 높이의 공역","page":55},{"k":"관제공역/비관제공역 등급","v":"관제공역 A·B·C·D·E등급, 비관제공역 F·G등급","page":56},{"k":"관제권 해당 등급","v":"비행정보구역 내 B, C 또는 D등급 공역 중에서 지정","page":57},{"k":"경량항공기사고 기간","v":"비행 목적으로 발동기 시동 순간부터 비행 종료 후 발동기 정지 순간까지","page":57},{"k":"경량항공기 비행 상한","v":"평균해면으로부터 1,500m(5천피트) 이상 비행 금지 (항공교통업무기관 승인 시 제외)","page":58},{"k":"VMC 10,000ft 이상","v":"비행시정 8천m, 구름 수평 1,500m·수직 1,000ft","page":59},{"k":"VMC 10,000ft 미만~3,000ft 초과","v":"비행시정 5천m, 구름 수평 1,500m·수직 1,000ft","page":59},{"k":"통제공역 비행허가 신청","v":"별지 제84호서식 신청서를 지방항공청장에게 제출 (비행 중 무선통신 가능)","page":60},{"k":"혈중알코올농도 기준","v":"0.02퍼센트 이상이면 정상 업무 수행 불가","page":61},{"k":"음주측정 불복 시","v":"조종사 동의 받아 혈액 채취 또는 소변 검사로 재측정","page":61},{"k":"순항고도 000°~179°","v":"1,500ft(FL015), 3,500ft(FL035)","page":65},{"k":"순항고도 180°~359°","v":"2,500ft(FL025), 4,500ft(FL045)","page":65},{"k":"QNH 수정 기준 거리","v":"비행로 따라 185km(100해리) 이내 관제기관 QNH, 없으면 비행정보기관 최신 QNH","page":65},{"k":"QNH 사용 범위","v":"전이고도 14,000ft 이하","page":66},{"k":"앞지르기 기준 각도","v":"후방 좌·우 70도 미만에서 접근 시 앞지르기 — 상대의 오른쪽으로 통과","page":67},{"k":"편대 내 분리","v":"종적·횡적 1km, 수직 30m 이내","page":68},{"k":"순항고도 적용 높이","v":"지표면·수면 상공 900m(3천피트) 이상 비행 시","page":68},{"k":"조난신호","v":"SOS(…---…), 붉은색 로켓·대포(짧은 간격 1발씩), 붉은색 낙하산 불빛, MAYDAY","page":70},{"k":"긴급신호","v":"착륙등·항행등 스위치 개폐 반복, XXX, PAN PAN","page":70},{"k":"침범 경고신호","v":"지상에서 10초 간격으로 발사되는 붉은색 및 녹색 불빛·별모양 신호탄","page":71},{"k":"빛총신호 연속 녹색","v":"비행 중: 착륙 허가 / 지상: 이륙 허가","page":71},{"k":"빛총신호 깜박이는 붉은색","v":"비행 중: 비행장 불안전, 착륙 금지 / 지상: 사용 중인 착륙지역에서 벗어날 것","page":71},{"k":"장애표시등 설치 높이","v":"제한구역 내 60m 이상 / 제한구역 밖 150m 이상(특정 구조물은 60m 이상)","page":78},{"k":"장애표지물 확인 거리","v":"공중 최소 1,000m, 지상 최소 300m / 공중선용은 직경 60cm 이상 구형","page":79},{"k":"장애표지물 간격","v":"직경 60~80cm 30m, 80~130cm 35m, 130cm 이상 40m","page":79},{"k":"풍력발전단지 표시등 간격","v":"900m 이내","page":80},{"k":"시계비행 항공계기","v":"나침반, 시계(시·분·초), 속도계, 기압고도계","page":85}],"quiz":[{"q":"비행계획에 포함되어야 할 사항 중 지방항공청장 또는 항공교통본부장이 요청하거나 제출자가 필요하다고 판단하는 경우에만 포함하는 사항이 아닌 것은?","o":["시간으로 표시한 연료탑재량","탑승 총 인원","비상무선주파수 및 구조장비","순항속도, 순항고도 및 예정항공로"],"a":3,"e":"㈕ 연료탑재량, ㈖ 변경될 목적비행장, ㈗ 탑승 총 인원, ㈘ 비상무선주파수 및 구조장비가 요청 시에만 포함되는 사항이며, 순항속도·고도·예정항공로는 기본 포함사항이다.","page":50},{"q":"시계비행방식에 따른 관제비행 중 기상이 시계비행기상상태 미만으로 악화된 경우의 조치로 옳지 않은 것은?","o":["목적비행장 또는 교체비행장으로 시계비행 기상상태를 유지하며 비행할 수 있도록 관제허가 변경을 요청한다.","관제허가를 받지 못하면 시계비행 기상상태를 유지하며 관제공역을 이탈하거나 가까운 비행장에 착륙할 예정임을 통보한다.","관제권 안에서 비행 중인 경우 특별시계비행방식에 따른 운항허가를 요구한다.","관제기관의 허가 없이 즉시 계기비행방식으로 전환하여 비행을 계속한다."],"a":3,"e":"교재의 조치는 관제허가 변경 요청, 불가 시 시계비행 기상상태 유지 하 관제공역 이탈 또는 착륙 예정 통보, 관제권 안이면 특별시계비행 허가 요구이다.","page":52},{"q":"도착비행장에 착륙한 후 도착보고를 할 수 있는 적절한 통신시설이 제공되지 않는 경우 도착보고 시기는?","o":["착륙 직전","착륙 후 30분 이내","착륙 후 24시간 이내","다음 비행 시작 전"],"a":0,"e":"착륙 후 도착보고를 할 통신시설이 없으면 착륙 직전에 관할 항공교통업무기관에 도착보고를 해야 한다.","page":53},{"q":"불확실상황(INCERFA)에 해당하는 경우로 옳은 것은?","o":["착륙허가를 받고도 착륙예정시간부터 5분 이내에 착륙하지 않은 경우","연락 예정시간 또는 첫 교신시도 실패시간 중 더 이른 시간부터 30분 이내에 연락이 없는 경우","탑재연료가 고갈되어 안전 유지가 곤란한 경우","불시착하였다는 정보가 정확한 정보로 판단되는 경우"],"a":1,"e":"30분 무연락·미도착은 불확실상황, 5분 미착륙은 경보상황, 연료 고갈·불시착 정보는 조난상황이다.","page":54},{"q":"경량항공기가 착륙허가를 받고도 착륙예정시간부터 몇 분 이내에 착륙하지 않고 무선교신이 되지 않으면 경보상황(Alert phase)에 해당하는가?","o":["3분","10분","5분","30분"],"a":2,"e":"착륙허가 후 착륙예정시간부터 5분 이내에 착륙하지 않은 상태에서 무선교신이 되지 않으면 경보상황이다.","page":54},{"q":"조난상황(DETRESFA)에 해당하지 않는 것은?","o":["경보상황에서 교신시도와 관계 부서 조회 결과 조난당하였을 가능성이 있는 경우","탑재연료가 고갈되어 안전을 유지하기가 곤란한 경우","비행능력이 상실되어 불시착하였을 가능성이 있음을 나타내는 정보가 입수되는 경우","비행능력이 상실되었으나 불시착할 가능성이 없음을 나타내는 정보를 입수한 경우"],"a":3,"e":"비행능력은 상실되었으나 불시착 가능성이 없다는 정보를 입수한 경우는 경보상황에 해당한다.","page":54},{"q":"관제구(管制區)의 정의로 옳은 것은?","o":["비행장 또는 공항과 그 주변의 공역","지표면 또는 수면으로부터 200미터 이상 높이의 공역으로서 국토교통부장관이 지정·공고한 공역","지표면 또는 수면으로부터 150미터 이상 높이의 공역","대한민국의 영토와 내수 및 영해의 상공"],"a":1,"e":"관제구는 지표면 또는 수면으로부터 200미터 이상 높이의 공역으로서 국토교통부장관이 지정·공고한 공역이다. 보기 1은 관제권, 보기 4는 영공이다.","page":55},{"q":"제공하는 항공교통업무에 따른 공역 구분에서 비관제공역에 해당하는 것은?","o":["C등급, D등급","D등급, E등급","E등급, F등급","F등급, G등급"],"a":3,"e":"관제공역은 A~E등급, 비관제공역은 F·G등급이다.","page":56},{"q":"계기비행을 하는 항공기에 항공교통관제업무가 제공되고, 시계비행을 하는 항공기에 교통정보가 제공되는 공역은?","o":["B등급","C등급","E등급","F등급"],"a":2,"e":"E등급은 IFR 항공기에 관제업무, VFR 항공기에 교통정보가 제공되는 공역이다. F등급은 IFR에 비행정보·조언업무, VFR에 비행정보업무가 제공된다.","page":56},{"q":"사용목적에 따른 공역 구분에서 주의공역에 해당하지 않는 것은?","o":["훈련구역","위험구역","비행제한구역","경계구역"],"a":2,"e":"비행제한구역은 비행금지구역, 초경량비행장치 비행제한구역과 함께 통제공역에 속한다. 주의공역은 훈련·군작전·위험·경계구역 및 초경량비행장치 비행구역이다.","page":57},{"q":"경량항공기사고의 정의에서 사고가 성립하는 시간적 범위는?","o":["사람이 비행을 목적으로 탑승한 때부터 내릴 때까지","이륙활주를 시작한 때부터 착륙 후 정지할 때까지","비행을 목적으로 발동기가 시동되는 순간부터 비행이 종료되어 발동기가 정지되는 순간까지","바퀴가 지면에서 떨어진 때부터 다시 접지할 때까지"],"a":2,"e":"경량항공기사고는 비행을 목적으로 발동기가 시동되는 순간부터 비행이 종료되어 발동기가 정지되는 순간까지 발생한 사망·중상·행방불명 등을 말한다.","page":57},{"q":"경량항공기 조종사의 금지행위에 해당하지 않는 것은?","o":["일몰 후부터 일출 전까지의 야간에 비행하는 행위","항공교통업무기관의 승인 없이 평균해면으로부터 1,500m 이상으로 비행하는 행위","동승한 사람의 낙하산 강하","평균해면으로부터 900m 고도에서 순항고도에 따라 비행하는 행위"],"a":3,"e":"야간비행, 승인 없는 평균해면 1,500m(5천피트) 이상 비행, 동승자 낙하산 강하, 곡예비행 등은 금지행위이며, 1,500m 미만에서 순항고도에 따른 비행은 금지되지 않는다.","page":58},{"q":"해발 10,000피트 이상 고도에서 시계상의 양호한 기상상태 기준으로 옳은 것은?","o":["비행시정 8천m, 구름으로부터 수평 1,500m·수직 1,000피트","비행시정 5천m, 구름으로부터 수평 1,500m·수직 1,000피트","비행시정 8천m, 구름으로부터 수평 1,000m·수직 500피트","비행시정 5천m, 지표면 육안 식별 및 구름을 피할 수 있는 거리"],"a":0,"e":"해발 10,000피트 이상에서는 비행시정 8천m, 구름으로부터 수평 1,500m·수직 1,000피트이다(시행규칙 별표 24).","page":59},{"q":"통제공역에서 비행하려는 자가 통제공역 비행허가 신청서를 제출해야 하는 대상은?","o":["국토교통부장관","지방항공청장","항공교통본부장","관할 비행장 관제탑"],"a":1,"e":"통제공역 비행허가 신청서(별지 제84호서식)는 지방항공청장에게 제출하며, 비행 중인 경우 무선통신 등의 방법으로 제출할 수 있다.","page":60},{"q":"주류등의 영향으로 경량항공기조종사의 업무를 정상적으로 수행할 수 없는 상태의 혈중알코올농도 기준은?","o":["0.02퍼센트 이상","0.01퍼센트 이상","0.03퍼센트 이상","0.05퍼센트 이상"],"a":0,"e":"주정성분이 있는 음료의 섭취로 혈중알코올농도가 0.02퍼센트 이상인 경우 정상적으로 업무를 수행할 수 없는 상태로 본다.","page":61},{"q":"경량항공기 조종사가 음성으로 전달된 관제 허가·지시 중 반드시 복창해야 하는 사항이 아닌 것은?","o":["활주로의 진입, 착륙, 이륙, 대기, 횡단 및 역방향 주행에 대한 허가 또는 지시","사용 활주로, 고도계 수정치, 트랜스폰더 배정부호","항공로의 허가사항","공항정보방송(ATIS)의 기상 정보 전문"],"a":3,"e":"반드시 복창할 사항은 활주로 관련 허가·지시, 사용 활주로·고도계 수정치·트랜스폰더 배정부호·고도·기수·속도지시·전이고도, 항공로 허가사항이다. 또한 CPDLC로 전달된 경우 음성 복창을 하지 않을 수 있다.","page":62},{"q":"비행장 또는 그 주변을 비행하는 경량항공기 조종사의 준수사항으로 옳은 것은?","o":["달리 지시를 받은 경우를 제외하고 접근 또는 이륙 중 선회는 좌선회한다.","앞선 항공기가 착륙하여 활주로 밖으로 나가기 전이라도 활주로 시단을 통과할 수 있다.","필요한 경우를 제외하고 바람을 등지고 이륙 및 착륙한다.","이륙 후 안전고도 미만에서 신속히 선회하여 교통장주에 진입한다."],"a":0,"e":"지시가 없으면 좌선회하고, 바람이 불어오는 방향으로 이착륙하며, 안전고도·안전속도 미만에서 선회하지 말아야 한다. 선행 착륙기가 활주로를 벗어나기 전에는 시단을 통과하지 않는다.","page":65},{"q":"자기방위 270°로 시계비행하는 경량항공기의 순항고도로 옳은 것은?","o":["1,500ft","3,500ft","4,500ft","5,500ft"],"a":2,"e":"180°~359° 방향 시계비행 순항고도는 2,500ft(FL025)와 4,500ft(FL045)이다. 1,500ft·3,500ft는 000°~179° 방향이다.","page":65},{"q":"비행로를 따라 일정 거리 이내에 항공교통관제기관이 있는 경우 그 기관으로부터 통보받은 QNH로 기압고도계를 수정해야 한다. 이 거리 기준은?","o":["93km(50해리)","185km(100해리)","278km(150해리)","370km(200해리)"],"a":1,"e":"비행로를 따라 185km(100해리) 이내에 관제기관이 있으면 그 QNH로, 없으면 비행정보기관 등의 최신 QNH로 수정한다.","page":65},{"q":"착륙을 위하여 비행장에 접근하는 항공기 상호간의 진로 양보에 관한 설명으로 옳은 것은?","o":["낮은 고도의 항공기가 높은 고도의 항공기에 진로를 양보한다.","속도가 빠른 항공기가 우선권을 가진다.","높은 고도의 항공기가 낮은 고도의 항공기에 진로를 양보하며, 낮은 고도의 항공기는 최종 접근단계 항공기 전방에 끼어들 수 없다.","먼저 무선 교신을 한 항공기가 우선권을 가진다."],"a":2,"e":"착륙 접근 상호간에는 높은 고도의 항공기가 낮은 고도의 항공기에 양보하고, 낮은 고도의 항공기는 최종 접근단계에 있는 항공기 전방에 끼어들거나 앞지르기해서는 안 된다.","page":66},{"q":"다른 항공기의 후방 좌·우 몇 도 미만의 각도에서 앞지르기하는 항공기는 앞지르기당하는 항공기의 오른쪽을 통과해야 하는가?","o":["30도","45도","60도","70도"],"a":3,"e":"후방 좌·우 70도 미만의 각도에서 앞지르기(상승·강하 포함)하려는 항공기는 앞지르기당하는 항공기의 오른쪽을 통과해야 한다.","page":67},{"q":"관제공역 내에서 편대비행을 할 때 편대를 책임지는 경량항공기로부터 편대 내 경량항공기들의 분리 기준은?","o":["종적·횡적 1km, 수직 30m 이내","종적·횡적 500m, 수직 30m 이내","종적·횡적 1km, 수직 100m 이내","종적·횡적 2km, 수직 60m 이내"],"a":0,"e":"편대 책임 경량항공기로부터 편대 내 경량항공기들을 종적 및 횡적으로는 1km, 수직으로는 30m 이내로 분리해야 한다.","page":68},{"q":"통신두절항공기가 시계비행 기상상태인 경우 취해야 할 조치로 옳은 것은?","o":["즉시 출발비행장으로 회항하여 착륙한다.","시계비행방식으로 비행을 계속하여 가장 가까운 착륙 가능한 비행장에 착륙한 후 도착 사실을 지체 없이 관할 관제기관에 통보한다.","비행계획상 목적비행장까지 계기비행방식으로 비행한다.","현 위치에서 30분간 선회 대기 후 착륙한다."],"a":1,"e":"통신두절항공기는 시계비행 기상상태인 경우 시계비행방식으로 비행을 계속하여 가장 가까운 착륙 가능한 비행장에 착륙한 후 지체 없이 도착 사실을 통보해야 한다.","page":69},{"q":"비행 중인 항공기에 대한 빛총신호 중 깜박이는 붉은색의 의미는?","o":["착륙을 허가함","다른 항공기에 진로를 양보하고 계속 선회할 것","착륙을 준비할 것","비행장이 불안전하니 착륙하지 말 것"],"a":3,"e":"비행 중인 항공기에 깜박이는 붉은색은 비행장이 불안전하니 착륙하지 말 것을 의미한다. 연속 붉은색은 양보하고 계속 선회, 연속 녹색은 착륙 허가, 깜박이는 녹색은 착륙 준비이다.","page":71},{"q":"무선통신 두절 시 비행 중인 항공기의 야간 응신 방법으로 옳은 것은?","o":["날개를 흔든다.","보조익 또는 방향타를 움직인다.","착륙등이 장착된 경우 착륙등을, 없으면 항행등을 2회 점멸한다.","충돌방지등을 끈다."],"a":2,"e":"야간에는 착륙등이 장착된 경우 착륙등을 2회 점멸하고, 장착되지 않은 경우 항행등을 2회 점멸한다. 주간 비행 중에는 날개를 흔든다.","page":71},{"q":"착륙하려는 항공기에 착륙 시 진입각의 적정 여부를 알려주기 위해 활주로의 외측에 설치하는 등화는?","o":["진입등 시스템(Approach Lighting Systems)","진입각 지시등(Precision Approach Path Indicator)","활주로시단식별등(Runway Threshold Identification Lights)","접지구역등(Touchdown Zone Lights)"],"a":1,"e":"진입각 지시등은 착륙하려는 항공기에 진입각의 적정 여부를 알려주기 위해 활주로 외측에 설치한다. 진입등 시스템은 진입로를 알려준다.","page":74},{"q":"장애물 제한구역 밖에 있는 물체로서 물체의 종류와 관계없이 지표 또는 수면으로부터 몇 m 이상이면 표시등과 표지를 설치해야 하는가?","o":["60m","100m","150m","200m"],"a":2,"e":"장애물 제한구역 밖에서는 높이가 150m 이상인 물체나 구조물에 표시등과 표지를 설치해야 하며, 굴뚝·철탑·가공선·풍력터빈 등 특정 물체는 60m 이상이면 설치한다.","page":78},{"q":"비행장 이동지역 내 이동물체의 단일 색 표지 기준으로 옳은 것은?","o":["응급차량은 붉은색 또는 황록색, 업무차량은 노란색","응급차량은 노란색, 업무차량은 붉은색","응급차량은 흰색, 업무차량은 주황색","응급차량과 업무차량 모두 주황색과 흰색 줄무늬"],"a":0,"e":"비행장 이동지역 내 이동물체는 응급차량 붉은색 또는 황록색, 업무차량 노란색, 그 밖의 이동물체는 눈에 잘 띄는 단일색으로 표지한다.","page":82},{"q":"시계비행방식에 의한 비행을 하는 항공기가 갖추어야 할 항공계기에 해당하지 않는 것은?","o":["나침반(Magnetic Compass)","속도계(Airspeed Indicator)","기압고도계(Pressure Altimeter)","자세지시계(Attitude Indicator)"],"a":3,"e":"시계비행방식 항공계기는 나침반, 시계(시·분·초 표시), 속도계, 기압고도계이다(헬리콥터는 정밀기압고도계).","page":85},{"q":"육상단발비행기가 구명동의 또는 이에 상당하는 개인부양장비를 탑승자 한 명당 1개씩 갖추어야 하는 경우는?","o":["해안으로부터 활공거리를 벗어난 해상을 비행하는 경우","고도 1,500m 이상으로 비행하는 경우","야간에 비행장에 주기하는 경우","관제권 내에서 비행하는 경우"],"a":0,"e":"육상단발비행기(수륙 양용 포함)가 해안으로부터 활공거리를 벗어난 해상을 비행하는 경우 탑승자 한 명당 1개의 구명동의 등을 갖추어야 한다.","page":85}]},{"id":"law-6","title":"제6장 경량항공기 사업","pages":[87,92],"goal":"경량항공기를 사용하는 항공기대여업·항공레저스포츠사업의 정의, 보험 가입의무, 영리 목적 사용금지, 등록요건과 결격사유를 알아야 한다.","summary":"경량항공기는 항공기대여업 또는 항공레저스포츠사업에 사용하는 경우를 제외하고는 영리 목적으로 사용할 수 없다. 경량항공기소유자등은 안전성인증을 받기 전까지 자동차손해배상 보장법 시행령 기준 금액 이상을 보장하는 보험·공제에 가입하고, 가입한 날부터 7일 이내에 보험가입신고서를 국토교통부장관에게 제출해야 한다. 항공기대여업과 항공레저스포츠사업은 자본금(경량항공기만 사용 시 3천만원 이상), 기체, 인력, 보험 등의 요건을 갖추어 등록해야 하며, 금고 이상 실형 후 3년, 등록취소 후 2년 등 결격사유가 있다. 항공레저스포츠사업에 쓰는 경량항공기는 안전성인증 제1종 등급을 받은 것이어야 한다.","sections":[{"title":"6.1 정의","page":87,"points":["항공기대여업: 타인의 수요에 맞추어 유상으로 항공기·경량항공기·초경량비행장치를 대여하는 사업(항공레저스포츠를 위하여 대여하는 사업은 제외)","항공레저스포츠: 취미·오락·체험·교육·경기 등을 목적으로 하는 비행(공중에서 낙하하여 낙하산류를 이용하는 비행 포함) 활동","항공레저스포츠사업: 타인의 수요에 맞추어 유상으로 ①항공기(비행선·활공기에 한정)·경량항공기·초경량비행장치로 조종교육, 체험 및 경관조망 목적으로 사람을 태워 비행하는 서비스 ②활공기 등·경량항공기·초경량비행장치를 항공레저스포츠용으로 대여하는 서비스 ③경량항공기·초경량비행장치의 정비, 수리 또는 개조서비스를 제공하는 사업","항공보험: 여객보험, 기체보험, 화물보험, 전쟁보험, 제3자보험, 승무원보험과 그 밖에 국토교통부령으로 정하는 보험 (항공사업법 제2조)"]},{"title":"6.2 항공보험 등의 가입의무","page":87,"points":["경량항공기소유자등은 비행으로 다른 사람이 사망·부상한 경우 피해자 보상을 위해 안전성인증을 받기 전까지 보험 또는 공제에 가입해야 함","보장금액: 「자동차손해배상 보장법 시행령」 제3조제1항 각 호에 따른 금액 이상, 동승한 사람에 대한 보장 포함","피해자가 사망한 경우 피해자란 손해배상을 받을 권리를 가진 자를 말함","가입한 날부터 7일 이내에 보험가입신고서(공제가입신고서)에 보험증서(공제증서) 사본을 첨부하여 국토교통부장관에게 제출, 변경·갱신 시에도 동일","신고서 기재사항: 가입자 주소·성명(법인은 명칭·대표자 성명), 보험 종류·보험료·보험금액, 종류별 발효 및 만료일, 보험증서 개요","항공기대여업자는 항공보험에 가입하지 아니하고는 경량항공기를 운항할 수 없음 (항공사업법 제70조)"]},{"title":"6.3 영리 목적 사용금지","page":88,"points":["경량항공기는 항공기대여업 또는 항공레저스포츠사업에 사용하는 경우를 제외하고는 영리 목적으로 사용해서는 아니 됨 (항공사업법 제71조)","영리 사용이 허용되는 두 사업은 모두 등록 대상: 항공기대여업은 국토교통부장관에게 등록, 항공레저스포츠사업은 지방항공청장에게 등록신청서 제출","사업용으로 등록하지 아니한 경량항공기를 영리 목적으로 사용하면 1년 이하의 징역 또는 1천만원 이하의 벌금 (항공사업법 제80조)"]},{"title":"6.4.1 항공기대여업","page":88,"points":["경량항공기로 항공기대여업을 경영하려면 신청서에 사업계획서 등을 첨부하여 국토교통부장관에게 등록, 국토교통부령으로 정하는 등록사항 변경 시 신고","등록요건(표 6-1) 자본금: 법인 납입자본금 2억5천만원 이상, 개인 자산평가액 3억7,500만원 이상, 단 경량항공기·초경량비행장치만 대여하는 경우 3천만원 이상","등록요건 기체: 항공기, 경량항공기 또는 초경량비행장치 1대 이상","보험: 기체마다 여객보험(여객 없는 초경량비행장치 제외), 기체보험(경량항공기·초경량비행장치 제외), 제3자보험, 승무원보험(승무원 없는 초경량비행장치 제외)","결격: 경량항공기 소유자로 등록할 수 없는 자, 피성년후견인·피한정후견인·복권되지 않은 파산자 (임원 포함)","결격: 항공안전법·공항시설법·항공보안법·항공·철도 사고조사법 위반으로 금고 이상 실형 후 집행 종료(면제 확정)일부터 3년 미경과자, 또는 금고 이상 형의 집행유예 기간 중인 사람","결격: 국내·국제·소형항공운송사업 또는 항공기사용사업 면허·등록 취소 후 2년 미경과자, 항공기대여업 등록 취소 후 2년 미경과자 (항공사업법 제46조)"]},{"title":"6.4 항공레저스포츠사업 등록요건 및 절차","page":90,"points":["자본금(표 6-2·6-3·6-4 공통): 법인 납입자본금 3천만원 이상, 개인 자산평가액 3천만원 이상","사람을 태워 비행하는 사업(표 6-2): 안전성인증 제1종 등급 경량항공기(경량항공기 기술기준에 적합하게 완제형태로 제작된 것), 조종교육증명을 받은 조종인력, 항공정비사 1명 이상, 비행 및 안전통제요원 1명 이상","정비업무 전체를 항공레저스포츠사업의 경량항공기 정비업체에 위탁하면 정비인력을 갖추지 않을 수 있고, 안전통제요원은 안전관리에 지장이 없는 범위에서 정비인력으로 대체 가능","시설·장비: 인근 항공교통업무 수행기관(군 비행장 포함)과 연락할 수 있는 유·무선 통신장비","보험: 경량항공기마다 제3자배상책임, 조종자 및 동승자 보험·공제, 보장금액은 자동차손해배상 보장법 시행령 제3조제1항 금액 이상","정비·수리·개조 사업(표 6-4): 항공정비사 1명 이상, 사무실 및 작업장(정비자재 보관장소 포함), 작업용 공구·계측장비","결격: 소유자 등록 불가자, 피성년후견인 등, 금고 이상 실형 후 3년 미경과·집행유예 중, 운송사업 등 면허·등록 취소 후 2년, 항공기취급업·항공기정비업·항공레저스포츠사업 등록 취소 후 2년 미경과자","등록 신청은 등록신청서(별지 제26호서식)에 등록요건 증명서류, 부동산 사용 증명서류(타인 부동산 사용 시), 사업계획서를 첨부하여 지방항공청장에게 제출"]},{"title":"6.4 항공레저스포츠사업 등록 제한 및 운영","page":90,"points":["등록 제한 사유: 안전사고 우려 또는 이용자에게 심한 불편·공익 저해 우려, 인구밀집지역·사생활 침해·교통·소음·주변환경상 부적합, 그 밖에 항공안전·사고예방상 국토교통부장관이 필요하다고 인정하는 경우","사업계획서 포함사항: 자본금, 상호·대표자·사업소, 항공기 수량·산출근거·예상 사업수지, 재원 조달방법, 시설·장비 개요, 종사자 인력, 사업 개시 예정일, 영업구역·영업시간, 탑승료·대여료, 안전관리대책","안전관리대책에는 항공레저시설 관리·점검계획, 안전수칙·교육·점검계획, 사고 시 비상연락체계, 탑승자 기록관리, 기상상태 현황 등 포함","지방항공청장은 심사 시 신청인과 계약한 공항·비행장·이착륙장 시설 소유자 등의 계약 이행 가능성에 관하여 관계 행정기관 또는 단체의 의견을 들을 수 있음","항공레저스포츠사업 등록기준상 경량항공기: 안전성인증 제1종 등급을 받은 경량항공기","항공레저스포츠사업자는 요금표 및 약관을 영업소 등에서 이용자가 잘 볼 수 있는 곳에 갖추어 두고 열람할 수 있게 해야 함 (항공사업법 제62조)"]}],"memorize":[{"k":"보험가입신고서 제출기한","v":"보험 등에 가입한 날부터 7일 이내, 국토교통부장관에게 (변경·갱신 시도 동일)","page":88},{"k":"경량항공기 보험 가입 시점","v":"안전성인증을 받기 전까지","page":87},{"k":"보험 보장금액 기준","v":"자동차손해배상 보장법 시행령 제3조제1항 각 호에 따른 금액 이상 (동승자 포함)","page":87},{"k":"영리 목적 사용 허용 예외","v":"항공기대여업 또는 항공레저스포츠사업에 사용하는 경우만","page":88},{"k":"항공기대여업 자본금(법인)","v":"납입자본금 2억5천만원 이상 (경량항공기·초경량비행장치만 대여 시 3천만원 이상)","page":89},{"k":"항공기대여업 자산평가액(개인)","v":"3억7,500만원 이상 (경량항공기·초경량비행장치만 대여 시 3천만원 이상)","page":89},{"k":"항공기대여업 기체 요건","v":"항공기, 경량항공기 또는 초경량비행장치 1대 이상","page":89},{"k":"대여업 보험 중 경량항공기 제외 항목","v":"기체보험 (경량항공기·초경량비행장치는 제외)","page":89},{"k":"항공레저스포츠사업 자본금","v":"법인 납입자본금 3천만원 이상, 개인 자산평가액 3천만원 이상","page":90},{"k":"항공레저스포츠사업용 경량항공기","v":"안전성인증 제1종 등급 (기술기준에 적합하게 완제형태로 제작)","page":90},{"k":"레저스포츠사업 정비인력","v":"항공정비사 자격증명 1명 이상 (정비업무 전체를 정비업체에 위탁 시 면제 가능)","page":90},{"k":"비행 및 안전통제요원","v":"1명 이상 (안전관리에 지장 없으면 정비인력으로 대체 가능)","page":90},{"k":"레저스포츠사업 조종인력","v":"항공안전법 제115조제1항 경량항공기 조종교육증명을 받은 사람","page":90},{"k":"레저스포츠사업 보험","v":"경량항공기마다 제3자배상책임, 조종자 및 동승자 보험·공제","page":90},{"k":"결격: 실형","v":"금고 이상 실형, 집행 종료·면제 확정일부터 3년 미경과","page":89},{"k":"결격: 집행유예","v":"금고 이상 형의 집행유예를 선고받고 유예기간 중","page":89},{"k":"결격: 등록·면허 취소","v":"취소처분 후 2년 미경과","page":89},{"k":"항공레저스포츠사업 등록 신청처","v":"지방항공청장 (별지 제26호서식)","page":91},{"k":"항공기대여업 등록처","v":"국토교통부장관","page":88},{"k":"정비·수리·개조 사업 시설","v":"사무실 및 작업장(정비자재 보관 장소 포함), 작업용 공구·계측장비","page":91},{"k":"레저스포츠사업 통신장비","v":"인근 항공교통업무 기관(군 비행장 포함)과 연락 가능한 유·무선 통신장비","page":90},{"k":"요금표·약관 비치","v":"항공레저스포츠사업자가 영업소 등 이용자가 잘 볼 수 있는 곳에 비치·열람 (항공사업법 제62조)","page":92}],"quiz":[{"q":"경량항공기를 영리 목적으로 사용할 수 있는 경우로 옳은 것은?","o":["항공기대여업 또는 항공레저스포츠사업에 사용하는 경우","항공기사용사업에 사용하는 경우","소형항공운송사업에 사용하는 경우","개인 소유자가 지인에게 유상으로 태워주는 경우"],"a":0,"e":"경량항공기는 항공기대여업 또는 항공레저스포츠사업에 사용하는 경우를 제외하고는 영리 목적으로 사용할 수 없다(항공사업법 제71조).","page":88},{"q":"경량항공기소유자등이 보험에 가입한 경우 보험가입신고서를 제출해야 하는 기한은?","o":["가입한 날부터 3일 이내","가입한 날부터 15일 이내","가입한 날부터 7일 이내","가입한 날부터 30일 이내"],"a":2,"e":"보험 등에 가입한 날부터 7일 이내에 보험증서 사본을 첨부한 신고서를 국토교통부장관에게 제출하며, 변경·갱신 시에도 같다.","page":88},{"q":"경량항공기소유자등이 보험 또는 공제에 가입하여야 하는 시점은?","o":["최초 비행 후 30일 이내","안전성인증을 받기 전까지","등록 후 1년 이내","사업 등록 신청 시"],"a":1,"e":"피해자 보상을 위하여 안전성인증을 받기 전까지 국토교통부령으로 정하는 보험이나 공제에 가입하여야 한다.","page":87},{"q":"경량항공기 보험·공제의 보장금액 기준으로 옳은 것은?","o":["상법상 최저 보험금액 이상","항공사업법 시행령에서 정한 1억원 이상","국토교통부장관이 매년 고시하는 금액 이상","자동차손해배상 보장법 시행령 제3조제1항 각 호에 따른 금액 이상"],"a":3,"e":"자동차손해배상 보장법 시행령 제3조제1항 각 호에 따른 금액 이상을 보장하는 보험 또는 공제이며 동승자 보장을 포함한다.","page":87},{"q":"법인이 경량항공기만을 대여하는 항공기대여업을 등록하려 할 때 납입자본금 요건은?","o":["3천만원 이상","2억5천만원 이상","3억7,500만원 이상","1억원 이상"],"a":0,"e":"법인은 납입자본금 2억5천만원 이상이나, 경량항공기 또는 초경량비행장치만 대여하는 경우 3천만원 이상이다(표 6-1).","page":89},{"q":"항공기대여업 등록요건 중 경량항공기에 대해 가입이 제외되는 보험은?","o":["여객보험","제3자보험","기체보험","승무원보험"],"a":2,"e":"기체보험은 경량항공기 및 초경량비행장치의 경우 제외된다. 여객보험·승무원보험은 여객·승무원이 없는 초경량비행장치만 제외된다.","page":89},{"q":"항공기대여업 등록의 결격사유로 옳지 않은 것은?","o":["항공보안법 위반으로 금고 이상 실형 후 집행이 끝난 날부터 3년이 지나지 아니한 사람","항공기대여업 등록 취소처분 후 2년이 지나지 아니한 자","피한정후견인","항공안전법 위반으로 벌금형을 선고받은 후 1년이 지나지 아니한 사람"],"a":3,"e":"결격사유는 금고 이상의 실형(3년)이나 집행유예 기간 중인 경우 등이며, 벌금형 후 1년은 교재에 규정된 결격사유가 아니다.","page":89},{"q":"조종교육·체험·경관조망 목적으로 사람을 태워 비행하는 항공레저스포츠사업에 사용하는 경량항공기의 요건은?","o":["안전성인증 제2종 등급","안전성인증 제1종 등급","특별감항증명","형식증명"],"a":1,"e":"국토교통부령으로 정하는 안전성인증 제1종 등급(기술기준에 적합하게 완제형태로 제작)을 받은 경량항공기여야 한다.","page":90},{"q":"사람을 태워 비행하는 항공레저스포츠사업의 인력 요건에 대한 설명으로 옳지 않은 것은?","o":["항공정비사 자격증명을 받은 사람 1명 이상이 필요하다.","정비업무 전체를 경량항공기 정비업체에 위탁하면 정비인력을 갖추지 않을 수 있다.","비행 및 안전통제요원은 어떠한 경우에도 다른 인력으로 대체할 수 없다.","조종인력은 경량항공기 조종교육증명을 받은 사람이어야 한다."],"a":2,"e":"비행 및 안전통제요원 1명 이상이 필요하지만, 안전관리에 지장을 주지 않는 범위에서 정비인력으로 대체할 수 있다.","page":90},{"q":"개인이 경량항공기 정비·수리·개조 서비스를 제공하는 항공레저스포츠사업을 등록할 때 자산평가액 요건은?","o":["1천만원 이상","5천만원 이상","2억5천만원 이상","3천만원 이상"],"a":3,"e":"표 6-4에 따라 법인은 납입자본금 3천만원 이상, 개인은 자산평가액 3천만원 이상이다.","page":91},{"q":"항공레저스포츠사업 등록신청서를 제출하는 기관은?","o":["지방항공청장","한국교통안전공단 이사장","관할 시장·군수·구청장","항공·철도사고조사위원회"],"a":0,"e":"항공레저스포츠사업을 등록하려는 자는 등록신청서에 서류를 첨부하여 지방항공청장에게 제출하여야 한다.","page":91},{"q":"국토교통부장관이 항공레저스포츠사업의 등록을 제한할 수 있는 경우가 아닌 것은?","o":["안전사고 우려 또는 이용자에게 심한 불편을 줄 우려가 있는 경우","인구밀집지역, 사생활 침해, 소음 등을 고려할 때 영업행위가 부적합한 경우","신청인이 이미 다른 지역에서 같은 사업을 하고 있는 경우","항공안전 및 사고예방을 위하여 등록제한이 필요하다고 인정하는 경우"],"a":2,"e":"등록 제한 사유는 안전사고·불편·공익 저해 우려, 인구밀집·사생활·교통·소음·주변환경상 부적합, 항공안전상 필요 등이다.","page":90}]},{"id":"law-7","title":"제7장 이착륙장","pages":[93,101],"goal":"이착륙장 관련 용어, 등급별 활주로·안전구역 기준, 이착륙 장소 제한과 예외, 이착륙장 설치허가 및 금지행위를 알아야 한다.","summary":"이착륙장은 비행장 외에 경량항공기·초경량비행장치의 이착륙에 사용되는 육지 또는 수면의 구역으로, 육상이착륙장과 수상이착륙장으로 구분되며 활주로 길이 등에 따라 1~4등급으로 나뉜다. 경량항공기는 비행장(군 비행장 제외) 또는 이착륙장에서만 이착륙할 수 있고, 비상상황 등 불가피한 사유로 국토교통부장관의 허가를 받은 경우만 예외이며 허가 기간은 6개월 이내이다. 국토교통부장관 외의 자가 이착륙장을 설치하려면 허가를 받아야 하고, 국토교통부장관은 관계 중앙행정기관의 장 및 시장·군수·구청장과 사전 협의해야 한다. 급유·정비 중인 항공기로부터 30미터 이내 진입 등 금지행위가 정해져 있다.","sections":[{"title":"7.1 정의","page":93,"points":["비행장: 항공기·경량항공기·초경량비행장치의 이륙(이수 포함)과 착륙(착수 포함)을 위하여 사용되는 육지 또는 수면의 일정한 구역으로 대통령령으로 정하는 것","이착륙장: 비행장 외에 경량항공기 또는 초경량비행장치의 이륙 또는 착륙을 위하여 사용되는 육지 또는 수면의 일정한 구역으로 대통령령으로 정하는 것","착륙대: 활주로와 항공기가 활주로를 이탈하는 경우 피해를 줄이기 위해 활주로 주변에 설치하는 안전지대로, 활주로 중심선에 중심을 두는 직사각형의 지표면 또는 수면","활주로 안전구역(RSA): 활주로 미착·과주·이탈 시 경량항공기등과 탑승자의 피해를 줄이기 위해 활주로 주변에 설치하는 안전지대","활주로 보호구역(RPZ): 지상의 인명과 재산을 보호하기 위해 활주로 시단·종단에 설치된 구역","이착륙장 표고(Airpark elevation): 가용 활주로의 가장 높은 지점의 해발 고도, 활주로 시단(Threshold): 착륙 가용 활주로 부분의 기점","동력패러장: 동력패러슈트의 이·착륙을 위한 육상 이착륙장의 일부 구역, 계류장(Apron): 승하차·화물·급유·주기·제방빙·정비 목적으로 설정된 구역","수상 관련: 착수대(Sea Lane), 착수대 보호구역, 유도수로(Taxi Channel), 수상구역, 선회수역(착수대 끝 부분의 방향전환 수역), 경사대(Slipways), 부표(Buoy: 착수대 경계 표시 부력표지)"]},{"title":"7.2 이착륙장의 구분 및 규모","page":94,"points":["이착륙장은 육상이착륙장과 수상이착륙장으로 구분, 활주로 길이·활주로 안전구역 및 보호구역 길이 등에 따라 1~4등급으로 구분(표 7-1)","포장 활주로 길이: 1등급 288m 이상, 2등급 230~287m, 3등급 173~229m, 4등급 60~172m","잔디 활주로 길이: 1등급 340m 이상, 2등급 275~339m, 3등급 200~274m, 4등급 70~199m / 비포장: 313m 이상, 250~312m, 188~249m, 65~187m","활주로 폭: 포장 6m 이상, 비포장 10m 이상 (전 등급 동일)","활주로 안전구역: 길이(종단부터) 75m 이상, 폭(활주로 중심선 좌우) 10m 이상 (전 등급 동일)","활주로 보호구역 길이: 1등급 1,000m, 2등급 700m, 3·4등급 300m / 시점 폭 16m, 종점 폭 1등급 45m·2등급 42m·3·4등급 36m","동력패러장은 전방향·양방향으로 분류하며, 양방향 동력패러장은 주간에 주바람 방향이 95% 이상인 경우에만 설치 가능","착수대: 양방향 착수대 길이 350m 이상·폭 40m 이상, 전방향 착수대 중심으로부터 반경 175m 이상, 양방향 착수대도 주간 주바람 방향 95% 이상인 경우에만 설치"]},{"title":"7.3 경량항공기 이륙·착륙의 장소","page":97,"points":["항공레저스포츠사업에 종사하는 경량항공기 조종사는 이착륙 시 제작자가 정한 거리 기준을 충족하는 활주로를 이용해야 함 (시행규칙 제298조)","누구든지 경량항공기를 비행장(군 비행장 제외) 또는 이착륙장이 아닌 곳에서 이착륙하면 안 됨, 단 안전 관련 비상상황 등 불가피한 사유로 국토교통부장관 허가를 받은 경우 예외 (항공안전법 제118조)","예외 사유: 계기 고장·연료 부족 등 비상상황으로 신속히 착륙해야 하는 경우, 항공기 운항 등으로 비행장·이착륙장을 사용할 수 없는 경우, 주변 30km 이내에 비행장 또는 이착륙장이 없는 경우","비상상황 착륙 허가: 무선통신 등으로 국토교통부장관에게 신청, 특별한 사유가 없으면 허가하여야 함","그 외 이착륙 허가: 허가신청서 제출, 안전에 지장이 없으면 6개월 이내의 기간을 정하여 허가","허가 신청서(별지 제70호서식)는 국토교통부장관 또는 지방항공청장에게 제출하며 장소(약도 포함), 절차·방향, 지형 적합성·지반 약화 가능성, 소화기·풍향지시장치, 주변 장애물, 접근통제·안전요원, 사고방지·급유 안전대책, 토지사용 사전협의, 소음 민원 예방대책 등을 첨부"]},{"title":"7.4 이착륙장 설치","page":98,"points":["국토교통부장관은 이착륙장을 설치할 수 있고, 그 외의 자는 국토교통부장관의 허가를 받아야 함 (공항시설법 제25조)","설치를 허가하려는 경우 관계 중앙행정기관의 장 및 관할 시장·군수·구청장과 사전에 협의","설치자는 「이착륙장 설치 및 관리기준」(국토교통부 고시)에 적합하게 설치·관리, 부적합 시 장관이 조치 명령, 상당한 기간 내 미조치 시 허가 취소 가능","허가 취소·효력정지·공사중지 사유: 거짓·부정 허가, 무허가 설치·허가사항 위반, 사정 변경으로 계속 시행 불가, 공사 착수 예정일부터 1년 이내 미착공 또는 완료 예정일까지 미완료, 허가 조건 위반","사용 중지 명령 사유: 위치·구조 등이 설치허가서와 다른 경우, 설치 및 관리기준에 맞지 않게 된 경우","설치허가 신청서(별지 제12호서식) 첨부: 설치계획서, 부지 소유권·사용권 증명서류(없으면 취득계획서), 토지조서·물건조서, 설계도서","설치계획서 포함사항: 시설 개요·목적, 기간·공사방법, 자금 조달계획, 사용 예정 기종, 관리계획, 시계비행 절차, 공역도면, 인접 비행장 비행절차와의 상관관계, 항공교통업무 내용, 풍향·풍속도(최근 1년 이상 자료)"]},{"title":"7.4.4 금지행위","page":100,"points":["누구든지 항공기·경량항공기·초경량비행장치를 향하여 물건을 던지거나 항행에 위험을 일으킬 우려가 있는 행위 금지","비행승인을 받지 않은 초경량비행장치가 공항·비행장에 접근·침입 시 국가·지방자치단체, 공항운영자, 비행장시설 관리·운영자는 퇴치·추락·포획 등 조치 가능","승인 없이 시설에서 영업행위, 무단 점유, 구매 강요·호객행위, 노숙, 소란, 광고물 설치·배포, 기부 요청 등 금지","급유·배유·정비·시운전 중인 항공기로부터 30미터 이내 진입 금지(작업 종사자 제외), 급유·배유 중 항공기로부터 30미터 이내 흡연 금지","흡연구역 외 흡연, 불 피우는 행위, 휘발성·가연성 물질로 격납고 바닥 청소, 드론을 공항·비행장에 진입시키는 행위 등 금지","국토교통부장관, 사업시행자등, 이착륙장 설치·관리자는 금지행위 위반자의 행위를 제지하거나 퇴거를 명할 수 있음 (공항시설법 제56조)"]}],"memorize":[{"k":"이착륙장 구분","v":"육상이착륙장, 수상이착륙장","page":95},{"k":"이착륙장 표고","v":"가용 활주로의 가장 높은 지점의 해발 고도","page":93},{"k":"활주로 시단(Threshold)","v":"착륙 가용 활주로 부분의 기점","page":93},{"k":"RSA(활주로 안전구역)","v":"미착·과주·이탈 시 피해를 줄이기 위한 활주로 주변 안전지대","page":93},{"k":"RPZ(활주로 보호구역)","v":"지상 인명·재산 보호를 위해 활주로 시단·종단에 설치된 구역","page":93},{"k":"1등급 포장 활주로 길이","v":"288m 이상 (잔디 340m 이상, 비포장 313m 이상)","page":94},{"k":"4등급 포장 활주로 길이","v":"60~172m (잔디 70~199m, 비포장 65~187m)","page":94},{"k":"활주로 폭","v":"포장 6m 이상, 비포장 10m 이상","page":94},{"k":"활주로 안전구역 규모","v":"길이(종단부터) 75m 이상, 폭(중심선 좌우) 10m 이상","page":94},{"k":"활주로 보호구역 길이","v":"1등급 1,000m, 2등급 700m, 3·4등급 300m","page":94},{"k":"활주로 보호구역 폭","v":"시점 16m, 종점 1등급 45m·2등급 42m·3·4등급 36m","page":94},{"k":"전방향 동력패러장 활주로","v":"중심 반경 45m 이상 원형 (안전구역 반경 76m 이상)","page":94},{"k":"양방향 동력패러장·착수대 설치조건","v":"주간에 주바람 방향이 95% 이상인 경우만","page":96},{"k":"양방향 착수대 규모","v":"길이 350m 이상, 폭 40m 이상","page":96},{"k":"전방향 착수대 규모","v":"중심으로부터 반경 175m 이상","page":97},{"k":"경량항공기 이착륙 장소","v":"비행장(군 비행장 제외) 또는 이착륙장","page":97},{"k":"장소 외 이착륙 예외 거리기준","v":"주변 30km 이내에 비행장 또는 이착륙장이 없는 경우","page":97},{"k":"비상 착륙 허가 신청","v":"무선통신 등으로 국토교통부장관에게, 특별한 사유 없으면 허가","page":97},{"k":"장소 외 이착륙 허가 기간","v":"6개월 이내","page":98},{"k":"장소 외 이착륙 허가 신청서","v":"항공안전법 시행규칙 별지 제70호서식, 국토교통부장관 또는 지방항공청장","page":98},{"k":"이착륙장 설치허가 사전협의","v":"관계 중앙행정기관의 장 및 관할 시장·군수·구청장","page":99},{"k":"미착공 시 허가 취소 기준","v":"공사 착수 예정일부터 1년 이내 미착공","page":99},{"k":"설치허가 신청서 서식","v":"공항시설법 시행규칙 별지 제12호서식","page":99},{"k":"설치계획서 풍향·풍속도 자료","v":"최근 1년 이상의 자료로 작성","page":100},{"k":"급유·정비 중 항공기 접근 금지 거리","v":"30미터 이내 (작업 종사자 제외), 급유 중 30m 이내 흡연 금지","page":101}],"quiz":[{"q":"“이착륙장 표고(Airpark elevation)”의 정의로 옳은 것은?","o":["가용 활주로의 가장 높은 지점의 해발 고도","활주로 시단의 해발 고도","활주로 중간 지점의 평균 해발 고도","계류장의 가장 낮은 지점의 해발 고도"],"a":0,"e":"이착륙장 표고는 경량항공기 이착륙장 가용 활주로의 가장 높은 지점의 해발 고도를 말한다.","page":93},{"q":"지상의 인명과 재산을 보호하기 위해 활주로 시단·종단에 설치된 구역은?","o":["활주로 안전구역(RSA)","착륙대","활주로 보호구역(RPZ)","계류장(Apron)"],"a":2,"e":"활주로 보호구역(RPZ)은 지상의 인명과 재산을 보호하기 위해 활주로 시단·종단에 설치된 구역이다. RSA는 미착·과주·이탈 시 피해를 줄이는 안전지대이다.","page":93},{"q":"포장(아스팔트 또는 콘크리트) 활주로를 가진 1등급 이착륙장의 활주로 길이 기준은?","o":["230m 이상","340m 이상","313m 이상","288m 이상"],"a":3,"e":"표 7-1에서 포장 활주로 1등급은 288m 이상이며, 잔디는 340m 이상, 비포장은 313m 이상이다.","page":94},{"q":"이착륙장 활주로 안전구역의 기준으로 옳은 것은?","o":["길이 75m 이상, 폭(중심선 좌우) 10m 이상","길이 50m 이상, 폭 6m 이상","길이 100m 이상, 폭 16m 이상","등급에 따라 길이 300~1,000m"],"a":0,"e":"활주로 안전구역은 전 등급 공통으로 종단부터 길이 75m 이상, 활주로 중심선 좌우 폭 10m 이상이다.","page":94},{"q":"1등급 이착륙장의 활주로 보호구역 길이는?","o":["300m","700m","1,000m","1,500m"],"a":2,"e":"활주로 보호구역 길이는 1등급 1,000m, 2등급 700m, 3·4등급 300m이다.","page":94},{"q":"양방향 동력패러장 또는 양방향 착수대를 설치할 수 있는 조건은?","o":["야간에 주바람 방향이 90% 이상인 경우","주간에 주바람 방향이 95% 이상인 경우","연간 평균풍속이 5kt 이하인 경우","주간에 주바람 방향이 80% 이상인 경우"],"a":1,"e":"양방향 동력패러장과 양방향 착수대는 주간에 주바람 방향이 95% 이상인 경우에만 설치할 수 있다.","page":96},{"q":"양방향 착수대의 규모 기준으로 옳은 것은?","o":["길이 175m 이상, 폭 40m 이상","길이 350m 이상, 폭 20m 이상","반경 175m 이상","길이 350m 이상, 폭 40m 이상"],"a":3,"e":"양방향 착수대는 길이 350m 이상, 폭 40m 이상이고, 전방향 착수대는 중심으로부터 반경 175m 이상이다.","page":96},{"q":"경량항공기가 이착륙할 수 있는 장소에 관한 설명으로 옳지 않은 것은?","o":["이착륙장에서는 이착륙할 수 있다.","군 비행장에서도 원칙적으로 자유롭게 이착륙할 수 있다.","비상상황 등으로 국토교통부장관의 허가를 받으면 그 외의 장소에서도 이착륙할 수 있다.","비행장(군 비행장 제외)에서 이착륙할 수 있다."],"a":1,"e":"경량항공기는 비행장(군 비행장은 제외) 또는 이착륙장이 아닌 곳에서 이착륙해서는 안 된다(항공안전법 제118조).","page":97},{"q":"경량항공기 이착륙 장소 예외 허가 사유가 아닌 것은?","o":["비행 중 계기 고장, 연료 부족 등으로 신속히 착륙해야 하는 경우","항공기 운항 등으로 비행장 및 이착륙장을 사용할 수 없는 경우","이착륙하려는 장소 주변 30km 이내에 비행장 또는 이착륙장이 없는 경우","목적지와 가장 가까운 이착륙장까지 10km 이상인 경우"],"a":3,"e":"예외 사유는 비상상황, 비행장 사용 불가, 주변 30km 이내 비행장·이착륙장 부재의 경우이다.","page":97},{"q":"이착륙 장소 외 이착륙 허가 신청에 대해 국토교통부장관이 안전에 지장이 없다고 인정할 때 정하는 허가 기간은?","o":["1개월 이내","3개월 이내","6개월 이내","1년 이내"],"a":2,"e":"국토교통부장관은 내용을 검토하여 안전에 지장이 없다고 인정되면 6개월 이내의 기간을 정하여 허가하여야 한다(시행령 제23조).","page":98},{"q":"국토교통부장관이 이착륙장 설치를 허가하려는 경우 사전 협의해야 하는 대상은?","o":["관계 중앙행정기관의 장 및 관할 시장·군수·구청장","한국교통안전공단 이사장","항공·철도사고조사위원회","관할 경찰서장 및 소방서장"],"a":0,"e":"국토교통부장관이 이착륙장 설치를 허가하려면 관계 중앙행정기관의 장 및 관할 시장·군수·구청장과 사전에 협의하여야 한다(공항시설법 제25조).","page":99},{"q":"정당한 사유 없이 이착륙장 설치허가서에 적힌 공사 착수 예정일부터 언제까지 착공하지 않으면 허가 취소 등 처분 대상이 되는가?","o":["3개월 이내","1년 이내","6개월 이내","2년 이내"],"a":1,"e":"공사 착수 예정일부터 1년 이내에 착공하지 아니하거나 완료 예정일까지 공사를 끝내지 아니한 경우 허가 취소·효력정지 등 처분을 할 수 있다.","page":99},{"q":"이착륙장 설치계획서에 포함되는 풍향·풍속도는 최근 몇 년 이상의 자료로 작성해야 하는가?","o":["3년","5년","6개월","1년"],"a":3,"e":"풍향·풍속도는 이착륙장 예정지 또는 그 부근의 최근 1년 이상의 자료에 의하여 작성된 것에 한정한다.","page":100},{"q":"이착륙장 등에서의 금지행위로, 기름을 넣거나 배출하는 작업 또는 정비·시운전 중인 항공기로부터 진입이 금지되는 거리는?","o":["30미터 이내","10미터 이내","50미터 이내","100미터 이내"],"a":0,"e":"급유·배유, 정비 또는 시운전 중인 항공기로부터 30미터 이내 장소에 들어가는 행위는 금지된다(작업 종사자 제외).","page":101}]},{"id":"law-8","title":"제8장 경량항공기 사고 및 보고","pages":[102,104],"goal":"경량항공기사고의 정의와 사망·중상·행방불명 적용기준, 사고 발생 통보 절차, 항공안전 의무보고와 자율보고 제도를 알아야 한다.","summary":"경량항공기사고는 비행을 목적으로 발동기가 시동되는 순간부터 비행이 종료되어 발동기가 정지되는 순간까지 발생한 사망·중상·행방불명, 추락·충돌·화재, 위치 확인 불가 또는 접근 불가를 말한다. 사망은 사고일부터 30일 이내 사망을 포함하고, 행방불명은 1년간 생사 불명인 경우이며, 중상은 7일 이내 48시간 초과 입원치료 부상 등으로 정해진다. 사고를 알게 된 조종사(불가 시 소유자)는 항공·철도사고조사위원회에 지체없이 가장 신속한 방법으로 통보해야 한다. 의무보고는 국토교통부장관에게, 자율보고는 한국교통안전공단 이사장에게 하며 발생일부터 10일 이내 자율보고 시 고의·중과실이 아니면 처분하지 않는다.","sections":[{"title":"8.1 정의","page":102,"points":["항공사고: 항공안전법에 따른 항공기사고, 경량항공기사고 및 초경량비행장치사고","경량항공기사고: 비행을 목적으로 발동기가 시동되는 순간부터 비행이 종료되어 발동기가 정지되는 순간까지 발생한 것으로 국토교통부령으로 정하는 것","경량항공기사고 유형: ①사람의 사망, 중상 또는 행방불명 ②추락, 충돌 또는 화재 발생 ③위치를 확인할 수 없거나 접근이 불가능한 경우","항공기준사고: 항공안전에 중대한 위해를 끼쳐 항공기사고로 이어질 수 있었던 것으로 국토교통부령으로 정하는 것","항공안전장애: 항공기사고 및 항공기준사고 외에 항공기 운항 등과 관련하여 항공안전에 영향을 미치거나 미칠 우려가 있었던 것"]},{"title":"8.2 사망·중상 등의 적용기준","page":102,"points":["행방불명: 경량항공기 안에 있던 사람이 사고로 1년간 생사가 분명하지 아니한 경우","사망·중상 적용: 탑승한 사람이 사망·중상(자연적 원인 또는 자기 자신이나 타인에 의한 경우 제외), 이탈된 부품이나 경량항공기와의 직접 접촉 등으로 사망·중상","사망은 사고가 발생한 날부터 30일 이내에 그 사고로 사망한 경우를 포함","중상: 부상일부터 7일 이내에 48시간을 초과하는 입원치료가 필요한 부상","중상: 골절(코뼈, 손가락, 발가락 등 간단한 골절 제외), 열상으로 인한 심한 출혈·신경·근육·힘줄 손상, 내장 손상","중상: 2도나 3도 화상 또는 신체표면 5퍼센트 초과 화상(7일 이내 48시간 초과 입원치료 필요한 경우만), 전염물질·유해방사선 노출 확인"]},{"title":"8.3 사고발생 통보","page":103,"points":["사고를 알게 된 경량항공기 조종사(조종사가 통보할 수 없으면 소유자)는 항공·철도사고조사위원회에 통보 (항공·철도 사고조사법 제17조)","통보 시기: 사고 발생 사실을 알게 된 때 지체없이","통보 방법: 구두, 전화, 팩스, 인터넷 홈페이지 등 중 가장 신속한 방법","통보사항: 사고 유형, 발생 일시 및 장소, 기종·발생 경위·사상자 등 피해상황(통보자가 아는 경우), 통보자 성명 및 연락처, 기타 조사에 필요한 사항","연락처: 전화 044-201-5447, 02-2665-9705 / 팩스 044-201-5698 / e-mail araib@korea.kr / 웹사이트 www.araib.go.kr"]},{"title":"8.4 항공안전 의무 및 자율보고","page":104,"points":["의무보고: 항공기사고·준사고·항공안전장애를 발생시켰거나 알게 된 항공종사자등 관계인은 국토교통부장관에게 보고 (항공안전법 제59조)","고장·결함·기능장애 발생 사실을 국토교통부장관에게 보고한 경우 의무보고를 한 것으로 봄","의무보고·자율보고를 한 사람에게 이를 이유로 해고·전보·징계·부당한 대우 등 불이익 조치 금지","자율보고: 의무보고 대상 외 항공안전장애(자율보고대상 항공안전장애) 또는 항공안전위해요인을 알게 되거나 의심되는 경우 누구든지 보고 가능","자율보고는 항공안전 자율보고서(별지 제66호서식) 또는 전자적 방법으로 한국교통안전공단 이사장에게 보고","발생일부터 10일 이내에 자율보고하면 고의 또는 중대한 과실이 아닌 한 항공안전법 및 공항시설법에 따른 처분을 하지 않음","국토교통부장관은 자율보고 내용을 법에 따른 경우를 제외하고 제3자 제공·일반 공개 금지 (항공안전법 제61조)"]}],"memorize":[{"k":"경량항공기사고 기간","v":"비행 목적으로 발동기가 시동되는 순간 ~ 비행 종료로 발동기가 정지되는 순간","page":102},{"k":"경량항공기사고 유형 3가지","v":"사망·중상·행방불명 / 추락·충돌·화재 / 위치 확인 불가·접근 불가","page":102},{"k":"항공사고 범위","v":"항공기사고, 경량항공기사고, 초경량비행장치사고","page":102},{"k":"항공기준사고","v":"항공안전에 중대한 위해를 끼쳐 항공기사고로 이어질 수 있었던 것","page":102},{"k":"항공안전장애","v":"사고·준사고 외에 항공안전에 영향을 미치거나 미칠 우려가 있었던 것","page":102},{"k":"행방불명 기준","v":"1년간 생사가 분명하지 아니한 경우","page":102},{"k":"사망 포함 기준","v":"사고 발생일부터 30일 이내 그 사고로 사망","page":102},{"k":"중상: 입원 기준","v":"부상일부터 7일 이내에 48시간을 초과하는 입원치료","page":103},{"k":"중상에서 제외되는 골절","v":"코뼈, 손가락, 발가락 등의 간단한 골절","page":103},{"k":"중상: 화상 기준","v":"2도·3도 화상 또는 신체표면 5% 초과 화상 (7일 이내 48시간 초과 입원 필요 시)","page":103},{"k":"사망·중상 적용 제외","v":"자연적인 원인 또는 자기 자신이나 타인에 의하여 발생된 경우","page":102},{"k":"사고 통보 의무자","v":"경량항공기 조종사 (통보할 수 없으면 소유자)","page":103},{"k":"사고 통보처","v":"항공·철도사고조사위원회","page":103},{"k":"사고 통보 시기·방법","v":"지체없이, 가장 신속한 방법(구두·전화·팩스·인터넷 등)","page":103},{"k":"사고조사위원회 이메일·웹","v":"araib@korea.kr / www.araib.go.kr","page":103},{"k":"의무보고 대상기관","v":"국토교통부장관","page":104},{"k":"자율보고 대상기관","v":"한국교통안전공단 이사장 (별지 제66호서식 또는 전자적 방법)","page":104},{"k":"자율보고 처분 면제","v":"발생일부터 10일 이내 보고, 고의·중대한 과실이 아닌 경우","page":104}],"quiz":[{"q":"경량항공기사고가 성립하는 시간적 범위로 옳은 것은?","o":["탑승자가 탑승한 순간부터 하기할 때까지","활주로에서 이륙 활주를 시작한 순간부터 착륙 후 정지할 때까지","비행을 목적으로 발동기가 시동되는 순간부터 비행이 종료되어 발동기가 정지되는 순간까지","이륙한 순간부터 착륙한 순간까지"],"a":2,"e":"경량항공기사고는 비행을 목적으로 경량항공기의 발동기가 시동되는 순간부터 비행이 종료되어 발동기가 정지되는 순간까지 발생한 것이다.","page":102},{"q":"경량항공기사고에 해당하지 않는 것은?","o":["경량항공기에 의한 사람의 중상","경량항공기의 화재 발생","경량항공기에 접근이 불가능한 경우","탑승자가 자연적인 원인으로 기내에서 사망한 경우"],"a":3,"e":"탑승자의 사망·중상 중 자연적인 원인 또는 자기 자신이나 타인에 의하여 발생된 경우는 제외된다.","page":102},{"q":"경량항공기사고에서 행방불명을 적용하는 기준은?","o":["1년간 생사가 분명하지 아니한 경우","30일간 생사가 분명하지 아니한 경우","6개월간 생사가 분명하지 아니한 경우","3년간 생사가 분명하지 아니한 경우"],"a":0,"e":"행방불명은 경량항공기 안에 있던 사람이 사고로 1년간 생사가 분명하지 아니한 경우에 적용한다.","page":102},{"q":"경량항공기사고에서 사람의 사망에 포함되는 기준은?","o":["사고 발생일부터 7일 이내 사망","사고 발생일부터 30일 이내 사망","사고 발생일부터 90일 이내 사망","사고 발생일부터 1년 이내 사망"],"a":1,"e":"사람의 사망은 경량항공기사고가 발생한 날부터 30일 이내에 그 사고로 사망한 경우를 포함한다.","page":102},{"q":"경량항공기사고에서 중상의 범위에 해당하는 것은?","o":["손가락의 간단한 골절","부상일부터 7일 이내에 24시간 입원치료가 필요한 부상","신체표면 3퍼센트의 1도 화상","내장의 손상"],"a":3,"e":"내장의 손상은 중상에 해당한다. 입원은 48시간 초과여야 하고, 코뼈·손가락·발가락 등 간단한 골절은 제외된다.","page":103},{"q":"경량항공기사고로 인한 중상 중 입원치료 기준으로 옳은 것은?","o":["부상일부터 3일 이내에 24시간을 초과하는 입원치료","부상일부터 7일 이내에 48시간을 초과하는 입원치료","부상일부터 10일 이내에 72시간을 초과하는 입원치료","부상일부터 30일 이내에 7일을 초과하는 입원치료"],"a":1,"e":"부상을 입은 날부터 7일 이내에 48시간을 초과하는 입원치료가 필요한 부상은 중상이다.","page":103},{"q":"경량항공기사고 발생 사실을 알게 된 경우 통보 의무자와 통보처로 옳은 것은?","o":["경량항공기 조종사(불가 시 소유자) - 항공·철도사고조사위원회","경량항공기 소유자 - 지방항공청장","목격자 - 관할 경찰서","경량항공기 조종사 - 한국교통안전공단 이사장"],"a":0,"e":"사고를 알게 된 경량항공기 조종사(통보할 수 없으면 소유자)는 항공·철도사고조사위원회에 통보하여야 한다.","page":103},{"q":"경량항공기 사고발생 통보의 시기와 방법으로 옳은 것은?","o":["24시간 이내에 서면으로","72시간 이내에 등기우편으로","지체없이, 구두·전화·팩스·인터넷 등 가장 신속한 방법으로","7일 이내에 사고보고서 서식으로"],"a":2,"e":"통보의무자는 사고 사실을 알게 된 때 지체없이, 구두·전화·FAX·인터넷 홈페이지 등 가장 신속한 방법으로 통보한다.","page":103},{"q":"경량항공기 사고 발생 통보 시 포함사항 중 '통보자가 알고 있는 경우만' 해당하는 것이 아닌 것은?","o":["기종","발생 경위","사상자 등 피해상황","통보자의 성명 및 연락처"],"a":3,"e":"기종, 발생 경위, 사상자 등 피해상황은 통보자가 아는 경우만 해당하고, 사고 유형·발생 일시 및 장소·통보자 성명 및 연락처는 기본 통보사항이다.","page":103},{"q":"항공안전 자율보고를 받는 기관은?","o":["국토교통부장관","한국교통안전공단 이사장","항공·철도사고조사위원회","지방항공청장"],"a":1,"e":"항공안전 자율보고서 또는 전자적인 보고방법에 따라 한국교통안전공단의 이사장에게 보고할 수 있다.","page":104},{"q":"자율보고대상 항공안전장애를 발생시킨 사람이 처분을 받지 않기 위한 자율보고 기한은? (고의·중과실이 아닌 경우)","o":["발생일부터 3일 이내","발생일부터 7일 이내","발생일부터 30일 이내","발생일부터 10일 이내"],"a":3,"e":"발생일부터 10일 이내에 항공안전 자율보고를 한 경우 고의 또는 중대한 과실이 아닌 한 처분을 하지 않는다.","page":104},{"q":"항공안전 의무보고 및 자율보고에 관한 설명으로 옳지 않은 것은?","o":["의무보고는 국토교통부장관에게 한다.","고장·결함·기능장애 발생 사실을 국토교통부장관에게 보고한 경우 의무보고를 한 것으로 본다.","국토교통부장관은 자율보고 내용을 항공안전 증진을 위해 일반에 자유롭게 공개할 수 있다.","보고를 이유로 해고·전보·징계 등 불이익 조치를 해서는 안 된다."],"a":2,"e":"국토교통부장관은 자율보고로 접수한 내용을 법에 따른 경우를 제외하고는 제3자에게 제공하거나 일반에게 공개해서는 아니 된다.","page":104}]},{"id":"law-9","title":"제9장 행정처분 등","pages":[105,112],"goal":"경량항공기 조종사 자격증명·항공신체검사증명의 위반유형별 행정처분기준, 청문 대상, 벌칙·벌금·과태료 금액을 알아야 한다.","summary":"부정한 방법의 자격증명 취득, 자격증명서 대여·알선, 측정요구 불응, 정지기간 중 조종, 사망자 발생, 재산피해 100억원 이상, 벌금 200만원 이상, 혈중알코올농도 0.09% 이상은 자격증명 취소 사유이다. 그 밖의 위반은 1차·2차·3차 위반 횟수에 따라 30일~1년의 효력 정지가 부과되며, 음주는 0.02~0.06% 60일, 0.06~0.09% 120일이다. 자격증명·항공신체검사증명·조종교육증명 취소 등의 처분 전에는 청문을 해야 한다. 벌칙은 항행 중 경량항공기 추락 등에 사형·무기징역부터, 음주비행 3년/3천만원, 자격증명 없이 비행 6개월/500만원 등이며, 과태료는 500만원·300만원·200만원·100만원·50만원으로 구분된다.","sections":[{"title":"9.1.1 자격증명 등 (사고·벌금·부정행위)","page":105,"points":["거짓이나 부정한 방법으로 자격증명등 취득: 자격증명 ,{"q":"항공신체검사증명을 받지 않고 경량항공기 조종업무를 한 경우 3차 이상 위반 시 처분은?","o":["효력정지 150일","효력정지 180일","자격증명 취소","효력정지 1년"],"a":0,"e":"항공신체검사증명 없이 조종업무·조종연습을 한 경우 1차 30일, 2차 60일, 3차 이상 150일 효력정지이다.","page":106},{"q":"허가를 받지 않고 통제공역에서 비행한 경우 처분기준으로 옳은 것은?","o":["1차 30일, 2차 60일, 3차 이상 150일","1차 30일, 2차 60일, 3차 이상 180일","1차 60일, 2차 120일, 3차 이상 취소","1차 30일, 2차 90일, 3차 이상 자격증명 취소"],"a":3,"e":"통제공역 무허가 비행과 국토교통부장관 등의 지시 불이행은 1차 30일, 2차 90일, 3차 이상 자격증명 취소이다.","page":107},{"q":"다음 중 자격증명 취소 사유가 아닌 것은?","o":["자격증명등의 정지기간에 조종업무에 종사한 경우","다른 사람에게 자격증명서를 빌려준 경우","경량항공기 조종업무 외의 업무에 종사한 경우(1차 위반)","거짓이나 부정한 방법으로 자격증명을 받은 경우"],"a":2,"e":"조종업무 외의 업무 종사는 1차 효력정지 150일, 2차 1년이며 취소 사유가 아니다.","page":105},{"q":"국토교통부장관이 처분 전 청문을 하여야 하는 경우가 아닌 것은?","o":["자격증명의 효력정지 30일","조종교육증명의 취소","항공레저스포츠사업 등록의 취소","이착륙장 설치 및 관리에 관한 허가·승인의 취소"],"a":0,"e":"청문 대상은 자격증명등·신체검사증명·조종교육증명·전문교육기관 지정·사업 등록·이착륙장 허가 등의 취소이며, 효력정지는 해당하지 않는다.","page":108},{"q":"사람이 현존하는 경량항공기를 항행 중에 추락시켜 사람을 사상에 이르게 한 사람에 대한 벌칙은?","o":["사형, 무기징역 또는 5년 이상의 징역","10년 이하의 징역","사형, 무기징역 또는 7년 이상의 징역","3년 이하의 징역 또는 3천만원 이하의 벌금"],"a":2,"e":"추락·전복·파괴 자체는 사형·무기 또는 5년 이상, 그로 인해 사람을 사상에 이르게 하면 사형·무기 또는 7년 이상의 징역이다(제139조).","page":109},{"q":"국토교통부장관의 주류등 측정 요구에 따르지 아니한 사람에 대한 벌칙은?","o":["1년 이하의 징역 또는 1천만원 이하의 벌금","3년 이하의 징역 또는 3천만원 이하의 벌금","6개월 이하의 징역 또는 500만원 이하의 벌금","500만원 이하의 과태료"],"a":1,"e":"주류등 영향 비행, 비행 중 주류등 섭취, 측정 요구 불응은 3년 이하의 징역 또는 3천만원 이하의 벌금이다(제160조).","page":109},{"q":"경량항공기 조종사 자격증명을 받지 아니하고 경량항공기를 사용하여 비행한 사람에 대한 벌칙은?","o":["6개월 이하의 징역 또는 500만원 이하의 벌금","1년 이하의 징역 또는 1천만원 이하의 벌금","2천만원 이하의 벌금","300만원 이하의 벌금"],"a":0,"e":"자격증명 없이 비행, 자격증명서 대여·차용·알선, 미등록 경량항공기 비행 등은 6개월 이하의 징역 또는 500만원 이하의 벌금이다.","page":110},{"q":"경량항공기 조종교육증명을 받지 아니하고 조종교육을 한 사람에 대한 벌칙은?","o":["500만원 이하의 벌금","1천만원 이하의 벌금","300만원 이하의 과태료","2천만원 이하의 벌금"],"a":3,"e":"경량항공기 조종교육증명을 받지 아니하고 조종교육을 한 사람은 2천만원 이하의 벌금에 처한다.","page":110},{"q":"경량항공기 사고가 발생한 것을 알고도 정당한 사유 없이 항공·철도사고조사위원회에 통보하지 아니한 경우의 처벌은?","o":["50만원 이하의 과태료","500만원 이하의 벌금","1년 이하의 징역","200만원 이하의 과태료"],"a":1,"e":"사고 발생을 알고도 정당한 사유 없이 통보하지 아니하거나 거짓으로 통보하면 500만원 이하의 벌금이다(항공·철도 사고조사법 제36조의2).","page":111},{"q":"보험 또는 공제 가입 대상인 경량항공기를 보험에 가입하지 않고 비행한 자에 대한 과태료는?","o":["500만원 이하","300만원 이하","200만원 이하","100만원 이하"],"a":0,"e":"보험·공제 미가입 경량항공기 비행은 500만원 이하의 과태료 대상이다.","page":111},{"q":"경량항공기 등록기호표를 부착하지 아니한 경량항공기소유자등에 대한 과태료는?","o":["50만원 이하","200만원 이하","100만원 이하","300만원 이하"],"a":2,"e":"경량항공기 등록기호표를 부착하지 아니한 소유자등에게는 100만원 이하의 과태료를 부과한다.","page":112},{"q":"안전성인증 등급에 따른 운용범위를 준수하지 않고 경량항공기를 사용하여 비행한 사람에 대한 과태료는?","o":["500만원 이하","300만원 이하","50만원 이하","200만원 이하"],"a":3,"e":"안전성인증 등급에 따른 운용범위 미준수 비행과 국토교통부장관 등의 지시 불이행은 200만원 이하의 과태료이다.","page":112},{"q":"경량항공기의 변경등록 또는 말소등록을 신청하지 아니한 경량항공기소유자등에 대한 과태료는?","o":["50만원 이하","100만원 이하","200만원 이하","300만원 이하"],"a":0,"e":"경량항공기사고 보고 미이행·거짓 보고, 변경등록 또는 말소등록 미신청은 50만원 이하의 과태료이다.","page":112}]}]},{"key":"theory","name":"비행이론","short":"이론","en":"Flight Theory","chapters":[{"id":"theory-1","title":"제1장 기초 비행 원리","pages":[117,150],"goal":"대기와 유체의 성질, 양력 발생 원리, 비행 중 작용하는 4가지 힘과 안정성, 선회·상승·강하·실속·하중계수, 프로펠러 특성, 측풍 활주와 비행 전 점검을 이해한다.","summary":"공기는 점성과 마찰을 가진 유체이며, 밀도는 압력에 비례하고 온도·습도에 반비례하여 밀도고도가 높을수록 항공기 성능이 저하된다. 양력은 베르누이 원리(정압+동압=전압 일정)에 따라 날개 위·아래의 압력차로 발생하며, 받음각이 커지면 압력중심이 앞전 쪽으로 이동하고 임계받음각(약 16~20°)을 넘으면 실속이 발생한다. 비행 중에는 추력·항력·양력·무게의 4가지 힘이 작용하고, 항공기는 세로·가로·수직축을 기준으로 운동하며 정적·동적 안정성, 세로·가로·방향 안정성을 갖도록 설계된다. 선회 시 경사각이 커질수록 하중계수와 실속속도가 증가(60° 선회 2g, 실속속도는 하중계수의 제곱근에 비례)하며, 프로펠러는 토크 반작용·코크스크류·자이로스코프 효과·P-factor로 기수를 왼쪽으로 돌리는 경향이 있다.","sections":[{"title":"1.1 비행 이론 일반(Theory of flight)","page":117,"points":["대기 구성: 질소 78%, 산소 21%, 기타 가스 1% — 무거운 기체(산소 등)는 낮은 고도에 분포하며 산소 대부분은 지표면부터 약 35,000ft까지 존재","유체(Fluid): 흐르는 성질을 가진 물체로 공기도 유체 — 압력이 가해져도 쉽게 변형되지 않거나 약간 변하는 성질을 저항점성(Resistance Viscosity)이라 함","점성(Viscosity): 유체가 흐르지 않으려는(이동하지 않으려는) 성질 / 마찰(Friction): 표면 위로 물체가 움직일 때 겪는 저항으로 두 물체의 접촉 부분에서 존재","날개 표면에 붙어 있는 공기 분자층을 경계층(Boundary Layer)이라 하며, 마찰과 점성이 날개 위 공기흐름을 방해하여 항력(Drag)으로 작용","압력: 물체 표면에 수직으로 작용하는 힘 — 물체는 압력이 높은 쪽에서 낮은 쪽으로 움직임","표준대기(해수면): 기압 1,013.2mb = 29.92inHg = 14.70psi, 온도 15°C(59°F) — 고도가 높을수록 단위 체적당 공기량이 적어짐","밀도가 적어지면 엔진 출력 감소, 프로펠러 효율 감소로 추력 감소, 양력 감소 → 항공기 성능을 알려면 밀도고도를 알아야 함","밀도는 압력에 비례(온도 일정), 기온에 반비례(압력 일정), 습도 증가 시 감소(수증기가 공기보다 가벼움) — 고도 증가 시 압력 감소 효과가 더 현저하여 밀도 감소; 상대습도가 높을수록 성능 저하"]},{"title":"1.2 양력 발생 원리(Theories in the Production of Lift)","page":119,"points":["양력은 중력과 반대 방향으로 작용하여 항공기를 부양시키며, 무게와 같거나 커야 함","베르누이(Daniel Bernoulli, 스위스 수학자): 유체 속도가 증가하면 압력은 감소 — 벤투리관의 좁은 지점에서 속도 증가·압력 감소(질량 보존의 법칙)","베르누이 정리: 이상 유체의 정상 흐름에서 정압(P)+동압(q)=전압(Pt)=일정; 정압은 표면에 수직으로 작용하는 단위면적당 공기력, 동압은 유체 속도의 제곱에 비례(q=½ρV²)","단면적이 넓은 지점은 유속 작음→동압 작음→정압 큼, 단면적이 좁은 지점은 유속 큼→정압 작음","양력 = ½ρV²·S·CL (양력계수 CL, 날개면적 S, 속도 V, 공기밀도 ρ)","에어포일 용어: 앞전(Leading Edge, 둥근 앞부분), 뒷전(Trailing Edge), 시위선(Chord Line: 앞전과 뒷전을 잇는 직선), 평균 캠버선(윗면과 아랫면 길이가 같은 지점을 연결한 선)","대칭형 에어포일은 위·아래 공기 속도와 압력변화가 같음; 비대칭(윗면 볼록)은 윗면 공기가 더 빨라 압력이 감소","받음각(AOA): 시위선과 상대풍이 이루는 각 / 압력중심(CP): 공기력의 합력점 — 받음각 작을 때 시위 중앙 부근, 정상(순항) 시 시위 앞 약 25% 부근, 받음각 증가 시 앞전 쪽으로 이동"]},{"title":"1.3 비행과 항공 역학(Aerodynamic of Flight)","page":123,"points":["4가지 힘: 추력(엔진·프로펠러가 발생, 일반적으로 세로축과 평행), 항력(추력과 반대, 상대풍과 평행), 양력(상대풍에 수직, 중심위치는 받음각에 따라 변함), 무게(CG를 통해 지구중심 방향)","등속직진수평비행: 양력=무게, 추력=항력 / 등속직진수평비행에서 저속이면 받음각 증가, 고속이면 받음각 감소로 양력과 무게를 맞춤","유도항력: 날개 끝 압력차로 아래→위 바깥쪽 흐름이 와류(Vortex)를 형성 — 뒤에서 보면 오른쪽 날개 끝은 반시계, 왼쪽은 시계방향 회전; 하향기류(Downwash)가 클수록 유도항력 증가","유해항력 3가지: 형상항력(유선형 설계로 감소), 간섭항력(날개 뿌리 등 두 면이 수직으로 만나는 곳에서 최대, 페어링으로 감소), 표면 마찰항력 — 경계층이 표면에서 분리되면 양력 감소·항력 증가(대표적 현상: 실속)","지면효과: 지면 접근 시 와류 약화→유도항력 감소→추력 증가 효과; 날개 높이가 스팬의 1배일 때 유도항력 1.4%, 1/4일 때 23.5%, 1/10일 때 47.6% 감소","지면효과 시 속도계는 정상보다 높게 지시, 권고속도보다 낮은 속도로 부양 가능해 보이나 지면효과를 벗어나면 다시 활주로로 떨어질(settle back) 수 있음; 착륙 시 출력을 늦게 줄이면 플로팅 거리 증가","운동 3축(무게중심에서 90°로 교차): 세로축-Rolling(에일러론), 가로축-Pitching(엘리베이터), 수직축-Yawing(러더) / 체중이동형은 Roll·Pitch 2축만 사용(조종간 Control bar), 체중이동형·동력패러슈트는 직접 Yawing 조종 부분이 없음","안정성: 정적(처음의 경향: 긍정적·중립적·부정적)과 동적(시간에 따른 반응: 진폭 감소=긍정적, 유지=중립적, 확산=부정적); 세로 안정성(피치, 가로축)은 수평꼬리날개가 가장 중요, 가로 안정성(롤, 세로축)은 상반각, 방향 안정성(수직축)은 수직안정판이 가장 큰 역할"]},{"title":"1.4 비행기동 중에 작용하는 항공 역학적인 힘(Aerodynamic Forces)","page":134,"points":["선회: 양력이 수직·수평 분력으로 나뉘고 수평분력이 선회시킴 — 경사각 증가 시 선회율 증가·선회반경 감소, 고도 유지 위해 받음각 증가(유도항력 증가→출력 증가 필요); 속도 증가 시 선회반경 증가","슬립(내활) 선회: 경사각이 선회율에 비해 너무 크고 양력의 수평성분이 원심력보다 큼; 일정한 선회율을 위해 경사각은 속도에 따라 달라져야 함","상승: 무게의 수평분력이 항력과 함께 뒤쪽으로 작용 → 추가 동력 필요; 필요추력 = 무게의 수평분력 + 항력, 여유추력이 없으면 절대 상승한계(absolute ceiling)","강하: 같은 속도 유지하려면 엔진 출력을 줄여야 함 — 무게의 수평성분이 추력방향으로 작용, 강하각이 클수록 증가","실속: 임계받음각(약 16~20°) 초과 시 공기 분리로 양력 급감; 속도·무게·하중·밀도고도와 관계없이 같은 받음각에서 실속, 어느 자세·속도에서도 발생 가능; 실속 시 양력이 완전히 없어지는 것은 아님","곧은 날개는 날개 뿌리부터 실속되도록 설계(날개 끝 에일러론 조종 가능); 무게중심이 후방한계를 넘으면 실속 회복이 매우 어려움; 0.8mm 정도 얼음은 양력을 약 25% 감소","하중계수 n = 양력/무게(수평비행 n=1); 60° 경사 선회 2g, 80° 5.76g, 45~50° 이상에서 급증; 실속속도는 하중계수의 제곱근에 비례(45kt → 3g에서 약 75kt); 안전계수 1.5, 극한하중계수 = 하중계수×안전계수","설계기동속도(VA): 구조 손상 없이 실속에 진입할 수 있는 최대 속도(+하중계수 제한치와 최대양력곡선의 교차점) — 최대·거친 조작은 VA 이하; 깊은 강하에서 기수 들 때 2~2.5g 이하, 스핀 회복 후 적절한 하중계수 2.5g, 소형 훈련기는 경사각 70~75°에서 최대 허용 하중계수 도달; VNE는 절대 초과 금지"]},{"title":"1.5 프로펠러(Propeller)","page":144,"points":["프로펠러는 크랭크축 또는 변속기어 축의 동력으로 회전하여 추력을 발생시키는 회전하는 날개(airfoil) — 추진력은 블레이드 모양, RPM, 블레이드 부분의 받음각에 따라 다름","Hub에서 tip으로 갈수록 선속도가 커지고 추진력은 속도의 제곱에 비례하므로 블레이드는 tip으로 갈수록 깃각이 작아지게 뒤틀려(twist) 있음; 블레이드 위치(station)는 Hub로부터의 길이(inch)로 표시","과회전(Over speed): 고정피치 프로펠러에서 출력을 줄이지 않고 강하하면 받음각 감소→부하 감소→잉여출력→RPM 증가로 제한치 초과·엔진 손상 → 강하 전에 반드시 출력을 먼저 줄임","Left Turning Tendency(조종석에서 보아 시계방향 회전 프로펠러) 4가지 원인: 토크 반작용, 슬립스트림의 나선형 움직임(코크스크류), 자이로스코프 효과, 비대칭 하중(P-factor)","토크 반작용: 뉴턴 제3법칙(작용·반작용) — 공중에서는 세로축 기준 왼쪽 Roll, 이륙 활주 중엔 왼쪽 바퀴에 하중이 더 실려 왼쪽 yawing; 크기는 엔진 마력, RPM, 항공기 크기, 활주로 표면 상태 등에 따라 다르며 러더·러더 트림으로 수정","코크스크류 효과: 높은 RPM·낮은 속도(이륙, 큰 받음각)에서 크게 발생, 나선형 흐름이 수직꼬리 왼쪽 표면에 부딪혀 yawing 모멘트 발생; 전진속도 증가 시 영향 감소, 롤링 모멘트도 발생","자이로스코프 효과: 강직성(rigidity)과 세차성(precession) — 힘의 결과가 회전방향 90° 지점에서 나타남; 테일 휠 항공기가 이륙 시 꼬리를 들 때 현저(프로펠러 윗부분에 가한 힘이 3시 방향에서 작용→기수 왼쪽)","P-factor: 높은 받음각 비행 시 아래로 움직이는 블레이드의 받음각이 더 커서 더 많은 추력 → 프로펠러 디스크 오른쪽 힘이 커져 기수가 왼쪽으로; 프로펠러 상대풍은 회전속도와 전진속도의 합력"]},{"title":"1.6 측풍 시 활주","page":148,"points":["강한 정풍(headwind): 에일러론 중립, 꼬리가 들리지 않게 승강타 Up","강한 배풍(tailwind): 에일러론 중립, 승강타 Down","측정풍(Quartering headwind): 승강타 중립 또는 Up, 바람 불어오는 쪽 에일러론 Up(날개 들림 방지)","측배풍(Quartering tailwind): 승강타 중립 또는 Down, 바람 불어오는 쪽 에일러론 Down"]},{"title":"1.7 비행 전 점검(preflight)","page":148,"points":["비행 전 점검은 비행 중 위험요소를 찾아내는 최종적인 기회 — 제작사 제공 POH 또는 지침서의 점검 리스트를 보며 한 항목씩 수행하는 것이 가장 적절","비행 전 항공기 상태 확인 책임은 조종사 자신; 동절기 눈·얼음은 성능을 급격히 감소시키므로 반드시 제거 후 이륙","외부 점검은 일반적으로 육안점검(Visual Inspection) — 먼저 조종실 주 전원 마스터/이그니션 스위치 OFF 확인(프로펠러 점검 시 시동 사고 예방)","외부 점검 항목: 누유·누설 흔적, 날개·동체 위 눈·서리, 안전핀·안전커버, 연료 내 물·이물질, 타이어 압력·파손, 연결 핀·안전고리, 조종면 힌지 핀, 냉각수·오일량, 조종 케이블, 기체 변형, 복합재 외피 손상, 프로펠러 상태","트라이커 사용 체중이동형 또는 동력패러슈트는 동체부위를 먼저 점검하고 날개부와 결합 후 전체 점검","조종석 내 점검: 조종간 전후좌우 작동, 주 전원 ON 후 전기 부품 작동, 연료량 확인 — 점검 중 점화스위치는 반드시 OFF, 주 전원스위치 OFF로 종료"]}],"memorize":[{"k":"대기 구성","v":"질소 78%, 산소 21%, 기타 1% (산소 대부분은 약 35,000ft까지 존재)","page":117},{"k":"해수면 표준대기","v":"1,013.2mb = 29.92inHg = 14.70psi, 15°C(59°F)","page":118},{"k":"밀도와 압력·온도·습도","v":"압력에 비례, 온도에 반비례, 습도 증가 시 감소(밀도고도 증가→성능 저하)","page":119},{"k":"베르누이 정리","v":"정압(P)+동압(q)=전압(Pt)=일정, 속도 증가→압력 감소","page":120},{"k":"동압","v":"q = ½ρV² (속도의 제곱에 비례)","page":120},{"k":"양력 공식","v":"L = ½ρV²·S·CL","page":121},{"k":"받음각(AOA)","v":"시위선과 상대풍이 이루는 각도","page":122},{"k":"순항 시 압력중심 위치","v":"시위 앞 약 25% 부근, 받음각 증가 시 앞전 쪽으로 이동","page":122},{"k":"유해항력 3종","v":"형상항력, 간섭항력, 표면 마찰항력","page":124},{"k":"날개 끝 와류 방향(뒤에서 볼 때)","v":"오른쪽 날개 끝 반시계, 왼쪽 날개 끝 시계방향","page":124},{"k":"지면효과 유도항력 감소율","v":"스팬 높이 1.4%, 1/4 높이 23.5%, 1/10 높이 47.6%","page":126},{"k":"운동 3축과 조종면","v":"세로축-Rolling-에일러론, 가로축-Pitching-엘리베이터, 수직축-Yawing-러더","page":127},{"k":"체중이동형 조종 축","v":"Roll & Pitch 2개 축 (직접 Yaw 조종 부분 없음)","page":127},{"k":"모멘트","v":"힘 × 힘이 작용하는 거리 (무게중심 기준 회전)","page":128},{"k":"동적 안정성 종류","v":"긍정적=진폭 감소, 중립적=진폭 유지, 부정적=진폭 확산","page":129},{"k":"안정성별 핵심 요소","v":"세로(피치)-수평꼬리날개, 가로(롤)-상반각, 방향(빗놀이)-수직안정판","page":133},{"k":"추력선 위치와 피치","v":"무게중심 아래: 출력 증가→기수 up / 위: 출력 증가→기수 down / 같은 위치: 모멘트 없음","page":132},{"k":"임계받음각","v":"대략 16~20° (설계에 따라 다름)","page":138},{"k":"임계받음각 초과가 잦은 3가지 상황","v":"낮은 속도, 높은 속도, 선회할 때","page":138},{"k":"착빙 영향","v":"약 0.8mm 얼음 → 항력 증가, 양력 약 25% 감소","page":139},{"k":"하중계수(n)","v":"양력/무게, 수평비행 시 n=1","page":139},{"k":"설계 안전계수","v":"1.5 (극한하중계수 = 하중계수 × 안전계수)","page":139},{"k":"경사각별 하중계수","v":"60° → 2g, 80° → 5.76g, 45~50° 넘으면 급증","page":140},{"k":"실속속도와 하중계수","v":"하중계수의 제곱근에 비례 (실속 45kt → 3g에서 75kt)","page":140},{"k":"설계기동속도(VA)","v":"구조 손상 없이 안전하게 실속에 진입할 수 있는 최대 속도","page":140},{"k":"기동별 하중계수 기준","v":"깊은 강하 후 기수 들 때 2~2.5g 이하, 스핀 회복 후 2.5g, 소형 훈련기 경사 70~75°에서 최대 허용한계","page":142},{"k":"한계하중 vs 극한하중","v":"한계하중: 원형 복구 안 되는 휘어짐까지 허용되는 힘 / 극한하중: 구조적 결함(파괴)이 발생하는 하중","page":143},{"k":"Left Turning Tendency 4요소","v":"토크 반작용, 코크스크류(슬립스트림), 자이로스코프 효과, P-factor","page":145},{"k":"자이로 세차성","v":"가한 힘의 결과가 회전방향 90° 지점에서 나타남","page":146},{"k":"측풍 활주 조종간 위치","v":"정풍: 승강타 Up / 배풍: 승강타 Down / 측정풍: 바람쪽 에일러론 Up / 측배풍: 바람쪽 에일러론 Down","page":148}],"quiz":[{"q":"해수면 표준대기 조건으로 옳은 것은?","o":["1,013.2mb, 15°C","1,013.2mb, 0°C","29.92mb, 15°C","14.70inHg, 59°F"],"a":0,"e":"해수면 표준대기압은 1,013.2mb 또는 29.92inHg(14.70psi), 온도는 15°C(59°F)이다.","page":118},{"q":"공기 밀도에 관한 설명으로 옳지 않은 것은?","o":["온도가 일정하면 밀도는 압력에 비례한다.","압력이 일정하면 밀도는 기온에 반비례한다.","습도가 증가하면 밀도는 증가하고 밀도고도는 낮아진다.","고도가 증가하면 일반적으로 공기밀도는 감소한다."],"a":2,"e":"수증기는 공기보다 가벼워 습한 공기는 밀도가 낮아지고 밀도고도는 증가하여 성능이 감소한다.","page":119},{"q":"베르누이 정리에 대한 설명으로 옳은 것은?","o":["유체의 속도가 증가하면 압력도 증가한다.","정압과 동압의 합인 전압은 항상 일정하다.","동압은 유체 속도에 반비례한다.","벤투리관의 좁은 지점에서 속도는 감소한다."],"a":1,"e":"이상 유체의 정상 흐름에서 정압(P)+동압(q)=전압(Pt)=일정이며, 동압은 속도의 제곱에 비례한다.","page":120},{"q":"받음각(AOA)의 정의로 옳은 것은?","o":["세로축과 수평선이 이루는 각","날개 뿌리와 날개 끝이 이루는 각","평균 캠버선과 시위선이 이루는 각","시위선과 상대풍이 이루는 각"],"a":3,"e":"받음각은 항공기의 시위선(chord line)과 상대풍이 이루는 각도이다.","page":122},{"q":"받음각을 증가시킬 때 압력중심(CP)의 이동으로 옳은 것은?","o":["뒷전 쪽으로 이동한다.","앞전 쪽으로 이동한다.","날개 끝 쪽으로 이동한다.","변하지 않는다."],"a":1,"e":"받음각이 커지면 최대 유속·최대 부압 지점이 앞쪽으로 이동하므로 압력중심은 앞전 쪽으로 이동한다.","page":122},{"q":"다음 중 유해항력(Parasite Drag)에 해당하지 않는 것은?","o":["형상항력","간섭항력","유도항력","표면 마찰항력"],"a":2,"e":"유해항력은 형상항력, 간섭항력, 표면 마찰항력 3가지이며 유도항력은 별도로 구분되는 항력이다.","page":124},{"q":"간섭항력이 가장 크게 작용하는 부분과 이를 줄이기 위한 장치로 옳은 것은?","o":["두 면이 수직으로 만나는 부분 - 페어링","날개 끝 - 윙렛","프로펠러 끝 - 스피너","꼬리날개 뒷전 - 트림탭"],"a":0,"e":"간섭항력은 날개 뿌리처럼 두 면이 수직으로 만나는 곳에서 가장 크며 이를 줄이기 위해 페어링을 장착한다.","page":124},{"q":"날개가 지면으로부터 스팬 길이의 1/10 높이에 있을 때 유도항력 감소율은?","o":["1.4%","23.5%","35.0%","47.6%"],"a":3,"e":"스팬 높이에서 1.4%, 1/4 높이에서 23.5%, 1/10 높이에서 47.6% 감소한다.","page":126},{"q":"지면효과에 대한 설명으로 옳지 않은 것은?","o":["날개 끝 와류가 약해져 유도항력이 감소한다.","속도계는 정상보다 낮게 지시한다.","권고속도보다 낮은 속도에서도 부양 가능한 것처럼 보인다.","착륙 시 출력을 늦게 줄이면 플로팅 거리가 늘어난다."],"a":1,"e":"지면효과는 정압 압력을 증대시켜 속도계가 정상보다 높게 지시한다.","page":126},{"q":"조종형비행기에서 가로축을 기준으로 하는 운동과 이를 조종하는 조종면으로 옳은 것은?","o":["Rolling - 에일러론","Yawing - 러더","Pitching - 엘리베이터","Pitching - 에일러론"],"a":2,"e":"세로축-Rolling(에일러론), 가로축-Pitching(엘리베이터), 수직축-Yawing(러더)이다.","page":127},{"q":"교란 후 원래 평형상태로 돌아가려 하지만 시간이 지나면서 진폭이 증감 없이 그대로 유지되는 경우는?","o":["긍정적인 동적 안정성","부정적인 동적 안정성","부정적인 정적 안정성","중립적인 동적 안정성"],"a":3,"e":"중립적인 동적 안정성은 진폭이 증감 없이 시간이 경과해도 그대로 유지되려는 경향이다.","page":129},{"q":"추력선이 무게중심보다 아래에 있는 항공기에서 엔진 출력을 증가시키면?","o":["피치 up 모멘트가 발생하여 기수가 들린다.","피치 down 모멘트가 발생하여 기수가 내려간다.","피치 모멘트가 발생하지 않는다.","왼쪽 롤 모멘트만 발생한다."],"a":0,"e":"추력선이 무게중심 아래에 있으면 출력 증가 시 피치 up, 출력 감소 시 피치 down 모멘트가 발생한다.","page":132},{"q":"가로 안정성을 증대시키기 위해 적용되는 대표적인 방법은?","o":["수직안정판 면적 증대","주익의 상반각(Dihedral)","역 캠버 수평안정판","프로펠러 깃의 뒤틀림"],"a":1,"e":"가로(롤) 안정성 증대를 위해 주익의 상반각이 적용되며, 방향 안정성에는 수직안정판이 가장 큰 역할을 한다.","page":133},{"q":"고도를 유지하며 경사각을 증가시켜 선회할 때의 변화로 옳은 것은?","o":["선회율 감소, 선회반경 증가","선회율 증가, 선회반경 증가","선회율 증가, 선회반경 감소","선회율과 선회반경 모두 변화 없음"],"a":2,"e":"경사각이 증가하면 양력의 수평성분이 증가하여 선회율이 증가하고 선회반경은 감소한다.","page":134},{"q":"항공기가 여유추력이 없어 더 이상 상승할 수 없는 고도를 무엇이라 하는가?","o":["실용 상승한계","밀도고도","기압고도","절대 상승한계"],"a":3,"e":"여유추력이 없으면 더 이상 상승할 수 없으며 이 고도를 절대 상승한계(absolute ceiling)라 한다.","page":136},{"q":"실속에 관한 설명으로 옳지 않은 것은?","o":["실속은 어느 자세나 어느 속도에서도 발생할 수 있다.","항공기는 무게·밀도고도에 관계없이 같은 받음각에서 실속에 들어간다.","실속에 진입하면 날개의 양력은 완전히 사라진다.","곧은 날개는 날개 뿌리부터 실속이 발생하도록 설계된다."],"a":2,"e":"실속 시 양력이 완전히 사라지는 것이 아니라 수평비행을 유지할 만큼의 양력이 발생하지 못할 뿐이다.","page":137},{"q":"교재에서 제시한 일반적인 임계받음각의 범위는?","o":["약 5~8°","약 10~12°","약 16~20°","약 25~30°"],"a":2,"e":"임계받음각은 대략 16~20° 정도로 항공기 설계에 따라 달라진다.","page":138},{"q":"날개 표면에 약 0.8mm의 얼음이 생기면 양력은 대략 얼마나 감소하는가?","o":["5%","25%","50%","75%"],"a":1,"e":"날개 표면에 대략 0.8mm 정도의 얼음이 생기면 항력이 증가하고 양력이 약 25% 감소한다.","page":139},{"q":"고도를 유지하며 경사각 60°로 수평선회할 때의 하중계수는?","o":["2g","1.5g","3g","5.76g"],"a":0,"e":"경사각 60°에서 하중계수는 2g로 수평비행보다 2배의 양력이 필요하며, 80°에서는 5.76g이다.","page":140},{"q":"수평비행 실속속도가 45노트인 항공기에 3g의 하중계수가 적용되면 실속속도는?","o":["약 55노트","약 65노트","약 135노트","약 75노트"],"a":3,"e":"실속속도는 하중계수의 제곱근에 비례하여 증가하며, 교재 예시에서 실속속도 45노트 항공기에 3g가 적용되면 실속속도는 약 75노트로 증가한다(45×√3≈78).","page":140},{"q":"설계기동속도(VA)에 대한 설명으로 옳은 것은?","o":["구조적 손상 없이 안전하게 실속에 진입할 수 있는 최대 속도이다.","어떤 경우에도 초과해서는 안 되는 최대속도이다.","수평비행 상태에서의 실속속도이다.","최소 조종 가능 속도이다."],"a":0,"e":"VA는 최대 하중을 주는 기동을 하여도 구조적 손상 없이 안전하게 실속으로 진입할 수 있는 최대 속도이며, 절대 초과 금지속도는 VNE이다.","page":142},{"q":"항공기 설계 시 일반적으로 적용하는 안전계수는?","o":["1.5","1.0","2.0","2.5"],"a":0,"e":"항공기는 설계 시 일반적으로 안전계수 1.5를 적용하며 극한하중계수는 하중계수에 안전계수를 곱한 값이다.","page":139},{"q":"고정피치 프로펠러 경량항공기가 엔진 출력을 줄이지 않고 강하할 때 발생하는 현상은?","o":["RPM이 증가하여 제한치를 초과할 수 있다.","프로펠러 받음각이 증가하여 RPM이 감소한다.","프로펠러 부하가 증가하여 엔진이 정지한다.","추력이 급격히 감소하여 실속한다."],"a":0,"e":"전진속도 증가로 받음각과 부하가 감소하고 잉여출력이 RPM을 증가시켜 제한치 초과·엔진 손상을 초래할 수 있으므로 강하 전 출력을 먼저 줄여야 한다.","page":145},{"q":"Left Turning Tendency를 일으키는 요소가 아닌 것은?","o":["토크 반작용","코크스크류 효과","P-factor","상반각 효과"],"a":3,"e":"기수를 왼쪽으로 틀어지게 하는 4가지 요소는 토크 반작용, 슬립스트림의 나선형 움직임(코크스크류), 자이로스코프 효과, 비대칭 하중(P-factor)이다.","page":145},{"q":"자이로스코프의 세차성에 대한 설명으로 옳은 것은?","o":["힘을 가한 지점에서 즉시 결과가 나타난다.","힘의 결과가 회전방향 90° 지점에서 나타난다.","힘의 결과가 회전 반대방향 180° 지점에서 나타난다.","회전체가 공간에서 자세를 유지하려는 성질이다."],"a":1,"e":"세차성은 자이로 가장자리에 힘이 작용하면 그 결과가 회전 방향 90° 부분에서 나타나는 특성이다.","page":146},{"q":"높은 받음각으로 비행할 때 P-factor로 기수가 왼쪽으로 틀어지는 이유는?","o":["위로 움직이는 블레이드의 받음각이 더 커서","아래로 움직이는 블레이드의 받음각이 더 커서 더 많은 추력을 내므로","슬립스트림이 수직꼬리 오른쪽을 치므로","왼쪽 바퀴에 하중이 더 실리므로"],"a":1,"e":"아래로 움직이는 블레이드가 더 높은 받음각으로 더 많은 추력을 생성하여 프로펠러 디스크 오른쪽 힘이 커진다.","page":147},{"q":"강한 배풍(tailwind) 상태에서 지상 활주 시 조종간 조작으로 옳은 것은?","o":["에일러론 중립, 승강타 Up","에일러론 중립, 승강타 Down","바람 쪽 에일러론 Up, 승강타 중립","바람 쪽 에일러론 Down, 승강타 Up"],"a":1,"e":"강한 배풍에서는 에일러론 중립, 꼬리날개가 들리지 않게 승강타를 Down 위치로 한다.","page":148},{"q":"비행 전 점검에 관한 설명으로 옳지 않은 것은?","o":["외부 점검 전 마스터/이그니션 스위치 OFF를 확인한다.","제작사 POH의 점검 리스트를 보며 한 항목씩 수행한다.","조종석 내 점검 중 전기 부품 확인을 위해 점화스위치를 ON에 둔다.","날개나 동체 위의 눈·서리는 반드시 제거 후 이륙한다."],"a":2,"e":"조종석 내 점검 중 점화스위치는 반드시 OFF에 있어야 하며, 전기 부품 확인은 주 전원 스위치를 ON하여 수행한다.","page":150}]},{"id":"theory-2","title":"제2장 경량항공기 구조 및 특징","pages":[151,189],"goal":"경량항공기 종류별(타면조종형·체중이동형·경량헬리콥터·자이로플레인·동력패러슈트·수상항공기) 구조와 조종 원리, 핵심 제원을 구분해 이해한다.","summary":"경량항공기는 조종방식에 따라 타면조종형비행기, 체중이동형비행기, 경량헬리콥터, 자이로플레인, 동력패러슈트로 구분되며 등급은 육상·수상으로 나뉜다. 타면조종형은 동체 구조(트러스·세미모노코크·모노코크), 플랩·슬롯·스포일러·트림 탭 등 조종면과 3축 운동이 핵심이고, 체중이동형과 동력패러슈트는 조종면 없이 체중이동이나 엔진 출력·캐노피 끝단 편향으로 피칭과 롤링만 조종한다. 경량헬리콥터는 단일로터·MTOW 600kg이며 힌지·스워시 판·양력 불균형·지면효과·자동활공 원리를, 자이로플레인은 비행 중 공기력으로 자유 회전하는 로터와 PIO 문제를 이해해야 한다. 수상항공기는 플로트 용량(무게의 180%), 구획(4개 이상), 이수·착수 거리 특성과 수상 환경의 영향을 숙지한다.","sections":[{"title":"2.1 경량항공기의 종류","page":151,"points":["조종방식에 따른 분류: 타면조종형비행기(날개·안정판의 조종면 작동), 체중이동형비행기(무게중심 이동), 동력패러슈트(뼈대 없는 섬유 날개, 램 에어포일 변형), 회전익(경량헬리콥터·자이로플레인)","자격증명 종류 한정: 타면조종형비행기, 체중이동형비행기, 경량헬리콥터, 자이로플레인, 동력패러슈트 / 등급 한정: 육상 및 수상","수상용 경량항공기: 수상에서만 운용하는 수상경량항공기와 수상·육상 모두 이착륙(수) 가능한 수륙양용 경량항공기가 있음","접지 부분 형태에 따라 보트형 선체를 갖는 수상경량항공기(경량비행정·선체형 경량비행정)와 착륙장치에 플로트를 장착한 플로트 수상경량항공기로 분류","타면조종형: 보트형 선체 또는 플로트 / 자이로플레인: 플로트 장착 / 체중이동형: 보트 또는 플로트 장착 가능","경량헬리콥터: 수상용 사용 사례 없음(중량제한에 따른 엔진 출력 한계) / 동력패러슈트: 수상에서 캐노피 펼침이 불가능하여 수상용 사용 불가"]},{"title":"2.2 타면조종형비행기의 구조 및 특성","page":152,"points":["구성: 동체(Fuselage), 날개(Wing), 꼬리날개(Empennage), 착륙장치(Landing Gear), 동력장치(Power Plant)","동체 구조: 트러스(삼각형 뼈대가 모든 하중 담당, 외피는 형상 유지 보조, 설계·제작 용이하나 유선형 제작 어려움, 론저론·스트럿으로 구성) / 세미모노코크(뼈대+외피, 벌크헤드·스트링거·외피, 외피도 응력·비틀림 영향) / 모노코크(하나의 외피 구조물, 비틀림·굽힘 응력 대부분 외피로 전달, 경량·내부공간 확보, 복합섬유 설계·제작 어려움)","주날개 구성품: 스파(좌우를 연결하는 주요 하중 부재), 리브(에어포일 형태 형성), 스트럿·스트링거; 뒷전에 에일러론(좌우 균형·기울임)과 플랩 장착","플랩 4종: 플레인(뒷전을 단순히 아래로, 소형 저속기, 캠버 증가·CP 후방 이동→기수 내림 피칭 모멘트) / 스플릿(뒷전 밑면 일부를 내림, 플레인보다 항력 증가 큼) / 슬롯티드(플랩 앞 공기통로로 흐름 떨어짐 방지, 플레인·스플릿보다 최대양력계수 높음) / 파울러(뒤로 밀려나며 날개면적 증가, 4종 중 성능 가장 우수)","앞전 고양력장치 슬롯(Slot): 캠버는 증가시키지 않지만 높은 받음각에서 흐름 분리를 지연시켜 최대 양력계수(CL) 증가 / 스포일러: 날개 윗면 고항력장치, 양력 감소·항력 증가, 속도 증가 없이 강하, 착륙 후 착륙거리 단축, 활공기에선 강하율 조절","꼬리날개: 수직안정판 뒤 방향타(Rudder), 수평안정판 뒤 승강타(Elevator), 이들 뒤에 탭(Tab) / 승강타 없이 하나의 수평안정판이 움직이는 형태 = 스테빌레이터(Stabilator); 트림 시스템: 트림 탭(엘리베이터 뒷전, 엘리베이터와 반대로 움직임, 기수내림 트림 시 탭은 위로), 밸런스 탭(주 조종면과 반대방향), 서보 탭(큰 항공기, 비행 탭으로 간주), 안티서보 탭(스테빌레이터 뒷전과 같은 방향, 민감함 감소), 지상 조절 탭(러더 등의 메탈 트림 탭, 순항 중 스키드 되지 않을 때까지 조절)","착륙장치: 주 착륙장치 + 전륜형(Nose Gear) 또는 미륜형(Tail Gear), 일반적으로 바퀴 3개; 눈·빙판용 스키드 형태도 있음; 러더 페달 또는 메인바퀴 브레이크 압력 차로 지상 방향조종 / 엔진: 견인식(Pulling)·추진식(Pusher), 2행정 또는 4행정 왕복엔진(휘발유·디젤), 타면조종형은 대부분 4행정 4기통 휘발유 엔진; 전동기는 경량항공기 기준을 충족시키지 못함","3축: 세로축(Longitudinal)-롤(Roll)-에일러론, 가로축(Lateral)-피치(Pitch)-엘리베이터, 수직축(Vertical)-요오(Yaw)-러더; 주조종면=에일러론·엘리베이터·러더, 2차 조종면=플랩·앞전장치·스포일러·트림; 좌선회 시 좌측 에일러론 위·우측 에일러론 아래 / 조종간 당기면 엘리베이터 위→기수 상향 / 왼쪽 러더 페달 밟으면 러더 왼쪽→기수 왼쪽"]},{"title":"2.3 체중이동형비행기의 구조 및 특성","page":160,"points":["행글라이더를 기본으로 추력장치를 부착해 평지 이륙이 가능하도록 발전; 무게중심 변화로 피칭과 롤링만 조종되는, 피벗 날개(pivoting wing)와 동체(trike carriage)로 구성된 동력항공기","러더·엘리베이터 같은 조종면 없이 유연한 날개와 삼각 조종간으로 체중을 이동해 상승·하강·선회; 수직축 직접 회전 조종면이 없어 상대풍으로의 직진 비행을 통해 Yaw 하도록 설계","날개 프레임: 리딩에지 튜브(좌우 2개, 길이 보통 4.5~5.5m, 코판에서 킬 튜브와 연결), 킬 튜브(날개 중간, Hang point·Control Frame 연결), 크로스 튜브, 바텐(리브 역할, 좌우 각 8~12개, 캠버 형성)","Control Frame: 삼각형(tripod) A자 형식, 양측면=down-tube, 손으로 잡는 아랫부분=Base bar(control bar), Hang point 바로 앞에서 킬 튜브에 체결 / 세일: 내구성 강한 천으로 날개 형상 형성","동체(트라이크): 날개와 완전히 분리되어 양력중심의 hang block에 매달림, 2인 계단식 좌석, 추진장치는 탑승자가 프로펠러 후류 영향을 받지 않도록 탑재, 항공용 알루미늄 합금(집중하중부는 강재)","착륙장치: 바퀴식·플로트·스키·보트형 선체, 바퀴식은 구조적으로 전륜식(Nose wheel type)만 적용 가능 / 동력장치: 동체 뒤 추진식(Pusher) 프로펠러, 2행정 또는 4행정 휘발유 엔진","조종성과 안정성은 상호 배타적; 피치 안정성=받음각 증감 시 수평으로 회복하려는 성질; 익단 받음각은 날개 뿌리보다 낮게 유지(뿌리가 양일 때 익단은 음이 되기도 함)","행 포인트를 앞으로 이동→속도 증가, 뒤로 이동→저속비행 트림 효과; 킬 튜브 롤러나 U-브래킷 결속 지점으로 이동"]},{"title":"2.4 경량헬리콥터의 구조 및 특성","page":165,"points":["경량헬리콥터는 일반 헬리콥터와 구조가 같으나 2인승, 최대이륙중량(MTOW) 600kg으로 제한; 추력·양력·무게·항력이 균형이면 제자리 비행","형식: 단일로터, 동축반전로터, 직렬로터, 병렬로터, NOTAR — 경량헬리콥터는 무게·엔진 제한으로 단일로터(메인로터 1+테일로터 1) 형식; 테일로터는 토크 상쇄 및 피치각 변경으로 방향전환하나 양력에 기여 없고 동력 소모·중량 증가","메인로터: 블레이드 2개 이상, 블레이드 많으면 진동·소음 감소·무게 증가; 대부분 대칭 에어포일, 가로세로비 15~20 직사각형 기본, 뿌리→끝으로 갈수록 블레이드 각 작아지게 비틀림","동력장치: 엔진+감속기어, 약 10:1 감속기어와 클러치로 로터허브 연결; 원심 클러치·프리휠 장치로 엔진 정지 시 로터 분리→자동회전; 좌석 배치는 탠덤형·측좌형","꼬리: 테일로터 힘×무게중심~테일로터 거리 = 메인로터 토크; 위에서 볼 때 메인로터 반시계 회전 시 테일로터 힘은 오른쪽; 패네스트론은 4개 이상 블레이드, 수직꼬리 내부 원형판에 있어 소음·안정성 개선 / 로터 허브 힌지 3종: 플래핑 힌지(상하 운동), 리드-래그 힌지(회전면 내 운동, drag hinge), 페더링 힌지(피치각 변경); 스워시 판은 두 판과 베어링, 윗판이 허브와 함께 회전하며 피치각 조절","양력 불균형: 선속도 400kt·전진속도 100kt이면 전진 블레이드 500kt, 후퇴 블레이드 300kt; 양력은 속도 제곱 비례(속도 3배→양력 9배); 코닝=플래핑으로 익단이 올라가 원추형; 리드-래깅은 정상비행 시 기준선에서 10~15도 뒤처짐, 자동회전 시 앞섬","조종장치: 사이클릭(1회전당 1회 피치 증감, 비행기 조종간 역할), 콜렉티브(모든 블레이드 피치 동시 증감, 수직 상하, 끝에 스로틀), 안티토오크 페달(테일로터 피치, Yaw)","지면효과: 로터 직경 0.5배 고도에서 추력 약 7% 증가, 1.25배 고도에서 증가 정지, 평탄 포장면에서 크고 거친 지면·수면에서는 부분 와해 / 자동활공: 엔진 고장 시 즉시 콜렉티브를 내리고 조종간을 앞으로 밀어 전진속도 확보, 고도/속도 한계(A: 고도 있으나 속도 부족, B: 속도 있으나 고도 부족)는 비행금지 구역"]},{"title":"2.5 자이로플레인의 구조 및 특성","page":174,"points":["정의: 시동 시는 엔진 구동, 비행 시에는 공기력으로 회전하는 회전익에서 양력을 얻고 추진력은 프로펠러에서 얻는 회전익 경량항공기; 비행 중 콜렉티브 피치 각도는 고정","비행 중 로터가 엔진에 의해 구동되지 않음; 양력 측면에서는 헬리콥터와 유사, 방향 조종·이착륙 활주는 고정익과 유사","초기에는 견인식(Pulling), 현재 경량 자이로플레인은 추진식(Pusher)으로 기동성·조종사 시야 확보 우수; 구성: 동체, 꼬리날개, 착륙장치, 로터 및 프로펠러 포함 동력장치","꼬리날개: 수직안정판+방향타, 로터가 운동·안정성 지배하므로 수평안정판을 장착하지 않는 경우도 있음 / 착륙장치: 스키드가 아닌 바퀴, 주 착륙장치에 브레이크, 수륙양용 시 플로트","로터: 티터링(teetering) 힌지 기준 로터 허브+로터 블레이드, 직경 약 6m·폭 약 15cm·가로세로비 15~20, 순항 시 수백 RPM / 동력장치: 일반적으로 4행정 4기통 휘발유 엔진","로터 스핀업(프리로테이터) 장치: 지상 활주거리 단축 위해 엔진 동력을 로터에 연결, 지상에서만 사용·비행 중 완전히 분리; 전기식 프리로테이터도 사용","실속은 없으나 조종사 유발진동(PIO)이 특이한 문제 — 동체가 로터에 매달려 있어 반대 조작이 진폭을 키움","자이로플레인은 호버링 불가, 테일로터·로터 동력전달장치가 필요 없어 헬리콥터보다 구조가 간단; 전진 비행 시 로터는 상방으로 젖혀진 상태로 회전"]},{"title":"2.6 동력패러슈트의 구조 및 특성","page":179,"points":["PPC(Powered ParaChute): 패러글라이더에 조종사가 탈 수 있는 트라이크를 결합한 경량항공기 = 캐노피 + 엔진 + 바퀴","대지속도 40~60km/h, 운항고도 일반적으로 500~1,500ft(항공안전법상 MSL 5,000ft까지 상승 가능), 자체중량 90~150kg, 2인 탑승 시에도 최대이륙중량 600kg 이하","조종 수단 2가지: 상승률에 영향을 주는 엔진 출력, 방향을 조절하는 캐노피 끝단 편향도 → 피칭과 롤링만 조종","캐노피: 격벽(Separator/Rib)으로 익형 유지, 크로스포트로 셀 간 공기 유통, 나일론·폴리에스터 코팅 원단; 보관은 아코디언식, 느슨하게 접음","산줄: 앞에서부터 A·B·C·D라인, 끝부분 브레이크 라인(보조익 위치), 윙팁은 Stabilisers 라인; 아라미드 계열 재질에 폴리에스테르 피복 / 라이저: 대개 3~4개, 이륙 시 트라이크를 끌어올림","트라이크: 두랄루민 합금강·강화 플라스틱, 주로 2행정 엔진(연료소모 많아 4행정도 사용), 전륜형 3바퀴(백사장·설상·수상용 탈부착), 2인승은 계단식 탠덤 좌석","엔진정지 시 활공비 3:1~6:1(캐노피 크기·모양, 무게 영향); 스티어링 바를 동시에 앞으로 밀면 캐노피 끝단이 플랩 역할","이륙: ①정풍으로 정렬 ②캐노피 펴고 라이저 장착 ③A라이저를 수직봉에 건다 ④엔진 속도↑로 캐노피 세움 ⑤정면 조정하며 이륙; 조종줄 계속 당기면 Deep Stall→Full Stall, 엔진 추력이 강하면 실속 안 일어남"]},{"title":"2.7 수상항공기","page":184,"points":["비행정: 이착수장치가 동체 밑면, 보조로 날개 끝 플로트(Wing tip Float) / 플로트 수상항공기: 착륙장치 대신 플로트 장착","플로트 구조: 용골(Keel)과 차인(Chine) 사이 보조용골(Sister Keelson), 갑판(Deck)에 빌지펌프 입구·손잡이 덮개·밧줄걸이, 앞부분 범퍼(정박 충격 완화), 차인 앞 스프레이 레일(프로펠러 보호), 후미 접이식 수중 방향타(얕은 물·이착수 시 접어둠)","플로트 등급은 담수 배제 부피 기준(해수가 약 3% 밀도 높음); 1,000lb 용량 플로트는 완전 침수까지 1,000lb 지지; 항공기 무게의 180%를 지지할 수 있는 플로트 장착 의무","플로트는 방수 칸막이로 4개 이상 구획, 두 플로트 구획 중 2개까지 물이 차도 가라앉지 않음","플로트 장착 가능: 타면조종형·체중이동형·자이로플레인(대부분 전륜형) / 불가: 경량헬리콥터(중량·출력), 동력패러슈트(캐노피 수상 전개 불가); MTOW 450kg→14인치, 600kg→15인치 플로트; 추가 장착 시 안전성 인증 재취득","플로트 장착 시 이륙거리 증가, 상승속도 감소, 연료소모 증가·항속거리 단축, 가파른 활공각·짧은 활공거리; 브레이크 없음, 저속 시 측풍에 민감, 수면 회전반경 큼","Super Petrel LS: 이륙 80m, 이수 120m, 착륙 120m, 착수 100m → 이수거리=이륙거리 1.5배, 착수거리=착륙거리 0.84배","물의 제동력은 속도 제곱 비례(속도 2배→4배); 플로트에 완충장치 없음; 잔잔한 수면은 거울 효과로 고도 판단 곤란; 이착수 운영 기간 4~45초, 소음 외 환경 영향 매우 적음"]}],"memorize":[{"k":"자격증명 종류 한정","v":"타면조종형비행기, 체중이동형비행기, 경량헬리콥터, 자이로플레인, 동력패러슈트","page":151},{"k":"수상용 사용 불가 종류","v":"동력패러슈트(캐노피 펼침 불가), 경량헬리콥터는 사용 사례 없음(출력 한계)","page":151},{"k":"타면조종형 구성 5요소","v":"동체, 날개, 꼬리날개, 착륙장치, 동력장치","page":152},{"k":"동체 구조 3형식","v":"트러스, 세미모노코크, 모노코크","page":152},{"k":"플랩 4종 성능 순","v":"파울러 > 슬롯티드 > 플레인·스플릿 (파울러가 가장 우수)","page":155},{"k":"슬롯(Slot)","v":"캠버 증가 없이 높은 받음각에서 흐름분리 지연 → 최대양력계수 증가","page":155},{"k":"트림 시스템 종류","v":"트림 탭, 밸런스 탭, 서보 탭, 안티서보 탭, 지상 조절 탭","page":156},{"k":"안티서보 탭 움직임","v":"스테빌레이터 뒷전과 같은 방향","page":157},{"k":"3축과 조종면","v":"세로축-롤-에일러론 / 가로축-피치-엘리베이터 / 수직축-요오-러더","page":159},{"k":"2차 조종면","v":"플랩, 앞전장치, 스포일러, 트림","page":159},{"k":"체중이동형 리딩에지 튜브 길이","v":"보통 4.5~5.5m (좌우 2개)","page":161},{"k":"체중이동형 바텐 수","v":"좌·우 날개 각각 8~12개 정도","page":161},{"k":"체중이동형 바퀴식 착륙장치","v":"전륜식만 적용 가능","page":163},{"k":"행 포인트 이동 효과","v":"앞으로→속도 증가 / 뒤로→저속비행 트림","page":164},{"k":"경량헬리콥터 제한","v":"2인승, MTOW 600kg","page":165},{"k":"헬리콥터 감속기어비","v":"약 10:1","page":167},{"k":"로터 블레이드 가로세로비","v":"15~20 (헬리콥터·자이로플레인 공통)","page":167},{"k":"로터 허브 힌지 3종","v":"플래핑, 리드-래그(drag), 페더링","page":168},{"k":"리드-래깅 뒤처짐","v":"정상비행 시 10~15도, 자동회전 시 앞섬","page":170},{"k":"지면효과","v":"로터 직경 0.5배 고도에서 추력 약 7% 증가, 1.25배에서 증가 정지","page":172},{"k":"자동활공 시 조작","v":"콜렉티브를 내리고 조종간을 앞으로 밀어 전진속도 확보","page":173},{"k":"자이로플레인 로터","v":"직경 약 6m, 폭 약 15cm, 순항 수백 RPM","page":176},{"k":"자이로플레인 특이 문제","v":"조종사 유발진동(PIO), 실속은 없음","page":177},{"k":"동력패러슈트 제원","v":"대지속도 40~60km/h, 운항고도 500~1,500ft(최대 MSL 5,000ft), 자체중량 90~150kg","page":179},{"k":"동력패러슈트 엔진정지 활공비","v":"3:1 ~ 6:1","page":182},{"k":"플로트 요구 용량","v":"항공기 무게의 180%","page":185},{"k":"플로트 구획","v":"4개 이상, 2개까지 침수돼도 부양","page":185},{"k":"경량항공기 플로트 길이","v":"MTOW 450kg→14인치, 600kg→15인치","page":186},{"k":"이수/착수 거리 비율","v":"이수=이륙의 1.5배, 착수=착륙의 0.84배 (Super Petrel LS)","page":187},{"k":"수상 이착수 운영 기간","v":"4~45초","page":189}],"quiz":[{"q":"경량항공기 조종사 자격증명의 종류 한정에 해당하지 않는 것은?","o":["타면조종형비행기","자이로플레인","동력패러슈트","활공기"],"a":3,"e":"종류 한정은 타면조종형비행기, 체중이동형비행기, 경량헬리콥터, 자이로플레인, 동력패러슈트로 구분되며 활공기는 포함되지 않는다.","page":151},{"q":"수상에서 캐노피 펼침이 불가능하여 수상용으로 사용할 수 없는 경량항공기는?","o":["동력패러슈트","자이로플레인","체중이동형비행기","타면조종형비행기"],"a":0,"e":"동력패러슈트는 수상에서 캐노피를 펼 수 없어 수상용으로 사용 불가하다.","page":151},{"q":"삼각형 구조물로 연결된 뼈대가 모든 하중을 담당하고 외피는 형상 유지만 보조하는 동체 구조는?","o":["세미모노코크 구조","트러스 구조","모노코크 구조","응력외피 구조"],"a":1,"e":"트러스 구조는 뼈대가 모든 하중을 담당하며 외피는 응력이나 비틀림에 영향을 미치지 않는다.","page":152},{"q":"경량항공기에 사용되는 4종류의 플랩 중 캠버 증가, 경계층 제어, 날개 면적 증가 효과로 가장 성능이 우수한 것은?","o":["플레인 플랩","스플릿 플랩","파울러 플랩","슬롯티드 플랩"],"a":2,"e":"파울러 플랩은 뒤로 밀려나며 날개면적을 넓히고 공기통로를 형성해 4종 중 가장 성능이 우수하다.","page":155},{"q":"스포일러(Spoiler)에 대한 설명으로 옳지 않은 것은?","o":["날개 윗면에 장착된 고항력 장치이다","속도의 증가 없이 항공기가 하강하도록 한다","착륙 후 착륙거리를 짧게 해준다","양력을 증가시키는 고양력 장치이다"],"a":3,"e":"스포일러는 날개 위 공기흐름을 방해하여 양력을 줄이고 항력을 증가시키는 고항력 장치이다.","page":155},{"q":"플레인 플랩(Plain Flap)을 내렸을 때 나타나는 현상으로 옳은 것은?","o":["양력중심이 후방으로 이동하여 기수가 내려가는 피칭 모멘트가 발생한다","캠버가 감소하여 양력이 줄어든다","항력이 감소한다","양력중심이 전방으로 이동하여 기수가 올라간다"],"a":0,"e":"플랩을 내리면 캠버가 증가하고 양력중심(CP)이 후방으로 이동하여 기수가 내려가는 피칭 모멘트가 발생한다.","page":154},{"q":"엘리베이터 트림 탭에 대한 설명으로 옳은 것은?","o":["트림 탭은 주로 러더 뒷전에 부착된다","트림 탭은 엘리베이터와 반대 방향으로 움직인다","기수내림 트림 시 트림 탭은 아래로 움직인다","트림 탭은 조종력을 증가시키는 장치이다"],"a":1,"e":"엘리베이터를 내린 상태에서 기수내림 트림을 하면 트림 탭은 위로 움직이며, 엘리베이터와 반대 방향으로 움직인다.","page":156},{"q":"밸런스 탭과 동일한 방식으로 작동하지만 반대방향이 아닌 같은 방향으로 스테빌레이터 뒷전에서 움직여 민감함을 감소시키는 탭은?","o":["서보 탭","안티서보 탭","지상 조절 탭","트림 탭"],"a":1,"e":"안티서보 탭은 스테빌레이터 뒷전과 같은 방향으로 움직여 스테빌레이터의 민감함을 감소시킨다.","page":157},{"q":"비행기의 가로축(Lateral Axis)에 대한 움직임과 이를 조종하는 조종면이 바르게 짝지어진 것은?","o":["롤(Roll) - 에일러론","요오(Yaw) - 러더","피치(Pitch) - 엘리베이터","피치(Pitch) - 러더"],"a":2,"e":"가로축에 대한 움직임은 피치이며 엘리베이터(승강타)가 조종한다.","page":159},{"q":"타면조종형비행기가 좌측으로 선회할 때 에일러론의 움직임으로 옳은 것은?","o":["좌측 에일러론은 아래로, 우측 에일러론은 위로 움직인다","양쪽 에일러론이 모두 위로 움직인다","양쪽 에일러론이 모두 아래로 움직인다","좌측 에일러론은 위로, 우측 에일러론은 아래로 움직인다"],"a":3,"e":"좌선회 시 좌측 에일러론은 위로 움직여 좌측 날개를 내리고, 우측 에일러론은 아래로 움직여 우측 날개를 올린다.","page":159},{"q":"체중이동형비행기 날개에서 리브 역할을 하며 좌·우 날개에 각각 보통 8~12개 정도 삽입되는 구성품은?","o":["바텐(Battens)","킬 튜브(Keel Tube)","크로스 튜브(Cross Tube)","리딩에지 튜브(Leading Edge Tube)"],"a":0,"e":"바텐은 날개 형상과 세일 텐션을 유지하는 화살 끝 모양의 얇은 튜브로 좌우 날개에 각각 8~12개 정도로 구성된다.","page":161},{"q":"체중이동형비행기의 바퀴식 착륙장치에 대한 설명으로 옳은 것은?","o":["미륜식 착륙장치만 적용할 수 있다","전륜식과 미륜식을 모두 적용할 수 있다","구조적으로 전륜식 착륙장치만 적용할 수 있다","바퀴식 착륙장치는 사용할 수 없다"],"a":2,"e":"체중이동형비행기의 바퀴식 착륙장치는 구조적으로 전륜식(Nose wheel type)만 적용할 수 있다.","page":163},{"q":"체중이동형비행기에서 행 포인트(hang point)를 앞으로 이동시키면 나타나는 효과는?","o":["속도가 증가되는 상태가 된다","저속비행에 적합한 트림 효과가 난다","피치 안정성이 사라진다","익단의 받음각이 증가한다"],"a":0,"e":"행 포인트를 앞으로 이동하면 속도가 증가되는 상태가 되고, 뒤로 이동하면 저속비행에 적합한 트림 효과가 난다.","page":164},{"q":"경량헬리콥터에 주로 사용되는 로터 형식은?","o":["동축반전로터 형식","직렬로터 형식","병렬로터 형식","단일로터(Single Rotor) 형식"],"a":3,"e":"경량항공기는 무게 및 엔진형식 등의 제한으로 메인로터 1개와 테일로터 1개의 단일로터 형식을 취한다.","page":166},{"q":"경량헬리콥터 동력장치에서 엔진 동력이 로터허브로 전달되는 감속기어비는 약 얼마인가?","o":["약 2:1","약 10:1","약 5:1","약 20:1"],"a":1,"e":"엔진에서 얻어진 동력은 약 10:1 정도의 감속기어와 클러치를 통하여 로터허브와 연결된다.","page":167},{"q":"블레이드 선속도가 400노트인 헬리콥터가 100노트로 전진비행할 때 앞서가는 블레이드와 뒤처지는 블레이드의 선속도는?","o":["400노트 / 400노트","500노트 / 400노트","500노트 / 300노트","300노트 / 500노트"],"a":2,"e":"앞서가는 블레이드는 선속도에 전진속도를 더하고(500노트), 뒤처지는 블레이드는 전진속도를 뺀다(300노트).","page":169},{"q":"정상 비행 중 로터 허브 기준선에서 10~15도 정도 뒤처짐이 발생하고, 자동회전 시에는 기준선보다 앞서게 되는 블레이드 운동은?","o":["리드 래깅(Lead-Lagging) 운동","플래핑(Flapping) 운동","페더링(Feathering) 운동","코닝(Coning) 현상"],"a":0,"e":"리드 래깅은 전진·후진 시 속도 영향으로 블레이드가 뒤처지거나 앞서는 운동으로 정상비행 시 10~15도 뒤처진다.","page":170},{"q":"헬리콥터의 지면효과에 대한 설명으로 옳은 것은?","o":["로터 직경의 1.25배 고도에서 추력 증가율이 최대가 된다","수면 상공에서 지면효과가 가장 크게 나타난다","거친 지면에서 지면효과가 더 크게 나타난다","로터 직경의 0.5배 고도에서 추력이 약 7% 증가한다"],"a":3,"e":"지면효과는 로터 직경 0.5배 고도에서 추력이 약 7% 증가하고 1.25배 고도에서 증가율이 정지되며, 평탄한 포장면에서 크게 나타난다.","page":172},{"q":"헬리콥터 엔진 고장 시 자동활공(Autorotation)을 위한 조종사의 즉각적인 조작으로 옳은 것은?","o":["콜렉티브 피치 조종간을 올려 블레이드 피치를 증가시킨다","콜렉티브 피치 조종간을 내리고 조종간을 앞으로 밀어 전진속도를 확보한다","조종간을 뒤로 당겨 고도를 유지한다","안티토오크 페달을 밟아 테일로터 피치를 최대로 한다"],"a":1,"e":"엔진 고장 시 즉시 콜렉티브를 내려 블레이드 피치를 감소시키고, 조종간을 앞으로 밀어 적절한 전진 속도를 확보한다.","page":173},{"q":"자이로플레인에 대한 설명으로 옳지 않은 것은?","o":["시동 시에는 엔진 구동으로 로터를 회전시킨다","추진력은 프로펠러에서 얻는다","비행 중 엔진이 로터를 직접 구동하여 양력을 얻는다","비행 중 로터의 콜렉티브 피치 각도는 고정되어 있어야 한다"],"a":2,"e":"자이로플레인의 로터는 비행 시 엔진에 의해 구동되지 않고 공기력의 작용으로 자유롭게 회전한다.","page":174},{"q":"자이로플레인의 로터 스핀업(prerotator) 장치에 대한 설명으로 옳은 것은?","o":["지상에서만 사용되고 비행 중에는 로터와 기계적으로 완전히 분리되어야 한다","비행 중 로터 회전수를 유지하기 위해 계속 사용된다","호버링을 가능하게 하는 장치이다","테일로터를 구동하는 장치이다"],"a":0,"e":"스핀업 장치는 지상 활주거리를 줄이기 위해 사용되며 지상에서만 사용되고 비행 중에는 로터와 완전히 분리되어야 한다.","page":177},{"q":"실속은 없지만 자이로플레인 설계에 따른 특이한 문제로 비행 안전성에 큰 영향을 미치는 현상은?","o":["코닝 현상","양력 불균형","지면효과","조종사 유발진동(PIO)"],"a":3,"e":"자이로플레인은 비행기처럼 실속은 없지만 조종사 유발진동(PIO: Pilot Induced Oscillation)이라는 특이한 문제가 있다.","page":177},{"q":"동력패러슈트에 대한 설명으로 옳지 않은 것은?","o":["대지속도는 40~60km/h 정도이다","엔진정지 시 활공비는 10:1 내지 15:1 정도이다","자체중량은 90~150kg 정도이다","항공안전법에 따라 MSL 5,000ft까지 상승이 가능하다"],"a":1,"e":"동력패러슈트의 엔진정지 시 활공비(power-off glide ratio)는 3:1 내지 6:1 정도이다.","page":182},{"q":"동력패러슈트 산줄 중 캐노피 최전방부에 위치한 산줄과 윙팁에 해당하는 산줄이 바르게 짝지어진 것은?","o":["D라인 - 브레이크 라인","A라인 - 브레이크 라인","A라인 - Stabilisers 라인","B라인 - C라인"],"a":2,"e":"캐노피 최전방부 산줄은 A라인이며, 비행기의 양쪽 날개 끝(윙팁)에 해당되는 것은 Stabilisers 라인이다.","page":181},{"q":"수상항공기에 장착이 의무화된 플로트의 용량 기준은?","o":["항공기 무게의 180%","항공기 무게의 100%","항공기 무게의 120%","항공기 무게의 150%"],"a":0,"e":"두 플로트가 완전히 잠기는 것을 방지하기 위해 항공기 무게의 180%를 지지할 수 있는 용량의 플로트 장착을 의무화하고 있다.","page":185},{"q":"Super Petrel LS의 POH를 기반으로 계산한 이수거리와 착수거리에 대한 설명으로 옳은 것은?","o":["이수거리는 이륙거리의 0.84배, 착수거리는 착륙거리의 1.5배이다","이수거리와 이륙거리는 같다","착수거리는 착륙거리의 1.5배이다","이수거리는 이륙거리의 1.5배, 착수거리는 착륙거리의 0.84배이다"],"a":3,"e":"이륙 80m, 이수 120m, 착륙 120m, 착수 100m이므로 이수거리는 이륙거리의 1.5배, 착수거리는 착륙거리의 0.84배이다.","page":187},{"q":"수상에서 운항 중인 수상항공기의 속도를 2배로 증가시키면 물에 의한 제동력은 어떻게 되는가?","o":["2배로 증가한다","변화 없다","4배로 증가한다","절반으로 감소한다"],"a":2,"e":"물의 저항에 의한 제동력은 항공기 속도의 제곱에 비례하므로 속도 2배는 제동력 4배가 된다.","page":188},{"q":"경량항공기에 플로트를 장착하는 경우에 대한 설명으로 옳지 않은 것은?","o":["플로트를 장착할 수 있는 기종은 대부분 전륜형 착륙장치를 보유한 경량항공기이다","별도의 안전성 인증을 다시 받을 필요가 없다","최대이륙중량 600kg에는 길이 15인치 플로트가 사용된다","상승속도가 감소하고 항속거리가 짧아진다"],"a":1,"e":"경량항공기에 추가적으로 플로트를 장착할 경우 경량항공기 안전성 인증을 다시 받아야 한다.","page":186}]},{"id":"theory-3","title":"제3장 동력장치 및 계기장치","pages":[190,210],"goal":"경량항공기 엔진의 분류·작동원리·흡기/점화/연료/오일 계통과 동정압 계기(고도계·승강계·속도계)의 원리, 오차, 제한 표시를 이해한다.","summary":"경량항공기 엔진은 가솔린(불꽃점화)과 디젤(압축착화)로 나뉘며, 냉각방식(공랭식 Jabiru, 수냉식 Rotax)과 행정(2행정·4행정)으로도 분류된다. 기화기는 착빙(외기 21℃ 이하, 상대습도 80% 이상)에 취약하여 기화기 가열장치를 사용하며, 고도 증가 시 혼합비를 줄여야 하고 점화계통은 항공기 전기계통과 독립된 2개의 마그네토로 구성된다. 동정압 계기 중 고도계·승강계는 정압을, 속도계는 전압과 정압의 차를 이용하며, 기온·기압 차이에 따른 고도계 오차와 고도의 종류(진고도·기압고도·절대고도·밀도고도)를 구분해야 한다. 속도계와 엔진계기의 색 표시(Red line, Yellow arc, Green arc, White arc)와 BRS 낙하산 기준(안전계수 1.5)도 시험 대상이다.","sections":[{"title":"3.1 경량항공기 엔진(LSA Engine) 분류","page":190,"points":["경량항공기 기술기준은 왕복불꽃점화엔진(가솔린엔진)과 왕복압축착화엔진(디젤엔진)을 다룬다.","가솔린엔진(SI-Engine): 공기·연료 혼합가스를 실린더에서 압축하고 전기 불꽃(Electric Spark)으로 점화·연소시킨다.","디젤엔진(CI-Engine): 고압으로 압축한 고온·고압 공기에 경유를 고압 분사하여 연료가 자기착화(Self-Ignition)한다.","공랭식: 엔진 주위 공기로 냉각, 정비가 쉽고 제작비가 저렴하며 가벼움 — Jabiru사 엔진이 해당.","수냉식: 물(냉각액)로 냉각, 탱크·워터펌프 등으로 구조가 복잡하고 무게가 늘지만 냉각 효율이 좋음 — Rotax사 엔진이 해당.","2행정: 크랭크축 1회전(360°)에 1사이클 완성, 가벼워 동력패러슈트·체중이동형비행기에 사용.","4행정: 크랭크축 2회전(720°)에 1사이클 완성, 연료소모량이 적어 경량항공기에 많이 사용."]},{"title":"3.2 디젤엔진과 가솔린엔진의 차이점","page":191,"points":["점화방식: 디젤은 공기만 흡입·압축 후 연료 분사로 압축열에 의한 자기착화, 가솔린은 혼합기를 압축 후 압축상사점 부근에서 전기불꽃(Spark Ignition)으로 점화.","사용연료: 디젤은 자기착화성이 높은 고(高) 세탄가(cetane number) 연료인 경유 사용.","가솔린엔진은 인화점이 낮아 불꽃으로 쉽게 점화되면서 자기착화성은 낮은 고(高) 옥탄가(octane number) 연료가 필요.","디젤 출력제어: 압축공기 중에 분사되는 연료량을 조절(분사량 제어).","간접분사식 전자제어 가솔린 분사장치: 흡기 체적/질량을 계량해 이론혼합비 연료를 흡기밸브 전방 또는 흡기다기관에 분사(공기량 제어).","가솔린 직접분사(GDI): 연료량과 공기량을 동시에 제어, 즉 혼합기의 양과 질을 함께 제어하여 출력 제어."]},{"title":"3.3 엔진의 행정","page":192,"points":["2행정 엔진은 4행정 엔진의 가스교환장치(흡/배기 밸브기구)가 없는 것이 가장 큰 차이점이며, 실린더와 크랭크실이 상호 보완작용을 한다.","2행정 가솔린엔진의 포트: 흡기구(Intake Port, 기화기↔크랭크실), 배기구(Exhaust Port, 연소실↔배기구), 소기구(Transfer Port, 크랭크실↔연소실).","4행정 순서: 흡입 → 압축 → 팽창 → 배기 (크랭크축 2회전, 720°).","가솔린 압축행정: 흡/배기밸브 모두 닫힘, 압축비 약 7~12:1, 혼합기 온도 약 400~500℃.","디젤 압축행정: 압축비 약 16~24:1, 압축온도 약 700~900℃, 압축행정 종료 직전 분사노즐로 연료 고압 분사.","팽창행정은 4개 행정 중 동력을 발생시키는 유일한 행정이며, 나머지 3개 행정은 플라이휠(Flywheel)의 관성으로 수행.","GDI 방식이나 디젤엔진의 흡입행정에서는 공기만 흡입된다; 디젤 흡입공기는 과급기로 이미 압축된 공기일 수도 있다."]},{"title":"3.4 점화플러그 & 예열플러그","page":194,"points":[
