"점화플러그는 중심전극과 접지전극 간 고압전류가 흐를 때 불꽃을 발생시킨다.","전극 간극은 보통 0.7~1.1mm(엔진마다 다름), 간극이 커지면 필요 점화전압이 상승한다.","장착 시 실린더 헤드 손상 방지를 위해 손으로 끝까지 조인 후 마지막에 제작사 토오크 값으로 토큐렌치를 사용해 조인다.","점화플러그 장/탈착은 엔진 온도가 식은 다음에 실시한다.","디젤엔진은 냉각 상태에서 압축압력·압축온도가 낮아 시동이 어려우므로 예열플러그를 사용(시동 용이, 회전 안정화, 유해 배출물 저감)."]},{"title":"3.5 흡기계통(Induction system)","page":195,"points":["흡기계통은 기화기(Carburetor) 방식과 직접분사(Fuel injection) 방식으로 나뉜다; 기화기는 플로트식과 압력식으로 구분.","플로트식 기화기: 구조가 간단해 소형항공기에 주로 쓰이나 자세변화에 따라 연료면이 변해 분사가 불규칙하고, 벤투리 저압·연료 기화로 착빙이 발생하는 단점.","기화기 착빙 조건: 기화기로 들어오는 공기 온도 70℉(21℃) 이하, 상대습도 80% 이상일 때 잘 발생.","고정피치프로펠러 항공기에서 기화기 착빙 시 RPM 감소, 악화되면 엔진 진동 발생.","착빙 의심 시 기화기 가열장치(Carburetor heater) 작동 — 엔진 배기가스로 덥힌 공기 공급; 착빙 예상 지역 강하 시 가열장치를 먼저 작동한 다음 출력을 줄인다.","기화기 가열장치 작동 시 공기 밀도 감소 → 혼합비를 줄여야 하며, 엔진 출력이 경우에 따라 15%까지 감소.","직접분사식 장점: 착빙 거의 없음, 연료흐름 균일, 스로틀 반응 빠름, 혹한기 시동 용이 / 단점: 엔진 가열 상태 시동 곤란, 더운 날 베이퍼 락, 엔진 정지 시 재시동 곤란.","연소 가능 혼합비(공기:연료 무게비) 8:1~20:1; Rich는 불완전연소, Lean은 과열로 이상폭발(Detonation)."]},{"title":"3.5.5~3.5.6 혼합비 조절 방법과 과급기","page":198,"points":["고도 증가 → 공기밀도 감소 → 혼합비조절레버로 연료량을 줄인다.","혼합비 조절은 먼저 스로틀로 원하는 출력에 맞춘 다음 조절하며, 배기가스온도계(EGT)를 이용하는 것이 가장 정확·보편적.","방법: 혼합비 레버를 왼쪽(lean)으로 천천히 돌려 RPM이 감소(rough)하기 시작하면 멈추고, 다시 오른쪽(rich)으로 돌려 원래 RPM(smooth)으로 맞춘다.","혼합비는 Best power Mixture 또는 Best economy Mixture로 조절하며 수치는 POH 확인.","대기압은 고도 1,000ft당 약 1inHg 감소 — 5,000ft 대기압 24.92inHg, 공기밀도 약 15% 감소.","과급기(Super charger·Turbocharger)는 흡입공기를 압축해 공기량(밀도)을 증가시키며, 두 방식은 임펠러·콤프레셔를 회전시키는 방법에 차이가 있다."]},{"title":"3.6 엔진 시동장치(Starting system)","page":199,"points":["시동모터 작동에는 고전압 전류가 필요하여 두툼한 케이블(heavy duty wiring cable)이 필요하다.","시동스위치와 시동모터를 케이블로 직접 연결하면 전력 낭비와 조종석 내 고전압 전달로 화재 위험 → 솔레노이드(Solenoid) 시스템 사용.","시동스위치를 Start에 두면 솔레노이드에 작은 전류를 보내 충전, 충전된 솔레노이드가 고전압을 시동모터로 보낸다.","엔진 RPM이 시동모터보다 빨라지면 시동장치는 자동으로 해제(disengage)된다."]},{"title":"3.7 점화계통(Ignition system)","page":199,"points":["마그네토는 항공기 전기시스템(Alternator, Battery)과 별도로 작동하는 독립 전기장치이며, 신뢰성을 위해 2개의 마그네토로 구성.","구성: 마그네토, 점화플러그, 고전압선(High tension lead), 점화스위치.","영구자석 회전 → 1차 코일 전류 유도 → 2차 코일 고전압 승압 → 배전기(Distributor)가 점화 순서대로 Ignition harness로 점화플러그에 전달.","점화스위치 위치: L, R, BOTH, START; START 위치에서는 좌측 마그네토만 작동(시동에는 실린더당 1회 점화만 필요), BOTH로 놓는 순간 우측도 작동.","마그네토 점검은 Run up 중 BOTH→L 또는 R 선택 시 RPM 약간 감소; POH 제한치 초과 감소 또는 RPM이 감소하지 않으면 비정상 → 비행 중단.","엔진 정지 후 점화스위치 OFF, 키 제거; OFF여도 접지선(Ground wire)이 절단·파손되면 프로펠러 회전 시 예기치 않게 시동될 수 있음 — 손으로 프로펠러를 돌리지 말 것."]},{"title":"3.8 연료시스템","page":200,"points":["연료탱크는 보통 날개 안쪽에 있고, 탱크 내외 압력을 같게 하려고 벤트 관(vent tube) 설치 — 더운 여름 벤트관으로 연료가 흘러나오는 것은 정상.","연료탱크에는 불순물 제거·연료샘플 채취용 드레인 밸브(drain valve)가 있다.","연료계기는 파운드 또는 갤런으로 표시하나 경량항공기 연료계기는 부정확할 수 있으므로 비행 전 항상 육안으로 연료량 확인.","연료선택 스위치: LEFT, RIGHT, BOTH, OFF — 한쪽만 사용 시 좌우 무게불균형, 완전 소모 후 연료라인 공기 유입으로 베이퍼락 가능.","빗속·구름 속 비행 시 습기 유입, 비행 후 탱크를 가득 채우지 않으면 빈 공간 공기가 냉각되어 물이 생겨 탱크 가장 낮은 곳에 모임 → 마지막 비행 후 연료를 가득 채운다.","외부점검 시 반드시 연료드레인(Fuel drain)을 실시하고 수분 발견 시 제거 후 비행."]},{"title":"3.9 오일시스템","page":201,"points":["오일 압력계기는 오일 시스템 정상 작동 여부를 직접 지시하며 항상 정상범위(green arc) 내에 있어야 한다.","오일 온도계기는 압력계기와 달리 시동 후 천천히 지시한다.","오일 온도가 높으면: 오일 라인 막힘, 오일 냉각기 고장, 오일 양 감소, 온도계기 고장 의심.","오일 온도가 정상보다 낮으면 특히 추운 날씨에 부적절한 점성의 오일이 급유되었음을 의미.","오일 온도와 압력이 동시에 높게 지시되면 매우 비정상 → POH에 따라 즉시 조치.","오일 양은 오일 필러캡의 점검막대(dipstick)로 확인, POH 명시량보다 적으면 보충, 최저치보다 적으면 비행 중단."]},{"title":"3.10 경량항공기 계기(Instruments)","page":202,"points":["필수 비행계기: 속도계, 고도계, 나침반 / 무선설비: ATC 교신용 VHF 또는 UHF 무선전화 송·수신기, 트랜스폰더(Mode 3/A 및 Mode C).","동정압계기: 고도계·승강계는 정압공(Static port)의 정압 이용, 속도계는 피토튜브 전압과 정압공 정압 이용.","기압고도계: 아네로이드(국제표준대기 기압으로 채워진 주름진 청동 Aneroid Wafers)의 수축·팽창으로 지시; Altimeter Setting 범위 28.00~31.00inHg(948~1,050hPa).","고도계 오차: 기계적 오차(QNH 세팅 시 비행장 표고와 차이), 외기온도 오차, 비표준 기압 오차.","추운 곳은 진고도 < 지시고도(지면충돌 위험), 더운 곳은 진고도 > 지시고도; 고기압→저기압 비행 시 재세팅하지 않으면 진고도 < 지시고도.","예: QNH 29.92inHg에서 5,000ft 비행 중 28.36inHg 지역으로 재세팅 없이 진입 시 지시는 5,000ft지만 진고도 3,500ft(약 1,500ft 차이).","승강계(VSI): 다이아프램과 Calibrated leak으로 경향(Trend)과 율(Rate) 지시, Calibrated leak 압력변화가 느려 지시가 조금 늦다.","속도계: 피토 전압(동압+정압)과 정압의 차이로 다이아프램이 팽창/수축; 같은 고도에서 속도 증가 시 동압은 증가, 정압은 일정."]},{"title":"3.10.3.3 고도의 종류","page":205,"points":["진고도(True Altitude): 지역 평균해수면 기압(관제탑 제공)을 세팅했을 때 MSL로부터의 높이, 항공지도 고도는 모두 진고도, 전이고도(우리나라 14,000ft) 이하에서 사용(QNH 방법).","기압고도(Pressure Altitude): 29.92inHg(1013.2hPa) 세팅 시 지시 고도, 우리나라 전이고도(FL140) 이상에서 사용(QNE 방법).","절대고도(Absolute Altitude): 지표면·장애물로부터 항공기까지 높이(QFE 방법), Radio 고도계로 일반적으로 지면으로부터 5,000ft까지 감지.","밀도고도(Density Altitude): 기압고도에서 비표준 온도를 수정한 고도, 이착륙 거리·상승성능 계산에 사용.","인코딩 고도(Encoding Altitude): 트랜스폰더 Mode C로 전송되어 지상 2차 감시레이더(SSR)가 관제사에게 고도를 지시."]},{"title":"3.10.5.2 속도의 종류","page":207,"points":["지시속도(IAS): 계기에 나타나는 속도, 공기밀도·설치오차·계기오차 미수정, 성능 결정·이착륙에 사용, 실속속도 산출 기준.","수정속도(CAS): IAS에 설치오차, 계기 자체 오차를 수정한 속도.","등가대기속도(EAS): CAS에서 피토튜브 공기압축 오차를 수정한 속도; 고도 10,000ft·200knots 이하에서는 압축오차 고려 안 함.","진대기속도(TAS): 기압고도·온도를 수정한 실제 속도, 1,000ft당 지시속도의 약 2%씩 증가.","대지속도(GS): 바람을 고려한 지면 이동 속도로 항법에 사용, 정풍에서 감소·배풍에서 증가."]},{"title":"3.10.6~3.10.9 동정압계통 막힘, 시동 후 점검, 속도·엔진 제한 표시","page":208,"points":["Pitot tube 막힘: 속도계 0 지시, 고도계·승강계 정상.","Static port 막힘: 속도계 상승 시 낮게·강하 시 높게 지시, 고도계·승강계 움직임 없음.","매 비행 후 피토튜브덮개를 씌우고 비행 전 반드시 제거; 착빙 의심 시 피토히터 작동.","정압공 막힘 시 대체정압(alternate static air) 사용 — 비여압 항공기는 벤투리 효과로 조종석 기압이 외부보다 낮다.","시동 후 점검: 고도계는 현재 QNH 세팅 시 비행장 표고와 75ft 이상 차이 나면 계기비행용 사용 불가; 속도계 정지 시 0knots; 승강계 0fpm(아니면 왼쪽 아래 나사로 조정 또는 현재 값을 0으로 간주).","속도계 색: Red line=VNE(절대 초과 금지), Yellow arc=VNO~VNE 주의구간(안정 기류에서만), Green arc=VS1~VNO 정상범위, White arc=VS0~VFE 플랩 사용범위.","엔진계기 색: Green arc 정상작동, Yellow arc 주의, Red line 최대 운용범위(초과 금지)."]},{"title":"3.11 경량항공기용 낙하산","page":209,"points":["낙하산 강도는 극한하중 조건 시험에서 에너지 방정식에 1.5의 안전계수(극한하중계수)를 적용한다.","낙하산 장착은 '낙하산 장착 매뉴얼(PIM: Parachute Installation Manual)'에 적합하게 작업해야 한다.","경량항공기용 낙하산은 사출형 BRS(ballistic parachute system)이다.","안전사고 예방을 위해 동체 외부 사출지점 근처에 잘 보이게 플래카드 또는 라벨을 부착한다."]}],"memorize":[{"k":"공랭식 / 수냉식 대표 엔진","v":"공랭식 Jabiru사, 수냉식 Rotax사","page":190},{"k":"2행정 / 4행정 1사이클","v":"2행정 크랭크축 1회전(360°), 4행정 2회전(720°)","page":191},{"k":"디젤 / 가솔린 연료 특성","v":"디젤: 고 세탄가(경유), 가솔린: 고 옥탄가","page":191},{"k":"2행정 가솔린엔진 3종 포트","v":"흡기구(기화기↔크랭크실), 배기구(연소실↔배기구), 소기구(크랭크실↔연소실)","page":192},{"k":"가솔린엔진 압축비·압축온도","v":"약 7~12:1, 약 400~500℃","page":193},{"k":"디젤엔진 압축비·압축온도","v":"약 16~24:1, 약 700~900℃","page":194},{"k":"동력을 발생시키는 유일한 행정","v":"팽창행정(나머지 3행정은 플라이휠 관성)","page":193},{"k":"점화플러그 전극 간극","v":"보통 0.7~1.1mm, 간극 커지면 필요 점화전압 상승","page":194},{"k":"기화기 착빙 발생 조건","v":"흡입공기 70℉(21℃) 이하, 상대습도 80% 이상","page":196},{"k":"기화기 가열장치 작동 시 출력 감소","v":"경우에 따라 최대 15%까지 감소, 혼합비 줄여야 함","page":197},{"k":"연소 가능 혼합비(공기:연료 무게비)","v":"8:1 ~ 20:1","page":198},{"k":"고도에 따른 대기압 감소","v":"1,000ft당 약 1inHg (5,000ft에서 24.92inHg, 공기밀도 약 15% 감소)","page":198},{"k":"혼합비 조절 가장 정확한 계기","v":"배기가스 온도계(EGT Indicator)","page":198},{"k":"점화스위치 위치","v":"L, R, BOTH, START (START 시 좌측 마그네토만 작동)","page":199},{"k":"연료선택 스위치 위치","v":"LEFT, RIGHT, BOTH, OFF","page":200},{"k":"필수 비행계기","v":"속도계, 고도계, 나침반","page":202},{"k":"고도계 Altimeter Setting 범위","v":"28.00~31.00inHg (948~1,050hPa)","page":203},{"k":"우리나라 전이고도","v":"14,000ft(FL140) — 이하 QNH, 이상 QNE(29.92inHg/1013.2hPa)","page":205},{"k":"QNH / QNE / QFE","v":"QNH=진고도, QNE=기압고도, QFE=절대고도","page":205},{"k":"Radio 고도계 감지 범위","v":"일반적으로 지면으로부터 5,000ft까지","page":205},{"k":"TAS 증가율","v":"1,000ft당 지시속도의 약 2%","page":207},{"k":"압축오차 무시 조건(EAS)","v":"고도 10,000ft, 속도 200knots 이하","page":207},{"k":"Static port 막힘 시 계기","v":"속도계 상승 시 낮게·강하 시 높게, 고도계·승강계 움직임 없음","page":208},{"k":"고도계 시동 후 점검 기준","v":"비행장 표고와 75ft 이상 차이 시 계기비행용 사용 불가","page":208},{"k":"속도계 Red line / Yellow arc","v":"Red line=VNE, Yellow arc=VNO~VNE 주의구간","page":209},{"k":"속도계 Green arc / White arc","v":"Green=VS1~VNO 정상, White=VS0~VFE 플랩 사용범위","page":209},{"k":"낙하산 안전계수","v":"1.5 (극한하중계수), 장착은 PIM 준수, BRS 사출형","page":209}],"quiz":[{"q":"경량항공기 엔진의 냉각방식에 대한 설명으로 옳지 않은 것은?","o":["공랭식은 정비가 쉽고 제작비가 저렴하다","수냉식은 구조가 복잡하고 무게가 증가하지만 냉각 효율이 좋다","Rotax사 엔진은 대표적인 공랭식 엔진이다","Jabiru사 엔진은 공랭식에 해당한다"],"a":2,"e":"교재는 Rotax사 엔진을 수냉식, Jabiru사 엔진을 공랭식의 예로 든다.","page":190},{"q":"4행정 엔진이 1사이클을 완성하는 동안 크랭크축의 회전수는?","o":["1회전(360°)","2회전(720°)","3회전(1,080°)","4회전(1,440°)"],"a":1,"e":"4행정 엔진은 크랭크축이 2회전(720°)하는 동안 흡입·압축·팽창·배기의 1사이클을 완성한다.","page":191},{"q":"디젤엔진에 사용되는 연료의 특성으로 옳은 것은?","o":["고 세탄가 연료","고 옥탄가 연료","인화점이 낮고 자기착화성이 낮은 연료","저 세탄가 가솔린"],"a":0,"e":"디젤엔진은 자기착화성이 높은, 즉 세탄가가 높은 경유를 사용한다.","page":191},{"q":"4행정 엔진의 행정 중 동력을 발생시키는 유일한 행정은?","o":["흡입행정","압축행정","배기행정","팽창행정"],"a":3,"e":"팽창행정이 유일한 동력행정이며, 나머지 3개 행정은 플라이휠의 관성으로 수행된다.","page":193},{"q":"4행정 디젤엔진의 압축행정에 대한 설명으로 옳은 것은?","o":["압축비 약 16~24:1, 압축온도 약 700~900℃","압축비 약 7~12:1, 압축온도 약 400~500℃","압축비 약 8~20:1, 압축온도 약 200~300℃","압축비 약 30~40:1, 압축온도 약 1,000℃ 이상"],"a":0,"e":"디젤 압축행정의 압축비는 약 16~24:1, 압축온도 약 700~900℃이다(7~12:1, 400~500℃는 가솔린).","page":194},{"q":"점화플러그에 관한 설명으로 옳지 않은 것은?","o":["전극 간극은 보통 0.7~1.1mm이다","간극이 커지면 필요 점화전압이 낮아진다","손으로 끝까지 조인 후 제작사 토오크 값으로 토큐렌치를 사용해 조인다","장/탈착 작업은 엔진 온도가 식은 다음에 실시한다"],"a":1,"e":"점화플러그 간극이 커지면 필요 점화전압은 상승한다.","page":195},{"q":"기화기 착빙이 잘 발생하는 조건으로 교재에 제시된 것은?","o":["외기 0℃ 이하, 상대습도 50% 이상","외기 32℉ 이하, 상대습도 100%","흡입공기 15℃ 이상, 상대습도 60% 이하","흡입공기 70℉(21℃) 이하, 상대습도 80% 이상"],"a":3,"e":"기화기 착빙은 들어오는 공기 온도가 70℉(21℃) 이하이고 상대습도 80% 이상일 때 잘 발생한다.","page":196},{"q":"착빙이 예상되는 지역에서 강하할 때 기화기 가열장치를 장착한 항공기의 올바른 조작 순서는?","o":["엔진 출력을 먼저 줄인 후 기화기 가열장치를 작동한다","기화기 가열장치를 먼저 작동시킨 다음 엔진 출력을 줄인다","혼합비를 최대 Rich로 한 뒤 가열장치는 사용하지 않는다","착빙 증상이 나타난 뒤에만 가열장치를 작동한다"],"a":1,"e":"착빙이 예상되는 지역에서 강하 시 기화기 가열장치를 우선 작동시킨 다음 엔진 출력을 줄여야 한다.","page":197},{"q":"직접분사식(Fuel injection) 흡기장치의 단점으로 옳은 것은?","o":["착빙 현상이 자주 발생한다","스로틀 조작에 반응이 느리다","혹한기 시동이 어렵다","더운 날씨에 베이퍼 락으로 시동이 어렵다"],"a":3,"e":"직접분사식의 단점은 엔진 가열 상태 시동 곤란, 더운 날 베이퍼 락, 엔진 정지 시 재시동 곤란이다.","page":197},{"q":"혼합비 조절에 관한 설명으로 옳지 않은 것은?","o":["고도가 증가하면 혼합비 조절레버로 연료량을 줄여야 한다","배기가스 온도계(EGT)를 이용하는 것이 가장 정확하고 보편적이다","혼합비가 Lean하면 과열로 이상폭발(Detonation)이 발생할 수 있다","혼합비를 먼저 조절한 다음 스로틀로 원하는 출력에 맞춘다"],"a":3,"e":"혼합비 조절은 먼저 스로틀로 원하는 출력에 맞춘 다음에 실시한다.","page":198},{"q":"대기압은 고도 1,000ft 증가마다 약 얼마씩 감소하는가?","o":["약 1inHg","약 0.1inHg","약 2inHg","약 10hPa당 100ft"],"a":0,"e":"대기압은 1,000ft마다 약 1inHg씩 감소하며 5,000ft에서는 24.92inHg로 공기밀도가 약 15% 감소한다.","page":198},{"q":"점화계통(마그네토)에 대한 설명으로 옳은 것은?","o":["마그네토는 항공기 배터리 전원으로 작동한다","START 위치에서는 양쪽 마그네토가 모두 작동한다","마그네토 점검 시 RPM이 감소하지 않으면 정상이다","항공기 전기계통과 독립된 장치로 2개의 마그네토로 구성된다"],"a":3,"e":"마그네토는 전기시스템과 별도로 작동하는 독립 장치이며 신뢰성을 위해 2개로 구성된다. START 시 좌측만 작동하고, RPM 무감소는 비정상이다.","page":199},{"q":"점화스위치를 OFF에 두었는데도 프로펠러를 돌리면 시동이 걸릴 수 있는 원인은?","o":["배터리 마스터 스위치가 켜져 있을 때","접지선(Ground wire)이 절단되거나 파손되었을 때","솔레노이드가 충전되어 있을 때","연료선택 스위치가 BOTH에 있을 때"],"a":1,"e":"점화스위치 OFF는 접지선으로 마그네토 전류를 차단하므로, 접지선이 절단·파손되면 마그네토에 전류가 흘러 예기치 않게 시동될 수 있다.","page":200},{"q":"연료계통에 관한 설명으로 옳지 않은 것은?","o":["더운 여름철 벤트관으로 연료가 흘러나오는 것은 정상이다","경량항공기 연료계기는 정확하므로 육안 확인은 생략할 수 있다","마지막 비행 후에는 연료탱크를 가득 채워 수분 생성을 방지한다","한쪽 탱크만 사용하면 좌우 날개 무게불균형이 생길 수 있다"],"a":1,"e":"경량항공기 연료계기는 부정확할 수 있으므로 비행 전 항상 육안으로 연료량을 확인해야 한다.","page":200},{"q":"추운 날씨에 오일 온도가 정상보다 낮게 지시될 때 의심할 수 있는 것은?","o":["오일 냉각기 고장","오일 라인 막힘","부적절한 점성의 오일 급유","오일 양 감소"],"a":2,"e":"오일 온도가 정상보다 낮으면 특히 추운 날씨에 부적절한 점성의 오일이 급유되었음을 알 수 있다. 나머지는 온도가 높을 때의 원인이다.","page":201},{"q":"QNH 29.92inHg 지역에서 5,000ft로 비행하던 항공기가 고도계 재세팅 없이 28.36inHg 저기압 지역으로 진입했을 때 진고도는?","o":["약 6,500ft","약 5,000ft","약 4,500ft","약 3,500ft"],"a":3,"e":"고도계는 계속 5,000ft를 지시하지만 기압차 약 1,500ft만큼 낮은 약 3,500ft를 비행하게 된다.","page":204},{"q":"표준대기보다 기온이 낮은 지역을 비행할 때 고도계 지시에 대한 설명으로 옳은 것은?","o":["진고도가 지시고도보다 낮아 지면 충돌 위험이 있다","진고도가 지시고도보다 높다","진고도와 지시고도가 항상 같다","기온은 고도계 지시에 영향을 주지 않는다"],"a":0,"e":"온도가 낮은 지역에서는 진고도<지시고도가 되어 지면 충돌 위험이 존재한다.","page":204},{"q":"우리나라 전이고도(FL140) 이상에서 고도계에 29.92inHg(1013.2hPa)를 세팅하여 지시되는 고도는?","o":["진고도(QNH)","기압고도(QNE)","절대고도(QFE)","밀도고도"],"a":1,"e":"29.92inHg를 세팅했을 때 지시되는 고도는 기압고도이며 QNE 방법이다.","page":205},{"q":"속도의 종류에 대한 설명으로 옳지 않은 것은?","o":["IAS는 실속속도 산출의 기준이 된다","CAS는 IAS에 설치오차와 계기 자체 오차를 수정한 속도이다","TAS는 대략 1,000ft당 지시속도의 약 2%씩 증가한다","대지속도는 정풍에서 증가하고 배풍에서 감소한다"],"a":3,"e":"대지속도는 정풍에서 감소하고 배풍에서 증가한다.","page":207},{"q":"비행 중 정압공(Static port)이 막혔을 때 계기 지시로 옳은 것은?","o":["속도계 0 지시, 고도계·승강계 정상","속도계 상승 시 낮게·강하 시 높게 지시, 고도계·승강계 움직임 없음","속도계 정상, 고도계 높게 지시","모든 계기 정상 지시"],"a":1,"e":"표 3-2에 따르면 Static port 막힘 시 속도계는 상승 시 낮게·강하 시 높게, 고도계와 승강계는 움직임이 없다.","page":208},{"q":"엔진 시동 후 지상에서 현재 QNH를 세팅한 고도계가 비행장 표고와 몇 ft 이상 차이 나면 계기비행용으로 사용할 수 없는가?","o":["25ft","50ft","75ft","100ft"],"a":2,"e":"비행장 표고와 75ft 이상 차이가 발생하면 그 고도계는 계기비행용으로 사용할 수 없다.","page":208},{"q":"속도계의 Yellow arc가 나타내는 범위는?","o":["VS0~VFE의 플랩 사용범위","VS1~VNO의 정상 작동범위","VNO~VNE의 주의구간","VNE 이상의 금지구간"],"a":2,"e":"Yellow arc는 VNO부터 VNE까지의 주의구간으로 안정된 기류에서만 비행할 수 있다.","page":209},{"q":"경량항공기용 낙하산 강도 시험 시 에너지 방정식에 적용하는 안전계수(극한하중계수)는?","o":["1.5","1.25","2.0","3.8"],"a":0,"e":"낙하산 강도는 극한하중 조건 시험에서 에너지 방정식에 1.5의 안전계수를 적용한다.","page":209}]},{"id":"theory-4","title":"제4장 경량항공기 무게중심과 균형","pages":[211,216],"goal":"무게가 비행성능에 미치는 영향과 무게중심 위치가 안정성에 미치는 영향을 이해하고, Arm·Moment를 이용해 무게중심을 계산할 수 있어야 한다.","summary":"항공기 무게가 증가하면 필요한 양력을 위해 속도·받음각이 증가하고 항력도 늘어 이착륙 거리 증가, 상승성능·순항속도 감소 등 성능이 저하된다. 세로 안정성을 결정하는 것은 무게중심(CG)의 위치이며 POH에 정한 CG 범위 내에서 운용해야 한다. 무게중심은 총 모멘트(무게×Arm)를 총 무게로 나눈 값이며, 기준선 뒤는 (+), 앞은 (-)로 표시한다. 체중이동형·동력패러슈트 등 매달려 비행하는 항공기는 CG 계산이 불필요하나 최대이륙중량은 준수해야 한다.","sections":[{"title":"4.1 비행성능에 영향을 미치는 경량항공기의 무게","page":211,"points":["일정 고도·속도 유지 시 무게가 증가하면 양력도 증가해야 하므로 속도와 받음각을 증가시켜야 한다.","속도·받음각 증가로 양력과 함께 항력도 증가하여 항공기 성능이 감소한다.","무게 증가 시 이착륙 속도 증가 → 이착륙 거리 증가, 상승성능(Climb Angle and Rate)·순항속도 감소, 착륙장치에 큰 하중.","POH에 명시된 최대이륙중량보다 적은 상태에서 운영해야 한다."]},{"title":"4.2 경량항공기 무게중심과 안정성","page":211,"points":["세로 안정성(Longitudinal stability)을 결정하는 것은 무게중심(CG)의 위치이며, CG는 화물의 무게와 위치에 따라 변한다.","세로 안정성이 부족하면 특히 실속회복이 잘 안 되고 이착륙 성능에 나쁜 영향을 준다.","CG가 설계 중심보다 뒤에 있으면 앞쪽이 가벼워지고, 앞에 있으면 앞쪽이 무거워져 조종이 어려워진다.","제작자는 POH에 CG 범위를 정하고, 조종사는 반드시 이 범위 내에서 운용해야 한다.","가로 무게중심은 일반적으로 잘 계산하지 않으나 자이로플레인과 경량헬리콥터에서는 중요한 요소이다.","좌우 날개 탱크 연료량 차이나 한쪽 탱크만 소모 시 가로 균형이 깨질 수 있다; 가로 CG는 로터 회전축 기준 왼쪽(-), 오른쪽(+)으로 계산."]},{"title":"4.3 경량항공기 무게중심의 계산","page":212,"points":["Arm: 기준선(Datum)으로부터 화물 위치까지 inch로 측정한 수평거리, 기준선 뒤 (+), 앞 (-).","Datum: 무게중심이나 Arm의 위치를 측정하는 가상의 기준선; CG: 무게가 균형을 이루는 지점(기준선으로부터 inch).","Moment = 무게 × 기준선으로부터의 거리(Arm), 단위 pound inch(in-lb).","Standard weights: Gasoline(AV gas) 6lb/US gal, Oil 7.5lb/US gal(1.875lb/1Quart), Water 8.35lb/US gal.","총중량은 인가된 최대이륙중량을 초과하면 안 되며, 초과 시 화물·연료 등을 감소시킨다.","CG 위치가 POH 허용범위를 벗어나면 승객·화물 탑재 위치를 변경하고 다시 계산한다.","무게중심 = 총 Moment ÷ 총 무게 (예: 총 모멘트 44,000 ÷ 총 무게 400lb = 110inch).","균형의 원리: 받침점 왼쪽 100lb×(-50)=-5,000in-lb, 오른쪽 200lb×25=+5,000in-lb → 총 모멘트 0으로 균형."]},{"title":"4.3.4~4.3.7 무게중심점 찾기, 화물 이동, Graph 이용, CG 계산 불필요 항공기","page":214,"points":["CG 구하는 순서: ① 기준선으로부터 각 물체까지 거리 → ② 거리×무게로 모멘트 → ③ 모멘트를 더해 총 모멘트 → ④ 총 모멘트÷총 무게.","화물 위치가 변하면 Arm이 변해 모멘트가 달라지고, 무게가 일정해도 CG 위치가 변한다 → 새 CG가 허용범위 내인지 확인.","화물 이동 예: A 100lb(-50in)=-5,000, C 200lb(+50in)=+10,000일 때 균형을 위해 B 200lb의 모멘트가 -5,000이어야 하므로 B를 -25inch 지점에 둔다.","Graph 방법: Item별 무게 Graph에서 모멘트를 구하고, CG Range chart에서 총 무게와 총 모멘트의 교차점이 허용범위 내에 있어야 한다.","매달려 비행하는 항공기(기구류, 패러글라이더, 행글라이더, 체중이동형, 동력패러슈트, 비행선)는 CG 위치가 큰 의미가 없고 CG 한계를 초과하기 어렵다.","체중이동형은 후방 시트·연료가 hang point와 매우 가까워 하중 변화가 CG에 거의 영향이 없다.","CG 제한이 없는 항공기도 과적에 의한 구조적 손상 때문에 제작사 최대이륙중량을 준수해야 한다."]}],"memorize":[{"k":"무게 증가 시 성능 변화","v":"이착륙 속도·거리 증가, 상승성능·순항속도 감소, 착륙장치 하중 증가","page":211},{"k":"세로 안정성 결정 요소","v":"무게중심(CG)의 위치","page":211},{"k":"CG가 설계 중심보다 뒤 / 앞","v":"뒤: 앞쪽이 가벼워짐, 앞: 앞쪽이 무거워짐 — 모두 조종 곤란","page":211},{"k":"가로 CG가 중요한 항공기","v":"자이로플레인, 경량헬리콥터","page":212},{"k":"가로 CG 부호","v":"로터 회전축 기준 왼쪽(-), 오른쪽(+)","page":212},{"k":"Arm 부호","v":"기준선 뒤 (+), 앞 (-), 단위 inch","page":212},{"k":"Datum","v":"무게중심·Arm 위치를 측정하는 가상의 기준선","page":212},{"k":"Moment","v":"무게 × Arm, 단위 pound inch(in-lb)","page":212},{"k":"Standard weight — Gasoline(AV gas)","v":"6lb/US gal","page":212},{"k":"Standard weight — Oil","v":"7.5lb/US gal (1.875lb/1Quart, 1Quart=1/4gal)","page":212},{"k":"Standard weight — Water","v":"8.35lb/US gal","page":212},{"k":"무게중심(CG) 공식","v":"CG = 총 Moment ÷ 총 무게","page":213},{"k":"총중량 초과 시 조치","v":"화물·연료 등을 감소시켜 최대이륙중량 이내 유지","page":213},{"k":"CG 범위 이탈 시 조치","v":"승객·화물 탑재 위치 변경 후 재계산","page":213},{"k":"균형 조건","v":"모든 모멘트의 합이 0 (예: 100×(-50)=-5,000, 200×25=+5,000)","page":213},{"k":"표 4-2 계산 예","v":"100lb@50 + 100lb@90 + 200lb@150 → 44,000/400 = 110inch","page":214},{"k":"CG 계산이 불필요한 항공기","v":"기구류, 패러글라이더, 행글라이더, 체중이동형, 동력패러슈트, 비행선(매달려 비행)","page":216},{"k":"CG 계산 불필요 항공기의 준수사항","v":"과적 구조 손상 방지 위해 최대이륙중량 준수","page":216}],"quiz":[{"q":"항공기 무게가 증가할 때 나타나는 현상으로 옳지 않은 것은?","o":["이착륙 거리가 길어진다","상승성능이 감소한다","순항속도가 증가한다","착륙장치에 큰 하중이 걸린다"],"a":2,"e":"무게가 증가하면 순항속도는 감소한다. 이착륙 거리 증가, 상승성능 감소, 착륙장치 하중 증가가 나타난다.","page":211},{"q":"일정한 고도와 속도를 유지하는 항공기의 무게가 증가하면 필요한 조치는?","o":["양력을 증가시키기 위해 속도와 받음각을 증가시킨다","받음각을 감소시킨다","양력을 감소시킨다","아무런 조치가 필요 없다"],"a":0,"e":"무게가 증가하면 양력도 증가해야 하므로 속도와 받음각을 증가시켜야 하며, 이에 따라 항력도 증가한다.","page":211},{"q":"비행기의 세로 안정성(Longitudinal stability)을 결정하는 것은?","o":["엔진 출력","날개 면적","무게중심(CG)의 위치","프로펠러 피치"],"a":2,"e":"교재는 비행기의 세로 안정성을 결정하는 것이 항공기 무게중심(CG)의 위치라고 설명한다.","page":211},{"q":"가로 무게중심(Lateral CG)이 특히 중요한 요소로 작용하는 경량항공기는?","o":["타면조종형비행기와 체중이동형비행기","동력패러슈트와 행글라이더","기구류와 비행선","자이로플레인과 경량헬리콥터"],"a":3,"e":"가로 CG는 일반적으로 잘 계산하지 않으나 자이로플레인과 경량헬리콥터에서는 중요한 요소로 작용한다.","page":212},{"q":"무게중심 계산 용어 중 Arm에 대한 설명으로 옳은 것은?","o":["기준선으로부터 화물 위치까지의 수평거리로 기준선 뒤는 (+), 앞은 (-)이다","기준선으로부터 화물 위치까지의 수직거리이다","기준선 앞은 (+), 뒤는 (-)로 표시한다","무게와 거리를 곱한 값이다"],"a":0,"e":"Arm은 기준선(Datum)으로부터 화물까지 inch로 측정한 수평거리로, 뒤에 있으면 (+), 앞에 있으면 (-)이다.","page":212},{"q":"무게중심 계산에 사용하는 Standard weights 중 Gasoline(AV gas)의 값은?","o":["7.5lb/US gal","6lb/US gal","8.35lb/US gal","1.875lb/US gal"],"a":1,"e":"표 4-1에서 Gasoline은 6lb/US gal, Oil은 7.5lb/US gal, Water는 8.35lb/US gal이다.","page":212},{"q":"모멘트(Moment)에 대한 설명으로 옳은 것은?","o":["무게를 거리로 나눈 값이다","단위는 pound/inch이다","기준선으로부터의 거리와 물체의 무게를 곱한 값이다","물체의 무게만으로 결정된다"],"a":2,"e":"모멘트는 기준선으로부터 물체까지의 길이와 무게를 곱한 것으로 pound inch로 표시하며, 무게뿐 아니라 분포상태에 따라 정해진다.","page":213},{"q":"무게중심 위치가 POH에 명시된 허용범위를 벗어난 경우 조종사의 조치로 옳은 것은?","o":["연료를 추가 주입한다","속도를 높여 비행한다","그대로 비행하되 착륙 시 주의한다","승객 또는 화물의 탑재 위치를 변경하고 다시 계산한다"],"a":3,"e":"CG가 허용범위를 벗어나면 승객 또는 화물의 탑재 위치를 변경하고 재계산하여 범위 내인지 확인해야 한다.","page":213},{"q":"기준선으로부터 50inch에 100lb, 90inch에 100lb, 150inch에 200lb가 있을 때 무게중심의 위치는?","o":["90inch","110inch","100inch","120inch"],"a":1,"e":"총 모멘트 5,000+9,000+30,000=44,000, 총 무게 400lb이므로 CG=44,000÷400=110inch이다.","page":214},{"q":"받침점 왼쪽 50inch에 100lb의 물체가 있을 때, 200lb의 물체로 평형을 이루려면 받침점 오른쪽 몇 inch에 놓아야 하는가?","o":["25inch","50inch","75inch","100inch"],"a":0,"e":"100×(-50)=-5,000in-lb이므로 200×25=+5,000in-lb가 되어 총 모멘트 합이 0으로 균형을 이룬다.","page":213},{"q":"A 100lb(-50in), C 200lb(+50in)가 있을 때 200lb인 화물 B를 어디에 두어야 총 모멘트가 0이 되는가?","o":["+25inch","-50inch","+50inch","-25inch"],"a":3,"e":"A=-5,000, C=+10,000이므로 B의 모멘트가 -5,000이어야 하고 200×(-25)=-5,000이므로 -25inch이다.","page":215},{"q":"Graph를 이용한 무게중심 계산에서 CG Range chart로 확인하는 것은?","o":["Item별 무게와 연료량의 교차점","총 무게와 총 모멘트를 연결하여 만나는 점이 허용범위 내인지","기준선과 받침점 사이 거리","최대 순항속도"],"a":1,"e":"CG Range chart에서 총 무게와 총 모멘트를 연결해 만나는 점이 허용범위 내에 있어야 한다.","page":215},{"q":"무게중심(CG) 위치 계산이 불필요한 항공기에 대한 설명으로 옳지 않은 것은?","o":["체중이동형비행기, 동력패러슈트 등 매달려 비행하는 항공기가 해당된다","체중이동형은 후방 시트·연료가 hang point와 가까워 하중 변화가 CG에 거의 영향이 없다","CG 제한이 없으므로 최대이륙중량도 준수할 필요가 없다","기구류·비행선처럼 부력으로 비행하는 항공기도 마찬가지이다"],"a":2,"e":"CG 제한은 없으나 과적으로 인한 구조적 손상 때문에 제작사가 제시한 최대이륙중량을 준수해야 한다.","page":216}]},{"id":"theory-5","title":"제5장 항공의학적 요소(Aeromedical Factor)","pages":[217,232],"goal":"비행 중 조종사에게 생리적 스트레스를 주는 신체적 요소(저산소증·감압병·약물 등)와 비행착각·착시의 원인과 대처법을 이해한다.","summary":"공중 환경의 기압 변화, 저산소증, 가감속, 기온 변화 등은 조종사에게 생리적 스트레스를 주어 비행 능력에 영향을 미친다. 저산소증은 원인에 따라 저산소성·빈혈성·허혈성·조직독성 4가지로 나뉘며, 10,000ft 이상에서는 증상이 현저해지므로 8,000ft 이하로 강하하거나 산소를 공급해야 한다. 과호흡, 중이·부비동 문제, 일산화탄소 중독, 피로, 탈수, 감압병, 알코올·약물도 비행 안전을 위협한다. 인체는 전정계·체성감각계·시각계로 자세를 판단하는데, 시각 참조점이 없으면 전정계 착각과 착시에 빠지므로 신체 감각보다 계기를 신뢰해야 한다.","sections":[{"title":"5.1.1 저산소증(Hypoxia)","page":217,"points":["저산소증: 체내 산소가 부족한 상태, 가장 중요한 문제는 뇌의 산소공급 부족 — 뇌는 산소 소모가 가장 많아 저산소증에 가장 취약","원인별 4분류: 저산소성(Hypoxic)·빈혈성(Hypemic)·허혈성(Stagnant)·조직독성(Histotoxic)","저산소성: 정상 몸 상태이나 흡입 공기 중 산소 부족 — 고고도 공기 희박에 따른 산소분압 감소가 주원인, 10,000ft(MSL)에서는 지상의 약 절반 산소분압 → 그 이상은 추가 산소공급 필요","빈혈성: 적혈구 부족(대표: 빈혈), 지상에서는 증상 없으나 고도상승 시 영향 현저 / 일산화탄소 중독도 해당","허혈성(정체성): 혈액이 잘 흐르지 않아 발생 — 과도한 G에 의한 혈류 정체 → 시야 감소 → 의식상실(LOC)","조직독성: 운반된 산소를 알코올·마약류 등 약물로 조직이 이용하지 못해 발생","증상: 청색증(손톱·입술 파래짐), 반응시간 지연, 판단력 저하, 행복감(Euphoria), 시각장애, 졸림, 어지러움, 두통, 손발 저림, 무감각","10,000ft 이상에서 증상 현저 → 신속히 8,000ft 이하로 강하하거나 산소 공급 / 초기 증상 거의 없어 조기 인지 훈련이 중요"]},{"title":"5.1.1.6 고도에 따른 생리적 현상 [표 5-1]","page":219,"points":["8,000ft(2,450m): 혈중 산소포화도 93%, 고통 없음 / 8,000ft 이하로 하강하면 보상작용으로 회복 / 제트여객기 객실여압 최대 고도 8,000ft","10,000ft(3,050m): 산소포화도 89%, 계산능력 저하·야간시력 현저히 감퇴","12,000ft(3,650m): 산소포화도 87%, 단기기억력·뇌기능 장애 심화 — 산소마스크 사용해야 함","14,000ft(4,250m): 산소포화도 약 83%, 인지기능·정서적 황폐 등 뇌기능 장애가 모든 사람에게 나타남","15,000ft(4,550m): 산소포화도 약 80%, 모든 사람이 심각한 장애"]},{"title":"5.1.2~5.1.5 과호흡·중이/부비동·멀미·일산화탄소중독","page":219,"points":["과호흡: 과도하게 빠르고 깊은 호흡으로 CO2가 과도하게 배출 → 산-염기 균형 붕괴, 호흡수 정상화 시 대부분 바로 회복","과호흡 증상: 시각장애, 의식상실, 어지러움, 손발 저림, 차고 뜨거운 감각 이상, 근육강직","중이 압력은 이관(유스타키오관)으로 평형 — 막히면 침 삼키기·하품, 심하면 코와 입을 막고 강제로 숨을 내쉬는 발살바(Valsalva) 법","부비동(사골동·상악동·전두동·접형동) 막힘은 주로 하강 중 통증 → 하강속도 줄이기, 상악동 문제는 치통으로도 나타남 / 감염·알레르기 시 비행하지 않는 것이 최선","멀미: 뇌가 불일치한 신체 위치 신호를 받을 때 발생 — 환기구 열어 신선한 공기, 외부 풍경 응시, 불필요한 머리 움직임 자제","CO는 헤모글로빈 결합능력이 산소의 200배 → 빈혈성 저산소증 / 소형기 히터의 배기구 균열이 원인","CO 중독 증상: 두통, 몽롱함, 시야 흐림, 어지러움, 졸음 → 근육이 풀림 / 인지 시 이미 근육마비로 회피 조작 불가할 수 있음 → 즉시 환기·산소 흡입"]},{"title":"5.1.6~5.1.9 스트레스·피로·탈수·열사병","page":221,"points":["스트레스: 정신·신체 자극에 대한 생체 반응, 적당하면 활력을 주나 한도 초과 시 즉각 반응능력·업무능력 감소","피로는 조종사 실수의 중요한 원인 — 육체적 피로(수면부족·육체노동), 정신적 피로(스트레스·장시간 정신노동)","급성 피로는 적절한 식사·충분한 휴식·수면으로 예방 / 비행 중 급성 피로는 충분한 휴식만이 유일한 해결책","탈수 원인: 덥고 건조한 조종실, 이뇨작용의 커피·차·알코올·카페인 음료 과다 섭취 / 증상: 두통, 피로감, 근육경직, 졸음, 어지러움","탈수 예방: 하루 약 2~4리터 수분 보충, 비행 중 커피·알코올 과다 섭취 자제","열사병: 체온을 적정하게 조절하지 못하는 상태, 증상은 탈수와 비슷 / 갈증 유무와 상관없이 수분을 자주 공급","캐노피·루프 윈도우형 조종실: 밝은 색·통기성 옷, 챙 있는 모자 / 열사병 가능성 높으면 시간당 1리터, 낮으면 그 절반 정도"]},{"title":"5.1.10~5.1.11 감압병(DCS)·스쿠버다이빙 후 비행","page":222,"points":["감압병: 저압 조건에서 혈액·조직에 녹아 있던 질소가 기화해 기포를 형성, 조직에 끼여 폐색 증상","보통 18,000ft 이내에서는 잘 발생하지 않으나 스쿠버다이빙 후에는 훨씬 낮은 고도에서도 발생","기포 생성에 시간이 걸려 상승 후 20~60분 지나 증상 발생","관절 통증은 감압통(bends), 드물게 호흡곤란(choke)·시력장애·허탈","예방: 비행 전 100% 산소를 흡입해 체내 질소 제거","다이빙 후 8,000ft 이내 비행: 비감압 잠수(non-decompression stop)는 최소 12시간, 감압 정지 잠수(decompression stop)는 24시간 이상","다이빙 후 8,000ft 이상 비행: 어떠한 경우라도 24시간 이상"]},{"title":"5.1.12~5.1.13 알코올·약물","page":223,"points":["알코올: 판단력·책임감·신체조정력·추론·기억력 감소, 주의집중시간 단축, 반응시간 증가, 시야 좁아짐","고도상승은 알코올 영향 증가 — 맥주 2잔 후 고고도 비행 = 지상 3~4잔 효과","알코올은 뇌 산소 흡수를 방해해 조직독성 저산소증(histotoxic hypoxia) 유발 / 대표적 중추신경계 억제제","진정제·신경안정제·항히스타민제: 신경계 억제, 저산소증에 취약 → 복용 시 비행하지 않음","아스피린·이부프로펜·아세트아미노펜(타이레놀)은 적정 용량이면 비행 제한하지 않음 / 옥시코돈·메페리딘·코데인 등 마약성 처방약은 비행 업무 시 투여 금지","치과 마취제는 짧은 관찰 후 비행 가능 / 암페타민계는 비행 사용 금지 약물, 카페인·니코틴 등 중추신경 자극제는 장기 사용 자제","허가받지 않은 약물·환각성 약물은 어떠한 경우도 절대 불허 / 멀미약 사용 시 최소 24시간 지난 후 비행 / 부작용 불분명 시 항공 전문의 상담"]},{"title":"5.2.1 비행 감각계","page":225,"points":["비행 착각: 비행기 자세·위치·운동방향에 대해 조종사가 지향점을 잃고 착각에 빠지는 것","인체는 전정계(Vestibular)·체성감각계(Somatosensory)·시각계(Visual) 3가지 정보를 통합해 판단","전정계는 내이에 있으며 3개의 반고리관과 이석기관으로 구성 — 반고리관은 머리 회전 각가속도, 이석기관은 수평·수직 방향 머리운동 감지","반고리관 내부는 림프액과 섬모 — 가속 시 림프액 흐름으로 섬모가 눕혀져 감지","체성감각은 피부·골격근·관절에서 발생, 비행 중 가속도를 지구 중력과 구분할 능력이 없음","수평선이 분명하면 내이 감각이 피치·롤·요를 정확히 느끼나 시각 참조점이 없어지면 전정계 감각은 신뢰할 수 없음"]},{"title":"5.2.2 전정계 착각(Vestibular Illusions)","page":226,"points":["경사착각(lean): 완만한 선회 지속 시 림프 이동이 없어져 수평으로 느끼다가, 선회를 멈추면 반대편으로 경사진 착각 (예: 장시간 좌선회 후 수평 복귀 시 우측으로 쏠린 느낌 → 다시 좌측으로 기울임)","전향성착각(Coriolis): 장시간 안정 선회 중 차트·계기를 보려고 머리를 움직일 때 발생 → 선회 중 머리 움직임 최소화","악성나선강하(graveyard spiral): 정상률 협조선회가 20초 이상 지속되면 선회 감각이 역치 이하로 사라짐 → 고도 상실을 회복하려 조종간을 당기면 나선강하 심화","신체중력 착각(Somatogravic): 이륙 시 급가속 → 기수가 들린 착각 → 기수를 과도하게 낮춤 / 급감속 → 하강 착각 → 기수를 들어 실속 위험","배면감 착각(Inversion): 상승자세에서 수평비행으로 갑자기 전환 시 이석기관 자극 → 뒤로 넘어가거나 배면비행하는 착각","승강타 착각(Elevator): 난류·상승기류의 갑작스러운 수직 가속 → 상승 착각 → 조종간을 밀어 하강자세로 진입 (하강 가속 시 반대)"]},{"title":"5.2.3~5.2.5 시각 착각·공간착각 체험·대처법","page":228,"points":["대표적 시각 착각: 허위수평선(false horizon) — 경사진 구름층을 지평선으로 착각, 야간 별빛·지상 불빛에 의한 왜곡 / 조종실 작업 몰두 후 외부를 볼 때 발생 쉬움","자동운동(autokinesis): 야간에 정지한 불빛을 오래 응시하면 움직이는 것처럼 보임","착각은 논리로 극복하기 어려워 실제 체험으로 감각을 익히는 것이 가장 좋은 방법","체험 기동: 가속 중 상승(수평 가속 → 상승 느낌), 선회 중 상승(약 50도 경사·1.5G 협조선회 → 상승 느낌, 중간에 종료 시 급강하 착각), 좌우 기울기(좌측 skid → 우측으로 기울어지는 착각), 운동 반전감(45도 선회각 → 반대방향 기울어진 착각, 롤·요·피치 모두에서 발생)","착각은 모든 조종사에게 발생하며 완벽한 예방법은 없음 — 훈련으로 조기 인지·억제","저시정(3마일 미만)이나 야간 수면 위 비행 전 계기비행 훈련 / 계기 운용 능력 부족 시 악기상·황혼녘·야간 비행 자제","외부 참조점은 지표면에 고정된 지점 선택, 이륙·선회·접근 중 갑작스러운 머리 움직임 회피, 신체 감각보다 계기를 신뢰"]},{"title":"5.2.6 착시현상(Optical Illusions)","page":230,"points":["착시가 비행안전에 가장 문제가 되는 것은 착륙할 때 / 착시는 치명적 비행사고의 가장 흔한 원인","활주로 폭 착시: 좁은 활주로 → 높다고 착각 → 낮게 접근(구조물 충돌·활주로 미달) / 넓은 활주로 → 낮다고 착각 → 높게 접근, 플레어 높음·overshoot","경사 착시: 오르막(upslope) 활주로 → 높다고 착각 → 낮게 접근 / 내리막(downslope)은 반대","희미한 지형 착시(블랙홀 접근): 수면·캄캄한 밤·눈 덮인 지면 → 높다고 착각 → 낮게 접근","수분 굴절: 방풍창 빗물로 지평선이 낮게 보여 높다고 착각 → 낮게 진입","연무(haze): 더 멀고 높다고 착각 → 낮게 접근 / 매우 청명한 날: 가깝게 느껴져 높게 접근 → 활주로 지나침·복행","안개 진입 시 피치가 들린다는 착각 → 접근각을 갑자기 깊게 하려는 경향","방지법: 낯선 활주로는 구배·길이·주변 지형 사전 숙지, 고도계 자주 확인, 상공 통과하며 풍향계·활주로 상태 확인, 진입각지시등 등 착륙보조장치 적극 활용"]}],"memorize":[{"k":"저산소증 4분류","v":"저산소성(Hypoxic)·빈혈성(Hypemic)·허혈성(Stagnant)·조직독성(Histotoxic)","page":217},{"k":"저산소증에 가장 취약한 조직","v":"뇌(산소 소모가 가장 많음)","page":217},{"k":"10,000ft(MSL) 산소분압","v":"지상의 약 절반 → 그 이상 고도에서 추가 산소공급 필요","page":218},{"k":"저산소증 대응","v":"신속히 8,000ft 이하로 강하 또는 산소 공급장비 사용","page":219},{"k":"8,000ft 산소포화도","v":"93%, 고통 없음 / 제트여객기 객실여압 최대 고도 8,000ft","page":219},{"k":"10,000ft 산소포화도","v":"89%, 계산능력 저하·야간시력 현저히 감퇴","page":219},{"k":"12,000ft 산소포화도","v":"87%, 단기기억력 장애, 산소마스크 사용해야 함","page":219},{"k":"14,000ft / 15,000ft 산소포화도","v":"약 83% / 약 80%","page":219},{"k":"허혈성 저산소증 원인","v":"과도한 G에 의한 혈류 정체 → 시야 감소 → 의식상실(LOC)","page":218},{"k":"조직독성 저산소증 원인","v":"알코올·마약류 등 약물로 조직이 산소를 이용하지 못함","page":218},{"k":"청색증(cyanosis)","v":"손톱 및 입술이 파래짐 — 저산소증 증상","page":218},{"k":"과호흡","v":"과도하게 빠르고 깊은 호흡으로 CO2 과다 배출, 호흡수 정상화로 회복","page":219},{"k":"발살바(Valsalva) 법","v":"코와 입을 막고 강제로 숨을 내쉬어 이관(유스타키오관)을 부풀림","page":220},{"k":"부비동 4종","v":"사골동·상악동·전두동·접형동","page":220},{"k":"CO 헤모글로빈 결합능력","v":"산소의 200배","page":220},{"k":"소형기 CO 유입 경로","v":"엔진 배기구에서 열을 얻는 히터 — 배기구 균열","page":221},{"k":"비행 중 급성 피로 해결책","v":"충분한 휴식만이 유일한 해결책","page":221},{"k":"탈수 예방 수분량","v":"하루 약 2~4리터","page":222},{"k":"열사병 예방 수분량","v":"가능성 높으면 시간당 1리터, 낮으면 그 절반 정도","page":222},{"k":"감압병 발생 고도/시간","v":"보통 18,000ft 이내 드묾 / 상승 후 20~60분 후 증상","page":222},{"k":"감압통 / choke","v":"bends = 관절통, choke = 호흡곤란","page":222},{"k":"감압병 예방","v":"비행 전 100% 산소 흡입으로 질소 제거","page":222},{"k":"다이빙 후 8,000ft 이내 비행","v":"비감압 잠수 최소 12시간, 감압 정지 잠수 24시간 이상","page":223},{"k":"다이빙 후 8,000ft 이상 비행","v":"어떠한 경우라도 24시간 이상","page":223},{"k":"고도와 알코올","v":"맥주 2잔 후 고고도 비행 = 지상 3~4잔 효과","page":223},{"k":"멀미약 복용 후 비행","v":"최소 24시간 지난 후","page":224},{"k":"비행 사용 금지 약물","v":"암페타민계 / 마약성 처방약(옥시코돈·메페리딘·코데인)은 비행업무 시 투여 금지","page":224},{"k":"전정계 구성/기능","v":"반고리관 3개(회전 각가속도) + 이석기관(수평·수직 머리운동)","page":225},{"k":"악성나선강하 감각 소실 시간","v":"정상률 협조선회 20초 이상 지속 시","page":227},{"k":"착시 방향 정리","v":"좁은 활주로·오르막·블랙홀·빗물·연무 → 높다고 착각 → 낮게 접근 / 넓은 활주로·내리막·청명 → 높게 접근","page":231}],"quiz":[{"q":"저산소증에 대한 설명으로 옳지 않은 것은?","o":["뇌는 산소 소모가 가장 많아 저산소증에 가장 취약하다","원인에 따라 저산소성·빈혈성·허혈성·조직독성으로 나눈다","초기에 뚜렷한 증상이 나타나 조종사가 쉽게 인지할 수 있다","10,000ft 이상에서는 증상이 현저해진다"],"a":2,"e":"저산소증의 증상은 초기에는 거의 없고 조종사가 인지하지 못하는 상태에서 비행에 영향을 미친다.","page":219},{"q":"과도한 G(중력가속도)에 의해 혈류가 정체되어 시야 감소, 의식상실(LOC)까지 일으킬 수 있는 저산소증은?","o":["저산소성 저산소증","허혈성 저산소증","빈혈성 저산소증","조직독성 저산소증"],"a":1,"e":"허혈성(정체성, Stagnant) 저산소증은 혈액이 잘 흐르지 않아 생기며 과격한 급기동 시 과도한 G로 발생한다.","page":218},{"q":"알코올이나 마약류 복용으로 조직까지 운반된 산소를 인체 조직이 이용하지 못해 발생하는 저산소증은?","o":["조직독성 저산소증","빈혈성 저산소증","저산소성 저산소증","허혈성 저산소증"],"a":0,"e":"조직독성(Histotoxic) 저산소증은 알코올·약물 등으로 산소가 조직에서 잘 치환되지 않아 발생한다.","page":218},{"q":"[표 5-1]에 따를 때 혈중 산소포화도가 87%로 감소하고 조종사가 산소마스크를 사용하여야 하는 고도는?","o":["8,000ft","10,000ft","14,000ft","12,000ft"],"a":3,"e":"12,000ft(3,650m)에서 산소포화도 87%, 단기기억력 장애가 심해져 산소마스크를 사용해야 한다.","page":219},{"q":"비행 중 저산소증 유발 상황에 직면했을 때 조치로 가장 적절한 것은?","o":["고도를 12,000ft로 유지하며 호흡을 빠르게 한다","신속히 고도를 8,000ft 이하로 낮추거나 산소를 추가 공급한다","증상이 사라질 때까지 현 고도를 유지한다","상승하여 구름 위로 비행한다"],"a":1,"e":"저산소증 유발 상황에서는 신속히 8,000ft 이하로 강하하거나 산소 공급장비로 산소를 추가 공급해야 한다.","page":219},{"q":"일산화탄소(CO)의 헤모글로빈 결합능력은 산소의 약 몇 배인가?","o":["20배","50배","100배","200배"],"a":3,"e":"CO는 헤모글로빈과의 결합능력이 산소의 200배에 달해 산소 결합을 방해한다.","page":220},{"q":"중이의 이관(유스타키오관)이 막혀 통증이 심할 때 코와 입을 막고 강제로 숨을 내쉬어 이관을 부풀리는 방법은?","o":["발살바(Valsalva) 법","과호흡법","100% 산소 흡입법","플레어(flare)"],"a":0,"e":"심한 경우 코와 입을 막고 강제로 숨을 내쉬어 이관을 부풀리는 발살바 법을 사용한다.","page":220},{"q":"스쿠버다이빙 후 8,000ft 이상으로 비행하려는 경우 권고되는 최소 적응시간은?","o":["6시간","12시간","24시간","48시간"],"a":2,"e":"8,000ft 이상으로 비행하는 경우 어떠한 경우라도 24시간 이상 적응시간을 가져야 한다.","page":223},{"q":"비행 중 감압병(DCS)에 대한 설명으로 옳지 않은 것은?","o":["혈액·조직 내 질소가 기화해 기포를 형성하여 발생한다","관절 통증을 감압통(bends)이라 한다","기포가 즉시 생성되므로 상승 직후 바로 증상이 나타난다","비행 전 100% 산소를 흡입하여 예방하기도 한다"],"a":2,"e":"기포 생성에 시간이 소요되므로 상승 직후보다 20~60분 정도 지난 후에 증상이 발생한다.","page":222},{"q":"약물과 비행에 관한 설명으로 옳은 것은?","o":["아스피린·타이레놀은 적정 용량이면 비행을 제한하지 않는다","암페타민계 약물은 피로 감소 효과가 있어 비행에 권장된다","멀미약은 복용 직후 비행하는 것이 좋다","항히스타민제는 저산소증 저항력을 높인다"],"a":0,"e":"처방전 없이 구매하는 아스피린·이부프로펜·아세트아미노펜은 적정 용량이면 비행을 제한하지 않는다. 암페타민계는 사용 금지, 멀미약은 최소 24시간 후 비행.","page":224},{"q":"정상률 협조선회가 20초 이상 지속되어 선회 감각이 사라진 조종사가 고도를 회복하려 조종간을 당겨 나선 하강이 심해지는 현상은?","o":["전향성착각(Coriolis Illusion)","배면감 착각","승강타 착각","악성나선강하(graveyard spiral)"],"a":3,"e":"선회 감각이 역치 이하가 되어 수평비행으로 착각한 채 조종간을 당기면 더 심한 나선강하에 빠지는데 이를 악성나선강하라 한다.","page":227},{"q":"이륙 시 갑작스러운 가속으로 이석기관이 자극되어 기수가 정상보다 들려 있다고 착각하는 현상은?","o":["경사착각(lean)","신체중력 착각(Somatogravic illusion)","자동운동(autokinesis)","허위수평선"],"a":1,"e":"신체중력 착각은 이륙 시 급가속이 이석기관을 자극해 기수가 들린 착각을 일으키고, 이를 교정하려 기수를 과도하게 낮출 수 있다.","page":227},{"q":"폭이 좁은 활주로에 접근할 때 조종사가 빠지기 쉬운 착각과 결과로 옳은 것은?","o":["고도가 낮다고 착각하여 높게 접근한다","고도가 높다고 착각하여 정상보다 낮게 접근한다","활주로가 가깝다고 착각하여 복행한다","피치가 들렸다고 착각하여 접근각을 깊게 한다"],"a":1,"e":"좁은 활주로에서는 고도가 높다고 착각해 낮게 접근하며, 구조물 충돌이나 활주로 미달 사고가 발생할 수 있다.","page":230},{"q":"다음 중 조종사가 실제보다 높다고 착각하여 낮게 접근하게 만드는 요인이 아닌 것은?","o":["오르막(upslope) 활주로","수면 위·캄캄한 밤의 블랙홀 접근","방풍창의 빗물","매우 청명한 날씨"],"a":3,"e":"매우 청명한 날씨에서는 활주로가 가깝게 느껴져 오히려 높은 고도로 접근하게 된다.","page":231}]},{"id":"theory-6","title":"제6장 인적요소(Human Factor)","pages":[233,237],"goal":"SHELL 모델과 인적요소(의사소통·상황인식), IMSAFE·PAVE 체크리스트를 이용한 위험관리를 이해한다.","summary":"인적요소를 설명하는 대표 모델은 SHELL 모델로, 중심의 L(조종사)과 H(하드웨어)·S(소프트웨어)·E(환경)·L(관계자) 사이의 인터페이스 문제가 조종사 과실과 사고로 이어진다. 사고 원인의 약 70% 이상(사고·준사고의 70~90%)이 인적요소에 기인한다. 항공 의사소통은 간단성·명료성·명확성을 지켜야 하며, 상황인식은 5가지 위험요소에 대한 정확한 인식이다. 위험관리는 IMSAFE로 조종사 자신의 위해요소를, PAVE로 조종사·항공기·환경·외부압력을 비행 전 점검한다.","sections":[{"title":"6.1 인적 요소 분석 SHELL 모델","page":233,"points":["인적요소 설명의 대표 모델: SHELL Model","중앙 L(Liveware): 사람, 조종사","H(Hardware): 항공기의 기계적인 부분","S(Software): 운항분야의 각종 규정·절차·기호·부호","E(Environment): 기상 등의 조종 환경","주변 L(Liveware): 조종사와 관계되는 사람들"]},{"title":"6.2 SHELL 모델의 목적","page":233,"points":["요소간 관계가 조화되면 항공안전 향상, 상호관계에 문제가 생기면 조종사 과실 → 사고와 직결","SHELL 모델로 각 요소간 문제를 찾아내고 그 근원을 해결","L-H: 인간과 기계시스템 관련 가장 일반적으로 고려되는 인터페이스 — 좌석 설계, 디스플레이, 동작 제어·코딩·위치","L-S: 절차, 매뉴얼·체크리스트 레이아웃, 기호, 컴퓨터 프로그램 등 시스템의 비물리적 측면","L-E: 초기에는 인간을 환경에 적응(헬멧·비행복·산소마스크), 현 추세는 환경을 인간 요구에 맞게 조정","L-L: 조종사·관제사·정비사·승객 등 사람과 사람 사이의 인터페이스","대부분의 사고조사기관은 모든 항공기 사고·준사고의 70~90%가 조종사·정비사·관제사 등 사람의 행동·의사결정 결과라고 추정"]},{"title":"6.3.1~6.3.3 개요·의사소통·상황인식","page":234,"points":["사고조사 결과 사고 원인의 약 70% 이상이 인적요소에 기인","인적요소는 신체적(Physical) 분야와 심리적(Psychology) 분야로 구분 — 초기엔 신체적 부분에 초점, 지금은 심리적 요소에도 관심","항공에서는 조종사-관제사처럼 대면하지 않고 통화하므로 명확한 의사전달 필수","의사소통 기본원칙: 간단성(Simplicity), 명료성(Clarity: 천천히 또박또박), 명확성(Accuracy: 의도한 내용을 정확히)","상황인식: 5가지 기본 위험요소(비행, 조종사, 항공기, 환경, 주어진 항공상황을 구성하는 작동 유형) 내 모든 요소·조건에 대한 정확한 인식과 이해","비행·항적·기상·ATC 무선통신 모니터링은 정신적 그림을 그리게 해 상황인식을 향상"]},{"title":"6.3.4 위험관리(Risk Management)","page":235,"points":["위험관리·해결: 위해요소 식별(hazard identification) → 위험 정도 평가(risk assessment) → 최선의 행동방침 결정하는 의사결정 프로세스","프로세스: 위해요인 식별, 위험 평가, 통제 분석, 통제 결정, 통제 사용, 결과 모니터링","IMSAFE: Illness(질병), Medication(약물), Stress(스트레스), Alcohol(술: 8시간·24시간 이내 음주 여부), Fatigue(피로), Emotion(감정)","알코올은 방향감각 상실과 저산소증에 더 취약하게 만듦 / 피로는 비행안전에서 가장 잠재된 위험요소 중 하나","PAVE: Pilot in Command(기장), Aircraft(항공기), enVironment(환경), External pressures(외부 압력) — 비행 전 계획에 포함","핵심 개념: 규정상 '합법적'인 것과 경험·숙련 측면에서 '현명한/안전한' 것의 차이","환경(V): 기상(운고·시정, 개인 최저치 설정, 측풍, 산악 강풍의 난류·하강기류, 뇌우, 착빙), 지역(VFR·IFR 차트로 안전고도, 최저비행고도), 비행장(조명·항행보조시설, NOTAM, 회항 비행장), 공역(TFR 확인)","외부 압력(E): 비행을 완료해야 한다는 압박감 — 기다리는 사람, 실망시키지 않으려는 승객, 능력 과시 욕구, 누군가를 감동시키려는 욕망, 개인적 목표, 임무 목표 완수 욕구"]}],"memorize":[{"k":"SHELL 중앙 L","v":"Liveware — 사람, 조종사","page":233},{"k":"SHELL의 H","v":"Hardware — 항공기의 기계적인 부분","page":233},{"k":"SHELL의 S","v":"Software — 운항분야 각종 규정·절차·기호·부호","page":233},{"k":"SHELL의 E","v":"Environment — 기상 등의 조종 환경","page":233},{"k":"SHELL 주변 L","v":"조종사와 관계되는 사람들","page":233},{"k":"L-H 인터페이스","v":"인간-기계시스템, 가장 일반적으로 고려 (좌석 설계·디스플레이·동작 제어)","page":233},{"k":"L-S 인터페이스","v":"절차·매뉴얼·체크리스트 레이아웃·기호·컴퓨터 프로그램 등 비물리적 측면","page":233},{"k":"L-E 현 추세","v":"환경을 사람의 요구사항에 맞게 조정 (초기: 헬멧·비행복·산소마스크로 인간을 환경에 적응)","page":234},{"k":"L-L 인터페이스","v":"조종사·관제사·정비사·승객 등 사람과 사람","page":234},{"k":"사고·준사고 중 인적 원인 비율","v":"70~90% (사고 원인의 약 70% 이상이 인적요소)","page":234},{"k":"인적요소 2분야","v":"신체적(Physical) 분야, 심리적(Psychology) 분야","page":234},{"k":"항공 의사소통 3원칙","v":"간단성(Simplicity)·명료성(Clarity)·명확성(Accuracy)","page":234},{"k":"위험관리 프로세스","v":"위해요인 식별 → 위험 평가 → 통제 분석 → 통제 결정 → 통제 사용 → 결과 모니터링","page":235},{"k":"IMSAFE","v":"Illness·Medication·Stress·Alcohol·Fatigue·Emotion","page":235},{"k":"IMSAFE의 Alcohol 질문","v":"8시간 이내에 마셨는가? 24시간 안에 마셨는가?","page":235},{"k":"가장 잠재된 위험요소 중 하나","v":"피로(Fatigue) — 심각한 오류 발생 때까지 명백하지 않을 수 있음","page":235},{"k":"PAVE","v":"Pilot in Command·Aircraft·enVironment·External pressures","page":235},{"k":"PAVE의 환경 하위 항목","v":"기상, 지역(지형), 비행장/이착륙장, 공역","page":236},{"k":"외부 압력 정의","v":"비행을 완료해야 한다는 압박감을 유발하는 비행 외적 영향, 종종 안전 저해 요소","page":237},{"k":"공역 확인 사항","v":"비행경로를 따라 공역 및 임시비행제한(TFR) 확인","page":237}],"quiz":[{"q":"SHELL 모델에서 운항분야의 각종 규정, 절차, 기호, 부호 등을 나타내는 요소는?","o":["S(Software)","H(Hardware)","E(Environment)","L(Liveware)"],"a":0,"e":"S(Software)는 운항분야의 각종 규정·절차·기호·부호 등을 나타낸다.","page":233},{"q":"SHELL 모델의 중앙에 위치하는 요소는?","o":["항공기의 기계적인 부분","기상 등 조종 환경","사람(조종사)","운항 규정과 절차"],"a":2,"e":"중앙의 L(Liveware)은 사람, 즉 조종사를 나타낸다.","page":233},{"q":"인간과 기계시스템과 관련하여 가장 일반적으로 고려되는 인터페이스로, 좌석 설계·디스플레이·동작 제어 등이 해당하는 것은?","o":["L-S","L-E","L-L","L-H"],"a":3,"e":"L-H(인간과 하드웨어)는 가장 일반적으로 고려되는 인터페이스로 좌석 설계, 디스플레이, 동작 제어·코딩·위치 등이 포함된다.","page":233},{"q":"SHELL 모델의 L-E(인간과 환경) 인터페이스에 대한 현재의 추세로 옳은 것은?","o":["인간을 환경에 적응시키는 것을 목표로 한다","사람의 요구사항에 맞게 환경을 조정한다","환경 요소는 고려하지 않는다","절차와 매뉴얼 개선에 집중한다"],"a":1,"e":"초기에는 헬멧·비행복·산소마스크 등으로 인간을 환경에 적응시켰으나, 현 추세는 환경을 사람에게 맞게 조정하는 것이다.","page":234},{"q":"교재에 따르면 대부분의 사고조사기관은 모든 항공기 사고 및 준사고 중 몇 %가 사람의 행동과 의사결정의 결과라고 추정하는가?","o":["10~30%","30~50%","70~90%","95% 이상"],"a":2,"e":"모든 항공기 사고 및 준사고의 70~90%가 조종사·정비사·관제사 등 사람의 행동과 의사결정의 결과로 추정된다.","page":234},{"q":"항공에서 의사소통의 기본 원칙에 해당하지 않는 것은?","o":["간단성(Simplicity)","명료성(Clarity)","명확성(Accuracy)","신속성(Speed)"],"a":3,"e":"항공 의사소통의 기본 원칙은 간단성·명료성·명확성이다.","page":234},{"q":"IMSAFE 체크리스트의 구성 요소가 아닌 것은?","o":["Illness(질병)","Aircraft(항공기)","Fatigue(피로)","Emotion(감정)"],"a":1,"e":"IMSAFE는 Illness·Medication·Stress·Alcohol·Fatigue·Emotion이며, Aircraft는 PAVE의 요소이다.","page":235},{"q":"IMSAFE 중 심각한 오류가 발생할 때까지 조종사에게 명백하지 않을 수 있어 비행안전에 가장 잠재된 위험요소 중 하나로 꼽히는 것은?","o":["Fatigue(피로)","Illness(질병)","Emotion(감정)","Medication(약물)"],"a":0,"e":"피로는 심각한 오류가 발생할 때까지 명백하지 않을 수 있어 가장 잠재된 위험요소 중 하나이다.","page":235},{"q":"PAVE 체크리스트의 네 가지 비행 위험 요인으로 옳은 것은?","o":["조종사·승객·환경·연료","기장·항공기·환경·외부 압력","계획·항공기·속도·고도","조종사·관제사·정비사·승객"],"a":1,"e":"PAVE는 Pilot in Command(기장), Aircraft(항공기), enVironment(환경), External pressures(외부 압력)이다.","page":235},{"q":"위험관리 프로세스에 포함되는 단계로 교재에 제시되지 않은 것은?","o":["위해요인 식별","위험 평가","통제 결정","책임자 처벌"],"a":3,"e":"위험관리 프로세스는 위해요인 식별, 위험 평가, 통제 분석, 통제 결정, 통제 사용, 결과 모니터링으로 구성된다.","page":235},{"q":"PAVE의 외부 압력(External Pressures)에 해당하는 예로 옳지 않은 것은?","o":["비행장에서 도착을 기다리는 사람","자신의 능력을 과시하고자 하는 욕구","실망시키지 않으려는 승객","항공기 착빙 조건의 발생"],"a":3,"e":"착빙 조건은 환경(기상) 요소이며, 외부 압력은 비행을 완료해야 한다는 압박감을 주는 비행 외적 영향이다.","page":237},{"q":"PAVE의 환경(V) 중 '공역' 항목에서 비행 전 확인해야 할 사항은?","o":["보급된 연료량과 주문 연료량의 일치","비행경로를 따른 공역 및 임시비행제한(TFR)","조종사의 최신 비행경험","승객의 탑승 의사"],"a":1,"e":"공역 항목에서는 비행경로를 따라 공역 및 임시비행제한(TFR)을 확인해야 한다.","page":237}]}]},{"key":"weather","name":"항공기상","short":"기상","en":"Aviation Weather","chapters":[{"id":"weather-1","title":"제1장 대기권의 구조","pages":[243,247],"goal":"지구 대기권의 층 구분(대류권~외기권)별 고도·온도 특성과 대기 성분, 국제표준대기(ISA)의 물리 상수를 알아야 한다.","summary":"지구 대기권은 물리적 특성에 따라 대류권, 성층권, 중간권, 열권, 외기권으로 구분되며, 기상현상은 수증기와 대기 질량의 75% 이상을 가진 대류권(평균 약 11km)에서 일어난다. 대류권에서는 고도 1km당 약 6.5℃씩 기온이 감소하고, 성층권은 위로 갈수록 따뜻해지며, 중간권계면은 대기권에서 가장 춥다. 대기는 부피비로 질소 78%, 산소 21%, 기타 1%로 고도 80km까지 균일(균질권)하다. ICAO는 1964년 국제표준대기(ISA)를 규정했으며 해면기압 1,013.25mb(29.92inHg), 해면기온 15℃ 등이 기준값이다.","sections":[{"title":"1.1 지구 대기권 구분","page":243,"points":["지구 대기권은 지표면부터 대류권(troposphere)–성층권(stratosphere)–중간권(mesosphere)–열권(thermosphere)–외기권(exosphere)으로 구분한다.","ICAO Annex 3은 특이기상과 관련하여 지표~FL250, FL250~FL450, FL450~FL600의 층으로 구분한다.","대류권: 평균 고도 약 11km(극지방 6~10km, 적도 15~18km), 여름에 높고 겨울에 낮음, 중력·원심력보다 온도의 영향을 많이 받음, 전체 대기 질량의 75% 이상과 수증기를 포함해 기상현상 발생.","대류권은 고도 11km까지 약 6.5℃/km로 기온 감소, 풍속은 고도가 높을수록 증가; 상한인 대류권계면 부근은 안정·무운·저온으로 제트기 운항에 적합하고, 하부는 경량항공기·초경량비행장치가 활동하며 기상 영향을 많이 받음.","성층권: 지표면 11~50km, 고속의 바람이 불어도 와류가 생기지 않으며 위로 갈수록 따뜻해짐(대류권과 반대); 20~30km에 오존층이 두텁고, 하부는 안정·저온으로 제트여객기가 9~15km에서 순항.","중간권: 50~80km, 고도 상승에 따라 온도 감소, 최상부 중간권계면은 대기권에서 온도가 가장 낮음; 대류현상은 있으나 기상현상은 일어나지 않음.","열권: 약 80km~500km, 태양에너지로 공기 분자가 이온화되어 전리층(D·E·F·G층) 형성; F층(180~300km)은 55~95m 파장 전파를 반사하여 HF(2.8~22MHz, 파장 10~100m) 장거리 통신에 이용.","외기권: 500~1,000km에서 시작해 약 10,000km까지, 산소·질소 같은 무거운 원소는 거의 없고 수소·헬륨 같은 가벼운 원소가 존재."]},{"title":"1.2 대기의 성분","page":246,"points":["대기 구성 물질은 부피비로 질소(N2) 78%, 산소(O2) 21%가 99%를 차지한다.","나머지 1%는 아르곤(Ar), 이산화탄소(CO2), 헬륨, 메탄, 수소, 수증기, 일산화질소, 오존, 일산화탄소 등이다.","고도 80km까지는 구성분포가 균일하여 균질권(homosphere)이라 하며, 고도가 높아질수록 공기 밀도는 감소한다.","고도 80km 이상은 중력 영향이 작아져 가벼운 기체 비율이 증가하므로 성분비가 일정하지 않은 비균질권이다."]},{"title":"1.3 국제표준대기","page":246,"points":["ICAO는 1964년 국제표준대기(ISA: International Standard Atmosphere)를 국제 협약으로 규정하였다.","ISA 공기는 건조공기(균질권: 질소 78%, 산소 21%, 기타 1%)로서 이상기체 상태방정식을 고도·온도·시간에 관계없이 만족해야 한다.","해면상 표준기압 1,013.25mb(29.921inHg), 해면상 공기밀도 1.225kg/㎥, 중력가속도 9.80665, 해면상 기온 15℃(288.15K), 결빙온도 273.15K, 음속 340.43m/s.","고도별 온도변화율: 11.0km까지 -6.5℃/km, 11.0~20.0km는 0.0℃/km(등온층).","표준대기표: 8,000ft 약 752.6hPa(≒3/4기압), 18,000ft 약 506.0hPa(≒1/2기압), 34,000ft 약 250.0hPa(≒1/4기압).","제트여객기 고공비행 시 여압 객실 기압은 해면 표준기압의 3/4에 해당하는 고도 8,000ft 아래로 설정되며, 왕복엔진 항공기의 최대 운용고도 상한은 일반적으로 약 18,000ft(1/2기압)이다."]}],"memorize":[{"k":"대기권 구분 순서(아래→위)","v":"대류권 → 성층권 → 중간권 → 열권 → 외기권","page":243},{"k":"대류권 평균 고도","v":"약 11km (극지방 6~10km, 적도 15~18km; 여름 높고 겨울 낮음)","page":243},{"k":"대류권 대기 질량 비율","v":"전체 대기 질량의 75% 이상","page":243},{"k":"대류권 기온감률","v":"고도 11km까지 약 6.5℃/km 감소","page":243},{"k":"ICAO Annex 3 특이기상 층 구분","v":"지표~FL250, FL250~FL450, FL450~FL600","page":243},{"k":"성층권 범위","v":"지표면으로부터 11~50km, 위로 갈수록 따뜻해짐","page":244},{"k":"오존층 위치","v":"지표면으로부터 20~30km 지점에 두텁게 존재","page":244},{"k":"제트여객기 순항 고도","v":"9~15km (성층권 하부)","page":244},{"k":"중간권 범위","v":"50~80km, 최상부 중간권계면이 대기권 최저온도","page":244},{"k":"열권 범위","v":"약 80km~500km, 전리층 형성(D·E·F·G층)","page":245},{"k":"전리층 F층","v":"고도 180~300km, 55~95m 파장 전파 반사 → HF 장거리 통신","page":245},{"k":"HF 주파수","v":"파장 10~100m, 주파수 2.8~22MHz 단파","page":245},{"k":"외기권 범위","v":"500~1,000km에서 시작, 약 10,000km까지; 수소·헬륨 존재","page":245},{"k":"대기 성분(부피비)","v":"질소 78%, 산소 21%, 기타 1%(아르곤, CO2 등)","page":246},{"k":"균질권","v":"고도 80km까지 성분비 균일; 80km 이상은 비균질권","page":246},{"k":"ISA 제정","v":"ICAO, 1964년 국제 협약으로 규정","page":246},{"k":"ISA 해면상 표준기압","v":"1,013.25mb = 29.921inHg","page":246},{"k":"ISA 해면상 기온","v":"15℃ = 288.15K","page":246},{"k":"ISA 해면상 공기밀도","v":"1.225kg/㎥","page":246},{"k":"ISA 중력가속도 / 결빙온도 / 음속","v":"9.80665 / 273.15K / 340.43m/s","page":246},{"k":"ISA 고도별 온도변화율","v":"11.0km까지 -6.5℃/km, 11.0~20.0km 0.0℃/km(등온층)","page":246},{"k":"3/4 기압 고도","v":"8,000ft(약 752.6hPa) — 여압 객실 기압 설정 기준","page":247},{"k":"1/2 기압 고도","v":"18,000ft(약 506.0hPa) — 왕복엔진 항공기 최대 운용고도 상한","page":247},{"k":"1/4 기압 고도","v":"34,000ft(약 250.0hPa)","page":247}],"quiz":[{"q":"대류권의 평균 고도 범위로 옳은 것은?","o":["지표면으로부터 약 11km","지표면으로부터 약 50km","지표면으로부터 약 80km","지표면으로부터 약 6km"],"a":0,"e":"대류권의 범위는 일반적으로 지표면으로부터 평균고도 11km 정도이며, 극지방 6~10km, 적도 15~18km이다.","page":243},{"q":"대류권에서 고도 11km까지 고도 증가에 따른 평균 기온 감소율은?","o":["약 2℃/km","약 6.5℃/km","약 10℃/km","약 3℃/km"],"a":1,"e":"고도 11km까지는 고도가 높아질수록 기온이 약 6.5℃/km의 비율로 감소한다.","page":243},{"q":"대류권에 대한 설명으로 옳지 않은 것은?","o":["전체 대기 질량의 75% 이상을 가지고 있다.","극지방은 6~10km, 적도 부근은 15~18km 정도이다.","같은 장소라도 여름철보다 겨울철에 높게 나타난다.","수증기를 포함하고 있어 기상현상이 발생한다."],"a":2,"e":"대류권은 같은 장소에서도 여름철에는 높고 겨울철에는 낮게 나타난다.","page":243},{"q":"지구 대기권에서 온도가 가장 낮은 곳은?","o":["대류권계면","성층권계면","열권 하부","중간권계면"],"a":3,"e":"중간권은 고도가 높아짐에 따라 온도가 감소하여 최상부에 대기권에서 온도가 가장 낮은 중간권계면이 있다.","page":244},{"q":"성층권에 대한 설명으로 옳은 것은?","o":["고도가 높아질수록 기온이 감소한다.","위쪽으로 올라갈수록 따뜻해지는 특성을 가진다.","지표면으로부터 50~80km 범위에 있다.","구름·비·눈 등 대부분의 기상현상이 일어난다."],"a":1,"e":"성층권(11~50km)은 위쪽으로 올라갈수록 따뜻해지는 특성으로 대류권과 정반대이다.","page":244},{"q":"항공분야에서 HF 장거리 통신에 이용되는, 55~95m 파장의 전파를 반사하는 전리층은?","o":["D층","E층","F층","G층"],"a":2,"e":"F층은 고도 180~300km로 55~95m 파장의 전파를 반사하므로 HF를 사용한 장거리 통신에 이용된다.","page":245},{"q":"지구 대기의 주요 구성 성분(부피비)으로 옳은 것은?","o":["질소 21%, 산소 78%","질소 70%, 산소 29%","질소 78%, 산소 21%","질소 80%, 산소 19%"],"a":2,"e":"대기는 부피로 보아 99%가 질소 78% 및 산소 21%로 구성되고 기타 1%는 아르곤, CO2 등이다.","page":246},{"q":"ICAO 국제표준대기(ISA)의 해면상 조건으로 옳지 않은 것은?","o":["표준기압 1,013.25mb","기온 15℃(288.15K)","공기밀도 1.225kg/㎥","음속 300m/s"],"a":3,"e":"ISA에서 음속은 340.43m/s이다.","page":246},{"q":"국제표준대기에서 고도 11.0~20.0km 구간의 온도변화율은?","o":["0.0℃/km(등온층)","-6.5℃/km","+2.0℃/km","-10℃/km"],"a":0,"e":"ISA의 고도별 온도 변화율은 11.0km까지 -6.5℃/km, 11.0~20.0km는 0.0℃/km(등온층)이다.","page":246},{"q":"표준대기표에서 해면상 표준대기압의 약 1/2에 해당하며, 왕복엔진 항공기의 일반적인 최대 운용고도 상한인 고도는?","o":["8,000ft","14,000ft","18,000ft","34,000ft"],"a":2,"e":"18,000ft는 약 506.0hPa로 해면 표준기압의 1/2이며 왕복엔진 항공기의 최대 운용고도 상한이다.","page":247},{"q":"대기 성분비가 고도 80km까지 균일하게 유지되는 영역을 무엇이라 하는가?","o":["비균질권","전리층","등온층","균질권"],"a":3,"e":"대기 성분은 고도 80km까지 균일한 구성분포를 유지하여 균질권(homosphere)이라 한다.","page":246},{"q":"ICAO가 국제표준대기(ISA)를 국제 협약으로 규정한 연도는?","o":["1964년","1944년","1974년","1956년"],"a":0,"e":"ICAO에서는 1964년 국제표준대기(ISA)를 국제 협약으로 규정하였다.","page":246}]},{"id":"weather-2","title":"제2장 대류권의 기상현상","pages":[248,270],"goal":"대류권에서 일어나는 기온·습도·기압·바람·기단·전선·구름·안개의 원리와 항공기 운항에 필요한 기준값(단열감률, 고도계 설정방식, 바람 기준 등)을 알아야 한다.","summary":"열은 복사·전도·대류로 전달되며, 상승 공기는 단열팽창으로 건조 시 약 10℃/km, 습윤 시 약 4~6℃/km 냉각된다. 기압고도계는 ISA를 근거로 하며 우리나라 전이고도 14,000ft 이하에서는 QNH, 이상에서는 QNE(29.92inHg)를 사용하고 QFE는 활주로에서 0ft를 지시한다. 바람은 기압경도력·전향력·마찰력으로 결정되며, 고기압은 북반구에서 시계방향으로 불어나가고 저기압은 반시계방향으로 불어 들어간다. 우리나라에는 시베리아(cP)·오호츠크해(mP)·북태평양(mT)·양쯔강(cT) 기단이 영향을 주며, 전선(온난·한랭·폐색·정체), 기본운형 10종, 안개(시정 1km 미만)의 특성이 시험의 핵심이다.","sections":[{"title":"2.1 대기의 기온과 습도","page":248,"points":["열은 복사·전도·대류 세 가지 방법으로 전달되며 실제로는 둘 또는 세 가지가 동시에 일어난다; 복사는 매체가 필요 없어 태양에너지는 주로 복사로 전달된다.","전도는 물질 이동 없이 고온부→저온부로 열이 이동(온도차가 있을 때만), 대류는 연직방향 유체 운동에 의한 수송, 이류(Advection)는 수평방향 유체 운동에 의한 수송이다.","온도 환산: °F=1.8℃+32, K=℃+273.15; 화씨는 물의 어는점 32℉·끓는점 212℉(180등분), 0K는 -273.15℃.","일 최고기온은 일사량 최대(정오)보다 지연되어 오후 1~3시, 최저기온은 일출 직후에 나타난다.","비열이 작은 지표가 대기보다 빨리 냉각되어 지면(복사)역전층이 생기며 이런 날은 안개 발생 확률이 높다; 상층역전층에서는 연기가 올라가지 못하고 얇고 평탄한 구름 형태로 정체한다.","이슬점 온도: 공기 중 수증기가 포화되기 위해 냉각되어야 하는 온도; 상대습도: 현재 수증기량과 그 온도의 포화수증기량의 백분율(기온이 높으면 습도 낮음); 포화수증기압은 온도가 증가할수록 커진다.","단열변화: 외부와 열 교환 없이 온도가 변함 — 상승 시 단열팽창(냉각), 하강 시 단열압축(가열).","건조단열감률 약 -10℃/km, 습윤단열감률 약 -4~-6℃/km."]},{"title":"2.2 기압","page":252,"points":["기압은 어떤 점을 중심으로 한 단위면적 위에서 연직으로 취한 공기 기둥 안의 공기 무게이다.","공식 기압 단위는 hPa(소수 첫째자리까지 측정); 1mb=1hPa=0.750062mmHg=0.0295300inHg; 1기압(atm)=760mmHg=1,013.25hPa=29.92inHg; 1Pa=1㎡당 1N.","해면기압: 높이가 다른 관측소의 기압을 평균해수면 값으로 환산한 것으로 일기도에 기록한다.","전이고도(Transition Altitude)는 나라마다 다르며 우리나라·일본 14,000ft, 미국 18,000ft이다.","QNH: 관제탑이 제공하는 고도압력으로 맞추며 활주로의 해면고도(표고)가 표시됨; 우리나라는 전이고도 14,000ft 이하에서 사용, 장거리 비행 시 가까운 비행장 값으로 재세팅.","QNE: 표준대기압 29.92inHg(1013.25mb)에 맞추는 방식으로 우리나라는 14,000ft 이상에서 사용하며 기압고도라고도 한다.","QFE: 활주로 표고(착지점)로부터의 고도를 표시하도록 현지 기압으로 맞추어 출발 시 0ft를 지시(Zero Setting); 관제탑 없는 비행장·이착륙장에서 장주비행·Local 비행 시 주로 사용."]},{"title":"2.3 고기압과 저기압","page":253,"points":["고기압 내 바람은 북반구에서 중심 주위를 시계방향, 남반구에서 반시계방향으로 회전하며 불어나간다; 등압선과 풍향의 각은 해상 약 15°, 육상 약 25~35°.","온난고기압: 대기대순환에 의해 역학적으로 생기며 키가 크고 상공으로 갈수록 고기압이 현저, 거의 이동하지 않음; 상층 기압능(Ridge)이 발달하면 저지(blocking) 현상, 침강으로 온난건조·맑은 날씨.","한랭고기압: 겨울철 고위도 대륙에서 지표 복사냉각으로 발생, 3km 상공에서 고기압 성질이 없어지는 키 작은 고기압이며 상층에 저기압이 있어 일기가 좋지 않음.","저기압 지상풍은 북반구에서 중심을 향해 반시계방향으로 불어 들어오며, 동반된 한랭전선은 중심에서 남서쪽, 온난전선은 남동쪽으로 향한다.","저기압 분류: 전선 유무(전선저기압/비전선저기압), 구조(한랭저기압/온난저기압), 발생 지역(온대저기압/열대저기압).","한랭저기압(Cold Low): 중심이 주위보다 한랭, 기온감률 급함, 상층으로 갈수록 저기압성 순환 증가, 서서히 이동, 키가 크고 불안정; 온난저기압(Warm Low): 중심이 온난, 상층에서 고기압성 순환, 키가 작고 이동 속도 빠름.","저기압 기류: 지표 근처 수평수렴 → 상승기류 → 상층 수평발산; 강수는 수렴하는 중심 부근과 전선을 따라 발생."]},{"title":"2.4 바람","page":255,"points":["풍향은 바람이 불어오는 방향으로 진북 기준이며, 항공에서는 36방위 사용, 관제사 제공 바람정보는 자북 기준 3자리 수를 사용한다.","풍속 단위는 일반적으로 m/s, 기상전문에서는 노트(knot)를 주로 사용(m/s×2≒knot); 풍속 0.5m/s(1knot) 이하는 정온(calm)으로 풍향 '00' 표기.","급변풍(Wind Shear): 풍속·풍향이 갑자기 바뀌는 현상으로 수평 급변풍은 소용돌이, 연직 급변풍은 청천난류 등을 발생시킨다.","기압경도력은 두 지점의 기압차에 비례, 거리에 반비례(f∝△P/L)하며 등압선 간격이 좁을수록 바람이 세다; 전향력(코리올리 힘)은 북반구 오른쪽·남반구 왼쪽 편향, 적도 0·극에서 최대.","지표마찰력은 거친 지형·강한 풍속일수록 커지고, 지면으로부터 약 600m 이상에서는 거의 영향을 받지 않는다; 등압선과 이루는 각은 마찰력에 비례·고도에 반비례(대륙 약 45°, 해양 약 10°).","거스트(돌풍): 10분간 평균풍속보다 10knot 이상 차이, 순간최대풍속 17knot 이상, 지속시간 초단위; 스콜: 풍속 증가 매초 8m 이상, 풍속 11m/s 이상이 1분 이상 지속.","태풍(열대성 저기압): 중심 최대풍속 17m/s 이상; 지역별 명칭 태풍(북태평양 남서부)·허리케인(서인도제도)·사이클론(인도양)·윌리윌리(남태평양); 태풍의 눈은 5m/s 이하 미풍; 발생장소 북위 5°~25°, 동경 120°~170°.","국지풍: 해륙풍(낮 해풍 바다→육지, 밤 육풍), 산곡풍(낮 곡풍 골짜기→산, 밤 산풍), 활강풍(산풍보다 강한 하강풍, 대부분 10knot 이하), 푄(습윤 상승 약 5℃/km 냉각 → 건조 하강 약 10℃/km 승온, 우리나라 동해 지역)."]},{"title":"2.5 기단","page":260,"points":["기단은 주어진 고도에서 온도·습도 등 수평적으로 성질이 비슷한 대규모 공기덩어리이다.","발원지 위도에 따라 열대기단(T), 한대기단(P), 극기단(A)으로, 습도에 따라 대륙성(c, 건조)과 해양성(m, 습윤)으로 분류한다.","mT 온난·다습·불안정, cT 고온·건조·안정(상공)/불안정(지상), mP 서늘·다습·불안정, cP 한랭·건조·안정, mA 한랭·다습, cA 한랭·건조.","시베리아기단(cP): 주로 겨울, 한랭건조, 겨울 혹한과 삼한사온 유발.","오호츠크해기단(mP): 주로 장마기, 한랭다습, 동해안 지역을 흐리게 하고 비를 내림.","북태평양기단(mT): 주로 여름, 고온다습, 여름철 더위·폭염; 양쯔강기단(cT): 봄과 가을, 온난건조, 이동성 고기압과 함께 동진."]},{"title":"2.6 전선","page":261,"points":["물리적 성질이 다른 두 기단의 경계면을 전선면(불연속면), 지면과 만나는 선을 전선(불연속선), 대역을 전선대라 한다.","온난전선: 따뜻한 공기가 찬 공기 위를 타고 오르며 이동속도 느리고 기울기 작음, 넓은 지역에 약한 강수; 통과 전 권운→권층운→고층운→난층운→층운 순.","온난전선 위험기상: 넓은 강수대가 층운·안개를 만들어 수천 ㎢에 낮은 실링·악시정, 찬 공기가 어는점 이하면 어는 비·얼음싸라기, 여름 뇌우·겨울 심한 착빙, 하층 바람시어가 전방에서 6시간 이상 지속 가능.","한랭전선: 찬 공기가 쐐기 모양으로 파고들어 이동속도 빠르고 경사가 크며 좁은 지역에 강한 강수(소나기·뇌우·우박); 통과 시 기압 갑자기 상승, 기온·노점 갑자기 하강, 통과 후 서풍 또는 북서풍.","한랭전선 위험기상: 전선 앞 스콜선(Squall Line)과 적운형 구름 — 심한 요란, 바람시어, 뇌우, 번개, 소나기, 우박, 착빙, 토네이도, 강한 돌풍.","폐색전선: 온대저기압 발달 마지막 단계로 한랭전선이 온난전선을 따라붙어 형성; 한랭전선 후면 공기가 더 차면 한랭형, 반대면 온난형; 우리나라 부근은 겨울 한랭형, 여름 중립형·온난형이 많음.","폐색전선에서는 한랭·온난전선 기상이 혼합(스콜선·뇌우+낮은 실링)되고 기상이 급변하며 발달 초기에 가장 악화된다.","정체전선: 움직이지 않거나 10km/hr 미만으로 움직이는 전선, 상공 풍향과 전선 방향이 평행할 때 형성; 날씨는 온난전선과 비슷하며 한랭기단 쪽이 나쁘고, 위험 기상이 여러 날 지속."]},{"title":"2.7 구름","page":265,"points":["구름은 어는점보다 높은 물방울, 과냉각 물방울, 빙정으로 이루어지며, 빙정은 어는점 이하에서 승화로 형성되고 대류권 상층 구름은 대부분 빙정이다.","공기를 상승시키는 4가지 원인: 대류상승(열기포 thermal), 지형적 상승(풍하측 비그늘 rain shadow), 전선에 의한 상승(한랭전선은 강제상승), 공기의 수렴에 의한 상승.","불안정한 기층에서는 수직으로 두꺼운 적운형, 안정한 기층에서는 얇은 층운형 구름이 발달한다.","상층운(운저 보통 6km 이상, 거의 빙정): 권운(CI), 권적운(CC), 권층운(CS).","중층운(중위도 운저 2~6km): 고적운(AC), 고층운(AS); 하층운(운저 2km 이하/미만): 층운(ST), 난층운(NS), 층적운(SC).","수직운(2~20km 이내, 불안정 공기와 밀접): 적운(CU), 적란운(CB).","권층운은 햇무리·달무리, 고적운은 양떼구름, 난층운은 진한 회색으로 지속적인 비나 눈, 층운은 안개와 비슷한 구름, 적운은 여름 오후 뭉게구름.","적란운(CB): 수직으로 크게 발달한 거대한 탑 모양, 꼭대기 쇠모루(Anvil) 형태, 뇌우·번개·소나기·우박·돌풍 동반."]},{"title":"2.8 안개(Fog)","page":269,"points":["구름과 안개의 차이는 지면과 접해 있는지 여부이며, 구성입자가 수적이고 시정이 1km 미만일 때를 안개라 한다.","냉각에 의한 안개: 지면에 접한 공기층의 온도가 이슬점 이하가 되면 발생 — 복사안개, 이류안개, 활승안개.","복사안개(땅안개, ground fog): 맑은 날 밤 바람이 약할 때 지표면 복사냉각으로 발생, 육상 안개의 대부분.","이류안개: 온난다습한 공기가 찬 지면으로 이류하여 발생; 해상 안개 대부분이며 해무(sea fog)라 부르고 복사안개보다 두껍고 넓으며 수일~한 달 지속되기도 함.","활승안개(upslope fog): 습윤 공기가 완만한 경사면을 따라 올라가며 단열팽창 냉각되어 형성, 산안개 대부분이며 바람이 강해도 형성.","증발에 의한 안개: 증발안개(온난한 수면에서 찬 공기로 수증기 증발), 전선안개(우적 증발; 전선 앞·전선 뒤·전선 통과 안개)."]}],"memorize":[{"k":"열전달 3가지","v":"복사(매체 불필요), 전도(분자운동, 물질 이동 없음), 대류(연직 유체운동); 수평 이동은 이류","page":248},{"k":"온도 환산","v":"°F=1.8℃+32, K=℃+273.15, 0K=-273.15℃","page":249},{"k":"일 최고/최저 기온 시각","v":"최고 오후 1~3시, 최저 일출 직후","page":249},{"k":"이슬점 온도","v":"공기 중 수증기가 포화되기 위하여 냉각되어야 하는 온도","page":250},{"k":"건조단열감률","v":"약 -10℃/km","page":251},{"k":"습윤단열감률","v":"약 -4~-6℃/km","page":251},{"k":"1표준기압","v":"760mmHg = 1,013.25hPa = 29.92inHg","page":252},{"k":"전이고도","v":"우리나라·일본 14,000ft, 미국 18,000ft","page":252},{"k":"QNH","v":"관제탑 제공 고도압력, 활주로 해면고도(표고) 표시, 14,000ft 이하에서 사용","page":252},{"k":"QNE","v":"29.92inHg(1013.25mb) 설정, 14,000ft 이상 사용, 기압고도","page":252},{"k":"QFE","v":"현지 기압 설정, 활주로에서 0ft 지시(Zero Setting), 장주·Local 비행","page":253},{"k":"등압선과 풍향 각(고기압)","v":"해상 약 15°, 육상 약 25~35°","page":253},{"k":"북반구 고기압/저기압 바람","v":"고기압: 시계방향으로 불어나감 / 저기압: 반시계방향으로 불어들어옴","page":253},{"k":"한랭고기압 키","v":"3km 정도 상공에서 고기압 성질 사라짐(키 작은 고기압)","page":254},{"k":"정온(calm)","v":"풍속 0.5m/s(1knot) 이하, 풍향 '00' 표기","page":255},{"k":"풍향 표기","v":"진북 기준, 항공 36방위; 관제사 바람정보는 자북 기준 3자리","page":255},{"k":"기압경도력","v":"f ∝ △P/L (기압차에 비례, 거리에 반비례)","page":255},{"k":"전향력","v":"북반구 오른쪽 편향, 적도 0, 극에서 최대","page":256},{"k":"지표마찰 영향 한계 고도","v":"지면으로부터 약 600m 이상에서는 거의 받지 않음","page":257},{"k":"지상풍과 등압선 각","v":"대륙 약 45°, 해양 약 10°","page":257},{"k":"거스트(돌풍) 기준","v":"10분 평균풍속보다 10knot 이상 차이, 순간최대 17knot 이상, 지속 초단위","page":258},{"k":"스콜 기준","v":"풍속 증가 매초 8m 이상, 풍속 11m/s 이상, 1분 이상 지속","page":258},{"k":"태풍 기준","v":"열대성 저기압 중심 최대풍속 17m/s 이상; 눈은 5m/s 이하","page":258},{"k":"태풍 발생장소","v":"북위 5°~25°, 동경 120°~170°","page":259},{"k":"푄 온도변화","v":"습윤 상승 1km당 약 5℃ 감소, 건조 하강 1km당 약 10℃ 상승","page":260},{"k":"우리나라 영향 기단","v":"시베리아 cP(겨울), 오호츠크해 mP(장마기), 북태평양 mT(여름), 양쯔강 cT(봄·가을)","page":261},{"k":"정체전선 속도","v":"움직이지 않거나 10km/hr 미만","page":264},{"k":"운저고도별 분류","v":"상층운 6km 이상(6-12km), 중층운 2~6km, 하층운 2km 미만, 수직운 2~20km","page":269},{"k":"기본운형 10종","v":"CI·CC·CS / AC·AS / NS·SC·ST / CU·CB","page":269},{"k":"안개 정의","v":"구성입자가 수적이고 시정 1km 미만","page":269}],"quiz":[{"q":"에너지가 이동하는 데 매체를 필요로 하지 않아 태양에너지 전달의 주된 형태가 되는 열전달 방법은?","o":["전도","대류","이류","복사"],"a":3,"e":"복사는 전자기파에 의한 에너지 전달로 매체가 필요 없어 우주를 지나오는 태양에너지는 주로 복사로 이동한다.","page":248},{"q":"일 최고기온이 일반적으로 나타나는 시각은?","o":["오후 1~3시","정오","오전 10~11시","일몰 직전"],"a":0,"e":"일사량은 정오에 최대이나 지표에 흡수된 에너지가 축적되어 최고기온은 지연되어 오후 1~3시에 나타난다.","page":249},{"q":"포화되지 않은 건조한 공기덩어리가 1km 상승할 때 감소하는 온도(건조단열감률)는?","o":["약 4~6℃","약 6.5℃","약 10℃","약 2℃"],"a":2,"e":"건조한 공기덩어리는 1km 상승할 때마다 약 10℃ 감소하며 이를 건조단열감률(-10℃/km)이라 한다.","page":251},{"q":"이슬점 온도(dew point)의 정의로 옳은 것은?","o":["공기 1㎥ 중에 포함된 수증기의 g수","공기 중 수증기가 포화되기 위하여 냉각되어야 하는 온도","포화수증기압에 대한 현재 수증기압의 비","혼합기체 중 수증기의 부분압력"],"a":1,"e":"이슬점 온도는 공기 중에 수증기가 포화되기 위하여 냉각되어야 하는 온도이며 이 온도에 도달하면 이슬이 맺히기 시작한다.","page":250},{"q":"우리나라의 전이고도(Transition Altitude)는?","o":["14,000ft","18,000ft","10,000ft","3,000ft"],"a":0,"e":"전이고도는 나라마다 다르며 우리나라 및 일본은 14,000ft, 미국은 18,000ft이다.","page":252},{"q":"QFE 고도계 설정방식에 대한 설명으로 옳은 것은?","o":["고도계를 표준대기압 29.92inHg에 맞춘다.","활주로의 해면고도(표고)가 고도계에 표시된다.","우리나라에서는 전이고도 14,000ft 이상에서 사용한다.","현지 기압으로 맞추어 활주로 출발 시 고도계가 0ft를 나타내도록 한다."],"a":3,"e":"QFE는 활주로 표고로부터의 고도를 표시하도록 현지 기압으로 맞추어 출발 시 0ft를 지시하는 Zero Setting 방식이다.","page":253},{"q":"북반구 고기압권 내 지상 바람의 흐름으로 옳은 것은?","o":["중심을 향해 반시계방향으로 불어 들어간다.","중심을 향해 시계방향으로 불어 들어간다.","중심 주위를 시계방향으로 회전하며 불어 나간다.","중심 주위를 반시계방향으로 회전하며 불어 나간다."],"a":2,"e":"고기압권 내 바람은 북반구에서 중심 주위를 시계방향으로 회전하며 불어 나간다.","page":253},{"q":"한랭고기압에 대한 설명으로 옳은 것은?","o":["대기대순환에 의해 역학적으로 생긴다.","3km 정도 상공에서 고기압 성질이 없어질 정도로 키가 작다.","상공으로 갈수록 고기압이 더욱 현저하다.","공기의 침강으로 온난건조하여 맑은 날씨가 특징이다."],"a":1,"e":"한랭고기압은 겨울철 고위도 대륙의 복사냉각으로 생기며 3km 정도 상공에서 고기압 성질이 없어지는 키 작은 고기압이다. 나머지는 온난고기압의 특성이다.","page":254},{"q":"바람이 약해 풍향을 확실하게 결정할 수 없어 정온(calm)으로 기록하는 풍속 기준은?","o":["1.5m/s(3knot) 이하","1m/s(2knot) 이하","2m/s(4knot) 이하","0.5m/s(1knot) 이하"],"a":3,"e":"풍속이 0.5m/s(1knot) 이하일 때를 정온이라 하며 풍향은 '00'으로 표기한다.","page":255},{"q":"전향력(코리올리 힘)에 대한 설명으로 옳은 것은?","o":["적도에서는 0이고 극에서 최대가 된다.","적도에서 최대이고 극에서 0이 된다.","위도와 관계없이 일정하다.","북반구에서 운동하는 물체는 왼쪽으로 편향된다."],"a":0,"e":"전향력은 적도에서 0이며 위도가 증가함에 따라 증가하여 극에서 최대가 되고, 북반구에서는 오른쪽으로 편향시킨다.","page":256},{"q":"일반적으로 지표마찰력의 영향을 거의 받지 않게 되는 고도는 지면으로부터 약 몇 m 이상인가?","o":["약 100m","약 600m","약 2,000m","약 6,000m"],"a":1,"e":"거친 지면의 영향은 고도가 높아짐에 따라 감소되어 일반적으로 지면으로부터 600m 이상에서는 지표마찰력의 영향을 거의 받지 않는다.","page":257},{"q":"열대성 저기압을 태풍으로 분류하는 중심부 최대풍속 기준은?","o":["11m/s 이상","25m/s 이상","17m/s 이상","33m/s 이상"],"a":2,"e":"태풍(열대성 저기압)은 중심부의 최대 풍속이 17m/s 이상일 때를 말하며 폭풍우를 동반한다.","page":258},{"q":"푄(Foehn) 현상에 대한 설명으로 옳지 않은 것은?","o":["우리나라 동해 지역에서 흔히 나타난다.","습윤 공기가 산을 오를 때 1km당 약 5℃씩 온도가 감소한다.","산을 내려오는 건조 공기는 1km당 약 10℃씩 온도가 상승한다.","풍하측으로 내려온 공기는 처음보다 차고 습해진다."],"a":3,"e":"푄은 산 정상 부근에서 비를 내린 후 건조한 공기가 산을 내려가며 단열압축으로 온도가 높아지는 현상이다.","page":260},{"q":"여름철 더위와 폭염을 가져오는 북태평양기단의 기호와 성질로 옳은 것은?","o":["mT, 고온다습","cP, 한랭건조","mP, 한랭다습","cT, 온난건조"],"a":0,"e":"북태평양기단은 해양성 열대기단(mT)으로 고온다습하며 주로 여름에 발달한다.","page":261},{"q":"한랭전선의 특성으로 옳은 것은?","o":["이동속도가 느리고 경사가 완만하다.","넓은 지역에 걸쳐 약한 강수가 나타난다.","이동속도가 빠르고 경사가 크며 좁은 지역에 강한 강수가 나타난다.","통과 후 기온이 상승하고 남풍이 분다."],"a":2,"e":"한랭전선은 찬 공기가 파고들어 이동속도가 빠르고 온난전선보다 기울기가 크며 좁은 지역에 강한 강수가 나타난다.","page":263},{"q":"정체전선의 이동속도 기준으로 옳은 것은?","o":["5km/hr 미만","10km/hr 미만","20km/hr 미만","30km/hr 미만"],"a":1,"e":"정체전선은 움직이지 않거나 움직여도 매우 느리게(10km/hr 미만) 움직이는 전선이다.","page":264},{"q":"다음 중 중층운에 해당하는 구름은?","o":["권운(CI)","층적운(SC)","적운(CU)","고적운(AC)"],"a":3,"e":"중층운(운저 2~6km)에는 고적운(Altocumulus)과 고층운(Altostratus)이 있다.","page":266},{"q":"구성입자가 수적일 때 안개로 정의하는 시정 기준은?","o":["1km 미만","5km 미만","500m 미만","2km 미만"],"a":0,"e":"일반적으로 구성입자가 수적으로 되어 있으면서 시정이 1km 미만일 때를 안개라고 한다.","page":269},{"q":"해상에서 형성되는 안개의 대부분으로, 해무(sea fog)라고 불리는 안개는?","o":["복사안개","활승안개","이류안개","증발안개"],"a":2,"e":"온난다습한 공기가 찬 지면으로 이류하여 발생하는 이류안개로, 해상 안개는 대부분 이류안개이며 해무라 부른다.","page":270},{"q":"우리나라 부근에서 겨울철에 주로 발생하는 폐색전선의 형태는?","o":["온난형 폐색전선","한랭형 폐색전선","중립형 폐색전선","정체형 폐색전선"],"a":1,"e":"우리나라 부근에서는 겨울철에는 한랭형이, 여름철에는 중립형이나 온난형 폐색전선이 많이 발생한다.","page":263}]},{"id":"weather-3","title":"제3장 비행안전에 관련된 기상현상","pages":[271,280],"goal":"난류·산악파·뇌우·다운버스트·우박·번개·급변풍·마이크로버스트·착빙·해무·황사 등 비행안전 위해 기상의 발생조건, 강도 기준, 조종사 대처를 알아야 한다.","summary":"난류의 강도는 수직가속도(g)로 표시하며 light 0.1~0.3g, moderate 0.4~0.8g, severe 0.9~1.2g, extreme 1.2g 이상이다. 산악파는 안정 대기에서 강풍이 산등성이를 가로지를 때 생기며 말린구름 내부·하층과 풍하측 하강기류가 가장 위험하다. 뇌우는 불안정 대기·상승운동·높은 습도의 3조건으로 형성되어 적운–성숙–소멸 단계를 거치며, 다운버스트·마이크로버스트·저고도 급변풍(지상 2,000ft 이하)은 이착륙에 치명적이다. 착빙은 과냉각 물방울(0~-20℃)과 0℃ 미만의 기체 표면이 조건이며 심한 착빙은 0~-10℃에서, 맑은 착빙이 가장 위험하고 기화기 착빙은 22~-10℃의 넓은 범위에서 생긴다.","sections":[{"title":"3.1 난류","page":271,"points":["난류(Turbulence)는 지표면의 불균등한 가열과 기복·수목·건물 등에 의한 회전기류와 바람 급변의 결과로 불규칙하게 변동하는 대기의 흐름이며, 지상에서는 스콜·돌풍 등에서 나타난다.","난류 발생 상황: CB 형성 시, 산악파, 청천난류(CAT), 지표면 전선, 항공기 후류, 저고도 급변풍.","난류 강도는 항공기가 받는 수직방향 가속도를 중력가속도 g로 표시하며, 충격은 항공기의 속도·크기·중량·안정도에 좌우된다.","약정도(light): 소규모 적운 내부·부근, 국지 가열 지면 위 청천대류, 하층 5,000ft 내 15kt 정도 바람 등.","중정도(moderate): 능선 수직 풍속성분 25~50kt이면 풍하측 150mile, 50kt 이상이면 300mile까지; 5,000ft 아래 지상풍속 25kt 초과; 연직 바람시어 6kt/1,000ft 또는 수평 18kt/150mile 초과.","심한정도(severe): 능선 수직 풍속 50kt 초과 시 풍하측 150mile, 25~50kt 시 50mile까지; 발달기·성숙기 뇌운 내부; 연직 바람시어 10kt/1,000ft 또는 수평 50kt/90mile 초과.","[표 3-1] 수직가속도·풍속변동폭: light 0.1-0.3g·15kt 이하(약간의 흔들림), moderate 0.4-0.8g·15~25kt(조종통제력 유지), severe 0.9-1.2g·25~50kt(순간적 조종통제력 상실), extreme 1.2g 이상·50kt 이상(항공기 손상, 조종불능).","severe 난류는 heavy 난류라고도 하며, extreme 난류는 뇌우를 제외하고는 드문 현상이다."]},{"title":"3.2 산악파","page":272,"points":["산악파(Mountain Wave)는 역전층 기류가 있거나 대기가 안정된 산 정상에 강한 바람이 산등성이를 가로질러 불 때 발생한다.","겨울철 한랭전선 이동과 함께 850hPa 고도(약 5,000ft)에서 역전층이 자주 발생하며, 봉우리 하나보다 여러 개 연달아 있는 산맥에서 자주 발생한다.","모자구름(cap cloud): 산맥 정상에서 형성되어 대부분 풍상측에 몰려 있으며 산마루를 차폐하므로 항상 피해야 한다.","말린구름(rotor cloud): 풍하측에 일렬로 늘어선 적운처럼 보이며 난류를 가장 잘 보여줌; 말린구름 내부 및 하층과 풍하측 하강기류 지역은 산악파에서 가장 위험한 지역.","렌즈구름(lenticular cloud): 정체성으로 계속 형성되며 말린구름보다 높은 20,000ft 이상에서 형성, 윤곽은 부드러우나 기류 요란 시 거칠게 보임."]},{"title":"3.3 뇌우","page":273,"points":["뇌우는 천둥과 번개를 동반하는 적란운 또는 적란운의 집합체로 폭우·우박·돌풍·번개를 동반해 짧은 시간에 큰 항공 재해를 가져올 수 있다.","열대지방은 연중, 우리나라 같은 중위도는 봄~여름~가을에 뇌우 가능성이 있고, 한랭전선이 빠르게 통과하면 겨울에도 드물게 발생한다.","발달 단계: 적운 단계(상승기류만) → 성숙 단계(상승·하강기류 공존) → 소멸 단계(하강기류 우세 후 소멸).","형성조건 3가지(모두 만족): ① 불안정 대기(조건부 불안정·대류 불안정) ② 상승운동(자유대류고도 LFC 도달) ③ 높은 습도.","상승작용 요인: 일사에 의한 대류, 지형에 의한 강제상승, 전선상 온난공기 상승, 저기압성 수렴, 상층냉각에 의한 불안정, 이류 등.","수증기가 많을수록 응결 시 잠열이 방출되어 더 쉽게 자유대류고도에 도달한다.","[표 3-2] 성숙단계: 구름 꼭대기 심한 난류·쇠모루(Anvil), 강수를 동반한 강한 하강기류; 구름 꼭대기 온도가 -20℃가 될 때 방전 시작, 아주 심한 방전은 쇠퇴단계에 발생."]},{"title":"3.4 다운버스트","page":275,"points":["뇌우 성숙 단계의 하강기류가 지표면에 도달하자마자 빠르게 퍼져 유출 기류를 만드는 현상을 다운버스트(downburst)라 한다.","유출 기류의 직경은 유출 후 경과시간에 따라 거의 선형적으로 증가한다.","10~15분 안에 최대로 유출되고 발산된다."]},{"title":"3.5 우박(hail)","page":275,"points":["적운·적란운 속 강한 상승운동으로 빙정 입자가 직경 2cm 이상의 강수 입자로 성장해 떨어지는 얼음덩어리가 우박이다.","작은 빙정 입자가 강한 상승기류로 높은 고도로 이동하면서 과냉각 수적과 충돌·흡착하여 성장한다.","상승기류가 충분히 강하면 우박은 다시 위로 옮겨지며 지상으로 떨어질 만큼 커질 때까지 계속 성장한다.","우박은 매우 강한 상승기류가 있는 적란운 정상 부근에서 적란운 밖으로 떨어질 수 있다."]},{"title":"3.6 번개와 천둥","page":275,"points":["번개는 적란운 내부의 음·양 전하 사이 또는 구름 하부 음전하와 지면 양전하 사이에서 발생하는 불꽃 방전이다.","적란운 상부에는 양전하, 하부에는 음전하가 축적되고 지면에는 양전하가 유도된다.","구름 하부 음전하가 계단 선도를 만들어 지표 돌출부의 양전하와 만나 방전하며, 산 정상·높은 빌딩·나무꼭대기·안테나·탑 등 높은 지점이 번개 맞기 쉽다.","방전은 수 cm 방전 통로의 공기를 순식간에 15,000~20,000℃까지 가열하여 폭발적 팽창의 충격파가 음파로 바뀐 것이 천둥이다.","음파가 빛보다 느리므로 번개 관측 후 천둥소리까지의 시간차로 번개까지의 대략적인 거리를 알 수 있다."]},{"title":"3.7 급변풍(Wind shear)","page":276,"points":["급변풍은 이착륙 과정에 매우 큰 영향을 주며, 활주로 근처에서 정풍·배풍의 급격한 증감으로 실속이나 비정상적 고도 상승을, 측풍으로 활주로 이탈을 초래한다.","최종 접근로·이륙로·이륙 직후 상승로를 따라 발생하는 지상 2,000ft 이하의 급변풍을 저고도 급변풍(low level wind shear)이라 한다.","저고도 급변풍 강도는 연직 급변풍 강도(kt/100ft)로 나타낸다.","[표 3-3] 약함 4.0 미만, 보통 4.0~7.9, 강함 8.0~11.9, 아주 강함 12 이상(kt/100ft)."]},{"title":"3.8 마이크로버스트","page":277,"points":["마이크로버스트(microburst)는 대류활동에 연관된 특수한 급변풍으로, 뇌우뿐 아니라 여름철 천둥·번개 없는 소규모 대류운과 관련된 강한 하강기류이다.","가시적 강수를 동반하지만 강수가 지표 도달 전 증발하면 보이지 않아 위험이 없어 보이는 지역에서도 사고를 유발한다.","하강기류가 지표에 처음 도달한 후 5분 내외에 강화되며 수평으로 바깥쪽으로 퍼진다.","수평 규모 1~3km, 지속시간 5~15분, 그중 2~4분 정도에 강한 급변풍이 나타난다."]},{"title":"3.9 착빙","page":277,"points":["착빙은 빙결온도 이하에서 노출된 물체에 과냉각 물방울 또는 구름 입자가 충돌해 얼음 피막을 형성하는 현상이다.","형성 조건: ① 대기 중 과냉각 물방울이 존재하는 비·구름 속 비행 ② 항공기 표면 자유대기온도 0℃ 미만.","과냉각 물방울은 0~-20℃에서 자주 관측되고 심한 착빙은 보통 0~-10℃에서 발생하며, 운중 온도 -20℃ 미만이면 물방울이 이미 빙결되어 착빙이 잘 일어나지 않는다(드물게 -40℃에서도 발생).","제트기는 착빙이 가장 적고, 착빙방지장치가 없고 습한 저고도를 비행하는 소형 왕복기관 항공기에서 가장 많으며, 헬리콥터는 회전날개에서 착빙 가능성이 가장 높다.","구조(기체) 착빙: 날개 끝·프로펠러·안테나·앞유리·피토관 등에 쌓여 운항효율 감소·실속 유발 — 맑은 착빙(수적 큼, 투명·단단, 가장 위험), 거친 착빙(수적 작음, -10~-20℃, 불투명·우유빛·부서지기 쉬움), 혼합 착빙.","서리 착빙: 이슬점 0℃ 이하에서 수증기가 직접 빙결; 표면을 거칠게 하고 항력 증가·양력 약화, 단단한 서리는 실속을 5~10% 증가시킬 수 있어 이륙 전 모든 서리를 제거해야 한다.","유도착빙: 공기흡입구 착빙(동력 감소)과 기화기 착빙(단열팽창과 연료 기화로 냉각, 22℃~-10℃의 넓은 기온 영역, 엔진 완전 정지 가능).","[표 3-4] 대처: TRACE 1시간 이상 지속되지 않으면 방빙·제빙 불필요; LGT 가끔 가동 및 방향·고도 변경; MOD 가동 및 방향·고도 변경; SEV 신속한 방향·고도 변경."]},{"title":"3.10 해무","page":280,"points":["해무(Sea Fog)는 초여름부터 해안 지역에서 자주 발생한다.","광범위한 고기압권에 위치하고 저기압·전선 영향이 없으며 바람이 거의 없을 때 발생한다.","해수면 온도 20℃보다 낮을 때, 온도와 노점온도차 0~2℃, 해수면 온도와 노점온도차 0~1℃일 때 발생한다.","지상 역전층 또는 4,000~5,000ft 대기의 역전층 현상이 관찰될 때 발생한다."]},{"title":"3.11 황사","page":280,"points":["황사(Yellow Sand)는 중국 고비사막과 몽골 사막에서 발생한다.","강한 편서풍을 타고 상공으로 올라가 넓은 지역까지 영향을 미친다.","우리나라는 2월~4월에 자주 나타나며 시정장애를 가져온다."]}],"memorize":[{"k":"난류 강도 표시 방법","v":"항공기 수직방향 가속도를 중력가속도 g로 표시","page":271},{"k":"난류 강도별 수직가속도","v":"light 0.1-0.3g / moderate 0.4-0.8g / severe 0.9-1.2g / extreme 1.2g 이상","page":272},{"k":"난류 강도별 풍속 변동폭","v":"light 15kt 이하 / moderate 15~25kt / severe 25~50kt / extreme 50kt 이상","page":272},{"k":"중정도 난류(산악지역)","v":"능선 수직 풍속 25~50kt → 풍하측 150mile, 50kt 이상 → 300mile까지","page":271},{"k":"심한정도 난류(산악지역)","v":"능선 수직 풍속 50kt 초과 → 풍하측 150mile, 25~50kt → 50mile까지","page":272},{"k":"moderate 난류 바람시어","v":"연직 6kt/1,000ft 또는 수평 18kt/150mile 초과","page":272},{"k":"severe 난류 바람시어","v":"연직 10kt/1,000ft 또는 수평 50kt/90mile 초과","page":272},{"k":"산악파 최위험 지역","v":"말린구름(rotor cloud) 내부 및 하층, 풍하측 하강기류 지역","page":273},{"k":"렌즈구름 고도","v":"20,000ft 이상(말린구름보다 고고도)","page":273},{"k":"뇌우 형성 3조건","v":"불안정 대기, 상승운동, 높은 습도","page":273},{"k":"뇌우 발달 단계","v":"적운(상승기류만) → 성숙(상승·하강 공존) → 소멸(하강기류 우세)","page":273},{"k":"뇌우 방전 시작","v":"구름 꼭대기 온도 -20℃일 때 시작, 아주 심한 방전은 쇠퇴단계","page":274},{"k":"다운버스트 최대 유출","v":"10~15분 안에 최대로 유출·발산","page":275},{"k":"우박 크기","v":"직경 2cm 이상의 얼음덩어리","page":275},{"k":"번개 방전 통로 온도","v":"15,000~20,000℃","page":276},{"k":"저고도 급변풍","v":"지상 2,000ft 이하의 급변풍(접근로·이륙로·상승로)","page":276},{"k":"저고도 급변풍 강도(kt/100ft)","v":"약함 <4.0 / 보통 4.0~7.9 / 강함 8.0~11.9 / 아주 강함 ≥12","page":277},{"k":"마이크로버스트 규모","v":"수평 1~3km, 지속 5~15분, 강한 급변풍 2~4분, 지표 도달 후 5분 내외 강화","page":277},{"k":"착빙 조건","v":"과냉각 물방울 존재 + 항공기 표면 자유대기온도 0℃ 미만","page":277},{"k":"착빙 온도 범위","v":"과냉각 물방울 0~-20℃, 심한 착빙 0~-10℃, -20℃ 미만은 잘 안 생김","page":277},{"k":"가장 위험한 구조 착빙","v":"맑은 착빙(clear icing) — 투명·단단, 날개 형태 크게 변형","page":278},{"k":"거친 착빙","v":"수적 작음, -10~-20℃, 불투명·우유빛, 부서지기 쉬움","page":278},{"k":"서리의 실속 영향","v":"단단한 서리는 실속을 5~10% 증가 → 이륙 전 모든 서리 제거","page":279},{"k":"기화기 착빙 기온 영역","v":"22℃ ~ -10℃ (외부 온도에 관계없이 발생)","page":279},{"k":"착빙 강도 4단계","v":"미약함(TRACE) / 약함(LGT) / 보통(MOD) / 심함(SEV)","page":279},{"k":"해무 발생 수온·노점 조건","v":"해수면 온도 20℃보다 낮음, 기온-노점 0~2℃, 해수면온도-노점 0~1℃","page":280},{"k":"해무 역전층 조건","v":"지상 역전층 또는 4,000~5,000ft 역전층","page":280},{"k":"황사 발생지·시기","v":"중국 고비사막·몽골 사막, 우리나라 2월~4월","page":280}],"quiz":[{"q":"비행 중 항공기가 조우하는 난류의 강도를 표시하는 방법은?","o":["풍속의 절대값으로 표시","기압 변화율로 표시","수직방향 가속도를 중력가속도 g로 표시","기온감률로 표시"],"a":2,"e":"난류의 강도는 항공기가 조우하는 난류에 대하여 수직방향 가속도의 정도를 중력가속도 g를 사용하여 표시한다.","page":271},{"q":"중정도(moderate) 난류의 수직가속도 범위는?","o":["0.1~0.3g","0.4~0.8g","0.9~1.2g","1.2g 이상"],"a":1,"e":"[표 3-1]에서 moderate 난류는 0.4~0.8g, 풍속 변동폭 15~25kt이며 조종통제력을 상실하지는 않는다.","page":272},{"q":"산악파에서 가장 위험한 지역은?","o":["모자구름의 풍상측 상부","20,000ft 이상 렌즈구름 위의 맑은 지역","산맥 풍상측의 완만한 경사면","말린구름 내부 및 그 하층과 풍하측 하강기류 지역"],"a":3,"e":"말린구름 내부 및 그 하층이나 말린구름 풍하측의 하강기류 지역은 산악파에서 가장 위험한 지역이다.","page":273},{"q":"뇌우가 형성되기 위한 기본 조건이 아닌 것은?","o":["강한 지상 역전층에 의한 안정한 대기","불안정 대기","상승운동","높은 습도"],"a":0,"e":"뇌우 형성의 3가지 조건은 불안정 대기, 상승운동, 높은 습도이며 안정한 대기는 해당하지 않는다.","page":273},{"q":"뇌우의 성숙 단계에 대한 설명으로 옳은 것은?","o":["세포 내에 오직 상승기류만 있다.","하강기류만 남아 약해지며 사라진다.","상승기류와 하강기류가 공존한다.","강수현상이 거의 없다."],"a":2,"e":"뇌우는 상승기류만 있는 적운 단계, 상승·하강기류가 공존하는 성숙 단계, 하강기류가 우세한 소멸 단계로 구성된다.","page":273},{"q":"우박은 빙정 입자가 직경 얼마 이상의 강수 입자로 성장하여 떨어지는 얼음덩어리인가?","o":["2cm 이상","5mm 이상","1cm 이상","5cm 이상"],"a":0,"e":"강한 상승운동에 의해 빙정 입자가 직경 2cm 이상의 강수 입자로 성장하여 떨어지는 얼음덩어리가 우박이다.","page":275},{"q":"다운버스트의 유출 기류가 최대로 유출·발산되기까지 걸리는 시간은?","o":["1~2분","3~5분","30~60분","10~15분"],"a":3,"e":"유출 기류의 직경은 시간에 따라 거의 선형적으로 증가하여 10~15분 안에 최대로 유출되고 발산된다.","page":275},{"q":"저고도 급변풍(low level wind shear)의 정의에 해당하는 고도 범위는?","o":["지상 1,000ft 이하","지상 2,000ft 이하","지상 5,000ft 이하","지상 500ft 이하"],"a":1,"e":"최종 접근로·이륙로·이륙 직후 상승로를 따라 발생하는 지상 2,000ft 이하의 급변풍을 저고도 급변풍이라 한다.","page":276},{"q":"연직 급변풍 강도가 9.0kt/100ft일 때 저고도 급변풍 강도 구분은?","o":["보통","강함","아주 강함","약함"],"a":1,"e":"[표 3-3]에서 8.0~11.9kt/100ft는 강함, 4.0~7.9는 보통, 12 이상은 아주 강함이다.","page":277},{"q":"마이크로버스트의 수평 규모와 지속시간으로 옳은 것은?","o":["수평 10~20km, 30~60분","수평 100m 이하, 1분 이내","수평 1~3km, 5~15분","수평 5~10km, 1~2시간"],"a":2,"e":"마이크로버스트의 수평적 규모는 1~3km 정도이고 지속시간은 5~15분이며 그중 2~4분 정도에 강한 급변풍이 나타난다.","page":277},{"q":"심한 착빙이 보통 발생하는 온도 범위는?","o":["0~-10℃","-20~-30℃","-30~-40℃","0~5℃"],"a":0,"e":"과냉각 물방울은 0~-20℃에서 자주 관측되며 심한 착빙은 보통 0~-10℃에서 발생한다.","page":277},{"q":"투명하고 단단하며 날개 형태를 크게 변형시켜 구조 착빙 중 가장 위험한 형태는?","o":["거친 착빙(rime icing)","서리 착빙(frost icing)","혼합 착빙(mixed icing)","맑은 착빙(clear icing)"],"a":3,"e":"맑은 착빙은 무겁고 단단하며 표면에 단단히 붙어 날개 형태를 크게 변형시키므로 구조 착빙 중 가장 위험하다.","page":278},{"q":"항공기 표면에 부착된 단단한 서리는 실속을 약 몇 % 증가시킬 수 있는가?","o":["1~2%","20~30%","5~10%","약 50%"],"a":2,"e":"서리는 표면을 거칠게 하고 항력을 증가시켜 양력을 약화시키며, 단단한 서리는 실속을 5~10% 증가시킬 수 있어 이륙 전 모두 제거해야 한다.","page":279},{"q":"기화기 착빙이 관측되는 기온 영역으로 옳은 것은?","o":["0~-20℃","22℃~-10℃","-10~-40℃","30~10℃"],"a":1,"e":"기화기 착빙은 단열팽창과 연료 기화에 의한 냉각으로 외부 온도에 관계없이 22℃~-10℃의 넓은 기온 영역에서 관측된다.","page":279},{"q":"해무가 발생하는 기상조건으로 옳지 않은 것은?","o":["해수면 온도가 25℃보다 높을 때","광범위한 고기압권에 위치할 때","바람이 거의 없을 때","해수면 온도와 노점온도차가 0~1℃일 때"],"a":0,"e":"해무는 해수면의 온도가 20℃보다 낮을 때 발생한다.","page":280},{"q":"우리나라에서 황사가 자주 나타나는 시기는?","o":["6월~8월","9월~11월","11월~1월","2월~4월"],"a":3,"e":"황사는 중국 고비사막과 몽골 사막에서 발생하며 우리나라는 2월~4월에 자주 나타나 시정장애를 가져온다.","page":280}]},{"id":"weather-4","title":"제4장 일기도와 비행계획","pages":[281,286],"goal":"지상일기도·국제 일기기호를 읽고 시계비행계획을 위한 기상분석(구름·운고·상층풍)을 할 수 있어야 한다.","summary":"지상일기도는 해면기압 분포·기온·풍향풍속·날씨·구름을 분석하는 기본 일기도로, 등압선은 1,000hPa 기준 4hPa 간격으로 그리며 간격이 좁을수록 바람이 강하다. 국제 일기기호는 바람(반깃 5kts, 깃 10kts, 깃발 50kts)·전선·운량·운형·현재날씨를 표준 기호로 기록하며, 관측지점 원 주위에 기온·이슬점·해면기압·기압변화량을 정해진 위치에 표시한다. 시계비행계획 시에는 지상일기도(고기압·저기압·전선), 등압면 일기도(850·700hPa), 상승곡선, 상층풍을 분석하고, 운량·운고·운형에 따라 VMC/IMC 여부를 판단해야 한다.","sections":[{"title":"4.1 일기도","page":281,"points":["이 장의 내용은 초경량비행장치 중 동력비행장치(타면/체중), 회전익비행장치(헬기/자이로), 동력패러글라이더, 유인자유기구에 해당된다.","지상일기도: 해면기압 분포, 지상기온, 풍향·풍속, 날씨, 구름의 종류와 높이 등을 분석하는 날씨분석의 기본 일기도로, 일정 시간 간격으로 작성한다.","등압선(isobar): 각 관측소 기압을 해면기압으로 보정해 기압이 같은 지점을 연결한 선.","등압선은 1,000hPa을 기준으로 4hPa 간격으로 그리며, 선 간격이 넓은 곳에는 2hPa 점선을 표시하기도 한다.","등압선은 도중에 없어지거나 서로 교차하지 않으며, 간격이 좁을수록 기압차가 커서 바람이 강하다.","지상기온 및 풍향/풍속 일기도: 지상 10m의 풍향·풍속(화살표)과 기온(색상)을 나타낸다."]},{"title":"4.2 국제 일기 기호","page":282,"points":["국제 일기 기호: 기상관측소에서 관측된 내용을 기록하는 데 사용하는 표준화된 기호.","바람 기호: 반깃 2m/s(5kts), 깃 5m/s(10kts), 깃발 25m/s(50kts).","지상 한랭전선: 찬 기단이 지상에 닿아 따뜻한 기단을 밀어냄 / 지상 온난전선: 따뜻한 기단이 지상에 닿아 찬 기단을 밀어냄.","폐색전선: 한랭전선이 온난전선을 앞질러 두 전선이 겹쳐진 전선 / 정체(정상)전선: 더운 기단과 찬 기단이 나란히 매우 천천히 이동하는 전선.","상층 온난·한랭전선: 지상에 닿지 않고 더 차가운 기단을 타고 올라가는 전선.","구름 약어: ST 층운, CI 권운, NS 난층운, CU 적운, CC 권적운, AS 고층운, CB 적란운, CS 권층운, AC 고적운, SC 층적운.","현재 날씨: 구름을 제외하고 관찰되는 모든 대기현상으로 광학·전기 현상과 모든 형태의 강우를 포함한다.","일기기호 읽기: 풍향선과 풍속선 사이각 120°, 풍속선은 풍향과 관계없이 항상 풍향선의 오른쪽 / 운량은 맑음은 빈 원, 흐림은 채운 원 / 현재기상은 원의 왼쪽 중간, 그 윗부분 기온·아랫부분 이슬점온도 / 해면기압은 윗부분, 기압변화량(지난 3시간)은 아랫부분."]},{"title":"4.2.6 일기기호의 해면기압·기압변화량 읽기","page":284,"points":["해면기압은 1/10hPa 단위로 표시하고 앞 두 자리(보통 10 또는 9)를 생략한다.","예: 410 → 1041.0hPa, 103 → 1010.3hPa, 987 → 998.7hPa, 872 → 987.2hPa.","기압변화량은 지난 3시간 동안 해면기압이 변한 양을 1/10hPa 단위 숫자로 나타낸다.","예: 1041.0hPa → 1038.3hPa이면 -27, 1038.3hPa → 1041.0hPa이면 +27."]},{"title":"4.3 시계비행계획을 위한 기상분석","page":284,"points":["지상일기도로 고기압·저기압·전선 등 중요 기상현상의 분포를 점검한다.","고기압권: 안개·연무·박무 등 시정장애가 자주 발생하고, 여름철 적운이 형성·발달하며 특히 오후 산악지역에서 급속히 발달할 수 있다.","저기압권 또는 저기압 접근 시: 이동속도·강수지역을 파악해야 하며 시정장애와 낮은 구름대가 형성된다.","전선: 구름상태, 풍향·풍속, 온도강하, 상승률 등으로 전선의 강도를 예측한다.","등압면 일기도: 대기압이 동일한 면을 나타내며 850hPa, 700hPa 차트는 고·저기압 발달과정이 묘사되어 비행계획에 중요하다.","상승곡선: 운형·운고·구름 형성·시정장애 예측 가능 / 습윤 경도율이 상승곡선보다 더 가파르면 불안정, 덜 가파르면 안정.","상층풍: 저고도 국지비행 시 무시하는 경향이 있으나, 난류는 각 층의 풍향·풍속이 현저히 다를 때 발생하므로 상층풍 분석은 필수다."]},{"title":"4.3.2 시계비행에 영향을 미치는 구름","page":285,"points":["운량은 지상에서는 쉽게 측정되나 공중에서 3/8, 5/8처럼 정확히 수치화하기 어렵고, 운형·이동에 따라 급변해 운중비행 가능성이 있으므로 항상 주의해야 한다.","저고도 운량은 국지비행과 관련되며, 하층운은 층운(ST), 층적운(SC), 난층운(NS), 적운(CU)과 적란운(CB)의 하층부로 구성된다.","운량 1/8~4/8: 구름을 피해 낮은 구름층 아래에서 시계비행 가능.","운량 5/8 이상: VMC(시계비행기상상태)인지 IMC(계기비행기상상태)인지 판단하는 것이 중요.","장주고도 1,000ft인 공항에서 실링이 1,500ft이면 VMC 하에서 Touch and Go 훈련비행이 가능할 수도 있다.","국지비행에 영향을 주는 구름: 층적운(회색 두루마리, 층쌘구름), 적운(여름 오후 뭉게구름, 쌘구름), 적란운(아주 높게 솟음, 번개·소나기·우박, 쌘비구름) 등."]}],"memorize":[{"k":"등압선 작성 기준","v":"1,000hPa 기준 4hPa 간격(간격 넓은 곳 2hPa 점선)","page":281},{"k":"등압선 간격과 바람","v":"간격이 좁을수록 기압차가 크고 바람이 강함, 등압선은 교차하거나 도중에 없어지지 않음","page":281},{"k":"풍향/풍속 일기도 기준 높이","v":"지상 10m","page":282},{"k":"반깃(짧은 선)","v":"2m/s(5kts)","page":282},{"k":"깃(긴 선)","v":"5m/s(10kts)","page":282},{"k":"깃발","v":"25m/s(50kts)","page":282},{"k":"폐색전선","v":"한랭전선이 온난전선을 앞질러 두 전선이 겹쳐진 전선","page":282},{"k":"정체(정상)전선","v":"더운 기단과 찬 기단이 나란히 매우 천천히 이동하는 전선","page":282},{"k":"구름 약어(상·중층)","v":"CI 권운, CC 권적운, CS 권층운, AS 고층운, AC 고적운","page":283},{"k":"구름 약어(하층·대류)","v":"ST 층운, SC 층적운, NS 난층운, CU 적운, CB 적란운","page":283},{"k":"풍향선과 풍속선 사이각","v":"120°, 풍속선은 항상 풍향선의 오른쪽","page":284},{"k":"일기기호 기온/이슬점 위치","v":"관측지점 왼쪽: 윗부분 기온, 아랫부분 이슬점온도","page":284},{"k":"해면기압 표기","v":"1/10hPa 단위, 앞 두 자리(10 또는 9) 생략: 410=1041.0, 103=1010.3, 987=998.7, 872=987.2hPa","page":284},{"k":"기압변화량","v":"지난 3시간 변화량, 1041.0→1038.3hPa이면 -27","page":284},{"k":"운량 기호","v":"맑음은 빈 원, 흐림은 원 전체를 채움","page":284},{"k":"중요 등압면 일기도","v":"850hPa, 700hPa 차트","page":285},{"k":"상승곡선 안정도 판단","v":"습윤 경도율이 상승곡선보다 더 가파르면 불안정, 덜 가파르면 안정","page":285},{"k":"운량 1/8~4/8","v":"구름을 피해 낮은 구름층 아래 시계비행 가능","page":285},{"k":"운량 5/8 이상","v":"VMC인지 IMC인지 판단이 중요","page":285},{"k":"하층운 구성","v":"ST, SC, NS, CU와 CB의 하층부","page":285},{"k":"난류 발생 조건(상층풍)","v":"각 상층마다 풍향·풍속이 현저하게 차이 날 때","page":285},{"k":"적란운(CB, 쌘비구름)","v":"아주 높게 솟은 구름, 번개·소나기·우박","page":286}],"quiz":[{"q":"지상일기도에서 등압선을 그리는 기준과 간격으로 옳은 것은?","o":["1,000hPa 기준 4hPa 간격","1,013hPa 기준 4hPa 간격","1,000hPa 기준 2hPa 간격","1,013hPa 기준 5hPa 간격"],"a":0,"e":"등압선은 1,000hPa을 기준으로 4hPa 간격으로 그리며, 간격이 넓은 곳에만 보조로 2hPa 점선을 표시한다.","page":281},{"q":"등압선에 대한 설명으로 옳지 않은 것은?","o":["기압이 같은 지점을 연결한 선이다","등압선은 필요에 따라 서로 교차하기도 한다","등압선 간격이 좁을수록 바람이 강하다","관측소 기압을 해면기압으로 보정하여 작성한다"],"a":1,"e":"등압선은 도중에 없어지거나 서로 교차하지 않는다.","page":281},{"q":"국제 일기기호에서 깃발 모양의 바람 기호 하나가 나타내는 풍속은?","o":["2m/s(5kts)","5m/s(10kts)","25m/s(50kts)","50m/s(100kts)"],"a":2,"e":"반깃 2m/s(5kts), 깃 5m/s(10kts), 깃발 25m/s(50kts)이다.","page":282},{"q":"한랭전선이 온난전선을 앞질러 두 전선이 겹쳐진 전선은?","o":["정체전선","상층 온난전선","지상 한랭전선","폐색전선"],"a":3,"e":"폐색전선은 한랭전선이 온난전선을 앞질러 갈 때 두 전선이 겹쳐진 전선이다.","page":282},{"q":"일기기호의 해면기압 표시가 ‘872’일 때 실제 해면기압은?","o":["987.2hPa","1087.2hPa","872.0hPa","1008.7hPa"],"a":0,"e":"해면기압은 1/10hPa 단위로 앞 두 자리(10 또는 9)를 생략하므로 872는 987.2hPa이다.","page":284},{"q":"일기기호 읽기에 대한 설명으로 옳지 않은 것은?","o":["풍향선과 풍속선 사이의 각은 120°가 되게 그린다","풍속선은 풍향에 따라 풍향선의 왼쪽 또는 오른쪽에 그린다","관측지점 왼쪽 윗부분에 기온, 아랫부분에 이슬점온도를 표시한다","기압변화량은 지난 3시간 동안의 해면기압 변화를 나타낸다"],"a":1,"e":"풍속선은 풍향과 관계없이 관측지점에서 보았을 때 항상 풍향선의 오른쪽에 그린다.","page":284},{"q":"3시간 동안 해면기압이 1038.3hPa에서 1041.0hPa로 변했다면 일기기호의 기압변화량 표기는?","o":["-27","+2.7","+27","-2.7"],"a":2,"e":"기압변화량은 1/10hPa 단위 숫자로 표시하며 2.7hPa 상승이므로 +27이다.","page":284},{"q":"상승곡선 분석 시 대기가 불안정하다고 판단되는 경우는?","o":["습윤 경도율과 상승곡선이 평행할 때","습윤 경도율이 상승곡선보다 덜 가파를 때","상층풍의 풍향이 일정할 때","습윤 경도율이 상승곡선보다 더 가파를 때"],"a":3,"e":"습윤한 경도율이 상승곡선보다 더 가파르면 불안정, 덜 가파르면 안정하다.","page":285},{"q":"시계비행 시 구름을 피해 낮은 구름층 아래에서 시계비행을 수행할 수 있는 운량은?","o":["1/8~4/8","5/8~7/8","8/8","운량과 관계없이 항상 가능"],"a":0,"e":"운량 1/8~4/8이면 구름을 피해 낮은 구름층 아래에서 시계비행이 가능하고, 5/8 이상이면 VMC/IMC 판단이 중요하다.","page":285},{"q":"교재에서 설명한 난류(Turbulence)의 발생 조건으로 옳은 것은?","o":["지상 기온이 높을 때에만 발생한다","각 상층마다 풍향·풍속이 현저하게 차이 날 때 발생한다","등압선 간격이 넓을 때 발생한다","고기압 중심에서 바람이 없을 때 발생한다"],"a":1,"e":"난류는 각 상층마다 풍향·풍속이 현저하게 차이가 날 때 발생하므로 비행계획 시 상층풍 분석이 필수다.","page":285},{"q":"지상일기도상 고기압권에 대한 설명으로 옳은 것은?","o":["넓은 강수지역이 형성된다","전선이 자주 통과한다","안개·연무·박무 등 시정장애가 자주 발생하고 여름철에는 적운이 발달할 수 있다","하층운이 전혀 형성되지 않는다"],"a":2,"e":"고기압권 내에서는 시정장애를 일으키는 안개·연무·박무가 자주 발생하며, 여름철 오후 산악지역에서 적운이 급속히 발달할 수 있다.","page":284},{"q":"아주 높게 솟아 번개가 치며 소나기나 우박을 내리는 구름(쌘비구름)은?","o":["층적운(SC)","적운(CU)","권운(CI)","적란운(CB)"],"a":3,"e":"적란운(CB)은 아주 높게 솟은 구름으로 번개, 소나기, 우박을 동반한다.","page":286}]},{"id":"weather-5","title":"제5장 항공기상업무","pages":[287,303],"goal":"항공기상청의 업무와 항공기상 용어, SIGMET·AIRMET·공항경보·급변풍경보·화산재정보의 발표 기준과 형식을 알아야 한다.","summary":"민간항공 기상지원 책임기관은 기상청 소속 항공기상청으로, 인천FIR을 감시하여 SIGMET·AIRMET·공항경보·급변풍경보를 발표하고 경량항공기·초경량비행장치에는 저고도 항공기상정보 포탈과 스마트폰 앱으로 정보를 제공한다. SIGMET은 심한 난류·착빙·산악파, 뇌전, 태풍, 화산재 등에 대해 4시간 이내 발표(화산재·태풍 12시간)·유효 4시간(최대 6시간)이며, AIRMET은 10,000ft 이하 저고도 운항에 영향을 주는 보통 강도 현상 등을 다룬다. 공항경보는 대설(24시간 신적설 3cm), 강풍(평균 25KT/순간 35KT), 호우(30mm/h, 50mm/3h) 등 기준으로 발표되고, 급변풍경보는 1,600ft(500m) 이하에서 15kt 이상 바람 변화 시 발표한다.","sections":[{"title":"5.1 항공기상 개요","page":287,"points":["비행 전 필수 확인 사항 중 하나는 비행 지역의 기상정보이며, 민간항공 기상지원 책임기관은 기상청 소속 항공기상청이다(인천 중구 공항로 272, amo.kma.go.kr).","항공기상청은 인천비행정보구역 내 기상현상을 지속 감시하고 필요 시 SIGMET, AIRMET, 공항경보, 급변풍경보를 발표한다.","국내선 항공기·헬리콥터에는 공항관측, 공항예보, 공항경보, 급변풍경보, 저고도 공역예보, SIGMET/AIRMET 정보를 제공한다.","기상정보는 항공고정통신망, FAX, 인터넷으로 제공되며, 공역예보는 항공기상청이 발표하고 홈페이지에 게시한다.","경량항공기·초경량비행장치 운용범위의 공역예보는 항공기상청 홈페이지 ‘저고도 항공기상정보 포탈’과 스마트폰 앱으로 제공된다.","스마트폰 앱 항목: 국내공항날씨, 세계공항날씨, 위성·레이더·낙뢰, METAR·TAF, AMOS 실황, 항공특보, 공역예보, 저고도기상(시정, 운고, 현천, 바람, 기온).","공역예보 SIGWX 구간: 지표면~10,000ft, 10,000~25,000ft, 25,000~63,000ft / 저고도 한반도 WINTEM은 2,000ft, 5,000ft, 10,000ft 고도별 제공.","한반도 WINTEM(상층바람기온자료) 기압면: 200, 300, 500, 700, 850hPa(약 1,500m/5,000ft), 925hPa(약 800m/2,500ft)."]},{"title":"5.2 항공기상 용어 정의","page":289,"points":["공항 표고: 착륙지역의 가장 높은 지점의 표고 / 표고(Elevation): 평균해면으로부터 지표면 위 또는 지표면에 붙은 점까지의 연직거리.","높이(Height): 특정 기준으로부터의 연직거리 / 고도(Altitude): 평균해수면으로부터의 연직거리 / 비행고도(FL): 1013.2hPa 기준 특정 기압 간격으로 분리된 일정 기압면.","기압고도계: QNH 설정 시 고도, QFE 설정 시 QFE 기준면으로부터의 높이, 1013.2hPa 설정 시 비행고도를 지시한다.","운항상 중요한 구름: 운저고도 1,500m(5,000ft) 미만 또는 가장 높은 최저구역고도 중 더 높은 고도보다 낮은 구름, 또는 운저와 관계없이 적란운(CB)·탑상적운(TCU).","시정: 밝은 배경에서 지면 근처의 적당한 크기 검은 물체를 인식할 수 있는 최대거리, 또는 불빛 없는 배경에서 1,000칸델라 불빛을 식별할 수 있는 최대거리 중 큰 값.","우세시정: 수평 원 또는 공항 지면의 적어도 절반에 도달하여 관측된 최대 시정값 / RVR: 활주로 중심선상 조종사가 활주로 표면표시·윤곽·중심선 불빛을 볼 수 있는 거리.","최저섹터고도(MSA): 항행무선시설 중심 반경 46km(25NM) 내 모든 물체 상공으로 300m(1,000ft) 최소 간격을 제공하는 가장 낮은 고도.","SIGMET 정보: 기상감시소(MWO)가 항로상 항공기 안전운항에 영향을 미칠 수 있는 기상현상 발생(예상)에 관해 발표 / AIRMET 정보: 이미 발표된 예보에 포함되지 않은 저고도 운항 안전 영향 현상에 대해 기상감시소가 발표."]},{"title":"5.3 항공기상특보 및 정보","page":291,"points":["항공기상특보: 계류 중 항공기를 포함한 지상 항공기, 공항시설·공항업무, 항공로 상 안전운항에 영향을 미칠 수 있는 기상현상을 국제적으로 합의된 약어로 서술한 것.","국제민간항공협약 부속서 3에 따른 항공기상특보 분류: SIGMET, AIRMET, 공항경보(Aerodrome Warning), 급변풍경보(Wind Shear Warning).","항공기상정보: 현재 및 예상 기상을 관제·운항관련 기관에 알릴 필요가 있을 때 제공하며, 공항기상정보와 화산재정보로 분류한다.","열대저기압: 조직화된 대류와 뚜렷한 저기압성 지상바람 순환이 있는 열대·아열대 바다의 비전선성 종관규모 저기압."]},{"title":"5.4 SIGMET","page":292,"points":["발표관서: 기상감시소(MWO) 역할을 하는 항공기상청.","발표시각: 현상 발생 예상 시각으로부터 4시간 이내, 화산재·태풍 SIGMET은 12시간 이내.","유효시간: 4시간 초과 불가, 화산재 구름·태풍 등 특별한 경우 6시간 초과 불가.","일련번호는 0001UTC 이후 새로 갱신되며, 불필요한 설명은 넣지 않고 뇌전·태풍 SIGMET에는 난류·착빙 사항을 포함하지 않는다.","대상 현상: 뇌전/우박 동반 뇌전, 태풍, 심한 난류, 심한 착빙, 심한 산악파, 강한 먼지·모래폭풍, 화산재, 방사성 구름.","식별군 순서: ICAO 지명약어(CCCC, 4자리) → 보고형태 지시자·일련번호 → 유효시간 → 발표 기상감시소 지명약어와 연자부호(-).","뇌전 약어: OBSC(연무·연기·어둠으로 모호), EMBD(구름층 내 끼어 있음), FRQ(구역의 75% 이상, 인접 뇌전 간격 거의 없음), SQL(선상 뇌전), 우박 동반 시 TSGR.","태풍(TC)은 10분 평균 지상풍 17m/s(34kt) 이상 / 난류는 EDR 최고값 0.7 초과 심한, 0.4~0.7 보통, 대류운과 연관해 사용 안 함 / SEV ICE (FZRA), HVY DS·SS, SEV MTW, VA, RDOACT CLD / 강도 INTSF·WKN·NC, 관측 OBS·예상 FCST."]},{"title":"5.5 AIRMET","page":296,"points":["AIRMET: 10,000ft 이하 저고도 운항 항공기에 영향을 미칠 수 있는 기상현상에 대해 기상감시소인 항공기상청이 발표하는 항공기상특보.","발표시각은 발생 예상 시각으로부터 4시간 이내, 유효시간은 4시간 초과 불가 / 10,000ft 이하 교통량 밀도를 고려해 지역항공항행협정에 따라 발표.","뇌전 또는 적란운 관련 AIRMET에는 난류·착빙 사항을 포함하지 않는다.","대상 현상(10,000ft, 산악 15,000ft 이하): 지상풍속, 지상시정, 뇌전, 산악차폐, 구름(CB·TCU), 보통착빙, 보통난류, 보통산악파.","SFC WIND: 평균풍속 30kt(15m/s) 이상 예상 지역(예: SFC WIND 35KT) / SFC VIS: 5,000m 이하 시정장애(예: SFC VIS 0800 FG).","뇌전·CB 분포: ISOL(구역의 50% 미만), OCNL(50~75%), FRQ(75% 이상) / 예: ISOL TSGR, OCNL CB / 산악차폐: MT OBSC.","구름: 지상 1,000ft(300m) 미만 운저의 BKN 또는 OVC 구역(예: BKN CLD 400/3000FT) / MOD ICE, MOD TURB, MOD MTW.","고도 표현 TOP FLnnn, FLnnn/nnn, SFC/FLnnn(예: FL350/400 = 35,000~40,000ft) / 이동 MOV E 20KT WKN, 정체 STNR / 관측 OBS AT 1210Z."]},{"title":"5.6 공항경보","page":299,"points":["공항경보: 계류 중 항공기 포함 지상 항공기, 공항시설·업무에 영향을 미칠 수 있는 기상현상에 대한 간결한 정보로, 항공기상청 또는 각 공항기상관서가 발표한다.","종류: 태풍, 황사, 운고, 저시정, 강풍, 호우, 대설, 뇌전, 어는강수, 서리, 지진해일, 화산재 침전물, 유독화학물질 및 부속서 3 부록 6의 기타 현상.","대설: 24시간 신적설 3cm 이상 발생 또는 예상.","강풍: 10분간 평균풍속 25KT 이상 또는 최대순간풍속 35KT 이상.","호우: 강우량 30mm/h 또는 50mm/3h 이상.","황사: 1시간 평균 PM10 농도 400㎍/m3 이상이 2시간 이상 지속 예상되고 시정 5,000m 이하 예상 시 / 운고·저시정: 기상관서·항공교통업무기관·운항자 간 협의 기준치 이하.","전문 순서: 공항 지명약어 → AD WRNG n(경보번호) → VALID 유효시간(UTC) → 기상현상 → OBS/FCST → INTSF/WKN/NC."]},{"title":"5.7 급변풍 경보","page":301,"points":["활주로 표면~1,600ft(500m) 사이 접근·이륙로 또는 선회접근 항공기, 착륙·이륙 주행 항공기에 영향을 줄 급변풍이 관측·예상될 때 발표한다.","급변풍 측정장비(LLWAS, Doppler radar, Sodar 등)로 바람 변화(Loss 또는 Gain)가 15kt 이상 관측되거나 지속 예상될 때 발표.","바람 변화가 30kt 이상이면 마이크로버스트 정보를 포함하여 발표.","접근·이륙 항공기 조종사로부터 급변풍 정보를 받으면 항공기 기종을 포함하여 발표.","전문: 공항 지시자 → WS WRNG n → 발표시간 VALID 유효시간(발표시간과 유효시작이 같으면 TLddhhmm) → WS 또는 MBST → REP AT/OBS/FCST → 원인 현상(SFC WIND 등)."]},{"title":"5.8 공항기상정보 / 5.9 화산재정보","page":302,"points":["공항기상정보: 현재 및 예상 공항기상을 관제·운항관련 기관에 알리는 정보로, 기상상황 및 전망, 특이기상현상·기상상황변화 등을 포함한다.","공항기상정보는 일 2회 제공하며 필요에 따라 수시 제공 가능.","화산재정보: 화산 폭발로 인한 화산재 확산이 항공기 운항에 영향을 미칠 것으로 예상될 때 관제·운항관련 기관에 알리는 정보.","화산재정보 포함사항: 화산위치, 화산이름, 최근분화현황, 필요 시 예상자료, 기타 관련 내용.","화산재정보 제공 대상: 우리나라 FIR에 12시간 내 영향 예상, 항공기 보고로 화산재 관측, 대규모 화산폭발로 운항에 상당한 영향 예상."]}],"memorize":[{"k":"민간항공 기상지원 책임기관","v":"기상청 소속 항공기상청","page":287},{"k":"저고도 기상정보 제공 채널","v":"항공기상청 홈페이지 ‘저고도 항공기상정보 포탈’, 스마트폰 앱","page":287},{"k":"앱 저고도기상 항목","v":"시정, 운고, 현천, 바람, 기온","page":287},{"k":"SIGWX 공역예보 구간","v":"지표~10,000ft, 10,000~25,000ft, 25,000~63,000ft","page":288},{"k":"저고도 한반도 WINTEM 고도","v":"2,000ft, 5,000ft, 10,000ft","page":288},{"k":"850hPa / 925hPa 대응 고도","v":"850hPa 약 1,500m(5,000ft), 925hPa 약 800m(2,500ft)","page":288},{"k":"공항 표고","v":"착륙지역의 가장 높은 지점의 표고","page":289},{"k":"운항상 중요한 구름","v":"운저 1,500m(5,000ft) 또는 최고 최저구역고도 중 높은 쪽 미만의 구름, 또는 운저 무관 CB·TCU","page":290},{"k":"비행고도(FL) 기준기압","v":"1013.2hPa","page":290},{"k":"고도계 설정별 지시값","v":"QNH→고도, QFE→QFE 기준면 높이, 1013.2hPa→비행고도","page":290},{"k":"시정 정의의 불빛 기준","v":"불빛 없는 배경에서 1,000칸델라 불빛 식별 최대거리","page":290},{"k":"최저섹터고도(MSA)","v":"항행무선시설 반경 46km(25NM) 내 모든 물체 상공 300m(1,000ft) 최소 간격","page":291},{"k":"항공기상특보 4종","v":"SIGMET, AIRMET, 공항경보, 급변풍경보","page":291},{"k":"항공기상정보 2종","v":"공항기상정보, 화산재정보","page":291},{"k":"SIGMET 발표시각","v":"발생 예상 4시간 이내, 화산재·태풍 12시간 이내","page":292},{"k":"SIGMET 유효시간","v":"4시간 초과 불가, 화산재·태풍 6시간 초과 불가","page":292},{"k":"SIGMET 일련번호 갱신","v":"0001UTC 이후 새로 갱신","page":292},{"k":"SIGMET 대상 현상","v":"뇌전(우박), 태풍, 심한 난류·착빙·산악파, 강한 먼지·모래폭풍, 화산재, 방사성 구름","page":292},{"k":"SIGMET 태풍 기준","v":"10분 평균 지상풍 17m/s(34kt) 이상","page":293},{"k":"EDR 난류 강도","v":"0.7 초과 심한난류, 0.4~0.7 보통난류","page":294},{"k":"AIRMET 대상 고도","v":"10,000ft 이하(산악지형 FL 15,000ft 이하)","page":296},{"k":"AIRMET 발표·유효시간","v":"발생 예상 4시간 이내 발표, 유효 4시간 초과 불가","page":296},{"k":"AIRMET SFC WIND 기준","v":"평균풍속 30kt(15m/s) 이상","page":297},{"k":"AIRMET SFC VIS 기준","v":"5,000m 이하 시정장애","page":297},{"k":"AIRMET 구름(CLD) 기준","v":"지상 1,000ft(300m) 미만 운저의 BKN 또는 OVC","page":298},{"k":"ISOL / OCNL / FRQ","v":"50% 미만 / 50~75% / 75% 이상","page":298},{"k":"공항경보 대설","v":"24시간 신적설 3cm 이상","page":300},{"k":"공항경보 강풍","v":"10분 평균 25KT 이상 또는 최대순간 35KT 이상","page":300},{"k":"공항경보 호우","v":"30mm/h, 50mm/3h 이상","page":300},{"k":"급변풍경보 기준","v":"활주로~1,600ft(500m), 바람 변화 15kt 이상(30kt 이상 마이크로버스트 포함)","page":301}],"quiz":[{"q":"우리나라 민간항공에 대한 기상지원 책임기관은?","o":["기상청 소속 항공기상청","국토교통부 항공교통본부","한국공항공사","항공안전기술원"],"a":0,"e":"민간항공에 대한 기상지원 책임기관은 기상청 소속 항공기상청이다.","page":287},{"q":"경량항공기·초경량비행장치 운용범위의 공역예보를 확인할 수 있도록 항공기상청이 제공하는 것은?","o":["VOLMET 전용 방송","저고도 항공기상정보 포탈과 스마트폰 앱","AFTN 단말기만 이용","국제 SIGWX 차트만 제공"],"a":1,"e":"경량항공기·초경량비행장치 운용범위의 공역예보는 항공기상청 홈페이지 ‘저고도 항공기상정보 포탈’과 스마트폰 앱으로 제공된다.","page":287},{"q":"‘운항상 중요한 구름’의 정의로 옳은 것은?","o":["운저고도 10,000ft 미만의 모든 구름","운량 5/8 이상의 모든 구름","운저고도 1,500m(5,000ft) 또는 가장 높은 최저구역고도 중 높은 쪽 미만의 구름, 또는 운저와 관계없이 CB·TCU","운저고도 1,000ft 미만의 층운만 해당"],"a":2,"e":"운항상 중요한 구름은 5,000ft(1,500m)나 최고 최저구역고도 중 높은 쪽 아래의 구름과, 운저에 관계없이 적란운·탑상적운이다.","page":290},{"q":"고도계를 1013.2hPa로 맞추었을 때 고도계가 지시하는 것은?","o":["평균해수면 기준 고도","QFE 기준면으로부터의 높이","공항 표고","비행고도(Flight Level)"],"a":3,"e":"QNH는 고도, QFE는 QFE 기준면으로부터의 높이, 1013.2hPa 설정 시에는 비행고도를 지시한다.","page":290},{"q":"최저섹터고도(MSA)의 정의에서 항행무선시설 중심으로부터의 반경과 장애물 최소 간격은?","o":["46km(25NM), 300m(1,000ft)","25km(13NM), 300m(1,000ft)","46km(25NM), 600m(2,000ft)","93km(50NM), 150m(500ft)"],"a":0,"e":"MSA는 항행무선시설 중심 반경 46km(25NM) 내 모든 물체 상공으로 300m(1,000ft)의 최소 간격을 제공하는 가장 낮은 고도이다.","page":291},{"q":"국제민간항공협약 부속서 3에 따른 항공기상특보에 해당하지 않는 것은?","o":["SIGMET 정보","화산재정보","공항경보","급변풍경보"],"a":1,"e":"항공기상특보는 SIGMET, AIRMET, 공항경보, 급변풍경보이며, 화산재정보는 공항기상정보와 함께 항공기상정보로 분류된다.","page":291},{"q":"일반적인 SIGMET의 발표시각과 유효시간 기준으로 옳은 것은?","o":["발생 예상 2시간 이내 발표, 유효 2시간","발생 예상 12시간 이내 발표, 유효 12시간","발생 예상 4시간 이내 발표, 유효 4시간 초과 불가","발생 예상 6시간 이내 발표, 유효 6시간 초과 불가"],"a":2,"e":"SIGMET은 발생 예상 시각으로부터 4시간 이내 발표하며 유효시간은 4시간을 초과하지 않는다(화산재·태풍은 12시간 이내 발표, 유효 6시간 이내).","page":292},{"q":"SIGMET 발표 대상 기상현상이 아닌 것은?","o":["심한 착빙","심한 산악파","화산재","보통 난류"],"a":3,"e":"SIGMET은 심한(severe) 난류·착빙·산악파 등을 대상으로 하며, 보통 난류는 AIRMET 대상이다.","page":292},{"q":"SIGMET에서 태풍(TC)으로 표현하는 기준은?","o":["10분간 평균 지상풍 17m/s(34kt) 이상","1분간 평균 지상풍 25m/s(50kt) 이상","10분간 평균 지상풍 10m/s(20kt) 이상","최대순간풍속 35kt 이
