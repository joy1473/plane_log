상"],"a":0,"e":"SIGMET의 태풍은 10분간 지상풍 평균풍속 17m/s(34kt) 이상인 태풍을 표현한다.","page":293},{"q":"SIGMET·AIRMET에서 난류 강도를 EDR(와도 소실률)로 구분할 때 ‘심한 난류’의 기준은?","o":["EDR 0.2 초과","EDR 최고값 0.7 초과","EDR 0.4~0.7","EDR 1.0 초과"],"a":1,"e":"EDR 최고값이 0.7 초과면 심한난류, 0.4~0.7이면 보통난류로 표현한다.","page":294},{"q":"AIRMET에 대한 설명으로 옳지 않은 것은?","o":["10,000ft 이하 저고도 운항 항공기에 영향을 주는 현상을 대상으로 한다","유효시간은 4시간을 초과하지 않는다","뇌전 또는 적란운 관련 AIRMET에도 난류와 착빙 사항을 반드시 포함한다","기상감시소 역할을 하는 항공기상청이 발표한다"],"a":2,"e":"AIRMET은 불필요한 설명을 넣지 않으며, 뇌전 또는 적란운과 관련된 AIRMET은 난류와 착빙 사항을 포함시키지 않는다.","page":296},{"q":"AIRMET에서 지상풍(SFC WIND)을 표현하는 평균풍속 기준은?","o":["15kt 이상","20kt 이상","25kt 이상","30kt(15m/s) 이상"],"a":3,"e":"AIRMET 지상풍은 평균풍속이 30kt(15m/s) 이상 예상되는 지역에 대해 단위와 함께 표현한다(예: SFC WIND 35KT).","page":297},{"q":"AIRMET에서 예상 구역의 50% 미만을 차지하는 적란운을 표현하는 약어는?","o":["ISOL","OCNL","FRQ","EMBD"],"a":0,"e":"ISOL은 50% 미만, OCNL은 50~75%, FRQ는 75% 이상을 차지할 때 사용한다.","page":298},{"q":"공항경보 발표기준 중 ‘강풍’의 기준으로 옳은 것은?","o":["10분간 평균풍속 15KT 이상 또는 최대순간풍속 25KT 이상","10분간 평균풍속 25KT 이상 또는 최대순간풍속 35KT 이상","1분간 평균풍속 30KT 이상","최대순간풍속 50KT 이상"],"a":1,"e":"공항경보 강풍은 10분간 평균풍속 25KT 이상 또는 최대순간풍속 35KT 이상인 현상이 발생 또는 예상될 때이다.","page":300},{"q":"공항경보 발표기준으로 옳지 않은 것은?","o":["대설: 24시간 신적설 3cm 이상","호우: 강우량 30mm/h 또는 50mm/3h 이상","운고: 항공기상청이 단독으로 정한 1,000ft 이하","뇌전: 해당 공항에 뇌전이 발생 또는 예상될 때"],"a":2,"e":"운고·저시정은 해당 공항의 기상관서, 항공교통업무기관 및 운항자 간 협의에 의한 기준치 이하일 때 발표한다.","page":300},{"q":"급변풍 경보에 대한 설명으로 옳은 것은?","o":["활주로 표면으로부터 5,000ft 이하에서만 적용된다","바람 변화가 10kt 이상이면 마이크로버스트 정보를 포함한다","조종사 보고에 의한 경우 항공기 기종은 포함하지 않는다","바람 변화(Loss 또는 Gain)가 15kt 이상 관측되거나 지속 예상될 때 발표한다"],"a":3,"e":"급변풍 경보는 활주로~1,600ft(500m) 구간에서 바람 변화 15kt 이상 시 발표하고, 30kt 이상이면 마이크로버스트 정보를 포함하며 조종사 보고 시 기종을 포함한다.","page":301},{"q":"화산재정보 제공 대상에 해당하는 것은?","o":["우리나라 비행정보구역에 화산재가 12시간 내 영향을 미칠 것으로 예상되는 경우","외국 화산이 분화 징후만 보이는 모든 경우","화산재가 48시간 이후 영향을 줄 것으로 예상되는 경우","지상 관측소에서 미세먼지가 관측된 경우"],"a":0,"e":"화산재정보는 우리 FIR에 12시간 내 영향 예상, 항공기 보고로 관측, 대규모 폭발로 상당한 영향이 예상될 때 제공한다.","page":303}]},{"id":"weather-6","title":"제6장 항공기상 예보","pages":[304,314],"goal":"공항예보(TAF), 이륙·착륙예보, 저고도 중요기상예보의 발표시각·유효시간·전문 형식과 변화 기준을 알아야 한다.","summary":"항공예보는 공항예보, 이륙예보, 착륙예보, 중요기상예보(고·중·저고도)로 분류되며, 새 예보는 이전의 동일 지역·유효시간 예보를 대체한다. 공항예보(TAF)는 보통 6~30시간 유효로 국제공항은 05·11·17·23UTC, 국내공항은 00·06·12·18UTC에 일 4회 발표하며 식별군·지상풍·시정·일기현상·구름·기온·변화군 순으로 작성한다. 착륙예보는 관측보고(METAR/SPECI)에 포함되는 2시간 유효의 경향예보로 BECMG·TEMPO·NOSIG 등을 사용하고, 저고도 중요기상예보는 10,000ft 이하 비행용 AIRMET을 지원한다.","sections":[{"title":"6.1 항공예보 개요","page":304,"points":["새로 발표한 예보는 이전에 발표된 동일 지역·동일 유효시간의 예보를 대체한다.","항공예보 분류: 공항예보(TAF), 이륙예보, 착륙예보, 중요기상예보(고고도·중고도·저고도).","6~30시간 유효시간의 공항예보는 비행계획 작성과 운항승무원 브리핑에 사용된다.","2~3시간 유효시간의 이착륙예보는 항공기의 이·착륙에 사용된다."]},{"title":"6.2 공항예보(TAF)","page":304,"points":["공항예보: 일정기간(보통 6~30시간) 공항에서 예상되는 지상풍, 수평시정, 일기, 구름 등 중요 기상현상을 국제 부호로 서술한 것으로 항공기상청의 항공기상관서가 발표한다.","발표시각: 국제공항 일 4회(05, 11, 17, 23UTC), 국내공항 일 4회(00, 06, 12, 18UTC) / 한 공항에 대해 주어진 발표시간에 하나의 예보만 발표.","유효시간 12시간 미만 TAF는 3시간 간격, 12~30시간 TAF는 6시간 간격으로 발표, 수정예보는 필요 시 발표.","유효시간: 발표시각 1시간 이후부터 30시간 이내, 새 TAF는 이전 TAF를 대체.","서술 순서: 식별군 → 지상풍 → 시정 → 일기현상 → 구름 → 기온 → 변화군 / 식별군 형식: TAF CCCC YYGGggZ Y1Y1G1G1/Y2Y2G2G2.","지상풍 dddff+KT/MPS: 돌풍이 평균보다 10kt(5m/s) 이상이면 G, 100kt(50m/s) 이상은 P99KT(P49MPS), VRB는 평균 3kt(1.5m/s) 미만 또는 우세풍향 예상 불가 시, 1kt(0.5m/s) 미만은 00000.","시정(4자리 우세시정): 800m 미만 50m 단위(예: 0350), 800~5,000m 미만 100m 단위, 5~10km 미만 1,000m 단위(예: 7000), 10km 이상 9999 / 일기현상은 최대 3개, 종료 시 NSW.","구름: FEW(1~2 oktas), SCT(3~4), BKN(5~7), OVC(8), 운고 100ft 단위 / 운항상 중요한 구름 없고 CAVOK 부적절 시 NSC / 하늘 차폐 시 수직시정 VVhshshs(100ft 단위)."]},{"title":"6.2.4 공항예보 구름 보고 순서·MSA·변화군","page":307,"points":["여러 운층 보고 순서: ① 최저운층(FEW·SCT·BKN·OVC) ② 3/8 이상 덮는 다음 운층(SCT·BKN·OVC) ③ 5/8 이상 덮는 다음 운층(BKN·OVC) ④ CB·탑상적운은 예상될 때마다 운형 표시.","구름정보는 5,000ft(1,500m)나 가장 높은 최저구역고도 중 높은 쪽 아래의 구름과 적란운 등 운항상 중요한 구름으로 제한한다.","최저섹터고도(MSA): 무선항공보안시설 중심 반경 46km(25해리) 내 모든 물체 높이로부터 최소 1,000ft(300m) 여유를 둔 비행안전최저고도.","공항별 MSA: 인천 3,900ft, 김포 4,000ft, 김해 5,200ft, 광주 5,000ft, 청주 4,600ft, 제주 8,500ft, 대구 5,800ft, 양양 7,700ft, 무안 3,800ft 등.","기온: 지역항공항행협정으로 포함 시 유효시간 중 최고·최저기온과 발생일시를 표현.","변화군: 기상당국이 항공교통업무기관·운항자와 협의한 기준값 및 ICAO Annex 3 Appendix 2 기준값 이상 변화 예상 시 사용."]},{"title":"6.3 이륙예보","page":308,"points":["이륙예보: 안전한 이륙을 지원하기 위해 국제 부호로 간결하게 서술하며 항공기상청의 항공기상관서가 발표한다.","이륙예보는 요청에 따라 출발예정시간 전 3시간 이내에 운항자·운항승무원에게 제공되도록 발표한다.","매 정시로부터 3시간 이내 예상되는 활주로 상 지상풍, 기온, 기압(QNH) 및 국지 합의 요소를 표현한다.","사용 요소·용어·단위·척도는 해당 공항의 정시관측보고 또는 특별관측보고와 같다."]},{"title":"6.4 착륙예보","page":308,"points":["착륙예보: 이용자와 공항으로부터 1시간 이내 비행거리에 있는 항공기에 필요한 기상정보로, 관측전문(METAR 또는 SPECI)에 포함하여 발표한다.","유효시간: 관측보고 시간으로부터 2시간 이내.","지상풍·시정·일기·구름 중 1개 이상 중요 변화 예상 시 경향예보 포함, 변화 없으면 NOSIG / 변화군 BECMG, TEMPO, 시간군 FM, TL, AT.","BECMG: 기상상태가 예보기간 내 규칙적 또는 불규칙적으로 변화 / TEMPO: 일시적 변동 각 지속 1시간 미만이고 총 변동시간이 전체 기간의 ½ 미만.","지상풍 변화기준: 평균풍향 60° 이상 변화하고 변화 전후 평균풍속 10kt 이상, 또는 평균풍속 10kt 이상 변화.","시정 기준: 150, 350, 600, 800, 1,500, 3,000m(VFR 항공기 많으면 5,000m 추가).","운고(5 oktas 이상 최저층) 기준: 100, 200, 500, 1,000ft(VFR 많으면 1,500ft) / 수직시정 100, 200, 500, 1,000ft.","운량(1,500ft 이하): NSC·FEW·SCT에서 BKN·OVC로 증가 또는 그 반대로 감소 시 / 일기현상 최대 3개, 종료 시 NSW."]},{"title":"6.5 저고도 중요기상예보(SIGWX)","page":311,"points":["중요기상예보 구분: 고고도(25,000~63,000ft), 중고도(10,000~25,000ft), 저고도(10,000ft 이하) SIGWX로 발표.","중요기상예보는 항공기상청이 발표하며 발표는 일 4회.","저고도 SIGWX는 비행고도 10,000ft 이하(산악 15,000ft 또는 필요 시 그 이상) 비행 항공기용 AIRMET을 지원하기 위해 국제 기호로 표현한다.","발표요소: 기압중심·전선 예상이동경로, CB·TCU 및 1,000ft 미만 5 oktas 이상 구름, 빙결고도, 화산분출, 뇌전, 태풍, 보통·심한 난류·착빙·산악파, 먼지·모래폭풍, 화산재, 방사성 구름.","추가 발표요소: 30kt(15m/s) 이상 지상풍, 지상시정 5,000m 미만 구역, 지역항공항행협정에 따른 해수면온도·바다상태.","모든 기상현상은 유효시간이 종료되는 시간대(FIXED TIME) 기준으로 표시 / 빙결고도는 중부지방 대표고도(필요 시 남부) / 난류는 항공예보모델 참고.","CB 표시: ISOL(50% 미만), OCNL(50~75%), FRQ(75% 이상), EMBD(다른 구름층 사이에 끼여 인식 어려움), 예: ISOL EMBD CB.","기타 구름: FEW 1/8~2/8, SCT 3/8~4/8, BKN 5/8~7/8, OVC 8/8, 운저고도는 표준해면고도 기준 100ft 단위 / 제트기류 깊이는 최대풍속 120KT 이상 구역에서 80KT 이상의 최하·최고고도."]}],"memorize":[{"k":"항공예보 분류","v":"공항예보, 이륙예보, 착륙예보, 중요기상예보(고·중·저고도)","page":304},{"k":"예보 대체 원칙","v":"새 예보는 이전 동일 지역·동일 유효시간 예보를 대체","page":304},{"k":"TAF 일반 유효기간","v":"보통 6~30시간(비행계획·브리핑용)","page":304},{"k":"이착륙예보 유효기간","v":"2~3시간","page":304},{"k":"국제공항 TAF 발표시각","v":"일 4회 05, 11, 17, 23UTC","page":304},{"k":"국내공항 TAF 발표시각","v":"일 4회 00, 06, 12, 18UTC","page":304},{"k":"TAF 발표 간격","v":"유효 12시간 미만 3시간 간격, 12~30시간 6시간 간격","page":305},{"k":"TAF 유효시간","v":"발표시각 1시간 이후부터 30시간 이내","page":305},{"k":"TAF 서술 순서","v":"식별군/지상풍/시정/일기현상/구름/기온/변화군","page":305},{"k":"돌풍(G) 표기 기준","v":"최대풍속이 평균보다 10kt(5m/s) 이상","page":305},{"k":"100kt 이상 풍속","v":"P99KT(P49MPS)","page":305},{"k":"VRB / 00000","v":"VRB: 평균 3kt(1.5m/s) 미만 또는 우세풍향 예상 불가 / 00000: 1kt(0.5m/s) 미만","page":305},{"k":"TAF 시정 단위","v":"800m 미만 50m, 800~5,000m 미만 100m, 5~10km 미만 1,000m, 10km 이상 9999","page":306},{"k":"운량 okta 구분","v":"FEW 1~2, SCT 3~4, BKN 5~7, OVC 8 oktas","page":306},{"k":"NSC / NSW","v":"NSC: 중요 구름 없고 CAVOK 부적절 / NSW: 일기현상 종료","page":306},{"k":"수직시정 표기","v":"VVhshshs, 뒤 3자리는 100ft 단위","page":306},{"k":"MSA","v":"반경 46km(25NM) 내 모든 물체로부터 최소 1,000ft(300m) 여유","page":307},{"k":"주요 공항 MSA","v":"인천 3,900ft, 김포 4,000ft, 제주 8,500ft, 김해 5,200ft","page":307},{"k":"이륙예보 제공","v":"출발예정시간 전 3시간 이내, 활주로 지상풍·기온·QNH","page":308},{"k":"착륙예보 대상·유효시간","v":"공항 1시간 이내 비행거리 항공기, 관측보고 시간부터 2시간 이내","page":309},{"k":"TEMPO 조건","v":"각 변동 1시간 미만, 총 변동시간 전체 기간 ½ 미만","page":310},{"k":"착륙예보 지상풍 변화기준","v":"평균풍향 60° 이상 변화(전후 평균풍속 10kt 이상) 또는 평균풍속 10kt 이상 변화","page":310},{"k":"착륙예보 시정 기준값","v":"150, 350, 600, 800, 1,500, 3,000m(VFR 많으면 5,000m)","page":310},{"k":"착륙예보 운고 기준값","v":"100, 200, 500, 1,000ft(VFR 많으면 1,500ft)","page":311},{"k":"SIGWX 고도 구분","v":"고고도 25,000~63,000ft, 중고도 10,000~25,000ft, 저고도 10,000ft 이하","page":311},{"k":"SIGWX 현상 표시 기준시각","v":"유효시간이 종료되는 시간대(FIXED TIME)","page":312},{"k":"제트기류 깊이 표시","v":"최대풍속 120KT 이상 구역에서 80KT 이상 최하·최고고도","page":313}],"quiz":[{"q":"국제공항에 대한 공항예보(TAF)의 정기 발표시각으로 옳은 것은?","o":["00, 06, 12, 18UTC","05, 11, 17, 23UTC","03, 09, 15, 21UTC","매 정시"],"a":1,"e":"국제공항 TAF는 일 4회 05, 11, 17, 23UTC, 국내공항은 00, 06, 12, 18UTC에 발표한다.","page":304},{"q":"공항예보(TAF)의 유효시간에 대한 설명으로 옳은 것은?","o":["발표시각부터 24시간 이내","발표시각 2시간 이후부터 12시간 이내","발표시각 1시간 이후부터 30시간 이내","발표시각부터 6시간 이내"],"a":2,"e":"공항예보의 유효시간은 각 발표시각 1시간 이후부터 30시간 이내이며, 새 예보가 이전 예보를 대체한다.","page":305},{"q":"공항예보의 내용 서술 순서로 옳은 것은?","o":["식별군-시정-지상풍-구름-일기현상-기온-변화군","식별군-구름-시정-지상풍-일기현상-변화군-기온","지상풍-식별군-시정-일기현상-구름-기온-변화군","식별군-지상풍-시정-일기현상-구름-기온-변화군"],"a":3,"e":"공항예보는 식별군/지상풍/시정/일기현상/구름/기온/예상되는 중요 변화군 순으로 서술한다.","page":305},{"q":"TAF 지상풍 표기에서 문자 ‘G’를 붙여 돌풍을 표현하는 기준은?","o":["최대풍속이 평균풍속보다 10kt(5m/s) 이상 지속될 것으로 예상될 때","평균풍속이 25kt 이상일 때","최대풍속이 평균풍속보다 5kt 이상일 때","풍향이 60° 이상 변할 때"],"a":0,"e":"최대풍속(돌풍)이 평균풍속보다 10kt(5m/s) 이상 지속될 것으로 예상되면 평균풍속 뒤에 G와 최대풍속을 붙인다.","page":305},{"q":"TAF에서 풍향을 VRB로 표현하는 경우로 옳은 것은?","o":["평균풍속이 10kt 이상일 때","평균풍속이 3kt(1.5m/s) 미만이거나, 3kt 이상이지만 우세한 풍향을 예상할 수 없을 때","바람이 1kt 미만일 때","돌풍이 예상될 때"],"a":1,"e":"VRB는 평균풍속 3kt(1.5m/s) 미만 또는 우세풍향 예상 불가 시 사용하며, 1kt(0.5m/s) 미만이면 00000(calm)으로 표현한다.","page":305},{"q":"TAF에서 예상 시정이 800m 이상 5,000m 미만일 때 표현 단위는?","o":["50m 단위","1,000m 단위","100m 단위","500m 단위"],"a":2,"e":"800m 미만은 50m, 800~5,000m 미만은 100m, 5~10km 미만은 1,000m 단위로 표현하고 10km 이상은 9999이다.","page":306},{"q":"TAF 구름 운량 약어와 okta의 연결이 옳지 않은 것은?","o":["FEW: 1~2 oktas","SCT: 3~4 oktas","OVC: 8 oktas","BKN: 4~6 oktas"],"a":3,"e":"BKN은 5~7 oktas이다.","page":306},{"q":"구름이 전혀 없고 CAVOK 사용이 적절하지 않을 때 TAF에서 사용하는 약어는?","o":["NSC","NSW","NOSIG","SKC VV"],"a":0,"e":"운항상 중요한 구름이 없고 CAVOK가 적절하지 않으면 NSC를 사용한다. NSW는 일기현상 종료를 뜻한다.","page":306},{"q":"교재에 제시된 각 공항별 최저섹터고도(MSA)로 옳은 것은?","o":["인천 8,500ft","제주 8,500ft","김포 5,800ft","대구 3,900ft"],"a":1,"e":"MSA는 인천 3,900ft, 김포 4,000ft, 제주 8,500ft, 대구 5,800ft 등이다.","page":307},{"q":"이륙예보에 대한 설명으로 옳은 것은?","o":["유효시간은 30시간이다","공항으로부터 1시간 이내 비행거리의 항공기를 대상으로 한다","요청에 따라 출발예정시간 전 3시간 이내에 운항자·운항승무원에게 제공되도록 발표한다","관측전문(METAR)에 포함하여 발표한다"],"a":2,"e":"이륙예보는 요청에 따라 출발예정시간 전 3시간 이내 제공되며 활주로 상 지상풍·기온·QNH 등을 표현한다. 1시간 이내 거리 항공기와 METAR 포함은 착륙예보의 특징이다.","page":308},{"q":"착륙예보의 유효시간은?","o":["관측보고 시간으로부터 30분 이내","관측보고 시간으로부터 1시간 이내","발표시각 1시간 이후부터 6시간","관측보고 시간으로부터 2시간 이내"],"a":3,"e":"착륙예보의 유효시간은 관측보고 시간으로부터 2시간 이내이다.","page":309},{"q":"착륙예보에서 기상상태가 일시적으로 변동하며 각 변동 지속시간이 1시간 미만, 총 변동시간이 전체 기간의 ½ 미만일 때 사용하는 변화군은?","o":["TEMPO","BECMG","NOSIG","FM"],"a":0,"e":"TEMPO는 일시적 변동이 각각 1시간 미만이고 총 변동시간이 전체 기간의 ½ 미만일 때 사용한다.","page":310},{"q":"착륙예보 변화기준 중 시정의 기준값에 해당하지 않는 것은?","o":["350m","2,000m","800m","3,000m"],"a":1,"e":"시정 기준값은 150, 350, 600, 800, 1,500, 3,000m이며 VFR 항공기가 많으면 5,000m가 추가된다.","page":310},{"q":"저고도 중요기상예보(SIGWX)에 대한 설명으로 옳지 않은 것은?","o":["10,000ft 이하(산악 15,000ft) 비행 항공기용 AIRMET을 지원한다","항공기상청이 일 4회 발표한다","기상현상은 유효시간이 시작되는 시각을 기준으로 표시한다","30kt(15m/s) 이상의 지상풍을 발표요소로 포함한다"],"a":2,"e":"SIGWX의 모든 기상현상은 유효시간이 종료되는 시간대(FIXED TIME)를 기준으로 표시한다.","page":312}]},{"id":"weather-7","title":"제7장 비행 중 기상조언 및 정보","pages":[315,318],"goal":"비행 중 기상조언(SIGMET·AIRMET), 비행 중 이용 가능한 기상정보(ATIS·AEIS·VOLMET), 조종사 기상보고(PIREP)와 착빙·난기류 보고 요령을 알아야 한다.","summary":"공항기상대는 관제기관을 통해 비행 전 브리핑에서 예보되지 않은 위험기상을 SIGMET·AIRMET으로 조언하며, AIRMET은 10,000ft 이하에서 중급 이상 착빙·난기류, 30KT 이상 강풍, 시정 3마일 미만·실링 300ft 이하, 광범위 산악차폐 시 발표된다. 비행 중에는 관제기관 제공 정보와 ATIS, AEIS, VOLMET(매시 10분·40분 방송)을 이용할 수 있다. 관제기관은 실링 5,000ft 이하, 시정 5마일 이하, 뇌전, Light 이상 착빙, Moderate 이상 난기류 등에서 PIREP을 요구하며, PIREP은 1~6항(IATA 3 Letter·보고형태·위치·시간·고도·기종)이 필수다. 착빙은 실속속도를 높이므로 강수지역을 벗어나 빙점 없는 고도로 이동해야 하고, 난기류는 Light·Moderate·Severe·Extreme 강도로 보고한다.","sections":[{"title":"7.1 비행 중 기상조언","page":315,"points":["공항기상대는 관제기관을 통해 비행 중 조종사에게 비행 전 브리핑 시 예보되지 않았던 위험기상 조우 가능성을 조언한다.","위험기상정보(SIGMET): 인천공항 기상대가 인천 FIR에서 교재 기준 비행고도 24,000ft 이상에서 해당 현상이 관측·예상될 때 발표, 유효기간 6시간 초과 불가·4시간 이내 바람직.","SIGMET 현상: 뇌전, 태풍, 난류(CAT 포함), 착빙, 화산재, 먼지폭풍·황사폭풍, 산악파, 극심한 우박.","AIRMET: 국내 공역 비행고도 10,000ft 이하 저고도 운항에 영향을 미치는 현상 발생·예상 시 발표, 유효기간 6시간 초과 않는 범위에서 4시간 이내 바람직.","AIRMET 현상: 중급 이상 착빙/난기류, 30KT 이상 강풍, 시정 3마일 미만과 실링 300ft 이하, 광범위한 산악 차폐."]},{"title":"7.2 비행 중 이용 가능한 기상정보","page":315,"points":["관제탑·관제기관은 조종사 요청 시 METAR/SPECI, TAF, TREND, TAKE OFF FORECAST, SIGMET, ROFOR 등과 Tower Wind Data, Pilot Report, Radar 영상 정보를 제공한다.","ATIS: 기상정보, 공항상황, 항법보조시설 작동 여부 등을 녹음하여 방송하며, 기상정보는 매시간 관측·특별관측정보·PIREP 등을 포함한다.","AEIS: 전국 VHF station이 설치된 곳에서 SIGMET, ROFOR, METAR, SPECI, TAF, PIREP 등을 받아볼 수 있다.","VOLMET: HF/VHF 주파수로 METAR, TAF 및 기타 항공정보를 방송으로 얻는 시스템.","한국은 VOLMET 태평양지역 그룹에 속하며 주요 공항 예보를 매시 10분, 40분에 5분 간격으로 방송, 배당 주파수 J3E HF."]},{"title":"7.3 조종사 기상보고(PIREP)","page":316,"points":["관제기관의 PIREP 요구 조건: 실링 5,000ft 이하, 시정 5마일 이하, 지표나 상층 뇌전 및 관련 현상, Light 정도의 착빙, Moderate 이상의 난기류와 전단풍, 화산재.","조종사는 구름의 두께, 운고, 운저, 비행시정, 강수, 연무, 상층온도 등을 즉시 보고해야 한다.","보고 경로: Tower나 ACC에 무선(HF, VHF)으로, 또는 SATCOM·ACARS로 운항통제실에 보고.","구성요소 1~6항 필수: IATA 3 Letter(가장 가까운 위치), 보고형태(UA 정기/UUA 긴급), /OV 위치, /TM 시간(UTC), /FL 고도, /TP 항공기 형식.","7~13항은 해당 현상 명시: /SK 하늘상태, /WX 날씨(비행시정·강수 등), /TA 기온(섭씨), /WV 바람(자북 기준, KT), /TB 난기류, /TC 착빙, /RM 비고.","PIREP은 간단명료해야 하나 언어·양식에 구애받지 않으며, 신속히 기상정보망으로 전파해야 한다.","무선 보고를 못 했다면 착륙 즉시 비행정보실, 항공기상대 또는 운항관리사에게 보고하는 것이 바람직하다.","활용: 관제탑은 교통흐름 처리·위험지역 회피 조언, ACC는 다른 조종사 통보·회피정보, 공항기상대는 위험기상정보 수정 발표, 항공사는 연구·대책 강구."]},{"title":"7.4 기체 착빙에 관련한 PIREP","page":317,"points":["기체 착빙은 출력 감소, 항력 증가, 양력 감소로 실속속도를 증가시키고 항공기 성능을 저하시킨다.","심한 경우 2~3인치 얼음이 불과 5분 이내에 날개 앞 표피에 착빙될 수 있다.","눈으로 확인 가능한 강수지역 통과 시나 외기온도가 2~10℃일 때는 착빙이 예상될 수 있다고 판단해야 한다.","착빙 감지 시(특히 Deicing 장비 없는 항공기): 강수지역을 벗어나고 빙점이 없는 고도로 상승·하강.","관제기관에 착빙현상을 보고하고 다른 항로나 고도를 요구한다."]},{"title":"7.5 난기류에 관한 PIREP","page":317,"points":["난기류 조우 시 조종사는 가능한 빨리 관제기관에 보고해야 한다.","보고 형식: 항공기 위치, 발생 시간(UTC), 난기류 강도, 구름 속/부근 여부, 항공기 고도, 항공기 기종, 난기류 지속시간.","Light: 순간적으로 약간 불규칙한 고도·자세 변화(Light TURB) 또는 고도·자세 변화 없이 율동적 동요(Light Chop) / 승객 벨트 약간 당김, 기내식·보행 가능.","Moderate: Light보다 강하나 조종 가능, 지시속도계 흔들림 / 벨트 당김이 명확, 고정 안 된 물건 움직임, 식사운반·보행 어려움.","Severe: 급격한 고도·자세 변화, 순간적으로 조종 불가능, 지시속도계 심하게 변화 / 물건이 튕겨 나오고 보행·기내식 운반 불가.","Extreme: 항공기가 급격하게 튀어 오르고 조종이 불가능하며 기체구조 손상의 원인이 됨.","지속시간 보고용어: Occasional, Intermittent, Continuous."]}],"memorize":[{"k":"비행 중 기상조언 주체","v":"공항기상대가 관제기관을 통해 조언","page":315},{"k":"SIGMET 유효기간(7장)","v":"6시간 초과 불가, 4시간 이내 바람직","page":315},{"k":"SIGMET 현상(7장)","v":"뇌전, 태풍, 난류·CAT, 착빙, 화산재, 먼지·황사폭풍, 산악파, 극심한 우박","page":315},{"k":"AIRMET 적용 고도(7장)","v":"국내 공역 비행고도 10,000ft 이하","page":315},{"k":"AIRMET 현상(7장)","v":"중급 이상 착빙/난기류, 30KT 이상 강풍, 시정 3마일 미만·실링 300ft 이하, 광범위 산악차폐","page":315},{"k":"ATIS","v":"기상정보·공항상황·항법보조시설 작동 여부 녹음 방송","page":315},{"k":"AEIS","v":"전국 VHF station에서 SIGMET, ROFOR, METAR, SPECI, TAF, PIREP 수신","page":316},{"k":"VOLMET 방송","v":"HF/VHF, 매시 10분·40분에 5분 간격, 태평양지역 그룹, J3E HF","page":316},{"k":"PIREP 요구 조건","v":"실링 5,000ft 이하, 시정 5마일 이하, 뇌전, Light 착빙, Moderate 이상 난기류·전단풍, 화산재","page":316},{"k":"PIREP 필수 항목","v":"1~6항: 위치(IATA 3 Letter), 보고형태, /OV, /TM, /FL, /TP","page":316},{"k":"UA / UUA","v":"UA 정기 PIREP, UUA 긴급 PIREP","page":316},{"k":"PIREP 코드 /TB, /TC","v":"/TB 난기류, /TC 착빙","page":316},{"k":"PIREP /WV, /TA","v":"/WV 자북 기준 풍향/풍속(KT), /TA 섭씨온도","page":316},{"k":"PIREP 보고 경로","v":"Tower·ACC에 HF/VHF 무선, SATCOM·ACARS로 운항통제실","page":316},{"k":"착빙의 영향","v":"출력 감소, 항력 증가, 양력 감소 → 실속속도 증가","page":317},{"k":"심한 착빙 속도","v":"2~3인치 얼음이 5분 이내 날개 앞 표피에 착빙 가능","page":317},{"k":"착빙 예상 외기온도","v":"2~10℃(또는 육안 확인 강수지역 통과 시)","page":317},{"k":"착빙 감지 시 조치","v":"강수지역 이탈, 빙점 없는 고도로 상승·하강, 관제기관 보고 및 다른 항로·고도 요구","page":317},{"k":"난기류 보고 항목","v":"위치, 시간(UTC), 강도, 구름 속/부근, 고도, 기종, 지속시간","page":318},{"k":"Severe 난기류","v":"급격한 고도·자세 변화, 순간적 조종 불가, 보행·기내식 운반 불가","page":318},{"k":"Extreme 난기류","v":"급격히 튀어 오르고 조종 불가, 기체구조 손상 원인","page":318}],"quiz":[{"q":"교재에서 AIRMET 발표 대상으로 제시한 기상현상이 아닌 것은?","o":["중급 이상 착빙/난기류","30KT 이상 강풍","시정 3마일 미만과 실링 300ft 이하","극심한 우박"],"a":3,"e":"극심한 우박은 SIGMET 대상이며, AIRMET은 중급 이상 착빙/난기류, 30KT 이상 강풍, 시정 3마일 미만·실링 300ft 이하, 광범위 산악차폐이다.","page":315},{"q":"비행 중 기상조언의 SIGMET·AIRMET 유효기간에 대한 교재 설명으로 옳은 것은?","o":["6시간을 초과하지 않으며 4시간 이내가 바람직하다","12시간을 초과하지 않는다","2시간을 초과하지 않는다","유효기간 제한이 없다"],"a":0,"e":"위험기상정보의 유효기간은 6시간을 초과하지 않아야 하며 4시간 이내가 바람직하다.","page":315},{"q":"기상정보, 공항상황, 항법보조시설 작동 여부 등을 녹음하여 방송하는 서비스는?","o":["VOLMET","ATIS","AEIS","PIREP"],"a":1,"e":"ATIS(Automatic Terminal Information Service)는 기상정보·공항상황·항법보조시설 작동 여부 등을 녹음 방송한다.","page":315},{"q":"VOLMET에 대한 설명으로 옳은 것은?","o":["조종사가 관제기관에 보고하는 기상정보이다","녹음된 공항 상황 정보를 매 30분 방송한다","HF/VHF로 METAR·TAF 등을 방송하며 한국은 주요 공항 예보를 매시 10분, 40분에 5분 간격으로 방송한다","VHF station에서만 SIGMET을 수신할 수 있다"],"a":2,"e":"VOLMET은 HF/VHF로 METAR·TAF 등을 방송하며, 태평양지역 그룹인 한국은 매시 10분·40분에 5분 간격으로 방송한다.","page":316},{"q":"관제기관이 PIREP을 요구하는 조건에 해당하지 않는 것은?","o":["실링 5,000ft 이하","시정 5마일 이하","Moderate 이상의 난기류와 전단풍","시정 10km 이상의 맑은 날씨"],"a":3,"e":"PIREP은 실링 5,000ft 이하, 시정 5마일 이하, 뇌전, Light 착빙, Moderate 이상 난기류·전단풍, 화산재 등이 보고·예보될 때 요구된다.","page":316},{"q":"PIREP 구성요소 중 반드시 포함되어야 하는 항목(1~6항)이 아닌 것은?","o":["/SK(하늘 상태)","/TM(시간)","/FL(고도)","/TP(항공기 형식)"],"a":0,"e":"1~6항(IATA 3 Letter, 보고형태, /OV, /TM, /FL, /TP)은 필수이고, /SK 등 7~13항은 해당 기상현상이 있을 때 명시한다.","page":316},{"q":"PIREP 코드 중 긴급 PIREP을 나타내는 보고형태는?","o":["UA","UUA","/RM","/OV"],"a":1,"e":"보고형태는 UA(정기) 또는 UUA(긴급)로 표시한다.","page":316},{"q":"PIREP의 /WV(바람) 항목의 기준으로 옳은 것은?","o":["진북 기준 풍향, 풍속 m/s","활주로 방향 기준 풍향, 풍속 km/h","자북 기준 풍향/풍속(KT)","자북 기준 풍향, 풍속 MPH"],"a":2,"e":"/WV는 자북 기준 풍향/풍속(KT)으로 보고한다.","page":316},{"q":"기체 착빙이 항공기에 미치는 영향으로 옳은 것은?","o":["양력 증가로 실속속도 감소","항력 감소로 연료 절감","출력 증가와 실속속도 감소","출력 감소, 항력 증가, 양력 감소로 실속속도 증가"],"a":3,"e":"착빙은 출력 감소, 항력 증가, 양력 감소로 실속속도를 증가시키고 성능을 저하시킨다.","page":317},{"q":"교재에서 착빙이 예상될 수 있다고 판단해야 하는 외기온도 범위는?","o":["2~10℃","-20~-30℃","15~20℃","-40℃ 이하"],"a":0,"e":"눈으로 확인 가능한 강수지역을 통과할 때나 외기온도가 2~10℃일 때는 착빙이 예상될 수 있다고 판단해야 한다.","page":317},{"q":"Deicing 장비가 없는 항공기가 비행 중 착빙을 감지했을 때의 조치로 옳은 것은?","o":["강수지역을 계속 통과하여 신속히 목적지로 간다","강수지역을 벗어나 빙점이 없는 고도로 상승·하강하고 관제기관에 보고한다","속도를 줄여 실속속도에 가깝게 비행한다","착륙 후에만 보고하고 비행 중에는 보고하지 않는다"],"a":1,"e":"착빙 감지 시 강수지역을 벗어나 빙점이 없는 고도로 상승·하강하고, 관제기관에 보고하여 다른 항로나 고도를 요구한다.","page":317},{"q":"난기류 강도 중 ‘급격한 고도·자세 변화로 순간적으로 조종이 불가능하고 지시속도계가 심하게 변화하며 기내 보행이 불가능한’ 단계는?","o":["Light","Moderate","Severe","Extreme"],"a":2,"e":"Severe는 급격한 고도·자세 변화, 순간적 조종 불가, 지시속도계 심한 변화를 보이며 보행과 기내식 운반이 불가능하다.","page":318},{"q":"난기류 PIREP 보고 형식에 포함되는 항목이 아닌 것은?","o":["발생 시간(UTC)","난기류 지속 시간","구름 속인지 구름 부근인지 여부","출발 공항의 QNH 값"],"a":3,"e":"난기류 보고는 위치, 시간(UTC), 강도, 구름 속/부근 여부, 고도, 기종, 지속시간으로 구성된다.","page":318}]}]},{"key":"nav","name":"항공교통 및 항법","short":"항법","en":"Air Traffic & Navigation","chapters":[{"id":"nav-1","title":"제1장 공중항법","pages":[323,327],"goal":"공중항법의 기본 요소·용어(방향, 편차, 방위, 거리, 속도, 시간)와 지문항법·추측항법·천측항법의 개념 및 지문항법 비행계획 수립 기준을 이해한다.","summary":"공중항법은 방향·속도·고도 등을 계획하고 자신의 위치를 파악해 경로를 수정하며 목적지에 도달하는 과정이다. 항공도는 진북 기준, 조종사가 쓰는 나침반은 자북 기준이며 그 차이가 편차(Variation)이다. 거리 단위는 해리(1NM=위도 1분=6,076ft=1,852m), 속도는 노트, 시간은 UTC를 사용한다. 지문항법은 지상 저명물로 점검지점을 확인하는 항법이고, 추측항법은 지상 참조물이 없을 때 방향·거리·바람을 계산해 찾아가는 항법이며, 순항고도는 자방위 000~179°는 홀수천+500ft, 180~359°는 짝수천+500ft를 사용한다.","sections":[{"title":"1.1 개요 및 항법 요소","page":323,"points":["공중항법: 방향·속도·고도 등을 계획(Planning)하고 자신의 위치를 파악하여 경로를 수정하면서 목적지에 도달하도록 계획 및 수정하는 과정","항법의 기본 요소: 위치(position), 방향(direction), 거리(distance), 비행고도(Altitude), 속도(Speed), 시간(time)","위치 파악의 가장 간단한 방법은 지상의 눈에 띄는 지형지물(강, 도로, 건물, 산, 특이 지형)을 참조점으로 삼는 것","방향: 거리에 관계없이 한 지점에서 다른 지점의 상대적 위치이며 360도 기준으로 진북 또는 자북에 기초해 정함","항공도는 진북(True North) 기준으로 제작, 조종사가 쓰는 나침반은 자북(Magnetic North) 기준의 방향정보 제공"]},{"title":"1.1.2 항법 용어 — 편차·방위·코스","page":323,"points":["편차(Variation): 진북과 자북의 차이, 지역에 따라 값이 다름 — 지구 북극과 자북 위치의 불일치에서 기인","진북은 변함이 없으나 자북은 조금씩 이동하므로 항공지도 제작 시 일정기간 후 편차를 수정해야 함","방위(Bearing): 한 지점(또는 항행안전시설)으로부터의 상대적 수평방향 — 기준이 기수방위이면 상대방위(Relative Bearing, RB)","기수방위(Heading): 기수가 향하는 방향 / 진기수방위는 진북 기준, 자기수방위는 자북 기준","진항로(True course)는 진북 기준, 자항로(Magnetic course)는 자북 기준으로 측정한 항로","항적(Track): 항공기가 지표면 위를 실제 이동한 자취 — 무풍 시 항적과 기수방위가 일치","편류수정각(Drift angle): 바람 영향으로 생긴 기수방위와 항적 사이의 각도","코스(Course): 목적을 가진 수평방향 / 기수방위 값은 항공기 세로축이 가지는 방향"]},{"title":"1.1.2 항법 용어 — 거리·속도·시간","page":325,"points":["항법 거리 단위는 해리(NM): 1해리 = 위도 1분 = 6,076feet = 1,852m","단위 일치: 해리(NM)를 쓰면 속도는 노트(knots), 육리(SM)를 쓰면 MPH 사용","기상에서 시정 측정단위는 일반적으로 육리(SM: statute Mile) 사용","속도 종류: 지시속도, 수정대기속도, 등가대기속도, 진대기속도, 대지속도 — 공중항법에 주로 쓰는 것은 대지속도(Ground Speed)","대기속도: 대기 속을 이동하는 속도 / 대지속도: 지면에 상대적인 속도 / 상대속도: 다른 항공기·물체에 상대적인 속도","항공 시간은 국제표준시(UTC) 사용, 24시간 = 360°, 1시간 = 15°, 4분 = 1°, 1분 = 15'"]},{"title":"1.2 항법의 종류 / 1.2.1 지문항법","page":325,"points":["항법의 종류: 지문항법(Pilotage), 천측항법(Celestial), 추측항법(Dead Reckoning), 무선항법(Radio), 위성항법(GPS)","지문항법: 시계비행 상태에서 외부 저명 지상참조물로 점검지점(Check point)을 확인하여 위치를 결정하고 목적지를 찾아가는 항법","비행 전 점검: 탑재서류, 항공정보(활주로 길이, 공역, 항행안전시설, 주파수), 기상, 무게와 균형, 성능(이착륙거리) 파악","점검지점은 도시·고속도로·강·호수·비행장·해안선·고압선로 등 지상 저명지점으로 선정, 간격은 대략 15~30NM 추천","신축 도로·건물은 다음 지도 발행까지 지도에 없을 수 있음 / TV안테나 지역은 가장 높은 장애물 상공 500ft보다 낮게 비행 금지","비행 중 점검지점을 무리하게 오래 찾거나 고개 숙여 항공도를 보는 것은 비추천 — 예상기수방위를 일정하게 유지하며 참조점을 찾음"]},{"title":"1.2.1.1 순항고도 선정","page":326,"points":["자방위(Magnetic Bearing) 000(360)~179°: 홀수 1,000ft + 500ft (예: 3,500ft)","자방위 180°~359°: 짝수 1,000ft + 500ft (예: 4,500ft)","최저안전고도: 산악지형은 최고 장애물보다 2,000ft, 그 외 지역은 1,000ft 더 높은 고도 유지 추천","항로가 짧은데 무리하게 높은 고도를 택하면 도달하자마자 강하해야 하므로 경제적 손실","상층풍: 배풍(Tail Wind) 성분이 유리한 고도 선정 — 정풍이면 대지속도 감소·도착 지연·연료소모 증가, 배풍이면 반대","순항고도 선정 후 POH의 성능(Performance) Section의 상승·순항성능 자료로 항법계획 수립"]},{"title":"1.2.2 추측항법 / 1.2.3 천측항법","page":327,"points":["추측항법: 해상·사막·구름 위·야간 등 지상 참조물이 없는 지역에서 현재 위치→목적지의 방향·거리를 측정하고 바람을 고려해 바람수정각과 도착예정시간을 산정하여 찾아가는 항법","수면 위 비행을 제외하고 추측항법은 일반적으로 야외비행 시 지문항법과 함께 사용 — 산출된 Heading과 GS는 check point 관측(지문항법)으로 지속 확인","천측항법: 별의 위치를 측정해 위치를 찾는 방법, 전 세계 어디서나 지상장비 없이 사용 가능","천측항법 제한: 구름·안개 등 관측 곤란 날씨에서 사용 불가, 기류 요동·급격한 기동 시 정확도 제한"]}],"memorize":[{"k":"항법의 기본 요소","v":"위치, 방향, 거리, 고도, 속도, 시간","page":323},{"k":"항공도 제작 기준","v":"진북(True North)","page":323},{"k":"조종사 나침반 기준","v":"자북(Magnetic North)","page":323},{"k":"편차(Variation)","v":"진북과 자북의 차이 — 지역마다 다르고 자북 이동으로 주기적 수정 필요","page":323},{"k":"상대방위(RB)","v":"기준 방향이 항공기 기수방위(Heading)인 베어링","page":324},{"k":"항적(Track)","v":"지표면 위 실제 이동 자취, 무풍 시 기수방위와 일치","page":324},{"k":"편류수정각(Drift angle)","v":"바람으로 인한 기수방위와 항적 사이의 각도","page":324},{"k":"1해리(NM)","v":"위도 1분 = 6,076ft = 1,852m","page":325},{"k":"단위 조합","v":"NM↔knots, SM↔MPH / 기상 시정은 SM","page":325},{"k":"공중항법에 주로 쓰는 속도","v":"대지속도(Ground Speed)","page":325},{"k":"시간-각도 환산","v":"24시간=360°, 1시간=15°, 4분=1°, 1분=15'","page":325},{"k":"항공 시간 기준","v":"국제표준시(UTC)","page":325},{"k":"항법의 종류","v":"지문항법, 천측항법, 추측항법, 무선항법, 위성항법(GPS)","page":325},{"k":"점검지점 간 추천 거리","v":"약 15~30NM","page":326},{"k":"장애물(TV안테나 등) 지역 비행 제한","v":"가장 높은 장애물 상공 500ft보다 낮게 비행 금지","page":326},{"k":"순항고도 000~179°","v":"홀수 1,000ft + 500ft (예: 3,500ft)","page":326},{"k":"순항고도 180~359°","v":"짝수 1,000ft + 500ft (예: 4,500ft)","page":326},{"k":"최저안전고도(산악)","v":"최고 장애물보다 2,000ft 높게","page":326},{"k":"최저안전고도(그 외 지역)","v":"최고 장애물보다 1,000ft 높게","page":326},{"k":"성능자료 출처","v":"POH의 성능(Performance) Section","page":327},{"k":"추측항법 사용 환경","v":"해상, 사막, 구름 위, 야간 등 지상 참조물이 없는 지역","page":327},{"k":"천측항법 제한","v":"구름·안개 시 사용 불가, 기류 요동·급기동 시 정확도 제한","page":327}],"quiz":[{"q":"항공도 제작과 항공기 나침반이 각각 기준으로 삼는 방향을 바르게 짝지은 것은?","o":["항공도: 진북, 나침반: 자북","항공도: 자북, 나침반: 진북","항공도: 진북, 나침반: 진북","항공도: 자북, 나침반: 자북"],"a":0,"e":"항공도는 진북을 기준으로 제작되고, 조종사가 사용하는 나침반은 자북을 기준으로 방향정보를 제공한다.","page":323},{"q":"진북과 자북의 차이를 무엇이라 하는가?","o":["편류(Drift)","자차(Deviation)","편차(Variation)","상대방위(Relative Bearing)"],"a":2,"e":"편차는 진북과 자북의 차이로 지역에 따라 값이 다르며, 자북이 이동하므로 지도 제작 시 주기적으로 수정한다.","page":323},{"q":"바람의 영향으로 생긴 기수방위와 항적 사이의 각도를 무엇이라 하는가?","o":["상대방위","편류수정각(Drift angle)","편차","진항로"],"a":1,"e":"편류수정각은 바람의 영향으로 인한 기수방위와 항적 사이의 각도이며, 무풍 시에는 항적과 기수방위가 일치한다.","page":324},{"q":"1해리(NM)에 대한 설명으로 옳은 것은?","o":["경도 1분, 1,609m","위도 1도, 6,076ft","경도 1도, 1,852m","위도 1분, 1,852m"],"a":3,"e":"1해리는 위도 1분을 나타내며 6,076feet, 1,852m이다.","page":325},{"q":"UTC 시간과 지구 자전 각도의 관계로 옳지 않은 것은?","o":["24시간 = 360°","1시간 = 15°","4분 = 1°","1분 = 1°"],"a":3,"e":"교재에 따르면 1분 = 15'(분)이며, 1°는 4분에 해당한다.","page":325},{"q":"공중항법에서 주로 사용되는 속도로, 항공기가 실제 지표면 위를 지나는 속도는?","o":["대지속도(Ground Speed)","지시대기속도","진대기속도","상대속도"],"a":0,"e":"공중항법에 주로 사용되는 속도는 실제 항공기가 지표면 위를 지나는 대지속도이다.","page":325},{"q":"자방위 090°의 항로를 시계비행할 때 법규에 따른 순항고도로 적절한 것은?","o":["4,500ft","3,500ft","4,000ft","6,500ft"],"a":1,"e":"자방위 000~179°는 홀수 1,000ft 단위에 500ft를 더한 고도(예: 3,500ft)를 사용한다.","page":326},{"q":"지문항법 비행계획 시 산악지형 항로의 최저안전고도로 추천되는 기준은?","o":["최고 장애물보다 500ft 높게","최고 장애물보다 1,000ft 높게","최고 장애물보다 2,000ft 높게","최고 장애물보다 3,000ft 높게"],"a":2,"e":"산악지형은 최고 장애물보다 2,000ft, 그 외 지역은 1,000ft 더 높은 고도를 유지하는 것이 추천된다.","page":326},{"q":"지문항법의 점검지점(Check Point) 선정에 관한 설명으로 옳지 않은 것은?","o":["도시, 고속도로, 강, 호수, 해안선 등 저명지점으로 선정한다.","점검지점 간 거리는 대략 15~30NM을 추천한다.","새로 건설 중인 도로나 건물은 지도에서 찾지 못할 수 있다.","TV안테나는 잘 보이므로 가장 좋은 점검지점이다."],"a":3,"e":"TV안테나 같은 구조물은 잘 보이지 않는 경우가 많고 눈에 띄지 않는 전선을 동반하므로 비행안전에 저해된다.","page":326},{"q":"해상·사막·구름 위·야간 등 지상 참조물이 없을 때 방향·거리와 바람 영향을 계산하여 바람수정각과 도착예정시간을 산정해 찾아가는 항법은?","o":["지문항법","천측항법","위성항법","추측항법(Dead Reckoning)"],"a":3,"e":"추측항법은 지상 참조물이 없는 지역에서 미리 아는 위치로부터 방향·거리를 측정하고 바람을 고려해 찾아가는 항법이다.","page":327},{"q":"항로상 바람이 정풍(맞바람)일 때 나타나는 현상으로 옳은 것은?","o":["대지속도 감소, 도착 지연, 연료소모율 증가","대지속도 증가, 도착 단축, 연료 절약","대지속도 변화 없음","대기속도 감소, 도착 단축"],"a":0,"e":"정풍이면 대지속도가 감소하여 도착이 지연되고 연료소모율이 커지며, 배풍이면 반대이다.","page":326}]},{"id":"nav-2","title":"제2장 항행안전시설","pages":[328,336],"goal":"경량항공기 운항과 관련된 항행안전시설(항공등화, 레이더, 항공정보통신시설)과 비행장·이착륙장·수상이착륙장 표지시설 및 표지판의 의미를 이해한다.","summary":"항행안전시설은 공항시설법상 유선·무선통신, 인공위성, 불빛, 색채, 전파를 이용해 항행을 돕는 시설로 항공등화, 항행안전무선시설, 항공정보통신시설로 구성된다. 경량항공기는 주간 시계비행이 원칙이지만 진입각지시등(PAPI)과 지향신호등(빛총신호)은 주야간 구분 없이 사용되며, 트랜스폰더(Mode 3/A, Mode C)를 통해 2차 레이더와 연계된다. 레이더는 항로감시(ARSR), 공항감시(ASR), 공항지상감시(ASDE), 정밀접근(PAR) 레이더로 구분된다. 활주로 표지는 백색, 유도로 표지는 황색이며 표지판은 종류별 바탕·문자 색상이 정해져 있다.","sections":[{"title":"2.1 항행안전시설 개요 / 2.2 경량항공기 운영과 항행안전시설","page":328,"points":["항행안전시설(공항시설법 제2조제15호): 유선통신, 무선통신, 인공위성, 불빛, 색채 또는 전파를 이용해 항공기 항행을 돕는 국토교통부령으로 정하는 시설","시행규칙 제5조: 항공등화, 항행안전무선시설, 항공정보통신시설","항공등화(제2조제16호): 불빛, 색채 또는 형상(形象)을 이용해 항행을 돕는 항행안전시설","경량항공기는 주간 시계비행으로 비행장·공항·이착륙장에서 이착륙 가능","의무 장착: VHF 또는 UHF 무선전화 송수신기 1대 + 트랜스폰더(Mode 3/A 및 Mode C SSR) 1대","시계비행방식이므로 나침반, 시계, 속도계, 기압고도계를 갖춤"]},{"title":"2.3 항공등화시설 (진입각지시등·지향신호등)","page":328,"points":["경량항공기는 대부분의 항공등화를 쓸 기회가 거의 없으나 진입각지시등과 지향신호등은 주/야간 구분 없이 사용","PAPI: 착륙 시 진입각 적정 여부를 알려주기 위해 활주로 외측에 설치, 원칙적으로 모든 활주로에 설치(불필요한 곳 제외)","PAPI는 진입방향에서 보아 활주로 좌측에 4개(간이형 2개) 다중램프를 균등 간격 배열, 색 변화는 300m 이상 거리에서 보여야 함","많이 낮음: 모두 적색 / 약간 낮음: 활주로에 가까운 3개 적색·1개 백색(간이형 2개 모두 적색)","정상: 가까운 2개 적색·먼 2개 백색(간이형 각 1개) / 약간 높음: 가까운 1개 적색·3개 백색(간이형 모두 백색) / 많이 높음: 모두 백색","지향신호등: 모든 비행장 관제탑에 갖추어야 하며 무선통신두절 시 빛총신호로 적색·녹색·백색 신호 송신"]},{"title":"빛총신호의 종류 및 의미 [표 2-1]","page":329,"points":["연속 녹색: 비행 중 → 착륙 허가 / 지상 → 이륙 허가","연속 적색: 비행 중 → 다른 항공기에 진로 양보하고 계속 선회 / 지상 → 정지 / 차량·사람 → 정지","깜박이는 녹색: 비행 중 → 착륙 준비(착륙 및 지상유도 허가가 뒤이어 발부) / 지상 → 지상 이동 허가","깜박이는 적색: 비행 중 → 비행장이 불안전하니 착륙하지 말 것 / 지상 → 사용 중인 착륙지역에서 벗어날 것 / 차량 → 활주로·유도로에서 벗어날 것","깜박이는 흰색: 비행 중 → 착륙하여 계류장으로 갈 것 / 지상·차량 → 비행장 안의 출발지점으로 돌아갈 것"]},{"title":"2.4 항행안전무선시설 (레이더)","page":329,"points":["항행안전무선시설 대부분은 계기비행용이지만 레이더 시설은 모든 비행방식에 적용","1차 감시레이더(Primary): 항공기에서 반사된 신호를 계산해 방위·거리 정보를 관제사에게 제공","2차 감시레이더(SSR): 1차와 함께 운용, 질문기(interrogator)의 질문에 트랜스폰더가 코드와 기압고도 자료를 송신","Mode 3/A는 식별코드, Mode C는 고도정보를 얻기 위한 신호","ARSR(항로감시): 360°, 200NM 이상, 60,000ft, 5~6rpm, 10초 또는 12초 내 갱신","ASR(공항감시): 공항 주변 진입·출발 관제, 360°, 60~70NM, 25,000ft, 12~15rpm, 4초 또는 5초 내 갱신","ASDE(공항지상감시): 대형공항 악천후·육안관측 곤란 시 지표면 교통 감시, 360°, 6km, 60rpm, 1초 내 갱신","PAR(정밀접근): ILS 예비용으로 많이 사용, ASR로 활주로 연장선 약 10NM까지 유도 후 PAR로 유도, 안테나 2개(AZ 좌우, EL 상하), 1초 내 갱신"]},{"title":"2.5 항공정보통신시설","page":331,"points":["항공정보통신시설: 전기통신을 이용해 항공교통업무에 필요한 정보를 제공·교환하는 시설","AFTN/MHS(항공고정통신시스템): 고정지점 통신센터·가입자 간 비행계획, NOTAM, 항공기상 등 교환","AFTN 항공정보는 Store-and-Forward(저장 및 전송) 방식 처리, 30일 이상 보존","단거리이동통신시설: 관제사-조종사 음성통신, VHF 118.0~136.975MHz, UHF 225~400MHz","ATIS(공항정보방송시설): 공항 항공정보를 음성으로 반복 제공, 전화로도 제공(예: 김포 02-2660-2676)"]},{"title":"2.6 표지시설 및 표지판","page":332,"points":["백색: 활주로 표지 및 헬기장 착륙지역 표지(병원 헬기장은 백색 십자에 적색 H)","황색: 유도로, 이용 제한 지역(폐쇄·위험지역), 대기지점(활주로 상에 있더라도) 표지","활주로 번호: 자북 기준 활주로 중앙선 자방위를 가장 가까운 10단위로 반올림한 2자리 (예: 187° → 19), 평행활주로는 L·R·C","활주로명칭표지판·CAT Ⅰ/Ⅱ/Ⅲ 정지위치표지판·활주로정지위치표지판: 적색바탕에 백색문자","위치표지판: 일시정지위치에 설치, 흑색바탕에 황색문자, 단독설치 시 황색 경계선","방향표지판: 유도로 명칭과 방향을 화살표로 표시(알파벳 또는 알파벳+숫자), 인접 방향표지판은 흑색 수직선으로 경계","목적지표지판: 특정 목적지 방향 표시, 유도로 좌측 설치 / 활주로탈출표지판: 출구가 있는 방향(좌/우)에 설치","중간이륙표지판: 이륙방향 화살표와 이륙활주가용거리 숫자로 구성"]},{"title":"2.6.11 표지판 색상 [표 2-3]","page":335,"points":["명령지시표지판: 면 적색, 기호 백색, 테두리 없음","방향표지판: 면 황색, 기호 흑색","위치표지판: 면 흑색, 기호 황색, 테두리 황색(단독설치 시)","목적지·활주로탈출·활주로개방표지판(정보표지판): 면 황색, 기호 흑색","목적지표지판 약어: RAMP/APRON(일반 주기·서비스·탑재), PARK(주기 전용), CML(민항지역), MIL(군용지역), CARGO, INTL, RUNUP, AOP(고도계 점검), FUEL, HGR(격납고)"]},{"title":"2.7 이착륙장 / 2.8 수상이착륙장 표지시설","page":335,"points":["이착륙장 활주로 표지(아스팔트): 흰색 페인트 또는 도로용 플라스틱 삼각뿔 등 흰색 표지, 둘 다 사용 가능","활주로 옆선 표지: 길이 2m·폭 50cm 직사각형, 활주로와 평행하게 가장자리에 30m 간격","양방향동력패러장 직선부분: 길이 2m·폭 50cm 직사각형, 20m 간격","시단표지: 길이 10m 이상·폭 30cm 이상 직선 / 시단이설 표지: 길이 10m 이상·폭 30cm 이상 점선","전방향동력패러장 활주로 가장자리: 폭 20cm 이상","수상이착륙장 착수대 경계: 착수대 외곽에서 15m 이상 이격하여 부표(浮標) 설치"]}],"memorize":[{"k":"항행안전시설 3종(시행규칙 제5조)","v":"항공등화, 항행안전무선시설, 항공정보통신시설","page":328},{"k":"경량항공기 의무 장착 통신·감시장비","v":"VHF 또는 UHF 무선전화 송수신기 1대 + 트랜스폰더(Mode 3/A 및 Mode C) 1대","page":328},{"k":"주야간 구분 없이 쓰는 항공등화","v":"진입각지시등(PAPI), 지향신호등","page":328},{"k":"PAPI 설치 위치·개수","v":"진입방향에서 활주로 좌측, 4개(간이형 2개)","page":329},{"k":"PAPI 색 변화 시인 거리","v":"300m 이상","page":329},{"k":"PAPI 정상 진입각","v":"가까운 2개 적색, 먼 2개 백색","page":329},{"k":"PAPI 모두 적색 / 모두 백색","v":"많이 낮음 / 많이 높음","page":329},{"k":"빛총 연속 녹색","v":"비행 중: 착륙 허가 / 지상: 이륙 허가","page":329},{"k":"빛총 연속 적색(비행 중)","v":"다른 항공기에 진로 양보하고 계속 선회","page":329},{"k":"빛총 깜박이는 적색(비행 중)","v":"비행장이 불안전하니 착륙하지 말 것","page":329},{"k":"빛총 깜박이는 흰색(비행 중)","v":"착륙하여 계류장으로 갈 것","page":329},{"k":"Mode 3/A / Mode C","v":"식별코드 / 고도정보","page":330},{"k":"ARSR","v":"200NM 이상, 60,000ft, 5~6rpm, 10~12초 갱신","page":330},{"k":"ASR","v":"60~70NM, 25,000ft, 12~15rpm, 4~5초 갱신","page":331},{"k":"ASDE","v":"6km, 60rpm, 1초 갱신 — 지표면 교통 감시","page":331},{"k":"PAR","v":"ILS 예비용, ASR로 약 10NM까지 유도 후 정밀유도, 1초 갱신","page":331},{"k":"AFTN 처리방식·보존기간","v":"Store-and-Forward, 30일 이상 보존","page":331},{"k":"VHF / UHF 주파수대","v":"118.0~136.975MHz / 225~400MHz","page":331},{"k":"활주로 표지 색 / 유도로 표지 색","v":"백색 / 황색","page":332},{"k":"활주로 번호 예","v":"자방위 187° → 19","page":332},{"k":"명령지시표지판 색","v":"적색 바탕, 백색 문자","page":335},{"k":"위치표지판 색","v":"흑색 바탕, 황색 문자(단독설치 시 황색 테두리)","page":333},{"k":"방향·목적지·탈출·개방표지판 색","v":"황색 바탕, 흑색 문자","page":335},{"k":"이착륙장 활주로 옆선 표지","v":"2m×50cm, 30m 간격","page":335},{"k":"양방향동력패러장 표지","v":"2m×50cm, 20m 간격","page":335},{"k":"시단표지 / 시단이설 표지","v":"길이 10m 이상·폭 30cm 이상 직선 / 점선","page":335},{"k":"착수대 부표 이격거리","v":"착수대 외곽에서 15m 이상","page":335}],"quiz":[{"q":"공항시설법 시행규칙상 항행안전시설에 해당하지 않는 것은?","o":["항공등화","항행안전무선시설","항공정보통신시설","항공기 정비시설"],"a":3,"e":"시행규칙 제5조의 국토교통부령으로 정하는 시설은 항공등화, 항행안전무선시설, 항공정보통신시설이다.","page":328},{"q":"경량항공기가 의무적으로 장착해야 하는 장비로 옳은 것은?","o":["VHF 또는 UHF 무선전화 송수신기 1대와 트랜스폰더(Mode 3/A 및 Mode C) 1대","ILS 수신기 1대와 트랜스폰더 1대","VHF 송수신기 2대와 기상레이더 1대","ELT와 ADF 각 1대"],"a":0,"e":"경량항공기에는 VHF 또는 UHF 무선전화 송수신기 1대와 Mode 3/A 및 Mode C SSR 트랜스폰더 1대를 의무 장착한다.","page":328},{"q":"진입각지시등(PAPI)에서 활주로에 가까운 2개 등은 적색, 먼 2개 등은 백색으로 보인다면 항공기의 상태는?","o":["정상 진입각보다 많이 낮음","정상 진입각보다 약간 높음","정상 진입각","정상 진입각보다 약간 낮음"],"a":2,"e":"정상 진입각일 때 활주로에 가까운 2개는 적색, 먼 2개는 백색이다.","page":329},{"q":"진입각지시등(PAPI)에 대한 설명으로 옳지 않은 것은?","o":["진입방향에서 보아 활주로 좌측에 설치한다.","4개(간이형 2개)의 다중램프를 균등한 간격으로 배열한다.","색채 변화는 300m 이상 거리에서 볼 수 있어야 한다.","야간 운항에만 적합하도록 설계한다."],"a":3,"e":"진입각지시등은 주간·야간 운항에 모두 적합하여야 한다.","page":328},{"q":"비행 중인 항공기가 관제탑으로부터 깜박이는 적색 빛총신호를 받았다. 그 의미는?","o":["착륙을 허가함","비행장이 불안전하니 착륙하지 말 것","다른 항공기에 진로를 양보하고 계속 선회할 것","착륙하여 계류장으로 갈 것"],"a":1,"e":"깜박이는 적색은 비행 중인 항공기에게 '비행장이 불안전하니 착륙하지 말 것'을 의미한다.","page":329},{"q":"지상에 있는 항공기에게 연속되는 녹색 빛총신호의 의미는?","o":["지상 이동을 허가함","정지할 것","비행장 안의 출발지점으로 돌아갈 것","이륙을 허가함"],"a":3,"e":"연속되는 녹색은 비행 중 항공기에게는 착륙 허가, 지상 항공기에게는 이륙 허가를 뜻한다.","page":329},{"q":"트랜스폰더의 Mode C가 제공하는 정보는?","o":["항공기 고도정보","항공기 식별코드","항공기 속도정보","항공기 기수방위"],"a":0,"e":"Mode 3/A는 식별코드를 얻기 위한 Code이며, Mode C는 항공기의 고도정보를 얻기 위한 신호이다.","page":330},{"q":"공항감시레이더(ASR)의 제원으로 옳은 것은?","o":["통달범위 200NM 이상, 고도 60,000ft","통달범위 6km, 안테나 60rpm","통달범위 60~70NM, 고도 25,000ft, 12~15rpm","활주로 연장선 10NM 이내 정밀유도 전용"],"a":2,"e":"ASR은 방위각 360도, 통달범위 60~70NM, 고도 25,000ft, 안테나 회전수 12~15rpm으로 4~5초 내 항적을 갱신한다.","page":331},{"q":"항공고정통신시스템(AFTN)에서 처리된 항공정보의 보존기간은?","o":["7일 이상","15일 이상","30일 이상","90일 이상"],"a":2,"e":"AFTN의 모든 항공정보는 Store-and-Forward 방식으로 처리되며 30일 이상 보존된다.","page":331},{"q":"활주로 중앙선의 자방위가 187°일 때 활주로에 표시되는 번호는?","o":["18","19","187","01"],"a":1,"e":"활주로 번호는 자방위의 가장 가까운 10단위로 반올림한 두 자리 숫자로, 187°는 19로 표시한다.","page":332},{"q":"표지판 색상의 연결이 옳지 않은 것은?","o":["위치표지판 – 흑색 바탕에 황색 문자","활주로명칭표지판 – 적색 바탕에 백색 문자","방향표지판 – 황색 바탕에 흑색 문자","목적지표지판 – 적색 바탕에 황색 문자"],"a":3,"e":"목적지표지판은 황색 면에 흑색 기호이다.","page":335},{"q":"이착륙장 활주로 표면이 아스팔트일 때 활주로 옆선 표지 기준으로 옳은 것은?","o":["길이 2m, 폭 50cm 직사각형, 30m 간격","길이 10m, 폭 30cm 직선, 20m 간격","길이 2m, 폭 50cm 직사각형, 20m 간격","길이 5m, 폭 1m 직사각형, 50m 간격"],"a":0,"e":"활주로 옆선 표지는 길이 2m, 폭 50cm 직사각형으로 가장자리에 30m 간격으로 표시하며, 20m 간격은 양방향동력패러장 표지이다.","page":335},{"q":"수상이착륙장 착수대 경계 표시를 위한 부표 설치 기준은?","o":["착수대 외곽에서 5m 이상 이격","착수대 외곽에서 15m 이상 이격","착수대 외곽에서 30m 이상 이격","착수대 중심에서 50m 이상 이격"],"a":1,"e":"착수대 경계 표시를 위하여 착수대 외곽으로부터 15m 이상 이격하여 부표를 설치한다.","page":335}]},{"id":"nav-3","title":"제3장 항공교통관제","pages":[337,364],"goal":"비행계획서 제출·종료 절차, 사고 시 조치, 관제업무와 공역 분류, 무선통화 요령·ICAO 발음법, 트랜스폰더 운용, 관제용어, 조언업무, 비행장 관제 및 TIBA 절차를 이해한다.","summary":"비행정보구역 안에서 비행하려는 자는 비행 전 비행계획을 관할 항공교통업무기관에 제출하고(출발 최소 60분 전), 착륙 즉시 도착보고를 해야 하며 1시간 이상 지연 시 수정·재제출한다. 관제업무는 비행장·접근·지역관제로 나뉘고, 경량항공기가 운항하는 10,000ft 이하는 비행장·접근관제 범위이며, 공역은 관제(A~E)·비관제(G 등)·통제·주의공역으로 구분된다. 무선통화는 ICAO 발음법을 사용하고 안전 관련 허가는 복창(Read Back)하며, 트랜스폰더는 비행 중 ALT에 두고 VFR 1200, 비상 7500/7600/7700 코드를 사용한다. 관제탑이 없거나 비운영 시에는 TIBA로 위치를 방송한다.","sections":[{"title":"3.1 비행계획서의 제출·내용·종료","page":337,"points":["비행정보구역 안에서 비행하려는 자는 비행 시작 전 비행계획을 수립해 관할 항공교통업무기관에 제출","주요 내용: 식별부호(등록부호), 비행 방식·종류, 대수·형식·최대이륙중량 등급, 탑재장비, 출발비행장·출발예정시간, 순항속도·고도·예정항로, 최초 착륙예정 비행장·총 예상 소요시간","제9호~제14호(교체비행장, 연료탑재량, 탑승 총 인원, 비상무선주파수·구조장비, 기장 성명, 낙하산 강하)는 지방항공청장·항공교통센터장 요청 또는 제출자가 필요하다고 판단할 때만 해당","교체비행장은 시계비행방식 비행 시 제외, 탑승 총 인원은 불가피 시 이륙 직후 제출 가능","비행계획 종료: 착륙 즉시 관할(없으면 가까운) 항공교통업무기관에 도착보고 — 식별부호, 출발비행장, 도착비행장, 목적비행장, 착륙시간","제출 방법: 전화, 팩스, 정보통신망 — 팩스·정보통신망은 항공안전법 시행규칙 별지 제71호 서식","제출시기: 출발 최소 60분 전 / 1시간 이상 지연 시 수정 또는 새로 제출하고 기존 계획 취소"]},{"title":"3.1.6 비행계획서 인터넷 제출 방법","page":340,"points":["주소: http://ubikais.fois.go.kr → iARO → Create for Flight Message → ULP FPL, 특수기호 사용 불가","Flight Identity: 최대 7자리, 호출부호 없으면 등록기호(예: HL-C555) / Flight Rules: V(시계비행) / Flight Type: X(해당 없음)","후방난기류범주: L(Light) / 장비: VHF+트랜스폰더 V/C, 무전기만 V/N, 트랜스폰더만 N/C, 없으면 N/N","비행장: ICAO 4자리 지명부호(예: RKJW 영암, RKLS 여주승진), 없으면 ZZZZ 기입 후 18번란에 DEP/NAJU, DEST/GUMI 등 기재","출발예정시간은 UTC로 기입 — KST에서 9시간을 뺌(1430KST → 0530UTC)","Speed 5자리(첫자리 단위, 노트로 환산) / Level 100ft 단위(A050=5,000ft, A005=500ft) / Route: 30분 간격 직선 주요지점, 처음 DCT","Total EET: 이륙~착륙 중간 기착시간 포함 총 경과시간 / DOF는 YYMMDD 6자리, 120시간(5일) 전까지","보충정보: E/연료탑재량(E/0200), P/탑승인원(P/002), R/비상무선 UHF 243.0MHz·VHF 121.5MHz·ELT, S/생존장비 P극지·D사막·M해상·J밀림"]},{"title":"3.2 사고발생 시 조치사항","page":343,"points":["인명구호를 위해 신속히 필요한 조치","사고 발생·목격 시 관할 지방항공청 및 항공·철도사고조사위원회에 신속히 통보 — 관할 지방항공청 1곳과 사고조사위원회에 각각 통보","재발방지를 위한 정확한 원인규명이 되도록 임의 잔해이동 등 증거를 훼손하지 말 것","항공철도사고조사위원회 전화 044-201-5445"]},{"title":"3.3 항공교통관제 업무 및 공역","page":343,"points":["관제업무: 비행장관제(Aerodrome), 접근관제(Approach), 지역관제(Area Control Service) / 공군 운영 MCRC(중앙방공통제소)","여압이 없는 경량항공기 운영고도는 10,000ft 이하로 비행장·접근관제 범위, 지역관제는 20,000ft 이상 계기비행 항공기 관제","비행장관제: 관제권 내 이착륙 항공기 및 이동지역 내 항공기·차량 이동 통제","관제권(Control Zone): 비행장 중심 반경 5NM, 지표~1,500ft/5,000ft, 운영기관 관제탑, 민·군 공항 35개소","접근관제구역(TCA): 주요 비행장 근처 항로 합류지점에 14개 설정, AGL 700ft~7,000ft/22,000ft","관제공역: 관제기관 통제하에 관제를 받는 공간 / 비관제공역: 통제 없이 자율 사용 공간","비행장교통구역: D등급에서 시계비행 항공기 간 교통정보 제공 / 조언구역·정보구역은 비관제공역","통제공역: 비행금지구역, 비행제한구역, 초경량비행장치 비행제한구역 / 주의공역: 훈련구역, 군작전구역, 위험구역, 경계구역"]},{"title":"3.3.3.3 항공교통업무에 따른 공역 등급","page":346,"points":["A등급: 모든 항공기가 계기비행해야 하는 공역(지역관제업무)","B등급: 모든 항공기에 분리 포함 관제업무 제공 — 인천, 김포, 제주","C등급: 접근관제소 운영 공항 중심 5NM 이내 SFC~5,000ft AGL, 5~10NM 1,000~5,000ft AGL — 광주, 사천, 김해, 원주, 대구 등","D등급: MEA 이상 평균해면 20,000ft 이하 모든 항공로, 접근관제소 미운영 공항 5NM 이내 SFC~관제권 상한 — 청주, 서울, 수원, 양양, 울산, 여수, 무안 등","E등급: 계기비행에 관제업무, 시계비행에 비행정보업무 제공","G등급: 비행정보업무만 제공 — 영공 지표/해면 1,000ft 미만, 공해상 5,500ft 미만, 60,000ft AMSL 초과 비관제공역"]},{"title":"3.4 항공 무선통화 / 발음법","page":347,"points":["무선통화는 영어 권장, 상황에 따라 한국어 사용","송신 요령: 혼신 확인, 정상 음성으로 분명하게, 분당 100단어 초과 금지, 음량 일정, 숫자 전후 간격, '어(er)' 회피, 송신 완료 시까지 스위치 유지","복창(Read Back) 대상: 사용 활주로 번호, 고도계 수정치, 활주로 진입·착륙·이륙·Hold Short·횡단·역주행 허가, SSR 코드, 수평비행 지시, 기수·속도 지시, ATC 비행로 허가","숫자 발음: 3 TREE, 4 FOW-ER, 5 FIFE, 9 NIN-ER, 소수점 DAY-SEE-MAL","시계비행고도: 000~179°는 3,500/5,500/7,500/9,500, 180~359°는 4,500/6,500/8,500","고도계 수정치: 'Altimeter'/'QNH' 다음 분리 숫자, 'point' 사용 안 함(예: Altimeter Two Niner Niner Two)","풍향은 10° 단위 분리 숫자 + at + 풍속(Knots), Gust는 평균풍속보다 10knot 이상 차이 시 사용","Heading은 3자리 분리 숫자, Degrees 생략, 북쪽은 Heading 360 / 주파수는 소수점 아래 두 자리까지, Ground(121MHz)는 소수점 이전 생략 / 트랜스폰더 코드는 4단위 분리 숫자","시간은 UTC 4자리 분리, 'Zulu'는 UTC 표기, 지역시간은 24시간제에 'Local'"]},{"title":"3.5 트랜스폰더","page":352,"points":["트랜스폰더(transmitter+responder)는 1차 레이더 단점을 보완해 특정 항공기를 신속 정확히 식별","Mode A: 0~7 숫자판 4개, 최대 4096(8×8×8×8)개 코드 / 시계비행 일반 코드 1200","스위치: OFF 전원 차단, SBY 예열, ON Mode-3/A 작동, ALT 고도 자동응답(Mode-C), TST 점검","Ident: 지시 코드를 맞추고 식별 버튼을 누른 후 'Ident' 복창 — 레이더 화면에 더 강한 빛으로 표시","경량항공기는 비행 중 기능 스위치를 ALT로 설정, 코드는 관제사로부터 지정받아 사용","코드 세팅 시 비상코드가 무의식적으로 장입되지 않도록 맨 우측 숫자부터 세팅","비상코드: 7500 피랍(Hijacking), 7600 무선통신두절, 7700 비상(Distress)","Squawk VFR = 1200 장입 / Squawk Altitude = Mode-C 작동 / Stop Squawk = 전원 끄기 / Squawk Standby = 대기 위치"]},{"title":"3.6 관제용어","page":354,"points":["Affirm/Affirmative: Yes / Negative: No, 허가불허, 또는 정확하지 않음","Roger: 마지막 송신을 모두 받았다 / Wilco: 알아들었으며 그대로 따르겠다(will comply)","Altitude Readout: Mode C 송출 고도로 레이더 화면에 100ft 단위 전시","Cleared As Filed: 제출된 비행계획서 비행로대로 진행 허가 / Position And Hold: 이륙위치로 활주해 대기, 이륙 허가 아님","Hold Short Of: 지정 장소 또는 활주로 근처에서 다음 지시까지 대기 / Hold For Wake Turbulence: 앞선 대형기와 간격 조정 위해 대기","Mile: 별도 명시 없으면 해상마일(NM, 1.852km), 기상 시정 관련은 법정마일(SM, 1.61km)","Touch-And-Go: 정지·이탈 없이 재이륙 / Stop And Go: 완전 정지 후 동일 지점에서 이륙 / Low Approach: 접지하지 않고 활주로를 따라 접근","Traffic Pattern: Upwind–Crosswind–Downwind–Base–Final, 일반적으로 좌선회(left-hand pattern)"]},{"title":"3.7 조언업무 (안전경보·교통조언)","page":357,"points":["안전경보: 항공기가 지표·장애물·다른 항공기에 위험하게 근접한다고 판단될 때 관제사가 발부","조종사가 상황 인식·회피조치 중임을 통보하면 추가 경보 중단 가능, 경보 후 조치 결정은 조종사 책임","지상 장애물 경보 용어: Low Altitude Alert, Check Your Altitude Immediately (MEA/MVA/MOCA/MIA 고도 안내)","긴급 회피 필요 시 통신문 말미에 'Immediately' 사용 (Traffic Alert ... Immediately)","교통조언: 12시간 시각 기준 방위, 마일 단위 거리, 진행방향, 기종·고도(인지 시) — 급기동 시 8방위로 발부","Traffic No Factor: 더 이상 영향 없음 / Traffic No Longer Observed: 레이더에 전시되지 않으나 여전히 장애요소"]},{"title":"3.8 비행장에서의 관제","page":359,"points":["처음 호출: 관제기관 명칭 → 항공기 호출부호 → 필요 시 위치 → 의도·요청사항 순","수신감도: Unreadable, Readable Now And Then, Readable But With Difficulty, Perfectly Readable / 숫자는 5등급(예: 5 By 5 = Loud & Clear)","지상활주 우선권: 관제탑과 교신한 순서 / 활주로 진입은 관제탑 인가 후에만","활주로 변경: 정배풍 성분 5kts 이상 또는 안전상 필요 시 관제탑 지시로 변경","출항 방식 요청 예: Straight out departure, Right Downwind departure, Left/Right Closed Traffic","착륙 후 유도로 진입 시 Ground로 주파수 전환(Contact Ground)"]},{"title":"3.9 Tower 비운영/없는 이착륙장 / 3.10 항법비행 통화","page":362,"points":["TIBA(항공기 교통정보 방송): 관제공역 밖에서 충돌위험정보 보충이 필요하거나 정상 항공교통업무가 일시 중단된 경우 적용","지정 공역·이착륙장 진입 10분 전부터 해당 공역을 떠날 때까지 TIBA 주파수 계속 경청, 이륙기는 이륙 직후부터 떠날 때까지","VHF 2대 탑재 시 1대는 관제기관 주파수, 1대는 TIBA 주파수","잠재적 충돌위험이 없는 한 방송에 응답하지 않음 / TIBA와 관계없이 정상 위치보고절차는 계속","방송 시점: 계류장 Taxi 전, 활주로 진입 전, 이륙 직전, Crosswind·Base·Final 선회 직전, Downwind, Runway Clear 후, 통과 시 위치·고도·방향","인천비행정보센터(FIS): 호출부호 인천 Information, 주파수 126.9MHz, VFR 비행정보 및 기상 악화 시 Radar Monitor 제공"]}],"memorize":[{"k":"비행계획서 제출시기","v":"출발 최소 60분 전","page":338},{"k":"비행계획 지연 시","v":"1시간 이상 지연 시 수정 또는 새로 제출, 기존 계획 취소","page":338},{"k":"비행계획서 서식","v":"항공안전법 시행규칙 별지 제71호 서식","page":338},{"k":"도착보고 항목","v":"식별부호, 출발비행장, 도착비행장, 목적비행장, 착륙시간","page":337},{"k":"UTC 변환","v":"KST − 9시간 (1430KST = 0530UTC)","page":341},{"k":"비행계획서 장비 코드","v":"V/C(VHF+트랜스폰더), V/N(무전기만), N/C(트랜스폰더만), N/N(없음)","page":341},{"k":"지명부호 없는 비행장","v":"ZZZZ 기입, 18번란에 DEP/·DEST/ 기재","page":341},{"k":"비상무선주파수","v":"UHF 243.0MHz, VHF 121.5MHz","page":342},{"k":"사고 통보처","v":"관할 지방항공청 1곳 + 항공·철도사고조사위원회","page":343},{"k":"경량항공기 운영고도와 관제","v":"10,000ft 이하 — 비행장·접근관제 범위 / 지역관제는 20,000ft 이상 IFR","page":343},{"k":"관제권","v":"비행장 중심 반경 5NM, 지표~1,500ft/5,000ft, 35개소","page":344},{"k":"접근관제구역","v":"14개, AGL 700ft~7,000ft/22,000ft","page":344},{"k":"B등급 공역","v":"인천, 김포, 제주","page":346},{"k":"G등급 공역","v":"비행정보업무만 제공 — 영공 1,000ft 미만, 공해상 5,500ft 미만, 60,000ft AMSL 초과","page":346},{"k":"통제공역 / 주의공역","v":"비행금지·비행제한·초경량비행장치 비행제한구역 / 훈련·군작전·위험·경계구역","page":345},{"k":"무선 송신 속도","v":"분당 100단어 초과 금지","page":347},{"k":"Gust 사용 기준","v":"평균 풍속보다 10knot 이상 차이","page":350},{"k":"Mode A 코드 수","v":"4096개(8×8×8×8)","page":352},{"k":"VFR 트랜스폰더 코드","v":"1200","page":352},{"k":"비상코드","v":"7500 피랍, 7600 통신두절, 7700 비상","page":353},{"k":"비행 중 트랜스폰더 스위치","v":"ALT (Mode-C 고도 자동응답)","page":353},{"k":"코드 세팅 순서","v":"맨 우측 숫자부터 (비상코드 장입 방지)","page":353},{"k":"Wilco / Roger","v":"따르겠다(will comply) / 마지막 송신 모두 수신","page":356},{"k":"Mile 단위","v":"기본 NM(1.852km), 시정 관련 SM(1.61km)","page":355},{"k":"교통장주 구성","v":"Upwind, Crosswind, Downwind, Base, Final — 기본 left-hand","page":357},{"k":"활주로 변경 기준","v":"정배풍 성분 5kts 이상 또는 안전상 필요 시","page":360},{"k":"지상활주 우선권","v":"관제탑과 교신한 순서","page":360},{"k":"TIBA 경청 시작","v":"지정 공역·이착륙장 진입 10분 전부터 공역을 떠날 때까지","page":362},{"k":"인천 FIS","v":"인천 Information, 126.9MHz","page":364}],"quiz":[{"q":"비행계획서의 제출시기로 옳은 것은?","o":["출발 최소 30분 전","출발 최소 60분 전","출발 최소 2시간 전","출발 전날까지"],"a":1,"e":"[표 3-1]에 따르면 비행계획서는 출발 최소 60분 전에 제출한다.","page":338},{"q":"제출된 비행계획이 지연될 때 비행계획을 수정하거나 새로 제출하고 기존 계획을 취소해야 하는 기준은?","o":["30분 이상 지연","1시간 이상 지연","2시간 이상 지연","당일 중 출발하지 못한 경우"],"a":1,"e":"제출된 비행계획이 1시간 이상 지연될 때에는 수정하거나 새 비행계획을 제출하고 기존 계획은 취소해야 한다.","page":338},{"q":"경량항공기가 도착비행장에 착륙한 후 도착보고에 포함해야 하는 사항이 아닌 것은?","o":["식별부호(등록부호)","출발비행장","착륙시간","연료 잔량"],"a":3,"e":"도착보고 사항은 식별부호, 출발비행장, 도착비행장, 목적비행장(따로 있는 경우), 착륙시간이다.","page":337},{"q":"인터넷 비행계획서에 출발예정시간을 기입할 때, 한국시간 14시 30분 이륙이면 기입할 값은?","o":["1430","2330","0530","0930"],"a":2,"e":"출발예정시간은 UTC로 기입하며 국내시간에서 9시간을 빼므로 1430KST는 0530UTC이다.","page":341},{"q":"비행계획서 통신·감시장비 항목에서 VHF 무전기와 트랜스폰더를 모두 갖춘 경우 기입하는 값은?","o":["V/C","V/N","N/C","N/N"],"a":0,"e":"VHF와 트랜스폰더가 있으면 V/C, 무전기만 V/N, 트랜스폰더만 N/C, 장비가 없으면 N/N이다.","page":341},{"q":"경량항공기 사고 발생 시 조치사항으로 옳지 않은 것은?","o":["인명구호를 위해 신속히 필요한 조치를 취한다.","관할 지방항공청과 항공·철도사고조사위원회에 통보한다.","2차 사고 방지를 위해 잔해를 임의로 신속히 치운다.","정확한 원인규명을 위해 증거를 훼손하지 않는다."],"a":2,"e":"재발방지를 위한 원인규명이 되도록 임의 잔해이동 등 증거를 훼손하지 말아야 한다.","page":343},{"q":"관제권(Control Zone)의 일반적인 범위로 옳은 것은?","o":["비행장 중심 반경 3NM, 지표~1,000ft","비행장 중심 반경 10NM, 지표~10,000ft","비행장 중심 반경 20NM, AGL 700ft~7,000ft","비행장 중심 반경 5NM, 지표~1,500ft/5,000ft"],"a":3,"e":"관제권은 비행장 중심 반경 5NM, 지표~1,500ft/5,000ft 범위이며 관제탑이 운영한다.","page":344},{"q":"공역 사용목적에 따른 분류 중 '주의공역'에 해당하지 않는 것은?","o":["훈련구역","군작전구역","비행제한구역","경계구역"],"a":2,"e":"비행제한구역은 통제공역이며, 주의공역은 훈련구역·군작전구역·위험구역·경계구역이다.","page":345},{"q":"모든 항공기에 분리를 포함한 항공교통관제업무가 제공되며 인천·김포·제주가 해당하는 공역 등급은?","o":["A등급","C등급","D등급","B등급"],"a":3,"e":"[표 3-3]에서 B등급은 모든 항공기에 분리를 포함한 관제업무를 제공하며 인천, 김포, 제주가 해당한다.","page":346},{"q":"G등급 공역에 대한 설명으로 옳은 것은?","o":["모든 항공기가 계기비행을 해야 한다.","모든 항공기에 비행정보업무만 제공되는 비관제공역이다.","계기비행에는 관제업무, 시계비행에는 비행정보업무가 제공된다.","MEA 이상 20,000ft 이하 모든 항공로이다."],"a":1,"e":"G등급은 A~E등급 이외의 비관제공역으로 모든 항공기에 비행정보업무만 제공된다.","page":346},{"q":"조종사가 관제사에게 반드시 복창(Read Back)해야 하는 안전 관련 사항이 아닌 것은?","o":["사용 활주로 번호","고도계 수정치","2차 감시레이더(트랜스폰더) 코드","교통정보 방송의 일반 기상 개황"],"a":3,"e":"복창 대상은 활주로 번호, 고도계 수정치, 활주로 진입·이착륙 등 허가, SSR 코드, 수평비행·기수·속도 지시, ATC 비행로 허가이다.","page":347},{"q":"ICAO 무선 송신기법에 대한 설명으로 옳지 않은 것은?","o":["평균속도는 분당 150단어 정도로 빠르게 유지한다.","송신 전 사용할 주파수에 혼신이 없는지 확인한다.","'어(er)'와 같은 주저하는 용어 사용을 피한다.","숫자 전후로 약간의 간격을 둔다."],"a":0,"e":"평균속도는 분당 100단어를 초과하지 않도록 유지해야 한다.","page":347},{"q":"고도계 수정치 29.92를 읽는 방법으로 옳은 것은?","o":["Altimeter, Two Nine Point Nine Two","Altimeter, Two Niner Niner Two","Altimeter, Twenty-Nine Ninety-Two","QNH, Two Niner Decimal Niner Two"],"a":1,"e":"'Altimeter' 또는 'QNH' 다음에 분리된 숫자로 읽으며 'point'는 사용하지 않는다.","page":350},{"q":"지상풍 보고에서 'Gusts'를 사용하는 기준은?","o":["평균 풍속보다 5knot 이상 차이","평균 풍속이 15knot 이상","평균 풍속보다 10knot 이상 차이","풍향이 60° 이상 변화"],"a":2,"e":"Gust는 평균 풍속보다 10knot 이상의 차이가 있을 때 사용한다.","page":350},{"q":"무선통신 두절(Communication Failure) 시 설정하는 트랜스폰더 비상코드는?","o":["7500","7700","1200","7600"],"a":3,"e":"7500은 피랍, 7600은 무선통신 두절, 7700은 비상 상황 발생이다.","page":353},{"q":"트랜스폰더 운용에 관한 설명으로 옳지 않은 것은?","o":["경량항공기는 비행 중 기능 스위치를 ALT로 맞춘다.","코드는 관제사로부터 지정받아 사용한다.","코드 세팅은 비상코드 장입 방지를 위해 맨 좌측 숫자부터 한다.","Mode A는 최대 4096개의 코드를 조합할 수 있다."],"a":2,"e":"무의식적으로 비상코드가 장입되지 않도록 네 개의 숫자판 중 맨 우측의 변경이 필요한 숫자부터 세팅한다.","page":353},{"q":"관제사가 'Squawk VFR'이라고 지시하였다. 조종사의 조치는?","o":["트랜스폰더 코드를 1200으로 장입한다.","트랜스폰더 전원을 끈다.","식별 버튼을 누른다.","Mode-C를 작동시킨다."],"a":0,"e":"Squawk VFR은 트랜스폰더를 시계비행 코드(1200)로 장입하라는 의미이다.","page":353},{"q":"'당신의 메시지를 알아들었으며 그대로 따르겠다'는 의미의 관제용어는?","o":["Roger","Affirm","Wilco","Acknowledge"],"a":2,"e":"Wilco는 will comply의 축약형으로 메시지를 알아들었으며 그대로 따르겠다는 뜻이다. Roger는 수신만을 의미한다.","page":356},{"q":"관제용어 'Position And Hold'의 의미로 옳은 것은?","o":["이륙을 허가한다.","이륙 활주로 상의 이륙 위치로 활주하여 대기하라(이륙 허가는 아님).","활주로 근처 지정 장소에서 대기하라.","현재 위치에서 선회 대기하라."],"a":1,"e":"Position And Hold는 이륙 활주로 상의 이륙 위치로 활주해 대기하라는 지시이며 이륙을 허가하는 것은 아니다.","page":356},{"q":"관제용어에서 'Mile'에 대한 설명으로 옳은 것은?","o":["항상 법정마일(SM)을 뜻한다.","별도 명시가 없으면 해상마일(NM, 1.852km)이며 시정 관련은 법정마일(SM)이다.","항상 킬로미터를 뜻한다.","시정 관련은 해상마일, 그 외는 법정마일이다."],"a":1,"e":"'마일'은 별도로 명시하지 않는 한 해상마일(1.852km)이며, 기상에서 시정과 관련된 경우는 법정마일(1.61km)을 뜻한다.","page":355},{"q":"교통장주 중 착륙활주로의 착륙방향과 반대 방향으로 평행인 비행로는?","o":["Downwind Leg","Upwind Leg","Crosswind Leg","Base Leg"],"a":0,"e":"Downwind Leg는 착륙방향과 반대 방향으로 평행인 비행로이며, Upwind Leg는 착륙방향과 일치·평행한 비행로이다.","page":357},{"q":"관제사의 안전경보(Safety Alert) 발부 후 어떤 조치를 취할지 결정하는 책임은 누구에게 있는가?","o":["관제사","지방항공청장","조종사","항공교통센터장"],"a":2,"e":"경보 발부 후 조치가 필요한 경우 어떤 조치를 취할 것인가를 결정하는 것은 조종사 소관(조종사 책임)이다.","page":357},{"q":"'Traffic No Longer Observed'의 의미로 옳은 것은?","o":["관련 항공기가 더 이상 영향을 주지 않는다.","조종사가 항적을 육안으로 확인했다.","관련 항공기가 착륙했다.","관련 항공기가 레이더에 더 이상 전시되지 않으나 여전히 장애요소로 존재한다."],"a":3,"e":"Traffic No Longer Observed는 레이더 시현장치에 더 이상 전시되지 않으나 여전히 장애요소로 존재함을 의미한다.","page":356},{"q":"비행장에서의 관제에 관한 설명으로 옳지 않은 것은?","o":["처음 호출 시 상대방을 먼저 부르고 자신의 호출부호를 말한다.","지상활주 우선권은 관제탑과 교신한 순서에 의한다.","활주로 진입은 관제탑의 인가 없이 안전 확인 후 할 수 있다.","정배풍 성분 5kts 이상이면 관제탑 지시로 활주로를 변경할 수 있다."],"a":2,"e":"활주로 진입은 관제탑의 인가를 얻은 후에만 할 수 있다.","page":360},{"q":"Tower가 없는 이착륙장에서의 항공기 교통정보 방송(TIBA)에 관한 설명으로 옳지 않은 것은?","o":["지정 공역 진입 10분 전부터 TIBA 주파수를 경청한다.","VHF 2대 탑재 시 1대는 관제기관, 1대는 TIBA 주파수에 맞춘다.","모든 방송에 반드시 응답해야 한다.","TIBA와 관계없이 정상적인 위치보고절차를 계속한다."],"a":2,"e":"잠재적인 충돌위험이 느껴지지 않는 한 방송에 대한 응답을 해서는 아니 된다.","page":362},{"q":"인천비행정보센터(FIS)의 호출부호와 주파수로 옳은 것은?","o":["인천 Information, 126.9MHz","인천 Approach, 121.5MHz","인천 Tower, 118.0MHz","인천 Center, 243.0MHz"],"a":0,"e":"인천비행정보센터의 호출부호는 인천 Information, 주파수는 126.9MHz이며 VFR 비행정보와 기상악화 시 Radar Monitor를 제공한다.","page":364}]},{"id":"nav-4","title":"제4장 비상절차","pages":[365,371],"goal":"조난·긴급 상황에서 트랜스폰더·ELT·무선호출 절차와 수색구조(SAR) 체계, 통신두절 시 조치를 정확히 알아야 한다.","summary":"비상 시 조종사는 트랜스폰더 Code 7700(통신두절은 7600)을 설정하거나 MAYDAY(조난)/PAN-PAN(긴급)을 3번 반복해 비상을 선포한다. ELT는 121.5/243.0/406MHz 중 하나로 하향가청음을 발신하며 한 번 작동하면 48시간 신호를 낸다. 수색구조는 ICAO Annex 12를 따르며 인천FIR의 RCC 업무는 항공교통센터(ACC) 항공정보과가 담당하고, 비상단계는 불확실-경보-조난 3단계로 구분된다. 비행계획서는 도착지연 판단의 가장 적절한 근거이며, 최종목적지 도착예정시간 후 30분까지 통보가 없으면 수색이 시작된다.","sections":[{"title":"4.1 조종사를 위한 비상지원 업무","page":365,"points":["비상 시 조종사는 구두 또는 트랜스폰더 Mode 3/A에 Code 7700을 맞추어 비상을 선포하고, 상세한 비상내용과 조종사의 결심을 통보한다.","Code 7700은 레이더 포착 범위 내에서 지상 경보장치를 자동 작동시키고 레이더 화면에 특이한 형태로 나타나게 하며, ATC는 다른 모든 항적에 우선하여 비상항공기에 우선권을 부여한다.","ELT(비상위치송신기)는 추락 항공기 위치를 발견하기 위한 장비로, 모든 항공기에 장착하도록 되어 있으나 경량항공기의 필수장비는 아니다.","ELT는 내장 건전지로 작동하며 121.5MHz, 243.0MHz, 406MHz 중 하나로 작동하고, 수색구조 항공기가 식별하기 쉽도록 하향가청음(Downward Swept Audio Tone)을 발신한다.","ELT는 충격 작동형과 물에 잠기면 작동하는 형태가 있으며, 한 번 작동되면 48시간 지속적으로 신호를 방출한다.","ELT 오작동은 특수기동, 거친 착륙(Hard Landing), 지상 정비요원의 주변 장비 점검이나 ELT 이동 시 취급 잘못으로 자주 발생한다.","비행 중 121.5/243.0MHz ELT 신호를 청취하면 ATC에 최초 청취 위치, 최종 청취 위치, 최대강도 신호 위치, 비행고도 및 수신 주파수를 통보한다(가능하면 항법보조시설 기준 위치)."]},{"title":"4.2 수색 및 구조","page":366,"points":["한국 내 수색구조는 ICAO Annex 12의 국제표준 및 권고방식을 따르며, 재난 관련 사항은 「재난 및 안전관리 기본법」과 「수난구호법」에 따른다.","구조조정본부(RCC)는 SAR 업무를 조정·통제하는 기관으로, 인천FIR 내 RCC 업무는 항공교통센터(ACC) 항공정보과에서 담당한다.","비상의 단계: 불확실 단계(안전이 불확실) → 경보 단계(안전이 염려됨) → 조난 단계(중대하고 절박한 위험 또는 긴급한 도움이 필요하다는 상당한 증거).","ACC는 곤란·도착지연·실종 항공기 정보를 어떤 출처로든 접수하면 SAR 시스템을 비상대기시키며, 레이더조언 중 예고 없이 레이더에서 사라지거나 통신이 두절되면 비상으로 간주한다.","제출된 비행계획서는 도착지연 항공기를 판단하는 데 시기·효과 면에서 가장 적절한 근거이며 수색계획 수립에 매우 중요하다.","최종목적지 도착시간만 기재한 장거리 비행계획서의 경우 도착예정시간 후 30분이 지나서야 수색이 시작될 수 있으므로, 최대 보호를 원하면 첫 착륙예정지점까지 제출하고 각 경로마다 다시 제출한다.","경로 도중 착륙하여 30분 이상 지체되거나 계획 외 장소에 착륙하면 관련기관에 통보하고 원래 행선지를 알려야 하며, 도착예정시간부터 30분까지 통보가 없으면 수색이 시작된다.","VFR/DVFR 비행계획서 종결 책임은 조종사에게 있고 자동 종결되지 않는다. 부상 생존자의 생존 가능성은 사고 후 첫 24시간 동안 약 80%가 결정되고 첫 3일 이후 급격히 감소한다."]},{"title":"4.3 조난 및 긴급 시 절차","page":367,"points":["조난·긴급 시 가능하면 통신·레이더 포착을 위해 고도를 상승하되, 관제공역 내에서 VMC를 유지할 수 없다면 사전 통보 없이 상승·강하해서는 안 된다.","조난호출이나 조난메시지 송신은 반드시 기장(PIC)이 하며, 트랜스폰더는 특별한 지시가 없는 한 ATC가 지정한 Code로 계속 작동시킨다(항상 7700에 맞출 필요는 없음). ATC와 통신이 안 되면 7600 또는 7700을 맞춘다.","최초 호출은 현재 사용 중인 주파수로 하고, 필요하면 비상주파수 121.5MHz 또는 243.0MHz로 송신할 수 있으며, 이후 ATC가 지정한 주파수를 사용한다.","조난은 MAYDAY, 긴급은 PAN-PAN을 3번 반복하고 항공기 호출부호를 3번 반복한다. EMERGENCY라는 용어는 VHF/UHF 주파수로 비상통보 시 사용한다.","조난호출은 모든 통신에 절대적으로 우선하며 MAYDAY는 해당 주파수의 무선통신 중단·침묵 명령이다. 긴급통신은 조난통신을 제외한 모든 통신에 우선하며 PAN-PAN은 다른 통신소가 간섭해서는 안 된다는 경고이다.","조난/긴급 메시지 순서: ①MAYDAY/PAN-PAN ②호출부호 ③현위치 및 침로 ④고도와 분으로 환산한 연료잔량 ⑤기종 ⑥비상 내용 ⑦조종사의 결심 ⑧탑승인원수 ⑨기타 유용한 정보.","긴급상태는 곤란에 처한 항공기가 비행장 등 적절한 곳까지 비행할 수 있는 상황이고, 조난상태는 적절한 비행장에 착륙할 수 없는 상황이다."]},{"title":"4.4 무선교신 후 절차","page":369,"points":["무선통신이 이루어진 후 조종사는 수신한 권고나 지시를 따르고, 지시를 이해하지 못했거나 허가를 따를 수 없으면 주저 없이 질문한다.","위치를 모르면 장착된 ELT 등 비상통신장비를 작동시킨다.","지상통신소에 방향탐지기(DF)가 있으면 조난호출·메시지 송신 후 송신단추를 10초 길이로 2번 누르고 호출부호를 송신한 후 Over로 끝낸다.","조난이나 긴급통신을 방해할 수 있는 다른 무선통신소는 침묵을 지켜야 한다(예: All Stations stop transmission. We have an MAYDAY).","꼭 필요하지 않으면 주파수나 지상통신소를 변경하지 말고, 변경 시 사전에 현재 교신 중인 통신소에 통보하며, 새 주파수에서 교신이 안 되면 즉시 이전 주파수로 되돌아간다."]},{"title":"4.5 육상불시착 또는 해상비상착수 시 사전조치","page":369,"points":["시간과 상황이 허락하면 조난·긴급 송신내용에 추가하여 ELT 상태, 저명한 지형지물, 항공기 색깔(표지), 탑승 인원수, 탑재 비상장구, SAR에 도움이 되는 모든 정보를 송신한다.","장착상태가 허용하면 ELT를 작동시킨다.","화재 위험이 없다고 판단되면 무전통신기를 계속 송신위치에 맞추어 놓는다.","해상 비상착수가 필요하면 해상의 선박 근처에 착수하도록 노력한다.","수색항공기나 지상대원이 찾기 어려운 곳이 아니라면 추락 후 가능한 한 항공기에 있는 것이 가장 좋으며 수색항공기에 신호할 방법을 강구한다."]},{"title":"4.6 지상통신소 조치","page":370,"points":["조난·긴급메시지를 접수한 지상통신소는 즉시 응답하고, 필요하면 SAR 대원 파견을 포함한 협조절차를 밟는다.","응답 메시지 순서: ①조난메시지를 전달한 항공기 호출부호 3번 ②응답 통신소 호출부호 3번 ③Roger ④MAYDAY ⑤Out.","Out은 통상 VHF나 UHF에서는 생략한다."]},{"title":"4.7 다른 항공기 행동요령","page":370,"points":["다른 항공기의 조난을 알게 된 조종사는 송신을 경청하다가 조난항공기가 스스로 송신하지 못하거나, 지상통신소가 청취하지 못한다고 간주되거나, 추가 조언사항이 있을 때 통신소로 전달한다.","조난메시지 전달 순서: ①MAYDAY RELAY 3번 ②전달하는 항공기 호출부호 3번.","조난항공기가 다른 항공기 통신으로 방해받으면 주변 항공기는 방해 항공기에 침묵을 지시할 수 있으며, 이때 자신의 호출부호 다음에 DISTRESS라는 용어를 사용한다.","조난항공기를 알게 된 항공기는 구조활동에 참여하지 않더라도 감시·추적하다가 필요 시 도움을 주어야 한다.","감시 항공기는 조난항공기가 사용하는 동안 그 주파수로 송신해서는 안 되며, 조난항공기가 비상처치를 잘하고 있으면 통상적인 조언업무만 수행하고 어떤 경우에도 방해해서는 안 된다."]},{"title":"4.8 무선통신고장","page":371,"points":["비행 중 ATC와 무선통신이 두절되면 트랜스폰더 장착 시 Mode 3/A Code 7600을 설정한다.","시계비행 상태를 유지하고 비행을 계속하여 가장 가까운 착륙가능 비행장/이착륙장에 착륙한다.","착륙 후 도착사실을 지체 없이 관계 항공교통관제기관에 통지하여야 한다."]}],"memorize":[{"k":"비상 트랜스폰더 코드","v":"Mode 3/A Code 7700","page":365},{"k":"통신두절 트랜스폰더 코드","v":"Mode 3/A Code 7600","page":371},{"k":"ELT 작동 주파수","v":"121.5MHz, 243.0MHz, 406MHz 중 하나","page":365},{"k":"ELT 신호 지속시간","v":"한 번 작동되면 48시간 지속 방출","page":365},{"k":"ELT 발신음","v":"하향가청음(Downward Swept Audio Tone)","page":365},{"k":"ELT 작동 형식","v":"충격 작동형, 물에 잠기면 작동형 / 경량항공기 필수장비 아님","page":365},{"k":"ELT 신호 청취 시 보고사항","v":"최초 청취 위치, 최종 청취 위치, 최대강도 위치, 비행고도 및 수신 주파수","page":365},{"k":"수색구조 국제기준","v":"ICAO Annex 12","page":366},{"k":"인천FIR RCC 업무 담당","v":"항공교통센터(ACC) 항공정보과","page":366},{"k":"비상의 3단계","v":"불확실 단계(Uncertainty) → 경보 단계(Alert) → 조난 단계(Distress)","page":366},{"k":"수색 개시 시점","v":"최종목적지 도착예정시간 후 30분까지 통보 없을 때","page":367},{"k":"경로 도중 착륙 통보 기준","v":"30분 이상 지체 시 관련기관에 통보 및 원래 행선지 통보","page":367},{"k":"생존 가능성 통계","v":"첫 24시간 동안 약 80% 결정, 첫 3일 이후 급격히 감소","page":367},{"k":"비행계획서 종결 책임","v":"조종사(자동 종결되지 않음)","page":367},{"k":"조난/긴급 호출 용어","v":"조난 MAYDAY 3회, 긴급 PAN-PAN 3회, 호출부호 3회","page":368},{"k":"비상주파수","v":"121.5MHz 또는 243.0MHz","page":368},{"k":"조난호출 송신자","v":"반드시 기장(PIC)","page":368},{"k":"통신 우선순위","v":"조난통신 > 긴급통신 > 기타 모든 통신","page":368},{"k":"조난/긴급 메시지 순서","v":"MAYDAY/PAN-PAN → 호출부호 → 현위치·침로 → 고도·연료잔량(분) → 기종 → 비상내용 → 결심 → 탑승인원 → 기타","page":368},{"k":"긴급 vs 조난 상태","v":"긴급: 적절한 비행장까지 비행 가능 / 조난: 적절한 비행장에 착륙할 수 없음","page":369},{"k":"방향탐지(DF) 송신방법","v":"송신단추 10초 길이로 2번 → 호출부호 → Over","page":369},{"k":"지상통신소 응답 순서","v":"상대 호출부호 3회 → 자국 호출부호 3회 → Roger → MAYDAY → Out(VHF/UHF 생략)","page":370},{"k":"조난메시지 중계","v":"MAYDAY RELAY 3회 → 중계 항공기 호출부호 3회","page":370},{"k":"방해 항공기 침묵 지시 용어","v":"자기 호출부호 다음 DISTRESS","page":370},{"k":"통신두절 시 조치","v":"7600 설정, VMC 유지, 가장 가까운 착륙가능 비행장/이착륙장 착륙 후 지체 없이 통지","page":371}],"quiz":[{"q":"ELT(비상위치송신기)에 관한 설명으로 옳지 않은 것은?","o":["내장된 건전지로 작동한다","한 번 작동되면 48시간 지속적으로 신호를 방출한다","경량항공기에는 반드시 장착해야 하는 필수장비이다","하향가청음(Downward Swept Audio Tone)을 발신한다"],"a":2,"e":"ELT는 모든 항공기에 장착하도록 되어 있으나 경량항공기의 필수장비는 아니다.","page":365},{"q":"ELT의 작동 주파수에 해당하지 않는 것은?","o":["121.5MHz","243.0MHz","406MHz","118.0MHz"],"a":3,"e":"ELT는 121.5MHz, 243.0MHz, 406MHz 중 하나로 작동한다.","page":365},{"q":"비행 중 ELT 신호를 청취했을 때 ATC에 통보할 사항이 아닌 것은?","o":["최초로 신호를 들었을 때의 위치","자기 항공기의 잔여 연료량","최대강도의 신호가 들렸던 위치","비행고도 및 비상신호를 수신한 주파수"],"a":1,"e":"통보사항은 최초·최종 청취 위치, 최대강도 신호 위치, 비행고도 및 수신 주파수이다.","page":365},{"q":"인천비행정보구역(Incheon FIR) 내 구조조정본부(RCC) 업무를 담당하는 곳은?","o":["항공교통센터(ACC) 항공정보과","지방항공청 운항과","해양경찰청 상황실","공항 관제탑"],"a":0,"e":"인천FIR 내 RCC 업무는 항공교통센터(ACC) 항공정보과에서 담당한다.","page":366},{"q":"항공기와 탑승자의 안전이 '염려되는' 상황에 해당하는 비상의 단계는?","o":["불확실 단계(Uncertainty Phase)","경보 단계(Alert Phase)","조난 단계(Distress Phase)","긴급 단계(Urgency Phase)"],"a":1,"e":"불확실 단계는 안전이 불확실한 상황, 경보 단계는 안전이 염려되는 상황, 조난 단계는 중대하고 절박한 위험 상황이다.","page":366},{"q":"비행계획서를 제출한 항공기가 최종목적지 도착예정시간으로부터 몇 분까지 통보가 없으면 수색활동이 시작되는가?","o":["10분","15분","60분","30분"],"a":3,"e":"최종목적지 도착예정시간으로부터 30분까지 통보가 없으면 수색활동이 시작된다.","page":367},{"q":"VFR 비행계획서 종결에 관한 설명으로 옳은 것은?","o":["착륙과 동시에 자동으로 종결된다","관제탑이 종결 책임을 진다","종결 책임은 조종사에게 있으며 자동 종결되지 않는다","도착 후 24시간 이내에만 종결하면 된다"],"a":2,"e":"VFR 또는 DVFR 비행계획서의 종결 책임은 조종사에게 있고 자동으로 종결되지 않는다.","page":367},{"q":"조난 및 긴급 호출에 관한 설명으로 옳지 않은 것은?","o":["조난의 경우 MAYDAY를 3번 반복한다","긴급의 경우 PAN-PAN을 3번 반복한다","긴급통신은 조난통신을 포함한 모든 통신에 우선한다","조난호출은 반드시 항공기의 기장(PIC)이 하여야 한다"],"a":2,"e":"긴급통신은 조난통신을 제외하고 모든 통신에 우선하며, 조난호출이 모든 통신에 절대적으로 우선한다.","page":368},{"q":"조난 또는 긴급 메시지 송신 순서로 옳은 것은?","o":["MAYDAY/PAN-PAN → 호출부호 → 현위치 및 침로 → 고도·연료잔량","호출부호 → MAYDAY/PAN-PAN → 기종 → 현위치","MAYDAY/PAN-PAN → 탑승인원수 → 호출부호 → 조종사의 결심","현위치 → 호출부호 → MAYDAY/PAN-PAN → 비상 내용"],"a":0,"e":"순서는 MAYDAY/PAN-PAN, 호출부호, 현위치 및 침로, 고도와 연료잔량, 기종, 비상 내용, 결심, 탑승인원, 기타 정보이다.","page":368},{"q":"교재에서 정의한 '긴급상태'에 해당하는 것은?","o":["적절한 비행장에 착륙할 수 없는 상황","곤란에 처한 항공기가 비행장과 같은 적절한 곳까지 비행할 수 있는 상황","항공기가 이미 불시착한 상황","통신이 완전히 두절된 상황"],"a":1,"e":"긴급상태는 적절한 곳까지 비행할 수 있는 상황이고, 조난상태는 적절한 비행장에 착륙할 수 없는 상황이다.","page":369},{"q":"지상통신소에 방향탐지기(DF)가 있을 때 조난메시지 송신 후 조종사의 조치로 옳은 것은?","o":["송신단추를 5초 길이로 3번 누른다","트랜스폰더를 IDENT만 누른다","주파수를 즉시 243.0MHz로 변경한다","송신단추를 10초 길이로 2번 누르고 호출부호 송신 후 Over로 끝낸다"],"a":3,"e":"DF가 있으면 송신단추를 10초 길이로 2번 누르고 호출부호를 송신한 후 Over라고 말하고 끝낸다.","page":369},{"q":"다른 항공기의 조난메시지를 중계(전달)할 때 첫 호출로 옳은 것은?","o":["PAN-PAN 3번","MAYDAY RELAY 3번","EMERGENCY 3번","DISTRESS 1번"],"a":1,"e":"조난메시지 전달 시 MAYDAY RELAY를 3번, 이어서 전달하는 항공기의 호출부호를 3번 호출한다.","page":370},{"q":"육상불시착 또는 해상비상착수가 임박했을 때의 사전조치로 옳지 않은 것은?","o":["해상 착수 시 선박 근처에 착수하도록 노력한다","화재 위험이 없으면 무전기를 계속 송신위치에 둔다","추락 후에는 즉시 항공기를 떠나 멀리 이동하는 것이 가장 좋다","장착상태가 허용하면 ELT를 작동시킨다"],"a":2,"e":"찾기 어려운 곳이 아니라면 추락 후 가능한 한 항공기에 있는 것이 가장 좋다.","page":370},{"q":"비행 중 항공교통관제기관과 무선통신이 두절된 경우 조종사의 조치로 옳은 것은?","o":["Code 7500을 설정하고 출발지로 회항한다","Code 7700을 설정하고 계기비행으로 목적지까지 비행한다","Code 1200을 설정하고 비행을 계속한다","Code 7600을 설정하고 시계비행을 유지하여 가장 가까운 착륙가능 비행장에 착륙한다"],"a":3,"e":"통신두절 시 Mode 3/A Code 7600을 맞추고 시계비행 상태로 가장 가까운 착륙가능 비행장/이착륙장에 착륙 후 지체 없이 통지한다.","page":371}]},{"id":"nav-5","title":"제5장 항공정보","pages":[372,395],"goal":"종합항공정보집(AIP, AIP SUP, NOTAM, AIC 등)의 종류와 기준, ATIS 해독, NOTAM 시리즈·Q항목·A~G항목 형식, 항공지도 종류를 알아야 한다.","summary":"항공정보는 AIP·AIP 보충판·NOTAM·PIB·AIC 등으로 구성된 종합항공정보집 형태로 제공되며, AIP는 GEN·ENR·AD 3부분으로 구성된다(한국은 AD 3 헬기장 제외). NOTAM은 3개월 이상 유효할 수 없고 초과 예상 시 AIP 보충판으로 발간하며, 공역 운영 공고는 최소 7일 전(일반 훈련은 3일 전) 공고한다. NOTAM은 시리즈문자+4자리 일련번호/연도2자리로 번호를 붙이고 Q항목(8개 소항목)과 A~G항목으로 구성된다. ATIS는 공항 항공정보를 음성으로 반복 제공하며, 우리나라는 AIP에 필요한 정보를 수록해 비행장도·항로지도 등 각종 항공지도를 발간한다.","sections":[{"title":"5.1 항공정보 출판물","page":372,"points":["종합항공정보집(Integrated Aeronautical Information Package): AIP(수정판 포함), AIP 보충판, NOTAM, 비행 전 정보게시(PIB), 항공정보회람(AIC), 유효 NOTAM 대조표 및 목록으로 구성된 인쇄물 또는 전자매체 패키지.","AIP: 항공항행에 필수적이고 영구적인 성격의 항공정보를 수록한 간행물로, 일반사항(GEN)·항공로(ENR)·비행장(AD) 부분으로 구성한다.","AIP 보충판(AIP SUP): 3개월 이상의 장기간 일시적 변경 및 많은 분량의 본문·그림을 포함하는 단기간 정보사항을 발간.","항공정보회람(AIC): 비행안전·항행·기술·행정·규정개정 등에 관한 내용으로서 NOTAM이나 AIP에 의한 전파 대상이 되지 않는 정보를 수록한 공고문.","NOTAM: 직접 비행에 관련 있는 정보의 발효기간이 일시적·단기간이거나, 운영상 중요한 영구적 변경 또는 장기간 일시적 변경이 짧은 시간 내 고시될 때 신속히 작성·발행한다."]},{"title":"5.2 항공정보시스템","page":372,"points":["국토교통부 항공정책실은 우편·AFTN으로 제공하던 AIP, NOTAM을 일반 국민도 실시간 확인할 수 있도록 항공정보시스템(AIS) 홈페이지(http://ais.casa.go.kr)를 제공한다.","유비카이스(UBIKAIS, 서울지방항공청): ICAO 부속서 15(Aeronautical Information Services) 규정 항공정보를 인터넷으로 실시간 제공하는 시스템(http://ubikais.fois.go.kr).","유비카이스는 NOTAM, PIB, 기상상황, 공항교통정보, 비행계획서 접수 및 승인 등 항공기 운항 전반의 정보를 제공한다.","ATIS(공항정보방송시설): 공항의 각종 항공정보를 음성으로 반복 제공하는 항공정보통신시설로 전화로도 제공한다(인천 032-743-2676, 김포 02-2660-2676, 김해 051-974-2676, 제주 064-797-2676).","ATIS 포함 내용: 공항/시설명, 음성문자코드(A~Z), 기상전문시간(UTC), 풍향·풍속, 시정·시정장애물, 현 기상현상, 하늘상태, 온도·이슬점, 고도계 수정치, 필요시 밀도고도조언 등.","ATIS의 풍향·풍속, 고도계 수정치는 공인 계기를 직접 판독한 자료여야 하고, 온도·이슬점은 가능할 경우 공인 감지기를 직접 판독한 자료여야 하며, 참고자료는 번개·적란운·층적운을 포함한다.","ATIS 식별부호는 Alpha부터 Zulu까지 차례로 부여되며(예: Information Hotel = H), 마지막에 Advise You Have Information Hotel로 식별부호 재확인을 요구한다.","ATIS 예문 해독: Wind 320 At 12 Knots = 320° 방향에서 12kt, RVR Touchdown 1700/Mid 2000/Roll out 1900m = 활주로 각 지점 가시거리, QNH 1016 hPa = 고도계 수정치."]},{"title":"5.3 항공정보간행물(AIP)","page":374,"points":["AIP는 항공항행에 필요한 영속적인 성격의 항공정보를 수록하기 위해 정부 당국이 발행하는 간행물이다.","ICAO Annex 15에서 제시한 AIP 구성: 총론(GEN), 항로(ENR), 공항(AD) 3부분.","GEN: GEN 0 머리말, GEN 1 국내규정 및 기준, GEN 2 도표 및 부호, GEN 3 업무, GEN 4 비행장·헬기장 및 항공항행업무 사용료.","ENR: ENR 1 일반 규칙 및 절차, ENR 2 항공교통업무공역, ENR 3 ATS 항공로(ENR 3.5 기타항공로), ENR 4 무선항행안전시설, ENR 5 항행경고, ENR 6 항공로 지도.","ENR 5.4 항공항행장애물: 높이가 지상 100미터 이상인 장애물 목록. ENR 5.5는 항공스포츠 및 레저 활동.","관광비행로(단양·구미·함안 비행로)는 초경량비행장치·경량항공기 비행이 많으므로 주변 항공기는 지정 경로를 회피하거나 주의하여 비행해야 한다.","AD: AD 1 비행장/헬기장 소개(AD 1.5.2 경량항공기 이착륙장 인증상태), AD 2 비행장, AD 3 헬기장. 우리나라는 AD 3 HELIPORTS 부분을 제외하고 있다."]},{"title":"5.4 항공고시보(NOTAM)","page":377,"points":["NOTAM 정의: 항공시설·업무·절차 또는 위험의 신설, 운영상태 또는 그 변경에 관한 정보를 수록하여 전기통신 수단으로 배포하는 공고문.","NOTAM은 3개월 이상 유효해서는 안 되며, 3개월을 초과할 것으로 예상되면 반드시 AIP 보충판으로 발간한다.","발행기한: 항공교통센터장은 위험·제한·금지구역 운영 및 일시적 공역제한은 긴급한 경우를 제외하고 최소 7일 전 공고, 대규모 군사훈련 외의 훈련용 일시 공역제한은 최소 3일(72시간) 전, 취소·축소는 가능한 한 24시간 전 공고한다.","일련번호: 시리즈문자 + 4자리 일련번호 + 연도 2자리(예: A0023/11), 매년 1월 1일 0000 UTC에 1번부터 시작. NOTAMN(신규), NOTAMR(수정), NOTAMC(취소).","시리즈: A 국제배포(중·장거리), C 국내배포, D 공역사항(2012년부터 C에서 분리, 국내), G GPS RAIM 오류예측 국제, H GPS RAIM 국내, S 설빙고시보(SNOWTAM), V 화산재고시보, Z 위성항법시설.","Q항목은 8개 소항목을 사선(/)으로 분리: FIR/Q-코드/교통(I·V·K)/목적(N·B·O·M·K)/범위(A·E·W·K)/하한고도(기본 000)/상한고도(기본 999)/좌표·반경(nm 3자리, 기본 999).","Q코드는 5문자: 첫 문자 Q, 둘째·셋째 주어부, 넷째·다섯째 서술부. 해당 부호 없으면 XX, AIRAC 발행 알림은 넷째·다섯째에 TT, 유효 NOTAM 대조표는 KKKK.","항목 A 위치부호(예: RKRR), B 발효일시(UTC 10자리 YYMMDDhhmm), C 종료일시(영구 PERM, 불확실 EST), D 세부일시(200자 초과 시 분리), E 평문 내용(국제배포 시 영문 포함), F/G 하한/상한(SFC, UNL 등)."]},{"title":"5.4.4~5.4.5 Q-CODE 문자 코드","page":382,"points":["둘째 문자 그룹: L 등화시설, M 이동지역, F 시설 및 업무(AGA), A 공역구조, S 항공교통 및 VOLMET 업무, P 항공교통절차(ATM), C 통신 및 감시, I ILS/MLS, G 위성항행, N 항행시설(CNS), R 공역제한, W 경고, O 기타.","주요 주어부: MR 활주로, MX 유도로, MN 계류장, FA 비행장, AC 관제권, AD 방공식별구역, AE 관제구, AF 비행정보구역, RP 금지구역, RR 제한구역, RT 임시제한구역.","넷째 문자 그룹: A 유효성, C 변경, H 위험요소, L 제한, X 기타(XX 평문).","주요 서술부: AS 이용할 수 없는(Unserviceable), CA 활성화, CN 취소된, LC 폐쇄, LV 시계비행운항 폐쇄, LI 계기비행운항 폐쇄, LN 모든 야간운항 폐쇄.","예) Q)RKRR/QRPCA/IV/BO/W/000/999/3731N12655E014: 인천FIR, 금지구역(RP) 활성화(CA), IFR·VFR, PIB 및 비행운영, 항행경고, 지표면~무한대, 좌표 중심 반경 14nm."]},{"title":"5.5 항공지도 및 기호","page":389,"points":["우리나라는 AIP에 필요한 항공정보를 수록하여 각종 공항 관련 지도 및 항로지도를 발간한다.","비행장도(Aerodrome Chart): 공항/비행장 구조, 중요 지점 주의·이행사항, 방위 정보, 지상 이동 시 관제절차 제시. 항공기 주기/탑승교 항공도: 주기장 위치와 진입 시 주의사항.","항공기 지상이동 경로도: 원활한 지상이동을 위한 접근 경로·속도 정보. 비행장 장애도: 장애표면 구역 내 주요 장애물의 위치와 높이.","터미널 구역도(TMA Chart): 공항 인근 주요 지형지물을 기술하여 시계비행 조종사에게 필요한 정보 제공.","ATC 감시 최저고도 항공도: 관제레이더 감시범위 제한에 따른 최저고도로, 그 이하로 내려가면 위험하거나 관제기관이 감시할 수 없게 된다.","시계 접근 절차도: IFR 항공기가 계기접근절차 일부/전부를 수행하지 않고 지형지물을 육안 참조하여 접근할 때의 절차·기상 최저치와 실패 시 절차 규정.","항로지도(Enroute Chart): AIP ENR 6에 수록되며 각 공항별 접근관제소 주파수, 간단한 공항정보, 비행금지/제한 공역, 군·민간 훈련공역, TMA 정보 제공. 항공도는 약속된 기호(ICAO Chart Symbols)를 사용한다."]}],"memorize":[{"k":"AIP 구성","v":"GEN(총론), ENR(항로), AD(비행장) 3부분 — 한국은 AD 3 헬기장 제외","page":374},{"k":"AIP 정의","v":"항공항행에 필수적이고 영구적(영속적) 성격의 항공정보 수록 간행물","page":372},{"k":"AIP 보충판(SUP)","v":"3개월 이상의 장기간 일시적 변경, 많은 분량의 본문/그림 포함 단기 정보","page":372},{"k":"AIC","v":"NOTAM이나 AIP로 전파되지 않는 비행안전·항행·기술·행정·규정개정 정보 공고문","page":372},{"k":"항공정보시스템 홈페이지","v":"http://ais.casa.go.kr (국토교통부 항공정책실)","page":372},{"k":"유비카이스","v":"http://ubikais.fois.go.kr (서울지방항공청), ICAO 부속서 15 기반","page":373},{"k":"ATIS 전화번호","v":"인천 032-743-2676, 김포 02-2660-2676, 김해 051-974-2676, 제주 064-797-2676","page":373},{"k":"ATIS 식별부호","v":"Alpha~Zulu(A~Z) 차례로 부여","page":373},{"k":"ENR 5.4 항공항행장애물","v":"지상 100미터 이상 장애물 목록","page":375},{"k":"관광비행로","v":"단양 비행로, 구미 비행로, 함안 비행로","page":375},{"k":"NOTAM 최대 유효기간","v":"3개월 이상 유효해서는 안 됨 — 초과 예상 시 AIP 보충판 발간","page":378},{"k":"공역 운영 공고 기한","v":"위험·제한·금지구역 및 일시 공역제한: 최소 7일 전","page":378},{"k":"일반 훈련 공역제한 공고","v":"대규모 군사훈련 외 훈련: 최소 3일(72시간) 전","page":378},{"k":"공고 활동 취소·축소","v":"가능한 한 24시간 전 공고","page":378},{"k":"NOTAM 번호 형식","v":"시리즈문자+4자리 일련번호/연도 2자리 (예 A0023/11), 매년 1월1일 0000UTC 재시작","page":378},{"k":"NOTAMN/R/C","v":"N 신규, R 수정(대체), C 취소","page":378},{"k":"NOTAM 시리즈 A/C/D","v":"A 국제배포, C 국내배포, D 공역사항(2012년~, 국내)","page":378},{"k":"NOTAM 시리즈 G/H","v":"GPS RAIM 오류예측 — G 국제배포, H 국내배포","page":378},{"k":"NOTAM 시리즈 S/V/Z","v":"S 설빙고시보, V 화산재고시보, Z 위성항법시설","page":378},{"k":"Q항목 구성","v":"8개 소항목, 사선(/)으로 분리","page":379},{"k":"Q코드 구성","v":"5문자: Q + 주어부(2·3번째) + 서술부(4·5번째)","page":379},{"k":"Q코드 특수 문자","v":"해당 없음 XX, AIRAC 알림 TT(4·5번째), 유효 NOTAM 대조표 KKKK","page":380},{"k":"Q항목 교통(Traffic)","v":"I=IFR, V=VFR, K=대조표","page":380},{"k":"Q항목 목적(Purpose)","v":"N 즉각 주의, B PIB, O 비행운영, M 기타, K 대조표","page":380},{"k":"Q항목 범위(Scope)","v":"A 비행장, E 항공로, W 항행경고, K 대조표","page":380},{"k":"Q항목 하한/상한 기본값","v":"하한 000(지표면), 상한 999(무한대) — FL로만 표기","page":380},{"k":"좌표·반경","v":"위경도 분 단위, 반경 nm 3자리(예 3800N12740E010), 전체 FIR이면 999","page":381},{"k":"항목 B/C","v":"B 발효일시, C 종료일시 — UTC 10자리(YYMMDDhhmm), 영구 PERM, 불확실 EST","page":381},{"k":"항목 D 길이 제한","v":"200문자 초과 시 연속 NOTAM으로 분리","page":382},{"k":"항로지도 수록 위치","v":"AIP ENR 6","page":390}],"quiz":[{"q":"종합항공정보집(Integrated Aeronautical Information Package)의 구성요소가 아닌 것은?","o":["항공정보간행물(AIP)","항공고시보(NOTAM)","항공정보회람(AIC)","조종사 운항일지"],"a":3,"e":"종합항공정보집은 AIP(수정판 포함), AIP 보충판, NOTAM, PIB, AIC, 유효 NOTAM 대조표 및 목록으로 구성된다.","page":372},{"q":"3개월 이상의 장기간 일시적 변경 및 많은 분량의 본문·그림을 포함하는 정보를 발간하는 것은?","o":["항공고시보(NOTAM)","항공정보간행물 보충판(AIP Supplement)","항공정보회람(AIC)","비행 전 정보게시(PIB)"],"a":1,"e":"3개월 이상의 장기간 일시적 변경 및 많은 분량의 본문/그림을 포함하는 정보는 AIP 보충판으로 발간한다.","page":372},{"q":"ICAO 부속서 15의 항공정보를 인터넷으로 실시간 제공하며 서울지방항공청이 운영하는 시스템은?","o":["유비카이스(UBIKAIS)","AFTN","ATIS","VOLMET"],"a":0,"e":"유비카이스(http://ubikais.fois.go.kr)는 NOTAM, PIB, 기상, 비행계획서 접수 등 운항 전반 정보를 제공한다.","page":373},{"q":"ATIS 방송 'RVR Runway 32 Right Touchdown 1700 Meters, Mid 2000 Meters, Roll out 1900 Meters'에서 활주로 중간 지점의 가시거리는?","o":["1,700m","1,900m","2,000m","1,000m"],"a":2,"e":"Touchdown 1,700m, Mid(활주로 중심) 2,000m, Roll out 1,900m를 의미한다.","page":374},{"q":"ATIS에 관한 설명으로 옳지 않은 것은?","o":["공항의 각종 항공정보를 음성으로 반복 제공한다","식별부호는 Alpha부터 Zulu까지 차례로 부여된다","전화로도 정보를 제공한다","기상전문시간은 지역표준시(KST)로 표시한다"],"a":3,"e":"ATIS의 기상전문시간·방송시간은 UTC로 표시한다.","page":373},{"q":"우리나라 AIP 구성에 대한 설명으로 옳은 것은?","o":["GEN, ENR, AD 3부분으로 구성되며 AD 3 헬기장 부분을 제외하고 있다","GEN, ENR 2부분으로만 구성된다","GEN, ENR, AD, MET 4부분으로 구성된다","AD 3 헬기장 부분을 포함하여 ICAO 구성을 완전히 따른다"],"a":0,"e":"우리나라는 ICAO Annex 15의 AIP 구성을 충실히 따르나 AD 3 HELIPORTS 부분을 제외하고 있다.","page":377},{"q":"AIP ENR 5.4 항공항행장애물 목록에 수록되는 장애물의 높이 기준은?","o":["지상 50미터 이상","지상 100미터 이상","지상 150미터 이상","지상 60미터 이상"],"a":1,"e":"ENR 5.4는 항공항행에 영향을 주는 장애물로서 높이가 지상 100미터 이상인 장애물 목록이다.","page":375},{"q":"항공고시보(NOTAM)의 유효기간에 관한 설명으로 옳은 것은?","o":["6개월까지 유효할 수 있다","1년 단위로 갱신한다","3개월 이상 유효해서는 안 되며 초과 예상 시 AIP 보충판으로 발간한다","유효기간 제한이 없다"],"a":2,"e":"NOTAM은 3개월 이상 유효해서는 안 되며, 3개월 초과 예상 시 반드시 AIP 보충판으로 발간한다.","page":378},{"q":"항공교통센터장이 대규모 군사훈련 외의 훈련을 위해 일시적으로 공역을 제한하는 경우 최소 언제까지 공고해야 하는가?","o":["7일 전","24시간 전","14일 전","3일(72시간) 전"],"a":3,"e":"위험·제한·금지구역 운영 등은 최소 7일 전이지만, 대규모 군사훈련 외 훈련용 일시 공역제한은 최소 3일(72시간) 전 공고한다.","page":378},{"q":"NOTAM 시리즈 중 국내공항에 대한 'GPS 수신기 자동 무결성 감시' 오류 예측 정보를 국내배포하는 시리즈는?","o":["G Series","H Series","Z Series","D Series"],"a":1,"e":"G Series는 국제배포, H Series는 국내배포 GPS RAIM 오류 예측 정보이다.","page":378},{"q":"'C0001/11 NOTAMN'의 의미로 옳은 것은?","o":["2011년도 첫 번째 국내 신규 항공고시보","2011년도 첫 번째 국제 취소 항공고시보","2001년도 11번째 국내 수정 항공고시보","2011년도 첫 번째 국내 취소 항공고시보"],"a":0,"e":"C 시리즈는 국내배포, 0001은 일련번호, 11은 연도, 맨 뒷자리 N은 신규를 뜻한다.","page":378},{"q":"NOTAM Q항목의 '목적(Purpose)' 소항목에서 'B'가 의미하는 것은?","o":["항공기 운영자의 즉각적인 주의","비행 전 정보 게시(PIB)를 위해 선정된 항공고시보","항행경고","유효 항공고시보 대조표"],"a":1,"e":"목적 소항목은 N 즉각 주의, B PIB, O 비행 관련, M 기타, K 대조표이다.","page":380},{"q":"NOTAM Q항목에서 특정 고도정보가 없을 때 하한고도와 상한고도의 기본값으로 옳은 것은?","o":["000 / 600","SFC / UNL","001 / 999","000 / 999"],"a":3,"e":"하한고도 기본값은 000(지표면), 상한고도 기본값은 999(무한대)이며 비행고도(FL)로만 표기한다.","page":381},{"q":"NOTAM 항목에 관한 설명으로 옳지 않은 것은?","o":["항목 B는 UTC 10자리로 표시한 발효일시이다","영구적인 정보는 항목 C에 PERM을 사용한다","항목 D가 200문자를 초과하면 연속 NOTAM으로 분리한다","시간이 불확실한 경우 항목 B에 'UNK'를 기재한다"],"a":3,"e":"시간 정보가 불확실하면 항목 C에 약어 EST를 사용하여 대략적인 일시를 기재하며, EST NOTAM은 예상일시 전에 취소 또는 대체해야 한다.","page":381},{"q":"Q코드 'QRPCA'에서 RP와 CA의 의미로 옳은 것은?","o":["제한구역 - 취소","위험구역 - 변경","금지구역 - 활성화","관제권 - 폐쇄"],"a":2,"e":"Q코드 둘째·셋째 문자 RP는 금지구역(Prohibited area), 넷째·다섯째 CA는 활성화(Activated)이다.","page":386},{"q":"공항 인근 주요 지형지물에 대하여 기술하여 시계비행 조종사들에게 필요한 정보를 제공하는 항공도는?","o":["비행장 장애도(Aerodrome Obstruction Chart)","터미널 구역도(Terminal Area Chart)","항공기 지상이동 경로도","ATC 감시 최저고도 항공도"],"a":1,"e":"터미널 구역도(TMA)는 공항 인근 주요 지형지물을 기술하여 시계비행 조종사에게 필요한 정보를 제공한다.","page":389}]}]}]};
const PASS = 0.7;
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem('lsa-study')||'{}'); }catch(e){ return {}; } },
  set(s){ try{ localStorage.setItem('lsa-study', JSON.stringify(s)); }catch(e){} }
};
let S = Object.assign({ch:{}, known:{}, wrong:{}}, store.get());
const save = () => store.set(S);
const $ = (s,el=document)=>el.querySelector(s);
const esc = t => String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app = $('#app');
const allCh = DATA.parts.flatMap(p=>p.chapters.map(c=>({...c, part:p})));
const chById = id => allCh.find(c=>c.id===id);
const qid = (c,i) => c.id+'#'+i;

function chState(c){
  const st = S.ch[c.id]||{};
  if (st.best!=null && st.best>=PASS) return 'done';
  if (st.read || st.best!=null || c.memorize.some((m,i)=>S.known[c.id+'#'+i])) return 'started';
  return '';
}
function stLabel(c){
  const st=S.ch[c.id]||{}; const s=chState(c);
  if (s==='done') return `<span class="pill ok">통과 ${Math.round(st.best*100)}점</span>`;
  if (st.best!=null) return `<span class="pill bad">재도전 ${Math.round(st.best*100)}점</span>`;
  if (s==='started') return `<span class="pill ing">학습중</span>`;
  return `<span class="pill">미시작</span>`;
}

    .replace(/(\d)\s?hPa\b/g,'$1 헥토파스칼').replace(/(\d)\s?km\b/g,'$1 킬로미터').replace(/(\d)\s?kg\b/g,'$1 킬로그램')
    .replace(/(\d)\s?m\b/g,'$1 미터').replace(/(\d)\s?(℃|°\s?C\b)/g,'$1 도').replace(/(\d)\s?°\s?F\b/g,'화씨 $1 도').replace(/(\d)\s?miles?\b/gi,'$1 마일').replace(/(\d)\s?°/g,'$1 도').replace(/(\d)\s?%/g,'$1 퍼센트')

    .replace(/(\d)\s?mm\b/g,'$1 밀리미터').replace(/(\d)\s?cm\b/g,'$1 센티미터').replace(/(\d)\s?(L|ℓ)\b/g,'$1 리터')
    .replace(/(\d)\s?(mph|MPH)\b/g,'$1 마일').replace(/(\d)\s?SM\b/g,'$1 법정마일').replace(/(\d)\s?lbs?\b/g,'$1 파운드')
    .replace(/(\d)\s?(inch|in)\b/g,'$1 인치').replace(/(\d)\s?(fpm|ft\/min)\b/g,'$1 피트 매분').replace(/(\d)\s?g\b/g,'$1 지')
    .replace(/(\d)\s?[-–]\s?(\d)/g,'$1에서 $2').replace(/([^\d\s])\s?\/\s?(\d)/g,'$1 당 $2');

/* 숫자 → 한국식 읽기 */
const D=['','일','이','삼','사','오','육','칠','팔','구'];
function sino(n){
  n=Math.floor(n); if(n===0) return '영';
  const units=['','만','억','조']; let out='', g=0;
  while(n>0){ const part=n%10000; n=Math.floor(n/10000);
    if(part){ let s=''; const ds=[Math.floor(part/1000),Math.floor(part/100)%10,Math.floor(part/10)%10,part%10];
      ['천','백','십',''].forEach((u,k)=>{ const d=ds[k]; if(!d) return; s+=(d===1&&u?'':D[d])+u; });
      if(g===1&&part===1) s=''; out=s+units[g]+out; }
    g++; }
  return out;
}
const NAT={1:'한',2:'두',3:'세',4:'네',5:'다섯',6:'여섯',7:'일곱',8:'여덟',9:'아홉'};
const NAT10={1:'열',2:'스물',3:'서른',4:'마흔',5:'쉰',6:'예순',7:'일흔',8:'여든',9:'아흔'};
function native(n){ if(n<1||n>99) return sino(n); const t=Math.floor(n/10), o=n%10;
  if(n===20) return '스무'; return (t?NAT10[t]:'')+(o?NAT[o]:''); }
const DIG=['공','일','이','삼','사','오','육','칠','팔','구'];
const digits=s=>s.split('').map(d=>DIG[+d]).join(' ');
function readNum(s){
  s=s.replace(/,/g,''); let neg='';
  if(/^[-−]/.test(s)){ neg='마이너스 '; s=s.slice(1); }
  const [i,f]=s.split('.');
  let r=sino(+i); if(f!==undefined) r+=' 점 '+f.split('').map(d=>d==='0'?'영':D[+d]).join('');
  return neg+r;
}
function koNum(s){
  return s
    // 트랜스폰더/스쿼크 코드: 한 자리씩 (칠칠공공)
    .replace(/(코드|스쿼크|squawk|트랜스폰더)([^\d]{0,10})(\d{4})(?!\d)/gi,(m,a,b,c)=>a+b+digits(c))
    .replace(/(?<![\d.,])(\d{4})(?=\s?(번\s?)?코드)/g,(m,c)=>digits(c))
    .replace(/(코드|트랜스폰더|스쿼크|squawk|transponder)[\s\S]*/i,m=>m.replace(/(?<![\d,.])(7500|7600|7700|1200|2000)(?![\d,.])/g,c=>digits(c)))
    // 범위: 한 시에서 세 시
    .replace(/(?<![\d.,])(\d{1,2})에서 (\d{1,2})\s?(시간|시(?![정행험설작점도장])|개(?!월|소|정|선)|명|가지)/g,(m,a,b,u)=>native(+a)+' '+u+'에서 '+native(+b)+' '+u)
    // 시각 09:30
    .replace(/(\d{1,2}):(\d{2})/g,(m,h,mi)=>native(+h||12)+' 시'+(+mi?' '+sino(+mi)+' 분':''))
    // 분수 1/2 → 이분의 일
    .replace(/(?<![\d.])(\d+)\/(\d+)(?![\d.])/g,(m,a,b)=>sino(+b)+'분의 '+sino(+a))
    // 첫 번째, 두 번째
    .replace(/(?<![\d.])(\d{1,2})\s?번째/g,(m,n)=>(+n===1?'첫':native(+n))+' 번째')
    // 고유어 수사와 쓰는 단위 (1~99): 세 개, 다섯 명, 두 시간, 오후 세 시
    .replace(/(?<![\d.,])(\d{1,2})\s?(시간|개(?!월|소|정|선)|명|가지|마리|살|척|장(?!치|애|소|관|비|주)|군데|시(?![정행험설작점도장]))/g,(m,n,u)=>native(+n)+' '+u)
    // 나머지 모든 수: 한자어 (만 사천, 이십구 점 구이)
    .replace(/[-−]?\d{1,3}(,\d{3})+(\.\d+)?|[-−]?\d+(\.\d+)?/g,(m,...a)=>{
      return readNum(m);
    })
    .replace(/\s+/g,' ').trim();
}
const TTS={
  ok:'speechSynthesis' in window, q:[], i:0, on:false, tok:0, voice:null, label:'',
  rates:[0.8,1,1.2,1.5],
  get rate(){return S.rate||1},
  pick(){ if(!this.ok) return; const vs=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));
    this.voice=vs.find(v=>/Google|Yuna|Heami|SunHi|Neural|Online/i.test(v.name))||vs[0]||null; },
  play(items,label,start=0){ if(!this.ok){ alertBox(); return; } this.stop(); if(!items.length) return;
    this.q=items; this.i=start; this.label=label; this.on=true; this.next(); },
  next(){
    this.mark(); if(!this.on) return;
    if(this.i>=this.q.length){ this.stop(); return; }
    const it=this.q[this.i]; const my=++this.tok;
    if(it.el){ it.el.classList.add('reading'); try{ it.el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }catch(e){} }
    it.onstart&&it.onstart();
    const u=new SpeechSynthesisUtterance(clean(it.text)); u.lang='ko-KR'; if(this.voice) u.voice=this.voice; u.rate=this.rate;
    const done=()=>{ if(my!==this.tok) return; this.i++; setTimeout(()=>{ if(my===this.tok) this.next(); }, it.gap||250); };
    u.onend=done; u.onerror=done;
    speechSynthesis.cancel(); speechSynthesis.speak(u); this.ui();
  },
  pause(){ this.on=false; this.tok++; speechSynthesis.cancel(); this.ui(); },
  resume(){ this.on=true; this.next(); },
  jump(d){ if(!this.q.length) return; this.i=Math.max(0,Math.min(this.q.length-1,this.i+d)); this.on=true; this.next(); },
  stop(){ this.on=false; this.tok++; if(this.ok) speechSynthesis.cancel(); this.q=[]; this.i=0; this.mark(); this.ui(); },
  mark(){ document.querySelectorAll('.reading').forEach(e=>e.classList.remove('reading')); },
  ui(){ const p=$('#player'); const show=this.q.length>0; p.hidden=!show; document.body.classList.toggle('playing',show);
    if(!show) return; $('#pl-lbl').firstChild.textContent=this.label;
    $('#pl-pos').textContent=`${Math.min(this.i+1,this.q.length)} / ${this.q.length}`;
    $('#pl-play').textContent=this.on?'❚❚':'▶'; $('#pl-play').setAttribute('aria-label',this.on?'일시정지':'계속 읽기');
    $('#pl-rate').textContent=this.rate.toFixed(1)+'×'; }
};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function runQuiz(el, qs, onFinish, afterFinish){
  let i=0, right=0;
  const draw=()=>{
    if (i>=qs.length){
      const sc=right/qs.length;
      const extra=onFinish?onFinish(sc):'';
      el.innerHTML=`<div class="qbox result"><div class="big mono" style="color:${sc>=PASS?'var(--ok)':'var(--bad)'}">${Math.round(sc*100)}</div>
        <p>${qs.length}문항 중 ${right}개 정답 · ${sc>=PASS?'통과 기준(70점) 충족':'70점 미만 — 틀린 문제는 오답노트에 모였습니다'}</p>
        <div class="row" style="justify-content:center"><button class="btn ghost" id="again">다시 풀기</button>${extra}</div></div>`;
      $('#again').onclick=()=>runQuiz(el, shuffle(qs), onFinish, afterFinish);
      afterFinish&&afterFinish();
      return;
    }
    const q=qs[i];
    el.innerHTML=`<div class="qbox"><div class="qhead"><span>${esc(q.src)}</span><span class="mono">${i+1} / ${qs.length} · 정답 ${right}</span></div>
      <div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
      <div class="qtext">${esc(q.q)}</div>
      <div class="listen">${spkBtn('문제 듣기','id="ls-q"')}</div>
      <div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="n">${'①②③④⑤'[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      <div id="ex"></div></div>`;
    $('#ls-q').onclick=()=>TTS.play([{el:el.querySelector('.qtext'),text:qSpeech(q)}], '문제 '+(i+1));
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      TTS.stop();
      const j=+b.dataset.j, ok=j===q.a;
      el.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(+x.dataset.j===q.a) x.classList.add('right');});
      if(!ok) b.classList.add('wrong');
      if(ok){ right++; if(S.wrong[q.key]) { S.wrong[q.key].streak=(S.wrong[q.key].streak||0)+1; } }
      else { S.wrong[q.key]={streak:0, t:Date.now()}; }
      save();
      $('#ex').innerHTML=`<div class="expl"><b class="${ok?'ok':'bad'}">${ok?'정답':'오답 — 정답 '+'①②③④⑤'[q.a]}</b> ${esc(q.e)} <span class="mono" style="color:var(--muted)">p.${q.page}</span></div>
        <div class="next row" style="justify-content:space-between">${spkBtn('해설 듣기','id="ls-e"')}<button class="btn" id="qn">${i+1<qs.length?'다음 문제':'결과 보기'}</button></div>`;
      $('#ls-e').onclick=()=>TTS.play([{el:$('#ex .expl'),text:(ok?'정답입니다. ':'오답입니다. 정답은 '+(q.a+1)+'번, '+q.o[q.a]+'. ')+q.e}], '해설');
      $('#qn').onclick=()=>{TTS.stop();i++;draw()}; $('#qn').focus();
    });
  };
  draw();
}

function allQs(filter){
  return allCh.filter(c=>!filter||c.part.key===filter).flatMap(c=>c.quiz.map((q,i)=>({...q,key:qid(c,i),src:c.part.short+' · '+c.title})));
}

function mock(){
  setNav('mock');
  app.innerHTML=`<div class="ch-h"><h1>모의고사</h1><div class="meta">선택한 과목에서 무작위로 출제합니다. 실제 시험처럼 과목별로 풀어 보세요.</div></div>
  <div class="row" style="margin:16px 0 18px">
    <select id="mp"><option value="">전 과목</option>${DATA.parts.map(p=>`<option value="${p.key}">${esc(p.name)}</option>`).join('')}</select>
    <select id="mn"><option>20</option><option>25</option><option>40</option></select>
    <button class="btn" id="ms">시작</button></div><div id="mb"></div>`;
  $('#ms').onclick=()=>{
    const qs=shuffle(allQs($('#mp').value)).slice(0,+$('#mn').value);
    runQuiz($('#mb'), qs, sc=>{S.mock=(S.mock||[]).concat({p:$('#mp').value,sc,t:Date.now()}).slice(-30);save();return ''});
  };
  const hist=(S.mock||[]).slice(-5).reverse();
  if(hist.length) $('#mb').innerHTML=`<div class="sec"><h3>최근 기록</h3><ul>${hist.map(h=>`<li>${esc((DATA.parts.find(p=>p.key===h.p)||{name:'전 과목'}).name)} — <span class="mono">${Math.round(h.sc*100)}점</span> <span style="color:var(--muted)">${new Date(h.t).toLocaleDateString('ko-KR')}</span></li>`).join('')}</ul></div>`;
}

function wrong(){
  setNav('wrong');
  const map={}; allQs().forEach(q=>map[q.key]=q);
  const keys=Object.keys(S.wrong).filter(k=>map[k]);
  app.innerHTML=`<div class="ch-h"><h1>오답노트</h1><div class="meta">틀린 문제가 모입니다. 다시 풀어 2번 연속 맞히면 자동으로 빠집니다.</div></div>
  <div class="row" style="margin:16px 0 18px">${keys.length?`<button class="btn" id="wr">오답 ${keys.length}문항 다시 풀기</button>${spkBtn('오답 전체 듣기','id="ls-w"')}`:''}</div><div id="wb">
  ${keys.length?keys.map(k=>{const q=map[k];return `<div class="wrong-item" data-k="${esc(k)}"><div class="src">${esc(q.src)} · p.${q.page}</div><div style="font-weight:500">${esc(q.q)}</div>
    <div class="ans">정답: ${esc(q.o[q.a])}</div><div style="font-size:14px;color:var(--muted)">${esc(q.e)}</div></div>`}).join(''):'<div class="empty">아직 틀린 문제가 없습니다. 장별 확인문제를 풀면 여기에 쌓입니다.</div>'}</div>`;
  const lw=$('#ls-w'); if(lw) lw.onclick=()=>TTS.play([...app.querySelectorAll('.wrong-item')].map(el=>{const q=map[el.dataset.k];
    return {el,text:q.q+'. 정답은, '+q.o[q.a]+'. '+q.e,gap:900};}), '오답노트');
  const b=$('#wr'); if(b) b.onclick=()=>TTS.stop()||runQuiz($('#wb'), shuffle(keys.map(k=>map[k])), ()=>{
    Object.keys(S.wrong).forEach(k=>{if((S.wrong[k].streak||0)>=2) delete S.wrong[k]}); save(); return '';
  });
}

home();
</script>
