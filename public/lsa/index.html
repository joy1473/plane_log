<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="2024 경량항공기 조종사 표준교재 기반 필기시험 단계별 학습 — 핵심정리, 암기카드, 확인문제, 모의고사, 음성 읽기">
<meta name="theme-color" content="#f3f5ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11181c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LSA 필기">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a8287a'/%3E%3Cpath d='M16 5l2 8 9 4v2l-9-2-1 6 3 2v2l-4-1-4 1v-2l3-2-1-6-9 2v-2l9-4z' fill='white'/%3E%3C/svg%3E">
<style>html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>경량항공기 필기 비행계획</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&family=Do+Hyeon&display=swap">
<style>
/* Layout: 항로도(sectional chart) — 4개 과목을 하나의 항로로, 각 장은 웨이포인트. 장 화면은 읽기 → 암기 → 확인문제 3구간 */
:root{
  --paper:#f3f5ef; --card:#ffffff; --ink:#18242c; --muted:#5d6b72; --line:#d5ddd8;
  --route:#a8287a;      /* 항로도 마젠타 */
  --sky:#1f5f99;        /* 관제공역 블루 */
  --ok:#2c7a4b; --bad:#b4322c; --warn:#a86a00;
  --chip:#e8eee9;
  --f-disp:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11181c; --card:#18222a; --ink:#e4ebe8; --muted:#9aa8ad; --line:#2b3a42;
  --route:#e070b6; --sky:#6fa8de; --ok:#5fc08a; --bad:#ef7a73; --warn:#e0a640; --chip:#22303a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11181c; --card:#18222a; --ink:#e4ebe8; --muted:#9aa8ad; --line:#2b3a42;
  --route:#e070b6; --sky:#6fa8de; --ok:#5fc08a; --bad:#ef7a73; --warn:#e0a640; --chip:#22303a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:880px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);
  display:flex;gap:12px;align-items:center;padding-block:10px;margin-bottom:18px}
header.top .brand{font-family:var(--f-disp);font-size:20px;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .brand b{color:var(--route);font-weight:400}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13.5px}
nav.tabs button[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Home */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin-bottom:22px}
.hero h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(28px,6vw,40px)}
.hero p{margin:.4em 0 0;color:var(--muted);max-width:60ch}
.gauge{width:112px;height:112px}
.gauge text{fill:var(--ink)}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:26px}
.stats b{color:var(--ink);font-family:var(--f-mono);font-size:15px;margin-right:3px}
.leg{margin-bottom:28px}
.leg-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.leg-h .step{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--route);border:1.5px solid var(--route);border-radius:4px;padding:1px 7px}
.leg-h h2{font-family:var(--f-disp);font-weight:400;font-size:24px}
.leg-h .en{color:var(--muted);font-size:13px}
.leg-h .pct{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.route{list-style:none;margin:0;padding:0 0 0 22px;position:relative}
.route::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;border-left:2.5px solid var(--route);opacity:.55}
.wp{position:relative;margin-bottom:8px}
.wp::before{content:"";position:absolute;left:-19px;top:15px;width:11px;height:11px;background:var(--paper);border:2.5px solid var(--route);transform:rotate(45deg)}
.wp.done::before{background:var(--route)}
.wp.started::before{background:linear-gradient(135deg,var(--route) 50%,var(--paper) 50%)}
.wp button{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.wp button:hover{border-color:var(--sky)}
.wp .t{font-weight:700;min-width:0}
.wp .g{grid-column:1;color:var(--muted);font-size:13.5px;min-width:0}
.wp .s{grid-row:1/3;grid-column:2;text-align:right;font-size:12px;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;background:var(--chip);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.ing{background:color-mix(in srgb,var(--sky) 16%,transparent);color:var(--sky)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}

/* Chapter */
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb button{background:none;border:0;padding:0;color:var(--sky);text-decoration:underline}
.ch-h h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(24px,5vw,32px)}
.ch-h .meta{color:var(--muted);font-size:13px;margin-top:4px}
.goal{margin:14px 0 18px;padding:12px 14px;border-left:3px solid var(--route);background:var(--card);border-radius:0 8px 8px 0}
.goal small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--route)}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:20px}
.phases button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 6px;text-align:center;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:0}
.phases button small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.phases button[aria-current="true"]{border-color:var(--route);box-shadow:inset 0 -3px 0 var(--route)}
.sec{margin-bottom:18px}
.sec h3{font-size:16.5px;margin-bottom:6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sec h3 .pg{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-weight:500}
.sec ul{margin:0;padding-left:1.1em}
.sec li{margin-bottom:4px;max-width:70ch}
.summary{color:var(--ink);margin-bottom:20px;max-width:70ch}
.next{display:flex;justify-content:flex-end;margin-top:20px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:9px 16px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* memorize */
.mem-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:13.5px;color:var(--muted)}
.mem-tools label{display:flex;gap:6px;align-items:center}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mc .k{font-weight:700}
.mc .v{min-width:0}
.mc.hide .v{filter:blur(6px);user-select:none;cursor:pointer}
.mc .f{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.mc .f button{background:none;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px}
.mc.known{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.mc.known .f button{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);border-color:transparent}

/* quiz */
.qbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.qhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:8px;gap:8px;flex-wrap:wrap}
.bar{height:4px;background:var(--chip);border-radius:2px;margin-bottom:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--route)}
.qtext{font-size:16.5px;font-weight:500;margin-bottom:12px}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 12px;display:flex;gap:10px}
.opt .n{font-family:var(--f-mono);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--sky)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.expl{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--chip);font-size:14.5px}
.expl b.ok{color:var(--ok)} .expl b.bad{color:var(--bad)}
.result{text-align:center;padding:10px 0}
.result .big{font-family:var(--f-disp);font-size:46px;line-height:1}
.result p{color:var(--muted)}
.empty{color:var(--muted);padding:24px 0;text-align:center}
select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 10px}
.wrong-item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.wrong-item .src{font-size:12px;color:var(--muted)}
.wrong-item .ans{color:var(--ok);font-weight:500}
.note{font-size:12.5px;color:var(--muted);margin-top:30px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:560px){
  .hero{grid-template-columns:1fr}.gauge{display:none}
  .brand b{display:none}
  .phases button{font-size:13px}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
[hidden]{display:none!important}
body.big{font-size:18px}
body.big .qtext{font-size:19px}
body.big .sec h3{font-size:19px}
.tool{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13.5px;line-height:1.3}
.spk{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);color:var(--sky);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:500;line-height:1.4}
.spk svg{width:13px;height:13px;fill:currentColor}
.listen{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.listen .spk{font-size:14px;padding:7px 14px}
.reading{background:color-mix(in srgb,var(--route) 13%,transparent);border-radius:4px;box-shadow:0 0 0 3px color-mix(in srgb,var(--route) 13%,transparent)}
.mc.reading{box-shadow:0 0 0 2px var(--route)}
.player{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--paper);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.player .in{max-width:880px;margin:0 auto;display:flex;gap:10px;align-items:center}
.player .lbl{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .lbl small{display:block;opacity:.7;font-family:var(--f-mono);font-size:11.5px}
.player button{background:transparent;border:1px solid color-mix(in srgb,var(--paper) 35%,transparent);color:var(--paper);border-radius:999px;min-width:44px;height:40px;padding:0 12px;font-size:14px}
.player button.main{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:700}
body.playing{padding-bottom:90px}
@media (max-width:560px){
  .opt{padding:12px 12px}
  nav.tabs button{padding:6px 11px}
}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="bl">LSA 필기 </span><b>비행계획</b></div>
    <nav class="tabs" aria-label="메뉴">
      <button id="nav-home" data-v="home">항로</button>
      <button id="nav-mock" data-v="mock">모의고사</button>
      <button id="nav-wrong" data-v="wrong">오답노트</button>
    </nav>
    <button class="tool" id="fs" aria-label="글자 크기">가+</button>
  </header>
  <main id="app"></main>
  <div class="player" id="player" hidden>
    <div class="in">
      <div class="lbl" id="pl-lbl">읽는 중<small id="pl-pos"></small></div>
      <button id="pl-rate" aria-label="읽기 속도">1.0×</button>
      <button id="pl-prev" aria-label="이전 문장">◀︎</button>
      <button class="main" id="pl-play" aria-label="일시정지">❚❚</button>
      <button id="pl-next" aria-label="다음 문장">▶︎</button>
      <button id="pl-stop" aria-label="읽기 끄기">✕</button>
    </div>
  </div>
  <p class="note">출처: 국토교통부 「2024 경량항공기 조종사 표준교재」(공공누리 제3유형). 요약·문제는 교재 내용을 바탕으로 정리한 학습용 자료이며, 페이지 번호는 PDF 기준입니다. 법규는 2023년 12월 시행 기준이므로 시험 직전 최신 개정 여부를 확인하세요. 진도는 이 브라우저에만 저장됩니다.</p>
</div>

<script>
const DATA = {"parts":[{"key":"law","name":"항공법규","short":"법규","en":"Air Law","chapters":[{"id":"law-1","title":"제1장 항공법규 일반","pages":[13,20],"goal":"항공법의 국제적 기원(파리협약·시카고협약·ICAO·부속서)과 우리나라 항공법 체계, 경량항공기의 법적 정의·기준·종류를 이해한다.","summary":"항공법은 1919년 파리협약에서 영공주권 원칙이 정착되고 1944년 시카고협약(국제민간항공협약)과 1947년 설립된 ICAO를 통해 국제적으로 통일되어 왔다. ICAO 부속서(Annex 1~19)는 그 자체로 직접적 법적 구속력은 없으나 국제표준은 준수하되 준수 불가 시 이사회 통보 의무가 있다. 우리나라 항공법은 2017년 3월 30일 항공안전법·공항시설법·항공사업법으로 분리되었고, 경량항공기 제도는 2009년 6월 도입되었다. 경량항공기는 최대이륙중량 600kg(수상 650kg) 이하, 실속속도 45노트 이하, 좌석 2개 이하 등 시행규칙 제4조 기준을 모두 충족해야 하며 조종형비행기·체중이동형비행기·경량헬리콥터·자이로플레인·동력패러슈트의 5종으로 구분된다.","sections":[{"title":"1.1 항공법 개요","page":13,"points":["1783년 프랑스 몽골피에 형제의 열기구 비행이 인류 비행의 최초 사례로 알려짐, 1903년 라이트 형제가 동력추진항공기 발명","1910년 파리에서 19개국 대표가 참석한 항공법회의 개최","1919년 10월 파리 국제항공회의에서 「항행의 규율에 관한 국제협약」(파리협약) 채택 — 제1조에서 자국 영공에 대한 완전하고 배타적인 주권 인정(영공주권 원칙)","1944년 시카고회의에서 「국제민간항공협약」(시카고협약) 채택 — 파리협약 제1조(영공주권)를 그대로 답습, 191개국 가입","ICAO는 시카고협약에 근거하여 1947년 4월 4일 설립, 주로 기술적 표준 설정과 일반적 감독 기능 수행, 경제적 규정은 국가 간 상호규정(bilateral)에 맡김","협약 본문: 제1부 항공(영공주권·영공비행·국적·항공용이화 조치·항공기 구비요건·국제표준 및 권고방식), 제2부 ICAO, 제3부 국제항공수송, 제4부 최종규정(비준·가입·개정·폐기)","협약서문장 언어: 3개 언어(영어·프랑스어·스페인어)와 4개 언어(영어·프랑스어·러시아어·스페인어)로 된 협약서문장에 관한 절차로 구성"]},{"title":"1.1.3 ICAO 부속서(Annex)","page":14,"points":["부속서는 기술적 사항 통일을 위한 것으로 그 자체가 직접 법적 구속력이 있는 것은 아님","국제표준(Standards): 통일이 필요한 사항 — 체약국은 준수하되 준수할 수 없으면 이사회에 통보할 의무(협약 제38조), 이사회는 이를 다른 모든 체약국에 통보","권고방식(Recommended Practices): 통일이 바람직한 사항 — 자국 방식과의 차이를 통보할 의무 없음, 중대한 차이만 통보 권장","국제표준과 권고방식을 합쳐 SARPs(Standards and Recommended Practices)라 함","주요 부속서: Annex 1 자격증명, 2 항공규칙, 3 항공기상, 4 항공지도, 5 측정단위, 6 항공기 운항, 7 국적 및 등록기호, 8 감항성","Annex 9 출입국간소화, 10 항공통신, 11 항공교통업무, 12 수색 및 구조, 13 항공기사고조사, 14 비행장, 15 항공정보업무, 16 환경보호, 17 보안, 18 위험물 안전운송, 19 안전관리","우리나라 항공 관련법의 규격·규제·표지판·용어 등은 ICAO 권고 및 미국 FAA 표준을 근간으로 함"]},{"title":"1.1.4 우리나라 항공법","page":16,"points":["항공은 본질적으로 국제성을 띠어 국내항공법의 국제화·통일화 추세(조약의 국내입법화, SARPs 반영)가 진행됨, 국가별 차이는 ICAO에 통보","형식적 의미의 항공법: 「항공법」이라는 명칭이 붙은 법","실질적 의미의 항공법: 항공 관련 내용이 포함된 모든 법령·규정 — 항공안전법, 공항시설법, 항공사업법, 항공보안법, 공항소음방지법, 항공기등록령 등","항공 외 다른 분야도 포함하는 항공철도사고조사위원회법, 항공우주산업개발촉진법 등의 항공 관련 규정도 실질적 의미의 항공법"]},{"title":"1.2.1 경량항공기 관련 법률","page":16,"points":["2009년 6월 항공법에 경량항공기 제도 도입 전까지는 초경량비행장치 범주에 속함","2009년 9월 항공법 시행규칙에서 경량항공기의 종류 및 범위를 명시","항공법은 2017년 3월 30일부로 항공안전법·공항시설법·항공사업법으로 분리","항공안전법 목적(제1조): 국제민간항공협약 및 부속서의 표준과 권고방식에 따라 항공기·경량항공기·초경량비행장치의 안전하고 효율적인 항행 방법과 국가·항공사업자·항공종사자 등의 의무 규정","공항시설법 목적: 공항·비행장 및 항행안전시설의 설치·운영 등을 정하여 항공산업 발전과 공공복리 증진","항공사업법 목적: 항공정책 수립 및 항공사업 사항을 정하여 항공사업의 체계적 성장·경쟁력 강화, 질서유지, 이용자 편의 향상","경량항공기 사고 관련 법률은 「항공·철도 사고조사에 관한 법률」 — 항공철도사고조사위원회를 설치하여 독립적·공정한 조사로 사고원인 규명 및 사고 예방"]},{"title":"1.2.2 경량항공기 범위","page":18,"points":["정의(항공안전법 제2조 제2호): 항공기 외에 공기의 반작용으로 뜰 수 있는 기기로서 최대이륙중량·좌석 수 등 국토교통부령 기준에 해당하는 비행기·헬리콥터·자이로플레인·동력패러슈트 등","기준(시행규칙 제4조): 최대이륙중량 600kg 이하(수상비행용 650kg 이하), 최대 실속속도 또는 최소 정상비행속도 45노트 이하, 조종사 포함 탑승좌석 2개 이하","기준(계속): 단발 왕복발동기 또는 전기모터(충전 전기에너지 또는 수소로 발생시킨 전기에너지) 장착, 조종석 비여압, 비행 중 프로펠러 각도 조정 불가","고정된 착륙장치가 있을 것 — 단, 수상비행용은 고정 착륙장치 외에 접을 수 있는 착륙장치 장착 가능","항공기(제2조제1호) 및 초경량비행장치(제2조제3호)에 해당하지 아니하면서 위 기준을 모두 충족해야 함","최대이륙중량(MTOW): 인가된 최대이륙중량(Maximum certificated take-off mass)으로 총중량을 의미"]},{"title":"1.2.2.2 경량항공기 종류 및 정의","page":18,"points":["자격증명 한정상 5종(시행규칙 제290조): 조종형비행기, 체중이동형비행기, 경량헬리콥터, 자이로플레인, 동력패러슈트","시행규칙 제4조의 비행기 = 타면조종형비행기 + 체중이동형비행기","수상비행 가능 종류: 조종형비행기, 체중이동형비행기, 자이로플레인 — 대부분 수륙양용, 수상에서는 육상 착륙장치를 접어서 사용","조종형비행기: 엔진 구동 공기보다 무거운 고정익, 날개에 대한 공기 반작용으로 양력 — 조종면·동체·엔진·착륙장치 4가지로 구성","체중이동형비행기: 행글라이더에 엔진과 착륙장치를 부착, 체중을 이동하여 방향 조종","경량헬리콥터: 일반 헬리콥터와 구조는 같으나 무게 제한, 주회전날개 회전면을 기울여 전진하는 회전익","자이로플레인: 시동 시 엔진 구동, 비행 시 공기력으로 회전하는 회전익에서 양력을 얻고 추진력은 프로펠러에서 얻음","동력패러슈트: 패러글라이더에 엔진과 조종석을 장착한 동체(Trike)를 연결하여 비행 — 정의 근거는 경량항공기 비행안전을 위한 기술상의 기준(TS-LSA) 1.5"]}],"memorize":[{"k":"파리협약 채택","v":"1919년 10월, 제1조 영공주권(완전하고 배타적인 주권) 원칙","page":13},{"k":"파리 항공법회의","v":"1910년, 19개국 대표 참석","page":13},{"k":"시카고협약(국제민간항공협약)","v":"1944년 시카고회의에서 채택, 191개국 가입","page":14},{"k":"ICAO 설립일","v":"1947년 4월 4일","page":14},{"k":"ICAO 주요 기능","v":"기술적 표준 설정 및 일반적 감독, 경제적 규정은 국가 간 상호규정(bilateral)","page":14},{"k":"국제표준 미준수 시","v":"이사회에 통보 의무(협약 제38조), 이사회가 다른 체약국에 통보","page":15},{"k":"권고방식 차이","v":"통보 의무 없음, 중대한 차이만 통보 권장","page":15},{"k":"Annex 1 / 2 / 6 / 7 / 8","v":"자격증명 / 항공규칙 / 항공기 운항 / 국적 및 등록기호 / 감항성","page":15},{"k":"Annex 11 / 12 / 13 / 14","v":"항공교통업무 / 수색 및 구조 / 항공기사고조사 / 비행장","page":15},{"k":"Annex 17 / 18 / 19","v":"보안 / 위험물 안전운송 / 안전관리","page":15},{"k":"경량항공기 제도 도입","v":"2009년 6월 항공법(이전에는 초경량비행장치), 2009년 9월 시행규칙에 종류·범위 명시","page":16},{"k":"항공법 3법 분리","v":"2017년 3월 30일 — 항공안전법, 공항시설법, 항공사업법","page":16},{"k":"경량항공기 정의 조문","v":"항공안전법 제2조 제2호, 기준은 시행규칙 제4조","page":18},{"k":"경량항공기 최대이륙중량","v":"600kg 이하(수상비행용 650kg 이하)","page":18},{"k":"경량항공기 속도 기준","v":"최대 실속속도 또는 최소 정상비행속도 45노트 이하","page":18},{"k":"경량항공기 좌석 기준","v":"조종사 좌석 포함 2개 이하","page":18},{"k":"경량항공기 동력 기준","v":"단발 왕복발동기 또는 전기모터","page":18},{"k":"조종석·프로펠러 기준","v":"조종석 비여압, 비행 중 프로펠러 각도 조정 불가","page":18},{"k":"착륙장치 기준","v":"고정 착륙장치(수상비행용은 접이식 추가 장착 가능)","page":18},{"k":"경량항공기 5종","v":"조종형비행기, 체중이동형비행기, 경량헬리콥터, 자이로플레인, 동력패러슈트(시행규칙 제290조)","page":18},{"k":"수상비행 가능 종류","v":"조종형비행기, 체중이동형비행기, 자이로플레인","page":18},{"k":"조종형비행기 4대 구성","v":"조종면, 동체, 엔진, 착륙장치","page":19},{"k":"자이로플레인 양력/추진력","v":"양력: 공기력으로 회전하는 회전익, 추진력: 프로펠러","page":20},{"k":"동력패러슈트 정의","v":"패러글라이더 + 엔진과 조종석을 장착한 동체(Trike)","page":20}],"quiz":[{"q":"영공에 대한 완전하고 배타적인 주권을 최초로 제1조에 규정하여 영공주권 원칙을 정착시킨 협약은?","o":["파리협약(1919년)","시카고협약(1944년)","바르샤바협약","도쿄협약"],"a":0,"e":"1919년 10월 파리에서 채택된 「항행의 규율에 관한 국제협약」 제1조가 영공주권을 인정하였고, 시카고협약이 이를 답습하였다.","page":13},{"q":"국제민간항공기구(ICAO)가 설립된 날짜는?","o":["1919년 10월 13일","1944년 12월 7일","1947년 4월 4일","1952년 6월 1일"],"a":2,"e":"시카고협약에 따라 ICAO는 1947년 4월 4일 설립되었다.","page":14},{"q":"ICAO의 기능에 대한 설명으로 옳은 것은?","o":["경제적 규정을 직접 제정하여 체약국에 강제한다","기술적 표준 설정과 일반적 감독 기능을 주로 수행한다","각국의 항공사 운임을 결정한다","부속서는 체약국 국내법보다 우선하는 직접적 구속력을 갖는다"],"a":1,"e":"ICAO는 주로 기술적 표준 설정과 일반적 감독 기능을 수행하며, 경제적 규정은 국가 간 상호규정에 의하도록 하였다.","page":14},{"q":"ICAO 부속서의 국제표준(Standards)을 체약국이 준수할 수 없는 경우의 조치로 옳은 것은?","o":["별도 조치 없이 자국 방식을 적용한다","중대한 차이에 한하여 통보를 권장한다","국제사법재판소에 제소된다","이사회에 통보할 의무가 있다"],"a":3,"e":"국제표준은 준수하되 준수할 수 없으면 협약 제38조에 따라 이사회에 통보할 의무가 있다. 통보 의무가 없는 것은 권고방식이다.","page":15},{"q":"ICAO 부속서와 그 내용의 연결이 옳지 않은 것은?","o":["Annex 1 - 항공종사자의 자격증명","Annex 8 - 항공기의 감항성","Annex 13 - 항공보안","Annex 19 - 안전관리"],"a":2,"e":"Annex 13은 항공기사고조사이며, 보안(Security)은 Annex 17이다.","page":15},{"q":"항공법이 항공안전법, 공항시설법, 항공사업법으로 분리된 시점은?","o":["2009년 6월","2009년 9월","2017년 3월 30일","2024년 1월 1일"],"a":2,"e":"항공법은 2017년 3월 30일부로 항공안전법, 공항시설법, 항공사업법으로 분리되었다.","page":16},{"q":"항공안전법 시행규칙 제4조에 따른 경량항공기의 최대이륙중량 기준으로 옳은 것은?","o":["육상 600kg 이하, 수상비행용 650kg 이하","육상 650kg 이하, 수상비행용 700kg 이하","육상 115kg 이하, 수상비행용 150kg 이하","육상 750kg 이하, 수상비행용 800kg 이하"],"a":0,"e":"최대이륙중량 600kg(수상비행에 사용하는 경우 650kg) 이하이어야 한다.","page":18},{"q":"경량항공기의 기준에 해당하지 않는 것은?","o":["최대 실속속도 또는 최소 정상비행속도가 45노트 이하일 것","조종사 좌석을 포함한 탑승 좌석이 2개 이하일 것","조종석은 여압이 되지 아니할 것","비행 중에 프로펠러의 각도를 조정할 수 있을 것"],"a":3,"e":"경량항공기는 비행 중에 프로펠러의 각도를 조정할 수 없어야 한다.","page":18},{"q":"수상비행에 사용하는 경량항공기의 착륙장치에 관한 설명으로 옳은 것은?","o":["고정된 착륙장치를 장착해서는 안 된다","고정된 착륙장치 외에 접을 수 있는 착륙장치를 장착할 수 있다","접이식 착륙장치만 장착해야 한다","착륙장치 기준이 적용되지 않는다"],"a":1,"e":"고정된 착륙장치가 있어야 하나, 수상비행에 사용하는 경우 고정 착륙장치 외에 접을 수 있는 착륙장치를 장착할 수 있다.","page":18},{"q":"경량항공기 조종사 자격증명의 한정에서 구분하는 경량항공기 종류에 해당하지 않는 것은?","o":["체중이동형비행기","자이로플레인","동력패러글라이더","경량헬리콥터"],"a":2,"e":"5종은 조종형비행기, 체중이동형비행기, 경량헬리콥터, 자이로플레인, 동력패러슈트이다. 동력패러글라이더는 해당하지 않는다.","page":18},{"q":"시동 시에는 엔진으로, 비행 시에는 공기력의 작용으로 회전하는 회전익에서 양력을 얻고 추진력은 프로펠러에서 얻는 경량항공기는?","o":["경량헬리콥터","자이로플레인","동력패러슈트","체중이동형비행기"],"a":1,"e":"기술기준 1.5 용어의 정의에 따른 자이로플레인의 정의이다.","page":20},{"q":"행글라이더에 엔진과 착륙장치를 부착하고 체중을 이동하여 방향을 조종하는 경량항공기는?","o":["동력패러슈트","조종형비행기","자이로플레인","체중이동형비행기"],"a":3,"e":"체중이동형비행기는 행글라이더에 엔진과 착륙장치를 부착하여 체중이동으로 방향을 조종한다.","page":19}]},{"id":"law-2","title":"제2장 경량항공기 등록","pages":[21,25],"goal":"경량항공기 등록 의무·등록사항·등록 제외 및 제한, 변경·이전·말소 등록 기한과 등록부호 표시 방법을 정확히 안다.","summary":"경량항공기 등록은 항공안전법 제121조에 따라 항공기 등록 규정(제7~18조)을 준용하며, 소유자등은 국토교통부장관에게 등록해야 한다. 소유권의 취득·상실·변경은 등록해야 효력이 생기고, 임차권은 등록해야 제3자에 대항할 수 있으며, 변경·이전·말소등록은 모두 사유 발생일부터 15일 이내 신청한다. 외국인·외국법인 등은 등록할 수 없고, 군·세관·경찰용 등은 등록 제외 대상이다. 등록기호표는 가로 7cm·세로 5cm 내화금속으로 부착하며, 등록부호는 HL과 C001~C799 기호를 사용해 정해진 위치·크기로 표시한다.","sections":[{"title":"2.1 경량항공기 등록 관련 법규","page":21,"points":["항공안전법 제121조(경량항공기에 대한 준용규정) 제1항: 경량항공기 등록 등에 관하여는 제7조부터 제18조까지 준용","준용 조문: 제7조 등록, 제8조 국적 취득, 제9조 소유권, 제10조 등록 제한, 제11조 등록사항, 제12조 등록증명서 발급, 제13조 변경등록, 제14조 이전등록, 제15조 말소등록, 제16조 등록원부 발급·열람, 제17조 등록기호표 부착, 제18조 국적 등의 표시","시행규칙 제300조로 제12조(등록기호표 부착)~제17조(등록부호 표시의 예외) 준용","등록기호 세부사항은 국토교통부 고시 「항공기 및 경량항공기 등록기호 구성 및 지정요령」에서 규정"]},{"title":"2.2 경량항공기 등록","page":21,"points":["소유자등(소유하거나 임차하여 사용할 수 있는 권리가 있는 자)은 대통령령에 따라 국토교통부장관에게 등록해야 함","등록원부 기록사항: 형식, 제작자, 제작번호, 정치장(定置場), 소유자 또는 임차인·임대인의 성명(명칭)·주소·국적, 등록 연월일, 등록기호","국토교통부장관은 등록 시 등록한 자에게 등록증명서를 발급해야 함","누구든지 등록원부 등본·초본 발급이나 열람을 청구할 수 있으며 특별한 사유가 없으면 발급·열람하게 해야 함"]},{"title":"2.3 경량항공기 등록 제외 및 제한","page":22,"points":["등록 제외: 군·세관·경찰업무에 사용하는 경량항공기","등록 제외: 외국에 임대할 목적으로 도입하여 외국 국적을 취득할 경량항공기","등록 제외: 국내 제작 경량항공기로서 제작자 외의 소유자가 결정되지 아니한 것","등록 제한(소유·임차자): 대한민국 국민이 아닌 사람, 외국정부·외국 공공단체, 외국 법인·단체","등록 제한: 위 해당자가 주식·지분의 2분의 1 이상 소유하거나 사업을 사실상 지배하는 법인, 외국인이 대표자이거나 임원 수의 2분의 1 이상인 법인","대한민국 국민·법인이 임차한 경량항공기라도 외국 국적을 가진 경우 등록 불가"]},{"title":"2.4 경량항공기 소유권","page":23,"points":["소유권의 취득·상실·변경은 등록하여야 효력이 생김","임차권은 등록하여야 제3자에 대하여 효력이 생김","등록된 경량항공기는 대한민국 국적을 취득하고 그에 따른 권리·의무를 가짐","변경등록: 정치장 또는 소유자·임차인·임대인의 성명(명칭)·주소·국적 변경 시 변경된 날부터 15일 이내 신청","이전등록: 소유권 또는 임차권을 양도·양수하려는 자는 사유가 있는 날부터 15일 이내 신청","말소등록(15일 이내): 멸실 또는 해체(정비·수송·보관 위한 해체 제외), 존재 여부 1개월(사고 시 2개월) 이상 확인 불가, 등록제한 대상자에게 양도·임대(외국 국적 취득 시), 임차기간 만료 등으로 사용권리 상실","말소등록 미신청 시 국토교통부장관은 7일 이상 기간을 정하여 최고(催告), 최고 후에도 미신청 시 직권 말소하고 소유자등 및 이해관계인에게 통지"]},{"title":"2.5 등록부호","page":24,"points":["등록기호표: 강철 등 내화금속, 가로 7cm × 세로 5cm 직사각형, 국적기호·등록기호(등록부호)와 소유자등의 명칭 기재","부착 위치: 출입구가 있으면 주(主)출입구 윗부분 안쪽, 출입구가 없으면 동체 외부 표면","누구든지 등록기호표를 훼손해서는 안 되며, 국적·등록기호·소유자등 성명(명칭)을 표시하지 않은 경량항공기를 운항해서는 안 됨","표시 순서: 국적기호 → 등록기호, 장식체 사용 금지, 국적기호는 로마자 대문자 HL","등록기호 첫 글자가 문자인 경우 국적기호와 등록기호 사이에 붙임표(-) 삽입","등록부호는 지워지지 않고 배경과 선명하게 대조되는 색으로 표시","경량항공기 등록기호는 C001~C799 사용"]},{"title":"2.5.2 등록부호 표시장소 및 크기","page":25,"points":["비행기(조종형·체중이동형): 주 날개와 꼬리 날개 또는 주 날개와 동체에 표시","주 날개: 오른쪽 날개 윗면과 왼쪽 날개 아랫면, 앞끝·뒤끝에서 같은 거리, 등록부호 윗부분이 주 날개 앞끝을 향하게, 보조날개·플랩에 걸치면 안 됨","꼬리 날개: 수직 꼬리날개 양쪽 면, 앞끝·뒤끝에서 5cm 이상 떨어지게 수평 또는 수직 표시(꼬리날개 없는 체중이동형 제외)","동체: 주 날개와 꼬리날개 사이 동체 양쪽 면 수평안정판 바로 앞 — 꼬리날개 없는 체중이동형은 착륙장치 옆면","회전익(경량헬리콥터·자이로플레인): 동체 아랫면은 최대횡단면 부근에 윗부분이 동체 좌측을 향하게, 옆면은 주 회전익 축과 보조 회전익 축 사이 또는 동력장치 부근 양 측면","동력패러슈트: 캐노피의 오른쪽과 왼쪽 끝의 중앙부","크기: 가로세로비 2:3(아라비아 숫자 1 제외), 세로길이 주 날개 50cm 이상, 동체·수직꼬리날개 30cm 이상(협소 시 해당 면의 최대크기)","선의 굵기는 세로길이의 1/6, 간격은 가로길이의 1/4 이상 1/2 이하"]}],"memorize":[{"k":"등록 준용 근거","v":"항공안전법 제121조 제1항 — 제7조~제18조 준용","page":21},{"k":"등록 대상자(소유자등)","v":"경량항공기를 소유하거나 임차하여 사용할 권리가 있는 자","page":21},{"k":"등록 기관","v":"국토교통부장관(대통령령으로 정하는 바에 따라)","page":21},{"k":"등록원부 기록사항","v":"형식, 제작자, 제작번호, 정치장, 소유자·임차인·임대인 성명·주소·국적, 등록 연월일, 등록기호","page":22},{"k":"등록 제외 대상","v":"군·세관·경찰용 / 외국 임대 목적으로 외국 국적 취득 예정 / 국내 제작 후 제작자 외 소유자 미결정","page":22},{"k":"외국 지배 법인 기준","v":"주식·지분 2분의 1 이상 소유 또는 외국인 임원 2분의 1 이상(또는 외국인 대표자)","page":22},{"k":"소유권 효력 발생","v":"취득·상실·변경은 등록해야 효력 발생","page":23},{"k":"임차권 효력","v":"등록해야 제3자에 대하여 효력 발생","page":23},{"k":"변경등록 기한","v":"변경된 날부터 15일 이내","page":23},{"k":"이전등록 기한","v":"사유가 있는 날부터 15일 이내","page":23},{"k":"말소등록 기한","v":"사유가 있는 날부터 15일 이내","page":23},{"k":"존재 불명 말소 사유","v":"1개월 이상 확인 불가(경량항공기 사고인 경우 2개월)","page":23},{"k":"말소등록 최고 기간","v":"7일 이상의 기간을 정하여 최고, 불응 시 직권 말소","page":23},{"k":"등록기호표 재질·크기","v":"강철 등 내화금속, 가로 7cm × 세로 5cm","page":24},{"k":"등록기호표 부착 위치","v":"출입구 있음: 주출입구 윗부분 안쪽 / 없음: 동체 외부 표면","page":24},{"k":"국적기호","v":"로마자 대문자 HL, 장식체 금지","page":24},{"k":"붙임표(-) 삽입","v":"등록기호 첫 글자가 문자인 경우 국적기호와 등록기호 사이","page":24},{"k":"경량항공기 등록기호 범위","v":"C001 ~ C799","page":24},{"k":"동력패러슈트 표시장소","v":"캐노피 오른쪽과 왼쪽 끝의 중앙부","page":25},{"k":"꼬리날개 표시 이격","v":"앞끝과 뒤끝에서 5cm 이상","page":25},{"k":"등록부호 가로세로비","v":"2:3 (아라비아 숫자 1 제외)","page":25},{"k":"등록부호 세로길이","v":"주 날개 50cm 이상, 동체·수직꼬리날개 30cm 이상","page":25},{"k":"선 굵기 / 간격","v":"세로길이의 1/6 / 가로길이의 1/4 이상 1/2 이하","page":25}],"quiz":[{"q":"경량항공기 등록에 관하여 항공안전법의 어느 조문들을 준용하는가?","o":["제7조부터 제18조까지","제1조부터 제6조까지","제19조부터 제30조까지","제108조부터 제121조까지"],"a":0,"e":"항공안전법 제121조 제1항에서 경량항공기 등록 등에 관하여는 제7조부터 제18조까지의 규정을 준용한다고 명시한다.","page":21},{"q":"경량항공기 등록원부에 기록하는 사항이 아닌 것은?","o":["경량항공기의 정치장","경량항공기의 제작번호","조종사의 자격증명번호","등록 연월일"],"a":2,"e":"등록원부에는 형식, 제작자, 제작번호, 정치장, 소유자 등의 성명·주소·국적, 등록 연월일, 등록기호를 기록한다.","page":22},{"q":"다음 중 경량항공기 등록 제외 대상에 해당하는 것은?","o":["개인이 레저용으로 구입한 경량항공기","경찰업무에 사용하는 경량항공기","항공레저스포츠사업자가 임차한 경량항공기","국내 법인이 소유한 경량항공기"],"a":1,"e":"군 또는 세관에서 사용하거나 경찰업무에 사용하는 경량항공기는 등록 제외 대상이다.","page":22},{"q":"경량항공기 등록 제한 대상에 관한 설명으로 옳지 않은 것은?","o":["외국정부가 소유한 경량항공기는 등록할 수 없다","외국인이 주식의 2분의 1 이상을 소유한 법인의 경량항공기는 등록할 수 없다","외국인이 임원 수의 2분의 1 이상을 차지하는 법인의 경량항공기는 등록할 수 없다","대한민국 국민이 임차한 경량항공기는 외국 국적을 가졌더라도 등록할 수 있다"],"a":3,"e":"대한민국 국민 또는 법인이 임차한 경량항공기라도 외국 국적을 가진 경우에는 등록할 수 없다.","page":22},{"q":"경량항공기 임차권의 효력에 관한 설명으로 옳은 것은?","o":["계약만으로 제3자에게 효력이 생긴다","등록하여야 제3자에 대하여 효력이 생긴다","국토교통부장관의 승인이 있으면 등록이 필요 없다","임차권은 등록 대상이 아니다"],"a":1,"e":"경량항공기에 대한 임차권은 등록하여야 제3자에 대하여 그 효력이 생긴다.","page":23},{"q":"경량항공기의 정치장이 변경된 경우 변경등록 신청 기한은?","o":["7일 이내","10일 이내","30일 이내","15일 이내"],"a":3,"e":"정치장 또는 소유자 등의 성명·주소·국적이 변경된 경우 변경된 날부터 15일 이내에 변경등록을 신청한다.","page":23},{"q":"등록된 경량항공기가 사고로 그 존재 여부를 확인할 수 없는 경우, 말소등록 사유가 되는 기간은?","o":["1개월 이상","2개월 이상","3개월 이상","6개월 이상"],"a":1,"e":"존재 여부를 1개월(경량항공기 사고인 경우에는 2개월) 이상 확인할 수 없는 경우 말소등록 사유이다.","page":23},{"q":"소유자등이 말소등록을 신청하지 않을 때 국토교통부장관의 조치로 옳은 것은?","o":["7일 이상의 기간을 정하여 말소등록 신청을 최고하고, 그래도 신청하지 않으면 직권 말소한다","즉시 직권으로 말소한다","15일 이내에 과태료를 부과한 후 말소한다","1개월 이상 기간을 정하여 최고한 후 등록을 유지한다"],"a":0,"e":"국토교통부장관은 7일 이상의 기간을 정하여 최고하고, 최고 후에도 신청하지 않으면 직권으로 말소하고 소유자등 및 이해관계인에게 알린다.","page":23},{"q":"경량항공기 등록기호표의 규격으로 옳은 것은?","o":["가로 5cm, 세로 7cm의 알루미늄판","가로 10cm, 세로 7cm의 강철판","가로 7cm, 세로 5cm의 내화금속","가로 7cm, 세로 5cm의 플라스틱판"],"a":2,"e":"강철 등 내화금속으로 된 가로 7cm 세로 5cm의 직사각형 등록기호표를 부착한다.","page":24},{"q":"경량항공기 등록부호 표시에 관한 설명으로 옳지 않은 것은?","o":["국적기호는 로마자 대문자 HL로 표시한다","경량항공기 등록기호는 C001~C799를 사용한다","등록기호 첫 글자가 문자이면 국적기호와 등록기호 사이에 붙임표를 넣는다","식별을 쉽게 하기 위해 장식체를 사용할 수 있다"],"a":3,"e":"등록부호는 국적기호, 등록기호 순으로 표시하고 장식체를 사용해서는 아니 된다.","page":24},{"q":"동력패러슈트의 등록부호 표시장소는?","o":["캐노피의 오른쪽과 왼쪽 끝의 중앙부","동체(Trike) 아랫면","프로펠러 가드 양쪽 면","조종석 앞면"],"a":0,"e":"표 2-1에 따라 동력패러슈트는 캐노피의 오른쪽과 왼쪽 끝의 중앙부에 표시한다.","page":25},{"q":"경량항공기 주 날개에 등록부호를 표시하는 경우 각 문자의 세로길이 기준은?","o":["30cm 이상","20cm 이상","50cm 이상","75cm 이상"],"a":2,"e":"주 날개에 표시하는 경우 50cm 이상, 동체 또는 수직꼬리날개에 표시하는 경우 30cm 이상이다.","page":25}]},{"id":"law-3","title":"제3장 경량항공기 안전성인증","pages":[26,31],"goal":"안전성인증 절차와 제1~4종 등급별 운용범위, 시험비행 허가, 정비 확인·조종사 경미한 정비, 의무무선설비, 기술기준과 검사 종류를 안다.","summary":"경량항공기소유자등은 항공안전기술원장으로부터 경량항공기 기술기준에 적합하다는 안전성인증을 받고 비행해야 하며, 인증 등급은 제1종(완제기)~제4종으로 구분되어 등급별 운용범위가 제한된다. 연구·개발 시험비행 등은 국토교통부장관의 시험비행허가로 안전성인증 없이 가능하다. 경미한 정비 외의 정비는 항공정비사 확인을 받아야 하며, 조종사는 타이어 장탈착·점화플러그 교환 등 별표 41의 경미한 정비만 할 수 있다. 제1~3종은 VHF/UHF 무선전화 송수신기와 Mode 3/A·C 트랜스폰더를 각 1대 설치해야 하고, 안전성인증검사는 초도·정기·수시·재검사로 나뉜다.","sections":[{"title":"3.1 안전성인증","page":26,"points":["경량항공기소유자등은 국토교통부령으로 정하는 기관(항공안전기술원)의 장으로부터 경량항공기 기술기준 적합 안전성인증을 받고 비행해야 함","기술기준은 국토교통부장관이 정하여 고시하는 비행안전을 위한 기술상의 기준","근거: 항공안전법 제108조(경량항공기 안전성인증 등), 시행규칙 제284조"]},{"title":"3.2 안전성인증 등급 및 운용범위","page":26,"points":["항공안전기술원장은 인증 시 등급을 부여하고 운용범위를 지정, 비행하려는 사람은 그 운용범위를 준수해야 함","제1종: 기술기준에 적합하게 완제기 형태로 제작 — 운용 제한 없음","제2종: 기술기준에 적합하게 조립(組立) 형태로 제작 — 항공기대여업·항공레저스포츠사업 사용 제한","제3종: 완제형태이나 제작자로부터 기술기준 적합 입증서류를 발급받지 못함 — 대여업·레저스포츠사업 사용 제한, 조종사 포함 2명 탑승 시 이륙장소 중심 반경 10km 초과 비행 제한","제4종: 제작자 수리·개조지침을 따르지 않고 수리·개조하여 원형이 변경된 것, 또는 제1~3종에 해당하지 않는 것 — 제한된 범위에서 비행","제4종 제한: 대여업·레저스포츠사업 사용, 이륙장소 중심 반경 10km 초과 비행, 1명의 조종사 외 탑승, 인구 밀집지역 상공 비행","운용범위 근거: 시행규칙 별표 40"]},{"title":"3.3 안전성인증 제외 시험비행","page":27,"points":["안전성인증 없이 시험비행 가능: 연구·개발 중인 경량항공기 안전성 평가 시험비행","안전성인증을 받은 경량항공기의 성능향상을 위해 운용한계를 초과하는 시험비행","그 밖에 국토교통부장관이 필요하다고 인정하는 경우","허가 신청: 경량항공기 시험비행허가 신청서(시행규칙 별지 제110호서식)를 국토교통부장관에게 제출, 서류 적합성 확인 후 허가","첨부서류: 소개서(설계개요서·설계도면·부품표·제원), 시험비행등 계획서(기간·장소·점검표), 설계도면 일치 제작 입증서류","첨부서류(계속): 안전 수준 입증서류(지상성능시험 결과·안전대책), 조종절차 및 정비방법 명시 서류, 경량항공기 사진(전체·측면) 각 1매"]},{"title":"3.4 항공정비사 확인","page":28,"points":["국토교통부령으로 정하는 경미한 정비를 제외하고 경량항공기 또는 장비품·부품을 정비한 경우 항공정비사 자격증명을 가진 사람의 확인을 받고 비행해야 함","확인 후 해당 정비 기록문서에 서명을 받아야 함","확인 기준: 제작자가 제공하는 최신 정비교범 및 기술문서","제작자가 정비교범·기술문서를 제공하지 않은 경우 소유자등이 안전성인증 검사 시 제출한 검사프로그램, 그 밖에 국토부장관 고시 기준 기술자료","근거: 시행규칙 제285조(경량항공기의 정비 확인)"]},{"title":"3.5 조종사 수행 가능 경미한 정비","page":28,"points":["복잡한 조립 조작이 포함되지 않아야 함(시행규칙 별표 41)","착륙장치 타이어 장탈·장착, 탄성충격흡수장치 고정용 코드 교환, 유압완충지주에 윤활유 또는 공기 보충, 바퀴 베어링 세척 및 윤활유 주입","손상된 안전선(Safety Wire)·고정 핀(Cotter Key) 교환, 비구조부 품목(덮개·카울링·페어링)의 장탈(분해 제외) 및 윤활","유압유 저장탱크 유압액 보충, 안전벨트 교환, 1차 구조부·작동 시스템 분해가 필요 없는 좌석 교환","착륙등 배선회로 고장탐구 및 수리, 위치등·착륙등 전구·반사면·렌즈 교환","중량과 평형 계산이 필요 없는 바퀴·스키 교환, 점화플러그 교환·세척·간극 조정, 호스 연결부위 교환, 미리 제작된 연료배관 교환","연료·오일 여과기 세척, 배터리 교환 및 충전, 구조부재가 아닌 파스너 교환·조절","덧칠(균형 조종면 제외)은 1차 구조부재·작동 시스템 장탈·분해가 필요 없는 경우에 한함"]},{"title":"3.6 경량항공기의 의무무선설비","page":30,"points":["안전성인증 등급 제1~3종 경량항공기는 무선교신용 장비, 트랜스폰더 등 무선설비를 설치·운용해야 함(항공안전법 제119조, 시행규칙 제297조)","항공교통관제기관과 교신 가능한 초단파(VHF) 또는 극초단파(UHF) 무선전화 송수신기 1대","기압고도 정보를 제공하는 2차 감시 레이더용 트랜스폰더(Mode 3/A 및 Mode C SSR) 1대","무선전화 송수신기 성능: 항공기국과 항공국 간 또는 항공기국 상호 간 양방향 통신 가능","무선전화 송수신기 성능: 항공비상주파수 121.5MHz 또는 243.0MHz로 관제기관과 통신 가능"]},{"title":"3.7 경량항공기 기술기준","page":30,"points":["목적: 항공안전법 제108조에 따라 비행안전을 위한 기술상의 기준을 정하여 안전한 운항 확보","범위: 설계 및 성능, 요구장비, 품질보증, 제품 수락시험, 조종사운용안내서(POH), 정비매뉴얼·기록유지, 지속감항성, 키트조립 지침, 엔진·프로펠러 등","적용: 경량항공기로 비행하려는 사람과 설계·제작·정비·수리·개조 업무 수행자","기술기준에 없는 재료·부품 기준은 한국산업규격(KS) 등 각국 공인 산업규격 준용","새 기술·방법으로 적용이 어려우면 항공안전기술원장이 일부 생략·변경 가능 — 사전에 국토교통부장관에게 통보, 새 기준은 안전성이 같거나 더 높아야 함","약칭 TS-LSA(Technical Standards for Flight Safety of Light Sport Aircraft), 국토교통부 고시"]},{"title":"3.7.4 안전성인증검사의 종류","page":31,"points":["초도검사: 설계·제작 후 최초로 안전성인증을 받기 위한 검사(외국에서 도입 후 최초 검사 포함)","정기검사: 초도검사 이후 안전성인증서 유효기간 도래로 새 인증서를 받기 위한 검사","수시검사: 비행안전에 영향을 미치는 엔진 부품 교체 또는 대수리·대개조 후 기술기준 적합 여부 확인 검사","재검사: 초도·정기·수시검사에서 불합격된 항목을 보완·수정 후 다시 하는 검사"]}],"memorize":[{"k":"안전성인증 기관","v":"항공안전기술원(원장)","page":26},{"k":"안전성인증 근거","v":"항공안전법 제108조, 시행규칙 제284조","page":26},{"k":"제1종","v":"기술기준 적합 완제기 형태 — 운용 제한 없음","page":26},{"k":"제2종","v":"기술기준 적합 조립형태 — 항공기대여업·항공레저스포츠사업 사용 제한","page":26},{"k":"제3종","v":"완제형태이나 제작자 적합 입증서류 미발급 — 사업 사용 제한, 2명 탑승 시 반경 10km 초과 비행 제한","page":27},{"k":"제4종 정의","v":"제작자 지침 외 수리·개조로 원형 변경 또는 제1~3종 비해당","page":26},{"k":"제4종 운용 제한","v":"사업 사용, 반경 10km 초과, 조종사 1명 외 탑승, 인구 밀집지역 상공 비행","page":27},{"k":"운용범위 근거","v":"시행규칙 별표 40","page":27},{"k":"시험비행허가 신청서","v":"시행규칙 별지 제110호서식, 국토교통부장관에게 제출","page":27},{"k":"안전성인증 제외 시험비행","v":"연구·개발 중 안전성 평가 / 성능향상 위한 운용한계 초과 / 장관 인정","page":27},{"k":"정비 확인","v":"경미한 정비 외 정비는 항공정비사 자격증명 소지자 확인 + 정비기록문서 서명","page":28},{"k":"경미한 정비 근거","v":"시행규칙 제285조, 별표 41 — 복잡한 조립 조작 미포함","page":29},{"k":"조종사 경미한 정비 예","v":"타이어 장탈착, 점화플러그 교환·간극조정, 배터리 교환·충전, 안전벨트 교환, 연료·오일 여과기 세척","page":29},{"k":"의무무선설비 대상","v":"안전성인증 등급 제1~3종","page":30},{"k":"의무무선설비 종류","v":"VHF 또는 UHF 무선전화 송수신기 1대 + Mode 3/A 및 Mode C SSR 트랜스폰더 1대","page":30},{"k":"항공비상주파수","v":"121.5MHz 또는 243.0MHz","page":30},{"k":"의무무선설비 근거","v":"항공안전법 제119조, 시행규칙 제297조","page":30},{"k":"기술기준 약칭","v":"TS-LSA (국토교통부 고시)","page":31},{"k":"기준 없는 재료·부품","v":"한국산업규격(KS) 등 공인 산업규격 준용","page":31},{"k":"기술기준 일부 생략·변경","v":"항공안전기술원장 — 사전 국토부장관 통보, 안전성 동일 이상","page":31},{"k":"안전성인증검사 4종류","v":"초도검사, 정기검사, 수시검사, 재검사","page":31},{"k":"수시검사 사유","v":"비행안전 영향 엔진 부품 교체 또는 대수리·대개조 후","page":31}],"quiz":[{"q":"경량항공기 안전성인증을 실시하는 기관은?","o":["한국교통안전공단","지방항공청","항공안전기술원","항공철도사고조사위원회"],"a":2,"e":"경량항공기소유자등은 국토교통부령으로 정하는 기관(항공안전기술원)의 장으로부터 안전성인증을 받아야 한다.","page":26},{"q":"경량항공기 기술기준에 적합하게 조립(組立)형태로 제작된 경량항공기의 안전성인증 등급은?","o":["제1종","제2종","제3종","제4종"],"a":1,"e":"제1종은 완제기 형태, 제2종은 조립형태로 제작된 경량항공기이다.","page":26},{"q":"안전성인증 등급 제1종 경량항공기의 운용범위는?","o":["제한 없음","항공레저스포츠사업에의 사용 제한","반경 10km 초과 비행 제한","인구 밀집지역 상공 비행 제한"],"a":0,"e":"시행규칙 별표 40에 따라 제1종은 운용 제한이 없다.","page":27},{"q":"안전성인증 등급 제3종 경량항공기에 조종사를 포함하여 2명이 탑승한 경우 비행이 제한되는 범위는?","o":["이륙 장소 중심 반경 5km 초과","이륙 장소 중심 반경 20km 초과","고도 500ft 초과","이륙 장소 중심 반경 10km 초과"],"a":3,"e":"제3종은 조종사 포함 2명 탑승 시 이륙 장소의 중심으로부터 반경 10km 범위를 초과하는 비행에 사용이 제한된다.","page":27},{"q":"안전성인증 등급 제4종 경량항공기의 사용 제한 사항이 아닌 것은?","o":["항공기대여업에의 사용","1명의 조종사 외의 사람이 탑승하는 비행","야간 비행에의 사용","인구 밀집지역 상공에서의 비행"],"a":2,"e":"제4종 제한은 대여업·레저스포츠사업 사용, 반경 10km 초과 비행, 조종사 1명 외 탑승, 인구 밀집지역 상공 비행이다. 야간비행은 교재에 열거되지 않았다.","page":27},{"q":"안전성인증을 받지 아니하고 시험비행 등을 할 수 있는 경우에 해당하지 않는 것은?","o":["연구·개발 중인 경량항공기의 안전성 평가를 위한 시험비행","안전성인증을 받은 경량항공기의 성능향상을 위해 운용한계를 초과하는 시험비행","항공레저스포츠사업의 체험비행","그 밖에 국토교통부장관이 필요하다고 인정하는 경우"],"a":2,"e":"안전성인증 제외 시험비행은 연구·개발 평가, 성능향상 위한 운용한계 초과 시험비행, 장관이 인정하는 경우이다.","page":27},{"q":"경미한 정비를 제외한 정비를 한 경우 비행 전에 받아야 하는 조치는?","o":["항공정비사 자격증명을 가진 사람의 확인 및 정비기록문서 서명","지방항공청장의 정비 승인","한국교통안전공단의 수시검사","제작사의 서면 승인"],"a":0,"e":"경미한 정비 외에는 항공정비사 자격증명을 가진 사람으로부터 확인을 받고 정비 기록문서에 서명을 받아야 한다.","page":28},{"q":"경량항공기 조종사가 수행할 수 있는 경미한 정비에 해당하지 않는 것은?","o":["점화플러그의 교환, 세척 또는 간극 조정","배터리의 교환 및 충전 서비스","중량과 평형 계산이 필요한 바퀴와 스키의 교환","안전벨트의 교환"],"a":2,"e":"경미한 정비에는 중량과 평형(Weight and Balance) 계산이 필요 없는 바퀴와 스키의 교환만 포함된다.","page":29},{"q":"안전성인증 등급 제1~3종 경량항공기에 설치해야 하는 의무무선설비로 옳은 것은?","o":["ELT 1대와 VHF 송수신기 2대","VHF 또는 UHF 무선전화 송수신기 1대와 Mode 3/A 및 Mode C 트랜스폰더 1대","ADS-B 송신기 1대","HF 송수신기 1대와 Mode S 트랜스폰더 2대"],"a":1,"e":"시행규칙 제297조에 따라 VHF 또는 UHF 무선전화 송수신기 1대와 기압고도 정보를 제공하는 Mode 3/A 및 Mode C SSR 트랜스폰더 1대를 설치해야 한다.","page":30},{"q":"경량항공기 무선전화 송수신기가 통신 가능해야 하는 항공비상주파수는?","o":["118.0MHz 또는 136.0MHz","121.5MHz 또는 243.0MHz","123.45MHz 또는 406MHz","122.8MHz 또는 255.4MHz"],"a":1,"e":"항공비상주파수(121.5MHz 또는 243.0MHz)를 사용하여 항공교통관제기관과 통신이 가능해야 한다.","page":30},{"q":"새로운 기술이 적용되어 기술기준을 적용하기 어려운 경우에 관한 설명으로 옳은 것은?","o":["국토교통부장관이 기술기준 적용을 면제한다","항공안전기술원장이 일부를 생략·변경할 수 있으며, 사전에 국토교통부장관에게 통보하고 안전성은 같거나 더 높아야 한다","제작사가 자체 기준을 적용하면 된다","안전성인증 없이 제4종으로 자동 분류된다"],"a":1,"e":"항공안전기술원장은 안전성을 확보할 수 있는 범위에서 일부 생략·변경할 수 있고, 사전에 장관에게 통보하며 새 기준은 안전성이 동일하거나 높아야 한다.","page":31},{"q":"비행안전에 영향을 미치는 엔진 부품 교체 또는 대수리·대개조 후 기술기준 적합 여부를 확인하는 검사는?","o":["초도검사","정기검사","재검사","수시검사"],"a":3,"e":"수시검사는 엔진 부품 교체 또는 대수리·대개조 후 기술기준 적합 여부를 확인하는 검사이다.","page":31}]},{"id":"law-4","title":"제4장 경량항공기 자격증명","pages":[32,49],"goal":"경량항공기 조종사·조종교육증명의 응시자격, 조종연습, 업무범위·종류 한정, 시험과목·면제·유효기간, 신체검사증명, 자격증명 취소·정지 사유와 전문교육기관 제도를 안다.","summary":"경량항공기 조종사 자격증명은 17세 미만, 취소 후 2년 미경과자, 신체검사 기준 미충족자는 받을 수 없으며, 전문교육기관 이수 또는 20시간 이상 비행경력(단독 5시간·야외 5시간 등)이 필요하다. 조종연습은 지방항공청장의 허가를 받아 조종교육증명 보유자의 감독 하에 해야 하고, 자격증명은 5종으로 한정되며 학과시험은 항공법규·항공기상·비행이론·항공교통 및 항법 4과목이다. 학과 합격은 2년간 유효하고, 신체검사증명은 제2종 또는 자동차운전면허증으로 대신할 수 있으며 유효기간은 40세 미만 60개월·50세 미만 24개월·50세 이상 12개월이다. 부정 취득 등은 필요적 취소, 음주 비행 등은 취소 또는 1년 이내 효력정지 대상이며, 시험 부정행위자는 2년간 응시가 제한된다.","sections":[{"title":"4.1 자격증명 관련 법규","page":32,"points":["항공안전법 제109조 자격증명, 제110조 업무범위, 제111조 한정, 제112조 시험 실시·면제, 제113조 신체검사증명, 제114조 취소 등, 제115조 조종교육증명, 제116조 조종연습","시행규칙 제286조 응시자격, 제287조 응시원서 제출 등, 제288조 업무범위 외 비행 허가대상, 제289조 시험비행 허가, 제290조 한정, 제291조 신체검사 기준, 제292조 취소, 제293조 조종교육증명, 제294조 조종연습 허가 신청","준용 항공안전법 제40조(항공신체검사증명) 및 시행규칙 제75~96조 준용"]},{"title":"4.2.1 경량항공기 조종사 자격 응시","page":33,"points":["경량항공기로 비행하려는 사람은 국토교통부장관의 경량항공기 조종사 자격증명을 받아야 함(제109조)","결격: 17세 미만인 사람, 자격증명 취소처분 후 2년이 지나지 아니한 사람, 신체검사 기준 미충족자","응시자격 ①: 국토교통부장관이 지정한 전문교육기관의 교육과정 이수자","응시자격 ②: 해당 경량항공기 비행경력 20시간 이상 — 5시간 이상 단독 비행경력 포함","조종형비행기·경량헬리콥터·자이로플레인은 5시간 이상 야외비행경력 추가 — 120km 이상 구간에서 1개 이상 다른 지점에 이착륙","응시자격 ③: 자가용·사업용·운송용 조종사 또는 부조종사가 2시간 이상 단독 포함 5시간 이상 비행경력 — 비행기 한정자는 타면조종형비행기, 헬리콥터 한정자는 경량헬리콥터·자이로플레인"]},{"title":"4.2.2 조종교육증명(조종교관) 응시자격","page":34,"points":["항공기 조종교육증명 보유자로서 해당 경량항공기 비행경력 5시간 이상 — 사업용·운송용 조종사 비행기 한정은 조종형비행기, 헬리콥터 한정은 경량헬리콥터·자이로플레인","경량항공기 조종사 자격증명 보유자로서 외국정부로부터 해당 종류 조종교육증명을 받은 사람(시행규칙 제89조 제1항)","전문교육기관(외국정부 인정 외국 기관 포함) 또는 항공기 제작자가 실시하는 조종교관과정 이수자","종류별 비행경력 200시간 이상 + 국토부장관 인정 지상교육 + 조종교육증명 보유자로부터 15시간 이상 비행훈련 이수자"]},{"title":"4.2.3 조종연습","page":34,"points":["자격증명 없는 사람의 조종연습: 지방항공청장에게 조종연습 허가신청서(항공신체검사증명서 또는 자동차운전면허증 사본 첨부)를 제출하여 허가서 발급","조종연습은 경량항공기 조종교육증명을 받은 사람의 감독 하에 실시","자격증명 보유자가 해당 종류 외 경량항공기로 조종연습 시에도 조종교육증명 보유자의 감독 필요","조종연습 시 조종연습허가서와 항공신체검사증명서를 지녀야 함","근거: 항공안전법 제116조, 시행규칙 제294조"]},{"title":"4.3 업무범위 및 종류 한정","page":35,"points":["자격증명 보유자는 해당 종류의 경량항공기를 조종하는 업무 외의 업무를 해서는 안 됨","해당 종류 5가지: 조종형비행기, 체중이동형비행기, 경량헬리콥터, 자이로플레인, 동력패러슈트","새로운 종류의 경량항공기로 시험비행 등 국토부장관 허가를 받은 경우 종류 한정에 관계없이 조종업무 가능","허가 필요 경우: 새로운 종류로 시험비행, 국내 최초 도입 경량항공기에서 교관으로 훈련 실시, 장관이 필요하다고 인정하는 경우","시험비행 등 허가신청서(시행규칙 별지 제25호서식)를 해당 지방항공청장에게 제출"]},{"title":"4.4.1 자격증명 시험의 실시 및 면제","page":35,"points":["학과시험 및 실기시험에 합격해야 함","종류별로 한정하는 경우 실기시험으로 심사 가능","시험 전부 또는 일부 면제: 운송용·사업용·자가용·부조종사 자격증명 또는 외국정부 경량항공기 조종사 자격증명 보유자, 지정 전문교육기관 이수자, 해당 분야 실무경험자","자격증명서 발급: 국토교통부장관(한국교통안전공단 이사장에 위탁)이 학과·실기 합격자에게 발급"]},{"title":"4.4.2 응시원서·서류·시험과목","page":36,"points":["응시원서: 시행규칙 별지 제35호서식에 서류 첨부하여 한국교통안전공단에 제출, 경력증명서는 실기시험 응시원서 접수 시까지 제출 가능","비행경력은 별지 제36호서식(비행경력증명서)으로 증명 — 조종연습은 비행마다 감독자가, 자격 보유 조종사는 비행마다 해당 기장이 증명","경량항공기 등급: 육상경량항공기, 수상경량항공기","조종사 학과시험: 항공법규, 항공기상(기초지식·통보·기상도 해독), 비행이론(비행원리·구조와 기능), 항공교통 및 항법(공지통신·조난·비상통신·항공정보업무·지문/추측/무선항법)","조종교육증명 학과: 조종교육 항공법규, 조종교육 실시요령, 위험·사고 방지요령, 구급법, 인적요소, 비행 전문지식","조종사 실기: 조종기술, 무선기기 취급법, 공지통신 연락, 항법기술, 해당 자격 수행 기술","조종교육증명 실기: 조종기술, 비행 전후 지상 교육요령, 조종연습생 지상 조종감독요령, 탑승 시 조종교육요령"]},{"title":"4.4.2.8~4.4.2.13 결과 통보·유효기간·면제·발급","page":38,"points":["한국교통안전공단 이사장은 합격 여부를 응시자에게 통보하고 합격자 현황을 국토교통부장관에게 보고","공단 이사장은 다음 연도 시험 일정·응시자격·과목 등 계획을 매년 말까지 공고(전산망 수시 학과시험 일정 제외)","학과시험 일부 또는 전 과목 합격 유효기간은 2년","전 과목 합격 시 최종 과목 합격 통보일부터 2년 이내 실시(접수 마감일 기준)하는 시험·심사에서 합격 유효","지정 전문교육기관 이수자: 항공법규를 제외한 학과시험 면제","외국정부 자격 보유 교관·운용요원(신형식 도입), 국내 등록 기체로 교육훈련, 수출입 공수비행 조종사: 항공법규 제외 학과 및 실기 면제","자격증명서 발급: 공단 이사장이 전 과목 합격자의 항공신체검사증명서 확인 후 발급, 분실·훼손·기재사항 변경 시 재발급 신청, 유효성확인 증명서 발급 가능"]},{"title":"4.4.2.14 조종교육증명 권한","page":40,"points":["조종교육증명 보유자는 자격증명이 없는 사람에게 조종연습을 시킬 수 있으며, 해당 경량항공기 종류에 대해서만 가능","조종교육증명이 필요한 조종교육: 이륙조작·착륙조작·공중조작의 실기교육(연습생 단독비행 포함)","한국교통안전공단 이사장 실시 안전교육을 정기적(조종교육증명 또는 안전교육 받은 해의 말일부터 2년 내)으로 받아야 함","안전교육 내용: 항공법령 개정사항, 기상정보 획득 및 이해, 경량항공기 사고사례","조종교육증명 보유자는 항공레저스포츠사업의 조종사로 활동 가능"]},{"title":"4.4.3 종류별 실기시험 채점표","page":40,"points":["타면조종형비행기 45개 항목, 체중이동형비행기 41개, 경량헬리콥터 45개, 자이로플레인 38개, 동력패러슈트 34개 항목(예시)","공통 영역: 비행 전 준비, 비행 전 절차, 비행장 내 운영, 이·착륙 및 복행, 항법, 비상절차, 비행 후 절차, 기타사항","체중이동형 고유 항목: 조립(ASSEMBLY), 날개 조율(WING TUNING), 깊은각 접근 및 착륙, 급상승 실속 및 추락(전도) 인지","경량헬리콥터 고유 항목: 직진 오토로테이션 착륙, 동력고착(Settling with Power), Dynamic Rollover, 지상공진, 미익고장, Low G","동력패러슈트 고유 항목: 캐노피 배치(CANOPY LAYOUT), 엔진 예열/시동","근거: 한국교통안전공단 경량항공기조종사 실기시험표준서"]},{"title":"4.5 신체검사증명","page":46,"points":["조종연습자 및 경량항공기 조종사는 항공신체검사증명 제2종 또는 자동차운전면허증을 받아야 함","제2종 유효기간: 40세 미만 60개월, 40세 이상 50세 미만 24개월, 50세 이상 12개월","자동차운전면허증 적용 시 그 운전면허증의 유효기간이 신체검사 유효기간","근거: 항공안전법 제113조, 준 제40조, 시행규칙 제92조 별표 8"]},{"title":"4.6 자격증명등·신체검사증명의 취소","page":46,"points":["필요적 취소: 거짓·부정한 방법으로 자격증명등 취득, 성명 사용·자격증명서 대여 또는 이를 알선, 주류등 측정 요구 불응, 효력정지기간에 조종업무 종사","취소 또는 1년 이내 효력정지: 항공안전법 위반 벌금 이상 형 선고, 고의·중대과실 사고로 인명·재산피해, 업무범위 외 업무, 한정 종류 외 조종","취소 또는 정지(계속): 신체검사증명·운전면허 없이 조종업무, 조종교육증명 없이 조종교육, 2년 내 정기 안전교육 미이수 상태로 조종교육","취소 또는 정지(계속): 이착륙장소 아닌 곳·사용중지 이착륙장에서 이착륙, 주류등 영향 하 비행, 업무 중 주류등 섭취, 비행규칙 위반","취소 또는 정지(계속): 절차 미준수 비관제·주의공역 비행, 허가 없이 통제공역 비행, 관제 지시(이동·이륙·착륙 순서·시기·방법) 불이행","주류등: 주세법 제3조제1호 주류, 마약류관리법 제2조제1호 마약류, 화학물질관리법 제22조제1항 환각물질 / 자격증명등: 자격증명이나 자격증명의 한정","신체검사증명: 거짓·부정 취득 시 필요적 취소, 기준 미달·주류등 영향 비행·업무 중 섭취·측정 불응 시 취소 또는 1년 이내 효력정지","시험·심사·신체검사 부정행위자: 부정행위 날부터 2년간 시험 응시·심사·신체검사 불가"]},{"title":"4.7 전문교육기관","page":48,"points":["지정 신청: 경량항공기 전문교육기관 지정신청서(시행규칙 별지 제114호서식)에 교육규정을 첨부하여 국토교통부장관에게 제출","지정된 기관은 조종사 양성 시 예산 범위에서 경비의 전부 또는 일부를 지원받을 수 있음","교육계획서 내용: 교육과목 및 방법, 교관 현황(자격·경력·정원), 시설 및 장비 개요, 교육평가방법, 연간 교육계획","국토교통부장관은 지정 시 그 내용을 공고","교육 종료 후 이수자 명단·평가 결과를 지체 없이 국토부장관 및 한국교통안전공단 이사장에게 보고하고 항공교육훈련통합관리시스템에 입력","교육계획서 변경 시 지체 없이 장관에게 보고 및 시스템 입력","국토교통부장관은 1년마다 지정기준(시행규칙 별표 12) 적합 여부 심사"]}],"memorize":[{"k":"자격증명 결격 연령","v":"17세 미만","page":33},{"k":"취소 후 재취득 제한","v":"취소일부터 2년이 지나지 아
