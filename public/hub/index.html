<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="경량항공기 필기시험 공부와 비행기록을 한 곳에서">
<meta name="theme-color" content="#f3f5ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11181c" media="(prefers-color-scheme: dark)">
<title>경량항공기 — 필기시험 · 비행기록</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a8287a'/%3E%3Cpath d='M16 5l2 8 9 4v2l-9-2-1 6 3 2v2l-4-1-4 1v-2l3-2-1-6-9 2v-2l9-4z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Do+Hyeon&display=swap">
<style>
/* 항로도(sectional chart) 톤 — 교재 앱과 같은 팔레트를 쓴다. */
:root{
  --paper:#f3f5ef; --card:#ffffff; --ink:#18242c; --muted:#5d6b72; --line:#d5ddd8;
  --route:#a8287a; --sky:#1f5f99; --chip:#e8eee9;
  --f-disp:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11181c; --card:#18222a; --ink:#e4ebe8; --muted:#9aa8ad; --line:#2b3a42;
  --route:#e070b6; --sky:#6fa8de; --chip:#22303a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11181c; --card:#18222a; --ink:#e4ebe8; --muted:#9aa8ad; --line:#2b3a42;
  --route:#e070b6; --sky:#6fa8de; --chip:#22303a; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--paper);color:var(--ink);
  font-family:var(--f-body);font-size:16px;line-height:1.6;
  display:flex;flex-direction:column;justify-content:center;
  padding:40px max(20px,env(safe-area-inset-left,0px)) 40px max(20px,env(safe-area-inset-right,0px))}
.wrap{width:100%;max-width:560px;margin:0 auto}

header{margin-bottom:28px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
  background:var(--chip);color:var(--muted);font-size:12px;font-weight:500;letter-spacing:.02em}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(28px,7vw,38px);
  margin:14px 0 6px;letter-spacing:-.01em}
.sub{margin:0;color:var(--muted);font-size:14.5px}

/* 두 카드를 항로로 잇는 세로선 */
.route{position:relative;display:grid;gap:14px;padding-left:28px}
.route::before{content:"";position:absolute;left:7px;top:22px;bottom:22px;width:2px;
  background:repeating-linear-gradient(var(--route) 0 6px,transparent 6px 12px);opacity:.5}

.card{position:relative;display:block;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
  transition:border-color .15s,transform .15s,box-shadow .15s}
.card::before{content:"";position:absolute;left:-28px;top:24px;width:16px;height:16px;
  border-radius:50%;background:var(--paper);border:3px solid var(--route)}
.card:hover,.card:focus-visible{border-color:var(--route);transform:translateX(2px);
  box-shadow:0 3px 14px rgba(0,0,0,.09);outline:none}
.card:focus-visible{outline:2px solid var(--route);outline-offset:3px}

.card h2{font-family:var(--f-disp);font-weight:400;font-size:21px;margin:0 0 5px;
  display:flex;align-items:center;gap:9px}
.card h2 .ico{font-size:19px}
.card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55}
.tags{margin-top:11px;display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);
  font-size:11.5px;font-weight:500}
.go{position:absolute;right:18px;top:50%;transform:translateY(-50%);
  color:var(--line);font-size:19px;transition:color .15s}
.card:hover .go{color:var(--route)}

footer{margin-top:26px;color:var(--muted);font-size:12px;text-align:center}
footer a{color:var(--sky);text-decoration:none}
footer a:hover{text-decoration:underline}

@media (max-width:420px){
  .route{padding-left:24px}
  .card{padding:16px 17px}
  .card::before{left:-24px;width:14px;height:14px}
  .go{display:none}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="eyebrow"><span aria-hidden="true">✈</span>경량항공기 조종사</span>
    <h1>어디로 가시겠습니까?</h1>
    <p class="sub">필기시험 준비와 비행기록을 한 곳에서 관리합니다.</p>
  </header>

  <nav class="route" aria-label="앱 선택">

    <a class="card" href="/lsa">
      <h2><span class="ico" aria-hidden="true">📖</span>필기시험 공부</h2>
      <p>2024 경량항공기 조종사 표준교재 기반 단계별 학습. 진도는 이 기기에 저장됩니다.</p>
      <div class="tags">
        <span class="tag">핵심정리</span>
        <span class="tag">암기카드</span>
        <span class="tag">확인문제</span>
        <span class="tag">모의고사</span>
        <span class="tag">음성 읽기</span>
      </div>
      <span class="go" aria-hidden="true">→</span>
    </a>

    <a class="card" href="https://log.joy.it.kr/">
      <h2><span class="ico" aria-hidden="true">🛩</span>비행기록</h2>
      <p>비행 로그북을 기록하고 지도에서 확인합니다. 로그인이 필요합니다.</p>
      <div class="tags">
        <span class="tag">로그북</span>
        <span class="tag">CSV 업로드</span>
        <span class="tag">비행 지도</span>
        <span class="tag">오프라인</span>
      </div>
      <span class="go" aria-hidden="true">→</span>
    </a>

  </nav>

  <footer>joy.it.kr</footer>

</div>
</body>
</html>
